name: Wave2 Formal Composed Source Fix

on:
  push:
    branches:
      - repair/g3-g4-wave2

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[wave2-formal-composed-source-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Repair stale monolithic G4 source oracle only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('workspace-template/.pfc-internal-field-validation/tests/test_g4_formal_product_gate.py')
          text=p.read_text(encoding='utf-8')
          old="g4src=(RUNTIME/'aitest_runtime/g4/service.py').read_text(); csrc=(RUNTIME/'aitest_runtime/g4/contracts.py').read_text(); pesrc=(RUNTIME/'aitest_runtime/product_entry.py').read_text(); tool=(WORKSPACE/'.opencode/tools/aitest.ts').read_text(); g2src=(RUNTIME/'aitest_runtime/autonomous_orchestration.py').read_text()"
          new="g4src='\\n'.join(p.read_text(encoding='utf-8') for p in sorted((RUNTIME/'aitest_runtime/g4').glob('*.py'))); csrc=(RUNTIME/'aitest_runtime/g4/contracts.py').read_text(); pesrc=(RUNTIME/'aitest_runtime/product_entry.py').read_text(); tool=(WORKSPACE/'.opencode/tools/aitest.ts').read_text(); g2src=(RUNTIME/'aitest_runtime/autonomous_orchestration.py').read_text()"
          if old not in text:
              raise SystemExit('FORMAL_MONOLITHIC_SOURCE_PATTERN_NOT_FOUND')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          git rm .github/workflows/wave2-formal-composed-source-fix.yml
          git diff --check
      - name: Commit clean test-only oracle repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test(wave2): scan composed G4 implementation in Formal gate [wave2-formal-composed-source-fix]'
          git push origin HEAD:repair/g3-g4-wave2
