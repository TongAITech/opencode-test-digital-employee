name: RC7.2 C08 Current N7 Gate R1 Proof Fast Qualification

on:
  push:
    branches:
      - work/rc7.2-c08-active-n7-gate-proof
    paths:
      - 'rc7_release/rc72_mission_cli.py'
      - 'tests/test_rc72_mission_completion_denominator.py'
      - '.github/workflows/rc7.2-c08-active-gate-proof.yml'
  pull_request:
    branches:
      - work/rc7.2-abcd-v5-bsk-mobile-qualification
    paths:
      - 'rc7_release/rc72_mission_cli.py'
      - 'tests/test_rc72_mission_completion_denominator.py'
      - '.github/workflows/rc7.2-c08-active-gate-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  active-n7-gate:
    name: c08-active-gate-${{ matrix.os }}-python-${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
        python: ['3.8', '3.11']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install approved qualification dependencies
        run: python -m rc7_release.rc72_pytest_bootstrap --requirements rc7_release/requirements-qualification.txt --timeout-seconds 120
      - name: Compile actual CLI and R1 gate validation tests
        run: python -m py_compile rc7_release/rc72_mission_cli.py tests/test_rc72_mission_completion_denominator.py
      - name: Verify active N7 Gate, stale gate injection and exact ten-node denominator
        run: python -m pytest -q tests/test_rc72_mission_completion_denominator.py --junitxml=rc72-c08-active-gate-proof.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc72-c08-gate-${{ matrix.os }}-${{ matrix.python }}-${{ github.sha }}
          path: rc72-c08-active-gate-proof.xml
          retention-days: 14
          if-no-files-found: warn
