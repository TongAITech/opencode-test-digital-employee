name: RC8 N7 Coverage Denominator

on:
  push:
    branches: [work/rc8]
    paths:
      - 'rc8_center/coverage_denominator.py'
      - 'rc8_center/infrastructure/postgres_coverage_denominator.py'
      - 'tests/test_rc8_coverage_denominator.py'
      - 'tests/test_rc8_coverage_denominator_postgres.py'
      - '.github/workflows/rc8-n7-coverage-denominator.yml'
  workflow_dispatch:

jobs:
  n7-coverage-denominator:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Install formal Center infrastructure dependencies
        run: python -m pip install --disable-pip-version-check 'SQLAlchemy>=2,<3' 'redis>=5,<6'
      - name: Compile N7 Coverage Denominator
        run: >-
          python -m py_compile
          rc8_center/coverage_denominator.py
          rc8_center/infrastructure/postgres_coverage_denominator.py
          tests/test_rc8_coverage_denominator.py
          tests/test_rc8_coverage_denominator_postgres.py
      - name: Run N7 Coverage Denominator regression
        run: >-
          python -m unittest
          tests.test_rc8_coverage_denominator
          tests.test_rc8_coverage_denominator_postgres
          -v
