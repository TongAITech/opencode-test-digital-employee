name: RC8 N9 Defect Closure

on:
  push:
    branches: [work/rc8]
    paths:
      - 'rc8_center/defect_closure.py'
      - 'rc8_center/failure_diagnosis.py'
      - 'rc8_center/n7_execution_result.py'
      - 'rc8_center/n7_execution_result_receipt.py'
      - 'rc8_center/control_plane.py'
      - 'rc8_center/formal_app.py'
      - 'rc8_center/api/__init__.py'
      - 'rc8_center/api/defect_routes.py'
      - 'rc8_center/infrastructure/postgres_control.py'
      - 'rc8_center/infrastructure/postgres_defect_closure.py'
      - 'rc8_center/infrastructure/postgres_failure_diagnosis.py'
      - 'center/migrations/env.py'
      - 'center/migrations/versions/0015_n8_n9_failure_defect_persistence.py'
      - 'center/migrations/versions/0016_n9_n7_result_auth.py'
      - 'scripts/rc8_n8_n9_postgres_reality_test.py'
      - 'scripts/rc8_n9_production_http_reality_test.py'
      - 'scripts/rc8_n9_result_authority_http_test.py'
      - 'tests/test_rc8_defect_closure.py'
      - 'tests/test_rc8_defect_closure_postgres.py'
      - '.github/workflows/rc8-n9-defect-closure.yml'
  workflow_dispatch:

jobs:
  n9-defect-closure:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Install formal Center infrastructure dependencies
        run: python -m pip install --disable-pip-version-check 'SQLAlchemy>=2,<3' 'redis>=5,<6'
      - name: Compile N9 Defect Closure
        run: >-
          python -m py_compile
          rc8_center/failure_diagnosis.py
          rc8_center/defect_closure.py
          rc8_center/n7_execution_result.py
          rc8_center/n7_execution_result_receipt.py
          rc8_center/api/defect_routes.py
          rc8_center/infrastructure/postgres_failure_diagnosis.py
          rc8_center/infrastructure/postgres_defect_closure.py
          tests/test_rc8_defect_closure.py
          tests/test_rc8_defect_closure_postgres.py
      - name: Run N8-N9 integration regression
        run: >-
          python -m unittest
          tests.test_rc8_failure_diagnosis
          tests.test_rc8_defect_closure
          tests.test_rc8_defect_closure_postgres
          -v

  n8-n9-postgres-reality:
    runs-on: ubuntu-latest
    services:
      postgresql:
        image: postgres:16
        env:
          POSTGRES_DB: rc8
          POSTGRES_USER: rc8
          POSTGRES_PASSWORD: rc8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rc8 -d rc8"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      RC8_DATABASE_URL: postgresql+psycopg://rc8:rc8@127.0.0.1:5432/rc8
      RC8_REDIS_URL: redis://127.0.0.1:6379/0
      RC8_R1_ROOT: .ci-runtime/n9-r1
      RC8_ARTIFACT_ROOT: .ci-runtime/n9-artifacts
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install formal Center dependencies
        run: pip install -r center/requirements.txt
      - name: Compile N8-N9 production capability slice
        run: >-
          python -m py_compile
          center/migrations/versions/0015_n8_n9_failure_defect_persistence.py
          center/migrations/versions/0016_n9_n7_result_auth.py
          rc8_center/n7_execution_result.py
          rc8_center/n7_execution_result_receipt.py
          rc8_center/api/defect_routes.py
          rc8_center/api/__init__.py
          rc8_center/formal_app.py
          rc8_center/infrastructure/postgres_failure_diagnosis.py
          rc8_center/infrastructure/postgres_defect_closure.py
          scripts/rc8_n8_n9_postgres_reality_test.py
          scripts/rc8_n9_production_http_reality_test.py
          scripts/rc8_n9_result_authority_http_test.py
      - name: Apply formal PostgreSQL schema
        run: alembic -c center/alembic.ini upgrade head
      - name: Prove N8 PRODUCT route to N9 candidate survives real PostgreSQL reconstruction
        run: python scripts/rc8_n8_n9_postgres_reality_test.py
      - name: Prove production formal app exposes Center-derived N9 candidate HTTP truth
        run: python scripts/rc8_n9_production_http_reality_test.py
      - name: Prove N9 fix and regression consume only new authoritative N7 R1 receipts
        run: python scripts/rc8_n9_result_authority_http_test.py
      - name: Verify schema remains at head
        run: alembic -c center/alembic.ini current
