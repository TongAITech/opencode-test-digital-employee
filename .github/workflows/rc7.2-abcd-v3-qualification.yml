name: RC7.2 ABCD-v3 Same-HEAD Product and Independent QA Qualification

on:
  push:
    branches: [work/rc7.2-abcd-v3-qualification]
    paths:
      - 'rc7_runtime/**'
      - 'rc7_release/**'
      - 'tests/test_rc72_*.py'
      - 'tests/rc72_qa_c09_host.py'
      - '.github/workflows/rc7.2-abcd-v3-qualification.yml'
  pull_request:
    branches: [work/rc7.2]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc72-abcd-v3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  c01-c10-engineering:
    # Full product qualification is an integration checkpoint, not a per-commit tax.
    # Draft PRs run focused source/contract workflows; ready PRs run full ABCD + Chromium.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: abcd-v3-native-${{ matrix.os }}-python-${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
        python: ['3.8', '3.11']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Pinned source qualification harness
        run: python -m rc7_release.rc72_pytest_bootstrap --requirements rc7_release/requirements-qualification.txt --timeout-seconds 120
      - name: Compile real A B C D E product and QA code
        run: python -m compileall -q rc6_runtime rc7_runtime rc7_release tests
      - name: Run N8 multi-generation, CLI no-R1, D model, C09 signed browser, E independent product gates
        run: >-
          python -m pytest -q
          tests/test_rc72_n8_retry_continuation.py
          tests/test_rc72_n8_multi_round.py
          tests/test_rc72_n8_multi_round_contract_history.py
          tests/test_rc72_n8_multi_round_executed_peer.py
          tests/test_rc72_n8_multi_round_pending.py
          tests/test_rc72_qa_c01_c02_independent.py
          tests/test_rc72_configured_mission.py
          tests/test_rc72_mission_bindings.py
          tests/test_rc72_mission_factory.py
          tests/test_rc72_qa_product_wiring.py
          tests/test_rc72_qa_c09_product_dispatch.py
          tests/test_rc72_qa_bcd_core_integration.py
          tests/test_rc72_c09_playwright_product_binding.py
          tests/test_rc72_c09_ab_product_binding.py
          tests/test_rc72_production_economy_wiring.py
          tests/test_rc72_native_delta_prompt.py
          tests/test_rc72_production_economy_ingress.py
          --junitxml=rc72-v3-native-independent.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc72-v3-native-${{ matrix.os }}-${{ matrix.python }}-${{ github.sha }}
          path: rc72-v3-native-independent.xml
          retention-days: 14
          if-no-files-found: warn

  complete-rc7-with-real-chromium:
    # Full product qualification is an integration checkpoint, not a per-commit tax.
    # Draft PRs run focused source/contract workflows; ready PRs run full ABCD + Chromium.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: abcd-v3-ubuntu-3.11-complete-source-real-chromium
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python and actual Chromium/CDP
        shell: bash
        run: |
          set -euo pipefail
          python -m rc7_release.rc72_pytest_bootstrap --requirements rc7_release/requirements-qualification.txt --timeout-seconds 120
          python -m pip install --disable-pip-version-check 'playwright==1.62.0'
          python -m playwright install --with-deps chromium
      - name: Prove real CDP, DOM, POST/Response network origin and Oracle
        run: >-
          python -m pytest -q
          tests/test_rc72_c09_real_chromium_cdp_smoke.py
          tests/test_rc72_journey_drift_and_failure.py
          tests/test_rc72_journey_playwright_adapter.py
          --junitxml=rc72-v3-real-chromium.xml
      - name: Run every inherited RC7 and RC7.2 test module, with no case exclusion
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t cases < <(find tests -maxdepth 1 -type f -name 'test_rc7*.py' -print | sort)
          test "${#cases[@]}" -gt 0
          echo "FULL_INHERITED_TEST_MODULES=${#cases[@]}"
          python -m pytest -q "${cases[@]}" --junitxml=rc72-v3-all-inherited.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc72-v3-all-inherited-chromium-${{ github.sha }}
          path: |
            rc72-v3-real-chromium.xml
            rc72-v3-all-inherited.xml
          retention-days: 14
          if-no-files-found: warn
