name: WB A integrated W0 source candidate qualification
on:
  push:
    branches: [work/dsh-wb-w0-abcde-recheck-20261110]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  w0-contract-and-adversarial:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: A/B/C/D/E W0 design contracts without exclusions
        run: python -m unittest discover -s tests -p 'test_dsh_workbench*.py' -v
      - name: Preserve original F-owned SST identity regression
        run: python -m unittest discover -s tests -p 'test_dsh_workbench_b_sst_identity_f.py' -v
      - name: C 50 features, multi Scope, negative UI and legal source fence
        run: node --test tests/test_dsh_workbench_ui_w0.mjs tests/test_dsh_workbench_c_feature_reconciliation.mjs tests/test_dsh_workbench_ui_source_fence.mjs
      - name: CI admission fail-closed policy
        run: python tools/dsh_workbench/ci_admission.py
      - name: No QA or license signoff
        run: echo 'CONTRACT_AND_W0_PROTOTYPE_ONLY; NO DB, HOST, FIELD QA, LICENSE OR BANK ZIP'
  original-ui-real-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated real Chromium
        run: |
          python -m pip install --disable-pip-version-check 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Verify original UI prototype on real Chromium
        run: python tools/dsh_workbench/ui_w0_prototype/qa/run_browser_evidence.py --output "$RUNNER_TEMP/abcde-c-real-chrome"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: abcde-w0-c-original-probe-${{ github.sha }}
          path: ${{ runner.temp }}/abcde-c-real-chrome/*.png
          retention-days: 14
          if-no-files-found: warn
      - name: No F02 field implication
        run: echo 'REAL_CHROMIUM_W0_PROTOTYPE_ONLY; F02_PRODUCT_QA_NOT_RUN'
  q1-targeted-real-chromium:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Install Q1 compatible real browser
        run: |
          python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'playwright==1.48.0'
          python -m playwright install --with-deps chromium
      - name: Keep actual HTTP, DOM business Oracle, CDP, R1, PNG and bounded failure
        run: python -m pytest -q -ra tests/test_rc72_c09_real_chromium_cdp_smoke.py tests/test_rc72_journey_playwright_adapter.py --junitxml=wb-q1-source-cdp.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: abcde-w0-q1-fg17-${{ github.sha }}
          path: wb-q1-source-cdp.xml
          retention-days: 14
          if-no-files-found: warn
