name: RC7.2 C07 Configured Signed AgentTeams Host Entry
on:
  push:
    branches: [work/rc7.2-c07-configured-agentteams-host]
    paths:
      - rc7_release/rc72_configured_mission.py
      - tests/test_rc72_configured_mission.py
      - .github/workflows/rc72-c07-configured-agentteams-host.yml
  pull_request:
    branches: [work/rc7.2-abcd-v5-bsk-mobile-qualification]
    paths:
      - rc7_release/rc72_configured_mission.py
      - tests/test_rc72_configured_mission.py
      - .github/workflows/rc72-c07-configured-agentteams-host.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  configured-host:
    name: c07-configured-live-host-${{ matrix.os }}-py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
        python: ['3.8', '3.11']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned approved test harness
        run: python -m rc7_release.rc72_pytest_bootstrap --requirements rc7_release/requirements-qualification.txt --timeout-seconds 120
      - name: Compile package-configured signed Host and regressions
        run: >-
          python -m py_compile
          rc7_release/rc72_configured_mission.py
          rc7_release/rc72_captain_host_reentry.py
          tests/test_rc72_configured_mission.py
      - name: Real Host to R1 Captain and signed scoped DSH N9 cold takeover
        run: >-
          python -m pytest -q
          tests/test_rc72_configured_mission.py
          tests/test_rc72_captain_host_reentry.py
          tests/test_rc72_c07_n9_professional_dsh_fence.py
          tests/test_rc72_n9_captain_signed_dsh_bridge.py
          tests/test_rc72_captain_n7_pipeline.py
          --junitxml=rc72-c07-configured-host.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c07-configured-host-${{ matrix.os }}-${{ matrix.python }}-${{ github.sha }}
          path: rc72-c07-configured-host.xml
          retention-days: 14
          if-no-files-found: warn
