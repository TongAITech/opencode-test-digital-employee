name: RC6 Release Integrated Qualification and Packaging

on:
  push:
    branches:
      - work/rc6-runtime-reconstruction
      - work/rc6-agent-runtime-bank-final-clean
    paths:
      - 'rc6_runtime/**'
      - 'rc6_release/**'
      - 'packaging/rc6/**'
      - 'tests/**'
      - 'docs/RC6_RELEASE_QUALIFICATION.md'
      - 'docs/RC6_CONSTRUCTION_STATUS.md'
      - '.github/workflows/rc6-release.yml'
  workflow_dispatch:

jobs:
  runtime-regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install qualification dependencies
        run: python -m pip install -U pytest
      - name: Run all RC6 qualification including Execution Closure
        run: python -m pytest -q tests
      - name: Bash syntax qualification
        run: |
          bash -n packaging/rc6/AITEST.sh
          bash -n packaging/rc6/START-AITEST.sh
          bash -n packaging/rc6/STOP-AITEST.sh
          bash -n packaging/rc6/STATUS.sh
          bash -n packaging/rc6/VERIFY.sh
          bash -n packaging/rc6/QUALIFY-AGENT-RUNTIME.sh
          bash -n packaging/rc6/INSTALL-AITEST.sh
          bash -n packaging/rc6/VERIFY-RC6-PROFILE.sh
          bash -n packaging/rc6/ROLLBACK-AITEST.sh

  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Install qualification dependencies
        run: python -m pip install -U pytest
      - name: Run all RC6 qualification on Windows Python 3.8
        run: python -m pytest -q tests
      - name: Build immutable engineering candidate
        shell: pwsh
        run: python -m rc6_release.package build --repo-root . --output dist --source-commit $env:GITHUB_SHA
      - name: Verify built package
        shell: pwsh
        run: python -m rc6_release.package verify --package-root dist/PFC-AITest-DSH-Turnkey-RC6-BANK-WIN10
      - name: Static RC6 skill payload qualification
        shell: pwsh
        run: |
          $root = 'dist/PFC-AITest-DSH-Turnkey-RC6-BANK-WIN10'
          $skills = @(Get-ChildItem "$root/.dsh/skills" -Directory | Where-Object { $_.Name -like 'pfc-*' })
          if ($skills.Count -ne 26) { Write-Error "expected 26 static RC6 skills, got $($skills.Count)"; exit 1 }
          $professional = @($skills | Where-Object { $_.Name -ne 'pfc-full-chain-test' })
          if ($professional.Count -ne 25) { Write-Error "expected 25 professional RC6 skills"; exit 1 }
          foreach ($skill in $skills) {
            $path = Join-Path $skill.FullName 'SKILL.md'
            if (-not (Test-Path $path)) { Write-Error "missing $path"; exit 1 }
          }
          $manifest = Get-Content "$root/PACKAGE_MANIFEST.json" | ConvertFrom-Json
          if ($manifest.static_skill_count -ne 26) { Write-Error 'manifest static_skill_count mismatch'; exit 1 }
      - name: ZIP shell line-ending qualification
        shell: pwsh
        run: |
          python -c "import glob,zipfile; p=glob.glob(r'dist/PFC-AITest-DSH-Turnkey-RC6-BANK-WIN10-*.zip')[0]; z=zipfile.ZipFile(p); bad=[n for n in z.namelist() if n.endswith('.sh') and b'\r\n' in z.read(n)]; assert not bad, bad"
      - name: Git Bash package-only verification
        shell: bash
        run: ./dist/PFC-AITest-DSH-Turnkey-RC6-BANK-WIN10/VERIFY.sh --package-only
      - name: Git Bash workspace fresh and field legacy upgrade qualification
        shell: bash
        run: |
          set -euo pipefail
          PKG="$GITHUB_WORKSPACE/dist/PFC-AITest-DSH-Turnkey-RC6-BANK-WIN10"
          FRESH="$RUNNER_TEMP/rc6-pfc-fresh"
          LEGACY="$RUNNER_TEMP/rc6-pfc-legacy"
          rm -rf "$FRESH" "$LEGACY"
          PFC_WORKSPACE="$FRESH" "$PKG/INSTALL-AITEST.sh"
          PFC_WORKSPACE="$FRESH" "$PKG/VERIFY-RC6-PROFILE.sh"
          test "$(find "$FRESH/.dsh/skills" -mindepth 1 -maxdepth 1 -type d -name 'pfc-*' | wc -l | tr -d ' ')" = "26"
          PFC_WORKSPACE="$FRESH" "$PKG/INSTALL-AITEST.sh" | grep -q '"install_mode": "RC6_REPAIR"'

          mkdir -p \
            "$LEGACY/.dsh/skills/pfc-old-rc5" \
            "$LEGACY/.dsh/skills/custom-bank" \
            "$LEGACY/.agents/skills/pfc-old-agent" \
            "$LEGACY/.opencode/skills/pfc-bank-context" \
            "$LEGACY/.opencode/skills/custom-opencode" \
            "$LEGACY/.opencode/agents"
          printf 'legacy\n' > "$LEGACY/.dsh/skills/pfc-old-rc5/SKILL.md"
          printf 'keep\n' > "$LEGACY/.dsh/skills/custom-bank/SKILL.md"
          printf 'legacy-agent\n' > "$LEGACY/.agents/skills/pfc-old-agent/SKILL.md"
          printf 'legacy-bank-context\n' > "$LEGACY/.opencode/skills/pfc-bank-context/SKILL.md"
          printf 'legacy-opencode-agent\n' > "$LEGACY/.opencode/agents/pfc-old-agent.md"
          printf 'keep-opencode\n' > "$LEGACY/.opencode/skills/custom-opencode/SKILL.md"

          PFC_WORKSPACE="$LEGACY" "$PKG/INSTALL-AITEST.sh" | grep -q '"install_mode": "UPGRADE_FROM_LEGACY"'
          PFC_WORKSPACE="$LEGACY" "$PKG/VERIFY-RC6-PROFILE.sh"
          test "$(find "$LEGACY/.dsh/skills" -mindepth 1 -maxdepth 1 -type d -name 'pfc-*' | wc -l | tr -d ' ')" = "26"
          test -f "$LEGACY/.dsh/skills/custom-bank/SKILL.md"
          test -f "$LEGACY/.opencode/skills/custom-opencode/SKILL.md"
          test -z "$(find "$LEGACY/.agents/skills" -maxdepth 1 -name 'pfc-*' -print -quit 2>/dev/null || true)"
          test -z "$(find "$LEGACY/.opencode/skills" -maxdepth 1 -name 'pfc-*' -print -quit 2>/dev/null || true)"
          test -z "$(find "$LEGACY/.opencode/agents" -maxdepth 1 -name 'pfc-*' -print -quit 2>/dev/null || true)"
          test -n "$(find "$LEGACY/.aitest-backup" -path '*/.dsh/skills/pfc-old-rc5/SKILL.md' -print -quit)"
          test -n "$(find "$LEGACY/.aitest-backup" -path '*/.opencode/skills/pfc-bank-context/SKILL.md' -print -quit)"
          test -n "$(find "$LEGACY/.aitest-backup" -path '*/.opencode/agents/pfc-old-agent.md' -print -quit)"
      - name: Historical runtime-context bridge and reusable offline tool qualification
        shell: pwsh
        run: |
          $ws = Join-Path $env:RUNNER_TEMP 'rc6-tool-bootstrap'
          $root = (Resolve-Path 'dist/PFC-AITest-DSH-Turnkey-RC6-BANK-WIN10').Path
          Remove-Item $ws -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force (Join-Path $ws 'tools') | Out-Null
          New-Item -ItemType Directory -Force (Join-Path $ws 'aitest-runtime-context/secrets') | Out-Null
          Set-Content -Path (Join-Path $ws 'tools/foura_auth.py') -Value "def login():`n    return 'not-executed'`n" -Encoding utf8
          $catPath = Join-Path $ws 'aitest-runtime-context/secrets/cat.json'
          Set-Content -Path $catPath -Value '{"password":"CI_SECRET_MUST_NOT_LEAK"}' -Encoding utf8
          $pythonPath = (Get-Command python).Source
          $registry = @{ schema_version='legacy.field.registry.v1'; tools=@{ codegraph=@{ tool_id='codegraph'; executable=$pythonPath } } }
          $registry | ConvertTo-Json -Depth 5 | Set-Content -Path (Join-Path $ws 'aitest-runtime-context/registry.json') -Encoding utf8

          python -m rc6_release.legacy_field_bridge --workspace $ws --package-root $root --output (Join-Path $ws 'legacy-field-env.sh')
          $bridgeText = Get-Content "$ws/.dsh/rc6/LEGACY_FIELD_BRIDGE.json" -Raw
          if ($bridgeText -match 'CI_SECRET_MUST_NOT_LEAK') { Write-Error 'CAT secret leaked into bridge state'; exit 1 }
          $bridge = $bridgeText | ConvertFrom-Json
          $codegraph = @($bridge.bindings | Where-Object { $_.tool_id -eq 'codegraph' })[0]
          $catBridge = @($bridge.bindings | Where-Object { $_.tool_id -eq 'cat' })[0]
          if (-not $bridge.registry_present) { Write-Error 'historical registry was not detected'; exit 1 }
          if (-not $codegraph.found -or $codegraph.provenance -ne 'AITEST_RUNTIME_CONTEXT_REGISTRY') { Write-Error 'CodeGraph registry bridge failed'; exit 1 }
          if (-not $catBridge.found -or $catBridge.provenance -ne 'AITEST_RUNTIME_CONTEXT_SECRET_REF') { Write-Error 'CAT historical binding bridge failed'; exit 1 }
          if ($bridge.secret_contents_read -ne $false) { Write-Error 'bridge must not read secret contents'; exit 1 }
          if ($bridge.target_ready_forged -ne $false) { Write-Error 'bridge forged target readiness'; exit 1 }

          $env:PFC_CODEGRAPH_BIN = $codegraph.path
          $env:PFC_CAT_CONFIG = $catBridge.path
          $env:PFC_GIT_BIN = (Get-Command git).Source
          $env:PFC_PYTHON = $pythonPath
          python -m rc6_release.tool_bootstrap bootstrap --workspace $ws
          python -m rc6_release.tool_bootstrap verify --workspace $ws
          $profile = Get-Content "$ws/.dsh/rc6/TOOL_PROFILE.json" | ConvertFrom-Json
          $git = @($profile.tools | Where-Object { $_.tool_id -eq 'git' })[0]
          $cg = @($profile.tools | Where-Object { $_.tool_id -eq 'codegraph' })[0]
          $foura = @($profile.tools | Where-Object { $_.tool_id -eq '4a' })[0]
          $cat = @($profile.tools | Where-Object { $_.tool_id -eq 'cat' })[0]
          if ($git.status -ne 'PROBE_PASS') { Write-Error 'git reuse/probe failed'; exit 1 }
          if ($cg.status -ne 'PROBE_PASS') { Write-Error 'CodeGraph reuse/probe failed'; exit 1 }
          if ($foura.status -ne 'BLOCKED_FIELD_AUTH') { Write-Error '4A must remain field-blocked'; exit 1 }
          if ($cat.status -ne 'BLOCKED_FIELD_LOGIN') { Write-Error 'CAT must remain field-blocked'; exit 1 }
          if (@($profile.tools | Where-Object { $_.target_ready -eq $true }).Count -ne 0) { Write-Error 'bootstrap forged target READY'; exit 1 }
          if ($profile.summary.target_ready -ne 0) { Write-Error 'target_ready summary must stay zero'; exit 1 }
          if (Test-Path "$ws/tools/__pycache__") { Write-Error '4A discovery created bytecode side effect'; exit 1 }
      - name: Execution Closure runtime is packaged and status stays pre-bank
        shell: pwsh
        run: |
          $root = 'dist/PFC-AITest-DSH-Turnkey-RC6-BANK-WIN10'
          $manifest = Get-Content "$root/PACKAGE_MANIFEST.json" | ConvertFrom-Json
          if ($manifest.agent_runtime_bank_final_gate -ne 'NOT_PROVEN_UNTIL_REAL_DSH_VERTICAL_SLICE_PASS') { exit 1 }
          if ($manifest.autonomous_testing_pass -ne $false) { exit 1 }
          if ($manifest.full_chain_real -ne $false) { exit 1 }
          if ($manifest.bank_field_pass -ne $false) { exit 1 }
          if ($manifest.workspace_installation -ne 'AUTO_FRESH_OR_UPGRADE') { exit 1 }
          if ($manifest.static_skill_count -ne 26) { exit 1 }
          $required = @(
            'rc6_runtime/executable_spec.py',
            'rc6_runtime/automation.py',
            'rc6_runtime/runner_manifest.py',
            'rc6_runtime/recovery.py',
            'rc6_runtime/recovery_adapters.py',
            'rc6_runtime/execution_overlay.py',
            'rc6_release/execution_closure_mcp.py',
            'rc6_release/execution_closure_hardening.py',
            'rc6_release/recovery_adapter_registry.py',
            'rc6_release/workspace_install.py',
            'rc6_release/static_skills.py',
            'rc6_release/tool_bootstrap.py',
            'rc6_release/legacy_skill_guard.py',
            'rc6_release/legacy_field_bridge.py',
            'INSTALL-AITEST.sh',
            'VERIFY-RC6-PROFILE.sh',
            'ROLLBACK-AITEST.sh',
            '.dsh/skills/pfc-full-chain-test/SKILL.md',
            '.dsh/skills/pfc-requirement-analysis/SKILL.md',
            '.dsh/skills/pfc-code-analysis/SKILL.md',
            '.dsh/skills/pfc-l3-test-design/SKILL.md',
            '.dsh/skills/pfc-automation-engineer/SKILL.md',
            '.dsh/skills/pfc-failure-diagnosis/SKILL.md',
            'QUALIFY-AGENT-RUNTIME.sh'
          )
          foreach ($file in $required) { if (-not (Test-Path "$root/$file")) { Write-Error "missing $file"; exit 1 } }
      - name: Upload RC6 engineering candidate
        uses: actions/upload-artifact@v4
        with:
          name: PFC-AITest-DSH-Turnkey-RC6-BANK-WIN10-${{ github.sha }}
          path: dist/PFC-AITest-DSH-Turnkey-RC6-BANK-WIN10-*.zip
          if-no-files-found: error
          retention-days: 14
