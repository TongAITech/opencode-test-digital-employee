name: RC6 Release Integrated Qualification and Packaging

on:
  push:
    branches:
      - work/rc6-runtime-reconstruction
      - work/rc6-agent-runtime-bank-final-clean
    paths:
      - 'rc6_runtime/**'
      - 'rc6_release/**'
      - 'packaging/rc6/**'
      - 'tests/**'
      - 'docs/RC6_RELEASE_QUALIFICATION.md'
      - 'docs/RC6_CONSTRUCTION_STATUS.md'
      - '.github/workflows/rc6-release.yml'
  workflow_dispatch:

jobs:
  runtime-regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install qualification dependencies
        run: python -m pip install -U pytest
      - name: Run all RC6 qualification including Execution Closure
        run: python -m pytest -q tests
      - name: Bash syntax qualification
        run: |
          bash -n packaging/rc6/AITEST.sh
          bash -n packaging/rc6/START-AITEST.sh
          bash -n packaging/rc6/STOP-AITEST.sh
          bash -n packaging/rc6/STATUS.sh
          bash -n packaging/rc6/VERIFY.sh
          bash -n packaging/rc6/QUALIFY-AGENT-RUNTIME.sh
          bash -n packaging/rc6/INSTALL-AITEST.sh
          bash -n packaging/rc6/VERIFY-RC6-PROFILE.sh
          bash -n packaging/rc6/ROLLBACK-AITEST.sh

  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Install qualification dependencies
        run: python -m pip install -U pytest
      - name: Run all RC6 qualification on Windows Python 3.8
        run: python -m pytest -q tests
      - name: Build immutable engineering candidate
        shell: pwsh
        run: python -m rc6_release.package build --repo-root . --output dist --source-commit $env:GITHUB_SHA
      - name: Verify built package
        shell: pwsh
        run: python -m rc6_release.package verify --package-root dist/PFC-AITest-DSH-Turnkey-RC6-BANK-WIN10
      - name: Git Bash package-only verification
        shell: bash
        run: ./dist/PFC-AITest-DSH-Turnkey-RC6-BANK-WIN10/VERIFY.sh --package-only
      - name: Git Bash workspace fresh and legacy upgrade qualification
        shell: bash
        run: |
          set -euo pipefail
          PKG="$GITHUB_WORKSPACE/dist/PFC-AITest-DSH-Turnkey-RC6-BANK-WIN10"
          FRESH="$RUNNER_TEMP/rc6-pfc-fresh"
          LEGACY="$RUNNER_TEMP/rc6-pfc-legacy"
          rm -rf "$FRESH" "$LEGACY"
          PFC_WORKSPACE="$FRESH" "$PKG/INSTALL-AITEST.sh"
          PFC_WORKSPACE="$FRESH" "$PKG/VERIFY-RC6-PROFILE.sh"
          PFC_WORKSPACE="$FRESH" "$PKG/INSTALL-AITEST.sh" | grep -q '"install_mode": "RC6_REPAIR"'
          mkdir -p "$LEGACY/.dsh/skills/pfc-old-rc5" "$LEGACY/.dsh/skills/custom-bank" "$LEGACY/.agents/skills/pfc-old-agent"
          printf 'legacy\n' > "$LEGACY/.dsh/skills/pfc-old-rc5/SKILL.md"
          printf 'keep\n' > "$LEGACY/.dsh/skills/custom-bank/SKILL.md"
          printf 'legacy-agent\n' > "$LEGACY/.agents/skills/pfc-old-agent/SKILL.md"
          PFC_WORKSPACE="$LEGACY" "$PKG/INSTALL-AITEST.sh" | grep -q '"install_mode": "UPGRADE_FROM_LEGACY"'
          PFC_WORKSPACE="$LEGACY" "$PKG/VERIFY-RC6-PROFILE.sh"
          test -f "$LEGACY/.dsh/skills/custom-bank/SKILL.md"
          test -n "$(find "$LEGACY/.aitest-backup" -path '*/.dsh/skills/pfc-old-rc5/SKILL.md' -print -quit)"
          test -z "$(find "$LEGACY/.agents/skills" -maxdepth 1 -name 'pfc-*' -print -quit 2>/dev/null || true)"
      - name: Execution Closure runtime is packaged and status stays pre-bank
        shell: pwsh
        run: |
          $root = 'dist/PFC-AITest-DSH-Turnkey-RC6-BANK-WIN10'
          $manifest = Get-Content "$root/PACKAGE_MANIFEST.json" | ConvertFrom-Json
          if ($manifest.agent_runtime_bank_final_gate -ne 'NOT_PROVEN_UNTIL_REAL_DSH_VERTICAL_SLICE_PASS') { exit 1 }
          if ($manifest.autonomous_testing_pass -ne $false) { exit 1 }
          if ($manifest.full_chain_real -ne $false) { exit 1 }
          if ($manifest.bank_field_pass -ne $false) { exit 1 }
          if ($manifest.workspace_installation -ne 'AUTO_FRESH_OR_UPGRADE') { exit 1 }
          $required = @(
            'rc6_runtime/executable_spec.py',
            'rc6_runtime/automation.py',
            'rc6_runtime/runner_manifest.py',
            'rc6_runtime/recovery.py',
            'rc6_runtime/recovery_adapters.py',
            'rc6_runtime/execution_overlay.py',
            'rc6_release/execution_closure_mcp.py',
            'rc6_release/execution_closure_hardening.py',
            'rc6_release/recovery_adapter_registry.py',
            'rc6_release/workspace_install.py',
            'INSTALL-AITEST.sh',
            'VERIFY-RC6-PROFILE.sh',
            'ROLLBACK-AITEST.sh',
            '.dsh/skills/pfc-full-chain-test/SKILL.md',
            'QUALIFY-AGENT-RUNTIME.sh'
          )
          foreach ($file in $required) { if (-not (Test-Path "$root/$file")) { Write-Error "missing $file"; exit 1 } }
      - name: Upload RC6 engineering candidate
        uses: actions/upload-artifact@v4
        with:
          name: PFC-AITest-DSH-Turnkey-RC6-BANK-WIN10-${{ github.sha }}
          path: dist/PFC-AITest-DSH-Turnkey-RC6-BANK-WIN10-*.zip
          if-no-files-found: error
          retention-days: 14
