name: RC7.2 R4 C07 Bank-Owned AgentTeams Provider Trust (No ZIP)

on:
  pull_request:
    branches: [work/rc7.2]
    paths:
      - 'rc7_release/rc72_dsh_agentteams_factory.py'
      - 'rc7_release/rc72_mission_cli.py'
      - 'tests/test_rc72_configured_mission.py'
      - 'tests/test_rc72_r4_c07_bank_provider_trust.py'
      - '.github/workflows/rc7.2-r4-c07-provider-trust.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc72-r4-c07-bank-trust-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  c07-bank-trust:
    name: r4-c07-host-trust-${{ matrix.os }}-python-${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
        python: ['3.8','3.11']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned qualification test requirements
        run: python -m rc7_release.rc72_pytest_bootstrap --requirements rc7_release/requirements-qualification.txt --timeout-seconds 120
      - name: Verify no provider may self-attest bank Captain identity
        run: |
          python -m compileall -q rc7_release rc7_runtime tests
          python -m pytest -q tests/test_rc72_r4_c07_bank_provider_trust.py tests/test_rc72_dsh_agentteams_host.py tests/test_rc72_configured_mission.py --junitxml=rc72-r4-c07-trust.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc72-r4-c07-bank-trust-${{ matrix.os }}-${{ matrix.python }}-${{ github.sha }}
          path: rc72-r4-c07-trust.xml
          retention-days: 14
