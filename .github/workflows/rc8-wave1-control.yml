name: RC8 W1 Center Node Control

on:
  push:
    branches:
      - work/rc8
    paths:
      - 'rc8_center/**'
      - 'rc8_node/**'
      - 'rc8_runtime/**'
      - 'packaging/rc8/**'
      - 'docs/rc8/RC8-CODEGRAPH-REALITY-RUNBOOK.md'
      - 'docs/rc8/RC8-CODE-ANALYSIS-REALITY-RUNBOOK.md'
      - 'tests/test_rc8_center_control.py'
      - 'tests/test_rc8_center_node_http.py'
      - 'tests/test_rc8_formal_node_agent.py'
      - 'tests/test_rc8_artifact_sync.py'
      - 'tests/test_rc8_artifact_http.py'
      - 'tests/test_rc8_durable_repository.py'
      - 'tests/test_rc8_center_cli.py'
      - 'tests/test_rc8_real_capability_adapter.py'
      - 'tests/test_rc8_maven_execution_adapter.py'
      - 'tests/test_rc8_jacoco_changed_scope.py'
      - 'tests/test_rc8_maven_jacoco_execution.py'
      - 'tests/test_rc8_execution_publish.py'
      - 'tests/test_rc8_execution_coverage_publish.py'
      - 'tests/test_rc8_execution_publish_http.py'
      - 'tests/test_rc8_work_item_execution.py'
      - 'tests/test_rc8_work_item_coverage_execution.py'
      - 'tests/test_rc8_maven_reality_runner.py'
      - 'tests/test_rc8_codegraph_adapter.py'
      - 'tests/test_rc8_codegraph_reality_runner.py'
      - 'tests/test_rc8_code_analysis.py'
      - 'tests/test_rc8_code_analysis_reality_runner.py'
      - 'tests/test_rc8_dsh_semantic_worker.py'
      - 'tests/test_rc8_code_analysis_auto_reality.py'
      - '.github/workflows/rc8-wave1-control.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Compile W1 control plane, launchers and real execution adapters
        shell: bash
        run: |
          python -m py_compile \
            rc8_center/__init__.py \
            rc8_center/__main__.py \
            rc8_center/control_plane.py \
            rc8_center/http_server.py \
            rc8_center/artifacts.py \
            rc8_center/json_repository.py \
            rc8_runtime/artifacts.py \
            rc8_node/__init__.py \
            rc8_node/agent.py \
            rc8_node/formal_agent.py \
            rc8_node/capabilities.py \
            rc8_node/execution.py \
            rc8_node/jacoco.py \
            rc8_node/execution_publish.py \
            rc8_node/work_item_execution.py \
            rc8_node/reality_maven.py \
            rc8_node/codegraph.py \
            rc8_node/reality_codegraph.py \
            rc8_node/code_analysis.py \
            rc8_node/code_analysis_semantic.py \
            rc8_node/dsh_semantic_worker.py \
            rc8_node/reality_code_analysis.py \
            rc8_node/reality_code_analysis_auto.py \
            rc8_node/__main__.py \
            packaging/rc8/build-w1-reality-package.py \
            tests/test_rc8_center_control.py \
            tests/test_rc8_center_node_http.py \
            tests/test_rc8_formal_node_agent.py \
            tests/test_rc8_artifact_sync.py \
            tests/test_rc8_artifact_http.py \
            tests/test_rc8_durable_repository.py \
            tests/test_rc8_center_cli.py \
            tests/test_rc8_real_capability_adapter.py \
            tests/test_rc8_maven_execution_adapter.py \
            tests/test_rc8_jacoco_changed_scope.py \
            tests/test_rc8_maven_jacoco_execution.py \
            tests/test_rc8_execution_publish.py \
            tests/test_rc8_execution_coverage_publish.py \
            tests/test_rc8_execution_publish_http.py \
            tests/test_rc8_work_item_execution.py \
            tests/test_rc8_work_item_coverage_execution.py \
            tests/test_rc8_maven_reality_runner.py \
            tests/test_rc8_codegraph_adapter.py \
            tests/test_rc8_codegraph_reality_runner.py \
            tests/test_rc8_code_analysis.py \
            tests/test_rc8_code_analysis_reality_runner.py \
            tests/test_rc8_dsh_semantic_worker.py \
            tests/test_rc8_code_analysis_auto_reality.py
      - name: Verify canonical shell entrypoints and durable node-state guard
        shell: bash
        run: |
          bash packaging/rc8/rc8-node.sh --help >/dev/null
          bash packaging/rc8/rc8-center.sh --help >/dev/null
          bash packaging/rc8/rc8-maven-reality.sh --help >/dev/null
          bash packaging/rc8/rc8-codegraph-reality.sh --help >/dev/null
          bash packaging/rc8/rc8-code-analysis-reality.sh --help >/dev/null
          STATE_A="$PWD/.ci-node-state-a"
          STATE_B="$PWD/.ci-node-state-b"
          mkdir -p "$STATE_A" "$STATE_B"
          for entry in rc8-node.sh rc8-maven-reality.sh rc8-codegraph-reality.sh rc8-code-analysis-reality.sh; do
            LOG="$PWD/.ci-${entry}.log"
            if RC8_NODE_STATE="$STATE_A" bash "packaging/rc8/$entry" --state-dir "$STATE_B" --help >"$LOG" 2>&1; then
              echo "$entry accepted divergent durable node state" >&2
              cat "$LOG" >&2
              exit 1
            else
              STATUS=$?
            fi
            test "$STATUS" -eq 4
            grep -q 'RC8_NODE_STATE_CONFLICT' "$LOG"
          done
      - name: Run W1/W2 control, execution and autonomous code-analysis contract tests
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q \
            tests/test_rc8_truth_identity_contracts.py \
            tests/test_rc8_r1_runtime.py \
            tests/test_rc8_center_control.py \
            tests/test_rc8_center_node_http.py \
            tests/test_rc8_formal_node_agent.py \
            tests/test_rc8_artifact_sync.py \
            tests/test_rc8_artifact_http.py \
            tests/test_rc8_durable_repository.py \
            tests/test_rc8_center_cli.py \
            tests/test_rc8_real_capability_adapter.py \
            tests/test_rc8_maven_execution_adapter.py \
            tests/test_rc8_jacoco_changed_scope.py \
            tests/test_rc8_maven_jacoco_execution.py \
            tests/test_rc8_execution_publish.py \
            tests/test_rc8_execution_coverage_publish.py \
            tests/test_rc8_execution_publish_http.py \
            tests/test_rc8_work_item_execution.py \
            tests/test_rc8_work_item_coverage_execution.py \
            tests/test_rc8_maven_reality_runner.py \
            tests/test_rc8_codegraph_adapter.py \
            tests/test_rc8_codegraph_reality_runner.py \
            tests/test_rc8_code_analysis.py \
            tests/test_rc8_code_analysis_reality_runner.py \
            tests/test_rc8_dsh_semantic_worker.py \
            tests/test_rc8_code_analysis_auto_reality.py

  package:
    needs: control-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Build complete standalone W1/W2 bank reality package
        shell: bash
        run: |
          rm -rf dist
          python packaging/rc8/build-w1-reality-package.py --repo . --output-dir dist | tee dist-build-result.json
          python - <<'PY'
          import glob, zipfile
          files = glob.glob('dist/RC8-W1-REALITY-BANK-*.zip')
          assert len(files) == 1, files
          with zipfile.ZipFile(files[0], 'r') as zf:
              assert zf.testzip() is None
              names = zf.namelist()
              assert any(name.endswith('/rc8_node/formal_agent.py') for name in names)
              assert any(name.endswith('/rc8_node/reality_maven.py') for name in names)
              assert any(name.endswith('/rc8_node/jacoco.py') for name in names)
              assert any(name.endswith('/rc8_node/reality_codegraph.py') for name in names)
              assert any(name.endswith('/rc8_node/code_analysis.py') for name in names)
              assert any(name.endswith('/rc8_node/code_analysis_semantic.py') for name in names)
              assert any(name.endswith('/rc8_node/dsh_semantic_worker.py') for name in names)
              assert any(name.endswith('/rc8_node/reality_code_analysis_auto.py') for name in names)
              assert any(name.endswith('/packaging/rc8/rc8-codegraph-reality.sh') for name in names)
              assert any(name.endswith('/packaging/rc8/rc8-code-analysis-reality.sh') for name in names)
              assert any(name.endswith('/docs/rc8/RC8-CODE-ANALYSIS-REALITY-RUNBOOK.md') for name in names)
              assert any(name.endswith('/SHA256SUMS.txt') for name in names)
              assert any(name.endswith('/PACKAGE-MANIFEST.json') for name in names)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: RC8-W1-REALITY-BANK-${{ github.sha }}
          path: |
            dist/RC8-W1-REALITY-BANK-*.zip
            dist-build-result.json
          if-no-files-found: error
          retention-days: 14
