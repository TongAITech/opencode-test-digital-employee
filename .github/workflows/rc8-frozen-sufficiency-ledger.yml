name: RC8 Frozen Sufficiency Ledger

on:
  push:
    branches: [work/rc8]
    paths:
      - 'rc8_runtime/governance.py'
      - 'rc8_runtime/center_mission.py'
      - 'rc8_runtime/center_code_sufficiency.py'
      - 'tests/test_rc8_frozen_sufficiency_zero_denominator.py'
      - '.github/workflows/rc8-frozen-sufficiency-ledger.yml'
  workflow_dispatch:

jobs:
  frozen-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Compile governance and sufficiency runtime
        run: python -m py_compile rc8_runtime/governance.py rc8_runtime/center_mission.py rc8_runtime/center_code_sufficiency.py
      - name: Prove zero denominator cannot become SUFFICIENT
        run: python -m unittest tests.test_rc8_frozen_sufficiency_zero_denominator -v
