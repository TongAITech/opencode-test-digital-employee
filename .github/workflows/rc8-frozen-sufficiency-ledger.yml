name: RC8 Frozen Sufficiency Ledger

on:
  push:
    branches: [work/rc8]
    paths:
      - 'rc8_runtime/governance.py'
      - 'tests/test_rc8_coverage_zero_denominator_contract.py'
      - '.github/workflows/rc8-frozen-sufficiency-ledger.yml'
  workflow_dispatch:

jobs:
  frozen-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Compile governance runtime
        run: python -m py_compile rc8_runtime/governance.py
      - name: Prove zero denominator cannot become SUFFICIENT
        run: python -m pytest -q tests/test_rc8_coverage_zero_denominator_contract.py
