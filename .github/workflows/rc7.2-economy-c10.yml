name: RC7.2 C10 Economy Independent Qualification

on:
  push:
    branches:
      - work/rc7.2-economy
    paths:
      - 'rc7_runtime/rc72_production_economy_wiring.py'
      - 'rc7_runtime/rc72_production_economy_ingress.py'
      - 'rc7_release/rc72_mission_cli.py'
      - 'rc7_runtime/rc72_model_economy.py'
      - 'rc7_runtime/rc72_economy_scheduler.py'
      - 'tests/test_rc72_production_economy_wiring.py'
      - 'tests/test_rc72_production_economy_ingress.py'
      - 'tests/test_rc72_cost_window_configuration.py'
      - 'docs/rc7.2/C10-PRODUCTION-ECONOMY-INTEGRATION-HANDOFF.md'
      - '.github/workflows/rc7.2-economy-c10.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  economy-contract:
    name: c10-native-dsh-contract-python-${{ matrix.python-version }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile inherited and new runtime
        run: python -m compileall -q rc6_runtime rc7_runtime
      - name: Native DSH model-economy and adjacent regression
        run: >-
          python -m pytest -q
          tests/test_rc72_production_economy_wiring.py
          tests/test_rc72_production_economy_ingress.py
          tests/test_rc72_cost_window_configuration.py
          tests/test_rc72_token_economy.py
          tests/test_rc72_dsh_token_usage_wiring.py
          tests/test_rc72_context_worker_bridge.py
          tests/test_rc72_safe_execution_batch.py
          tests/test_rc72_economy_scheduler.py
          tests/test_rc72_critical_path_no_delay.py
          tests/test_rc72_q7_admission.py
