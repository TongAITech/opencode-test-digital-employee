name: RC7 One-SST Field Control

on:
  push:
    branches:
      - work/rc7-field-hardening
    paths:
      - 'rc7_release/one_sst_field_qualification.py'
      - 'packaging/rc7/FIELD-QUALIFY-ONE-SST.cmd'
      - 'packaging/rc7/FIELD-QUALIFY-ONE-SST.sh'
      - 'tests/test_rc7_one_sst_field_qualification.py'
      - '.github/workflows/rc7-one-sst-field-control.yml'
  pull_request:
    paths:
      - 'rc7_release/one_sst_field_qualification.py'
      - 'packaging/rc7/FIELD-QUALIFY-ONE-SST.cmd'
      - 'packaging/rc7/FIELD-QUALIFY-ONE-SST.sh'
      - 'tests/test_rc7_one_sst_field_qualification.py'
      - '.github/workflows/rc7-one-sst-field-control.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  one-sst-field-control:
    name: One-SST field control (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile One-SST field controller
        run: python -m py_compile rc7_release/one_sst_field_qualification.py
      - name: Exercise One-SST field controller
        run: python -m pytest -q tests/test_rc7_one_sst_field_qualification.py
      - name: Verify direct CLI surface
        run: python -m rc7_release.one_sst_field_qualification --help
