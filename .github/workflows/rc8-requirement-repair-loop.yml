name: RC8 Requirement Repair Loop

on:
  push:
    branches: ["work/rc8"]
    paths:
      - "rc8_center/requirement_loop_progression.py"
      - "rc8_center/formal_app.py"
      - "rc8_center/formal_control.py"
      - "rc8_center/scope_aware_governance_projector.py"
      - "rc8_center/autonomous_progression.py"
      - "rc8_center/mission_service.py"
      - "rc8_center/api/artifact_read_routes.py"
      - "rc8_center/api/claim_routes.py"
      - "rc8_center/api/__init__.py"
      - "rc8_node/__main__.py"
      - "rc8_node/autonomous_claim_client.py"
      - "rc8_node/autonomous_dispatcher.py"
      - "rc8_node/dsh_json_runner.py"
      - "rc8_node/scope_intake_worker.py"
      - "rc8_node/requirement_sufficiency_worker.py"
      - "rc8_runtime/mission_graph.py"
      - "rc8_runtime/governance.py"
      - "tests/test_rc8_node_autonomous_entry.py"
      - "tests/test_rc8_dsh_json_runner.py"
      - "tests/test_rc8_autonomous_dispatcher.py"
      - "tests/test_rc8_scope_intake_worker.py"
      - "tests/test_rc8_requirement_repair_loop.py"
      - "tests/test_rc8_requirement_sufficiency_worker.py"
      - "tests/test_rc8_scope_aware_sufficiency_projection.py"
      - ".github/workflows/rc8-requirement-repair-loop.yml"
  workflow_dispatch:

jobs:
  requirement-repair-loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Center test dependencies
        run: pip install -r center/requirements.txt pytest
      - name: Compile autonomous requirement repair slice
        run: |
          python -m py_compile \
            rc8_center/requirement_loop_progression.py \
            rc8_center/formal_app.py \
            rc8_center/formal_control.py \
            rc8_center/scope_aware_governance_projector.py \
            rc8_center/api/artifact_read_routes.py \
            rc8_center/api/claim_routes.py \
            rc8_node/__main__.py \
            rc8_node/autonomous_claim_client.py \
            rc8_node/autonomous_dispatcher.py \
            rc8_node/dsh_json_runner.py \
            rc8_node/scope_intake_worker.py \
            rc8_node/requirement_sufficiency_worker.py \
            tests/test_rc8_node_autonomous_entry.py \
            tests/test_rc8_dsh_json_runner.py \
            tests/test_rc8_autonomous_dispatcher.py \
            tests/test_rc8_scope_intake_worker.py \
            tests/test_rc8_requirement_repair_loop.py \
            tests/test_rc8_requirement_sufficiency_worker.py \
            tests/test_rc8_scope_aware_sufficiency_projection.py
      - name: Prove nested DSH JSON root preservation
        run: python -m pytest -q tests/test_rc8_dsh_json_runner.py
      - name: Prove autonomous node entry stage whitelist
        run: python -m pytest -q tests/test_rc8_node_autonomous_entry.py
      - name: Prove stage-safe dispatcher and scope intake evidence
        run: python -m pytest -q tests/test_rc8_autonomous_dispatcher.py tests/test_rc8_scope_intake_worker.py
      - name: Prove deterministic requirement sufficiency worker
        run: python -m pytest -q tests/test_rc8_requirement_sufficiency_worker.py
      - name: Prove append-only requirement repair loop
        run: python -m pytest -q tests/test_rc8_requirement_repair_loop.py
      - name: Prove scope-local and mission-global sufficiency gates
        run: python -m pytest -q tests/test_rc8_scope_aware_sufficiency_projection.py
