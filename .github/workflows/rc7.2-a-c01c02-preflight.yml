name: RC7.2 C01-C02 Whole-N5 Independent Proof Regression

on:
  push:
    branches:
      - work/rc7.2-a-c01c02-batch-proof
      - work/rc7.2-abd-integration
      - work/rc7.2
    paths:
      - 'rc7_runtime/rc72_n8_retry_continuation.py'
      - 'rc7_runtime/rc72_n8_execution_diagnosis.py'
      - 'rc7_runtime/rc72_n5_existing_data_repair.py'
      - 'tests/test_rc72_n8_retry_continuation.py'
      - 'tests/test_rc72_qa_c01_c02_independent.py'
      - '.github/workflows/rc7.2-a-c01c02-preflight.yml'
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches:
      - work/rc7.2-abd-integration
      - work/rc7.2
    paths:
      - 'rc7_runtime/**'
      - 'tests/test_rc72_n8_retry_continuation.py'
      - 'tests/test_rc72_qa_c01_c02_independent.py'
      - '.github/workflows/rc7.2-a-c01c02-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc72-n5-proof-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  physical-independent-n5-and-fresh-n7:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: actual-n5-n6-n7-${{ matrix.os }}-python-${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
        python: ['3.8', '3.11']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned qualification dependency
        run: python -m rc7_release.rc72_pytest_bootstrap --requirements rc7_release/requirements-qualification.txt --timeout-seconds 120
      - name: Compile actual N5-N8 runtime
        run: python -m compileall -q rc6_runtime rc7_runtime rc7_release
      - name: Execute original independent R1 no-side-effect test and full N8 regression
        run: >-
          python -m pytest -q
          tests/test_rc72_n8_retry_continuation.py
          tests/test_rc72_qa_c01_c02_independent.py
          --junitxml=rc72-n5-n8-proof.xml
      - name: Retain exact SHA test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc72-n5-proof-${{ matrix.os }}-python-${{ matrix.python }}-${{ github.sha }}
          path: rc72-n5-n8-proof.xml
          if-no-files-found: warn
          retention-days: 14
