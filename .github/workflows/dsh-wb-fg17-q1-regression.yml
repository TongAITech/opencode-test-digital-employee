name: FG17 Q1 Python 3.8 Real Chromium Async DOM Oracle Regression
on:
  push:
    branches: [work/dsh-wb-w0-fg17-fg21]
    paths:
      - 'tests/test_rc72_c09_real_chromium_cdp_smoke.py'
      - 'tests/test_rc72_journey_playwright_adapter.py'
      - 'rc7_runtime/rc72_journey_playwright.py'
      - '.github/workflows/dsh-wb-fg17-q1-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  q1-real-chromium:
    name: fg17-q1-py38-5x-real-chromium-dom-oracle
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Install the exact Q1 Python 3.8 and Playwright 1.48 compatibility stack
        run: |
          python -m pip install --disable-pip-version-check pytest==8.3.5 playwright==1.48.0
          python -m playwright install --with-deps chromium
      - name: Run the unmodified HTTP, DOM, CDP, R1 and PNG oracles five times
        shell: bash
        env:
          EVIDENCE_ROOT: fg17-q1-evidence
        run: |
          set +e
          failures=0
          for attempt in 1 2 3 4 5; do
            echo "::group::FG17 Q1 PY38 REAL CHROMIUM attempt=$attempt"
            export RC72_C09_EVIDENCE_EXPORT_ROOT="${EVIDENCE_ROOT}/attempt-${attempt}"
            python -m pytest -q -ra tests/test_rc72_c09_real_chromium_cdp_smoke.py \
              --junitxml="fg17-q1-${attempt}.xml"
            status=$?
            echo "FG17_ATTEMPT=${attempt} EXIT=${status}"
            if [ "$status" -ne 0 ]; then failures=$((failures + 1)); fi
            echo "::endgroup::"
          done
          echo "FG17_FIVE_TRIAL_FAILURES=${failures}"
          test "$failures" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fg17-q1-py38-real-chromium-${{ github.sha }}
          path: |
            fg17-q1-*.xml
            fg17-q1-evidence/
          retention-days: 14
          if-no-files-found: warn
