name: RC7.2 C07 C04 Captain Signed N9 DSH Execution

on:
  push:
    branches: [work/rc7.2-a-c07-n9-signed-dsh-execution]
  pull_request:
    branches: [work/rc7.2-abcd-v5-bsk-mobile-qualification]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-n9-professional:
    name: c07-n9-signed-dsh-${{ matrix.os }}-py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
        python: ['3.8', '3.11']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned native qualification harness
        run: python -m rc7_release.rc72_pytest_bootstrap --requirements rc7_release/requirements-qualification.txt --timeout-seconds 120
      - name: Compile Captain N9 bridge and real MissionFactory
        run: >-
          python -m py_compile
          rc7_runtime/rc72_n9_captain_worker_bridge.py
          rc7_runtime/rc72_n9_professional_dsh.py
          rc7_runtime/rc72_mission_factory.py
          tests/test_rc72_n9_captain_signed_dsh_bridge.py
      - name: Exercise signed DSH invocation and real local SUT failure no-replay
        run: >-
          python -m pytest -q
          tests/test_rc72_n9_captain_signed_dsh_bridge.py
          tests/test_rc72_c07_n9_professional_dsh_fence.py
          tests/test_rc72_n9_captain_qualification.py
          tests/test_rc72_n9_professional_dsh_contract.py
          tests/test_rc72_n9_professional_dsh_real_route.py
          tests/test_rc72_mission_factory.py
          tests/test_rc72_captain_host_reentry.py
          --junitxml=rc72-n9-signed-dsh.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc72-n9-signed-dsh-${{ matrix.os }}-${{ matrix.python }}-${{ github.sha }}
          path: rc72-n9-signed-dsh.xml
          retention-days: 14
          if-no-files-found: warn
