name: RC8 Distributed Runtime Stack

on:
  push:
    branches: [work/rc8]
    paths:
      - 'rc8_center/distributed_orchestration.py'
      - 'rc8_center/distributed_lifecycle.py'
      - 'rc8_center/node_team_runtime.py'
      - 'rc8_center/dsh_agent_teams_adapter.py'
      - 'rc8_center/dsh_node_runtime_adapter.py'
      - 'rc8_center/control_plane.py'
      - 'rc8_runtime/contracts.py'
      - 'rc8_runtime/r1_runtime.py'
      - 'tests/test_rc8_distributed_orchestration.py'
      - 'tests/test_rc8_distributed_lifecycle.py'
      - 'tests/test_rc8_node_team_runtime.py'
      - 'tests/test_rc8_dsh_agent_teams_adapter.py'
      - 'tests/test_rc8_dsh_node_runtime_adapter.py'
      - '.github/workflows/rc8-distributed-runtime-stack.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distributed-runtime-stack:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Install test dependency
        shell: bash
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile distributed runtime stack
        shell: bash
        run: |
          python -m py_compile \
            rc8_center/distributed_orchestration.py \
            rc8_center/distributed_lifecycle.py \
            rc8_center/node_team_runtime.py \
            rc8_center/dsh_agent_teams_adapter.py \
            rc8_center/dsh_node_runtime_adapter.py
      - name: Run distributed runtime stack regression
        shell: bash
        run: >-
          python -m pytest -q
          tests/test_rc8_distributed_orchestration.py
          tests/test_rc8_distributed_lifecycle.py
          tests/test_rc8_node_team_runtime.py
          tests/test_rc8_dsh_agent_teams_adapter.py
          tests/test_rc8_dsh_node_runtime_adapter.py
