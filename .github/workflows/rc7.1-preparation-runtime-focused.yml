name: RC7.1 Preparation Runtime Failure Focused Gate

on:
  push:
    branches:
      - work/rc7.1-minimal-hardening
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-preparation-runtime-failure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Install tests
        run: python -m pip install --disable-pip-version-check pytest
      - name: Preparation runtime durable blocker
        run: >-
          python -m pytest -q
          tests/test_rc7_1_bank_preparation_runtime_blocker.py
