name: RC7.2 C07 N9 Signed Child Authority Hardening

on:
  push:
    branches: [work/rc7.2-c07-n9-authority-env-hardening]
    paths:
      - 'rc7_runtime/rc72_authority.py'
      - 'rc7_runtime/rc72_n9_captain_worker_bridge.py'
      - 'tests/test_rc72_n9_captain_signed_dsh_bridge.py'
      - 'tests/test_rc72_worker_process_environment.py'
      - '.github/workflows/rc72-c07-n9-authority-env-hardening.yml'
  pull_request:
    branches: [work/rc7.2-abcd-v5-bsk-mobile-qualification]
    paths:
      - 'rc7_runtime/rc72_authority.py'
      - 'rc7_runtime/rc72_n9_captain_worker_bridge.py'
      - 'tests/test_rc72_n9_captain_signed_dsh_bridge.py'
      - 'tests/test_rc72_worker_process_environment.py'
      - '.github/workflows/rc72-c07-n9-authority-env-hardening.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-n9-worker:
    name: n9-authority-${{ matrix.os }}-py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
        python: ['3.8', '3.11']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install approved native harness
        run: python -m rc7_release.rc72_pytest_bootstrap --requirements rc7_release/requirements-qualification.txt --timeout-seconds 120
      - name: Compile changed native code and regression
        run: >-
          python -m py_compile
          rc7_runtime/rc72_authority.py
          rc7_runtime/rc72_n9_captain_worker_bridge.py
          tests/test_rc72_n9_captain_signed_dsh_bridge.py
          tests/test_rc72_worker_process_environment.py
      - name: Test signed authority, Captain N9, no replay and native composition
        run: >-
          python -m pytest -q
          tests/test_rc72_n9_captain_signed_dsh_bridge.py
          tests/test_rc72_c07_n9_professional_dsh_fence.py
          tests/test_rc72_n9_captain_qualification.py
          tests/test_rc72_n9_professional_dsh_real_route.py
          tests/test_rc72_worker_process_environment.py
          tests/test_rc72_signed_authority_ttl.py
          tests/test_rc72_mission_factory.py
          --junitxml=rc72-n9-authority.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: n9-authority-${{ matrix.os }}-${{ matrix.python }}-${{ github.sha }}
          path: rc72-n9-authority.xml
          retention-days: 14
          if-no-files-found: warn
