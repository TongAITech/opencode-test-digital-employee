name: Build DSH Offline10 Turnkey V2

on:
  push:
    branches: [build/dsh-plugin-pack-9-offline-20261019]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - name: Build offline 10-plugin Windows components
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git config --global core.longpaths true
          $npm=(Get-Command npm.cmd -ErrorAction Stop).Source
          $out=Join-Path $env:RUNNER_TEMP 'offline10'
          $vendor=Join-Path $out 'payload\vendor';$modules=Join-Path $vendor 'node_modules'
          $browser=Join-Path $out 'runtime\browser\browserskill';$extension=Join-Path $out 'runtime\browser\extension'
          New-Item -ItemType Directory -Force -Path $modules,$browser,$extension|Out-Null
          $plugins=@(
            @{n='dsh-routing-suite';t='npm';s='dsh-routing-suite'},
            @{n='@wxg-prc-cpg/browser-skill-dsh-plugin';t='npm';s='@wxg-prc-cpg/browser-skill-dsh-plugin'},
            @{n='dsh-context';t='npm';s='dsh-context'},
            @{n='dsh-plugin-bridge';t='npm';s='dsh-plugin-bridge'},
            @{n='@nanmicoder/dsh-agent-teams';t='npm';s='@nanmicoder/dsh-agent-teams'},
            @{n='@perrylink/dsh-plugin-doctor';t='npm';s='@perrylink/dsh-plugin-doctor'},
            @{n='dsh-vision-router';t='npm';s='dsh-vision-router'},
            @{n='dsh-plugin-anydoc';t='git';s='github:beancookie/dsh-plugin-anydoc#main'},
            @{n='dsh-memento';t='npm';s='dsh-memento'},
            @{n='dsh-error-handling';t='embedded';s='catalog:dsh-error-handling@0.1.0/33802021af'}
          )
          function P([string]$n){if($n.StartsWith('@')){$a=$n.Split('/');return Join-Path $modules ($a[0]+'\'+$a[1])};return Join-Path $modules $n}
          function Deps($m,[string]$dst,[string]$safe){
            $d=[ordered]@{};if($m.dependencies){foreach($x in $m.dependencies.PSObject.Properties){$d[$x.Name]=$x.Value}}
            $o=[ordered]@{};if($m.optionalDependencies){foreach($x in $m.optionalDependencies.PSObject.Properties){$o[$x.Name]=$x.Value}}
            if(($d.Count+$o.Count)-eq 0){return 0}
            $st=Join-Path $env:RUNNER_TEMP ('deps-'+$safe);New-Item -ItemType Directory -Force -Path $st|Out-Null
            ([ordered]@{name=('pfc-'+$safe);version='1.0.0';private=$true;dependencies=$d;optionalDependencies=$o}|ConvertTo-Json -Depth 10)|Set-Content -Encoding UTF8 (Join-Path $st 'package.json')
            Push-Location $st;try{& $npm install --omit=dev --legacy-peer-deps --no-audit --no-fund --package-lock=false;if($LASTEXITCODE -ne 0){throw "deps failed $($m.name)"}}finally{Pop-Location}
            $src=Join-Path $st 'node_modules';if(Test-Path $src){$dm=Join-Path $dst 'node_modules';New-Item -ItemType Directory -Force -Path $dm|Out-Null;robocopy $src $dm /E /NFL /NDL /NJH /NJS /NC /NS|Out-Null;if($LASTEXITCODE -gt 7){throw "copy deps failed $($m.name)"}}
            return ($d.Count+$o.Count)
          }
          function EmbeddedErrorHandling([string]$dst){
            New-Item -ItemType Directory -Force -Path (Join-Path $dst 'skills\error-handling')|Out-Null
            @'
          {
            "name": "dsh-error-handling",
            "version": "0.1.0",
            "description": "DSH error handling patterns: layered errors, typed errors, graceful degradation, observability and recovery.",
            "type": "module",
            "main": "index.js",
            "files": ["index.js", "cordis.patch.yml", "skills"],
            "license": "MIT",
            "dsh": {"bundle": {"patch": "./cordis.patch.yml"}},
            "peerDependencies": {"@deepseek-ai/cordis": "^4.0.1"}
          }
          '@ | Set-Content -Encoding UTF8 (Join-Path $dst 'package.json')
            @'
          - insert:
              - id: error-handling
                name: dsh-error-handling
                config: {}
          '@ | Set-Content -Encoding UTF8 (Join-Path $dst 'cordis.patch.yml')
            @'
          import { readFileSync } from 'node:fs';
          import { dirname, join } from 'node:path';
          import { fileURLToPath } from 'node:url';
          export const name = 'error-handling';
          export const inject = ['skills'];
          const root = dirname(fileURLToPath(import.meta.url));
          const dir = join(root, 'skills', 'error-handling');
          const file = join(dir, 'SKILL.md');
          function body(){const text=readFileSync(file,'utf8');const m=text.match(/^---\r?\n[\s\S]*?\r?\n---\r?\n/);return m?text.slice(m[0].length):text;}
          function provider(){return {name:'error-handling-bundled',list(){return Promise.resolve([{name:'error-handling',description:'错误处理模式：错误分层、类型化错误、优雅降级、可观测性与恢复策略。',whenToUse:'设计异常处理、失败恢复、重试、补偿、日志指标告警或人工介入机制时使用。',invocation:{modelInvocable:true,userInvocable:true},provider:'error-handling-bundled',source:'bundled',rank:600,resourceBase:{kind:'directory',path:dir+'/'},locator:file}]);},get(){return Promise.resolve({name:'error-handling',description:'错误处理模式：错误分层、类型化错误、优雅降级、可观测性与恢复策略。',whenToUse:'设计异常处理、失败恢复、重试、补偿、日志指标告警或人工介入机制时使用。',invocation:{modelInvocable:true,userInvocable:true},provider:'error-handling-bundled',source:'bundled',content:body(),path:file,resourceBase:{kind:'directory',path:dir+'/'}});}};}
          export function apply(ctx){const dispose=ctx.skills.registerProvider(()=>provider());if(typeof ctx.effect==='function')ctx.effect(()=>()=>dispose(),'dsh-error-handling bundled skill');}
          '@ | Set-Content -Encoding UTF8 (Join-Path $dst 'index.js')
            @'
          ---
          name: error-handling
          description: 错误处理模式：错误分层、类型化错误、优雅降级、可观测性与恢复策略。
          whenToUse: 设计异常处理、失败恢复、重试、补偿、日志指标告警或人工介入机制时使用。
          ---
          # 错误处理模式

          ## 1. 先分类，再恢复
          将失败分为预期业务错误、可重试基础设施错误、不可重试输入/权限错误、未知系统错误。禁止对不可重试错误原样循环重试。

          ## 2. 统一类型化错误
          每个错误至少携带 code、category、message、retryable、operation、cause、evidence/correlation id；面向用户的信息与内部诊断信息分离。

          ## 3. 恢复策略
          可重试错误使用有界次数与退避；业务失败走补偿或显式拒绝；未知错误保留原始证据并升级；达到重试上限后转人工或安全终止。

          ## 4. 优雅降级
          依赖不可用时返回明确的 degraded/blocked 状态，保留已经完成的可靠结果，不把部分成功伪装为整体成功。

          ## 5. 可观测性
          记录结构化日志、错误类别、关键输入摘要、执行阶段、耗时、重试次数、关联 id、最终处置；重要错误进入指标/告警。

          ## 6. 验证闭环
          修复后必须重放触发条件并验证：错误分类正确、恢复路径正确、无无限重试、证据可追溯、最终状态与实际一致。
          '@ | Set-Content -Encoding UTF8 (Join-Path $dst 'skills\error-handling\SKILL.md')
          }

          $resolved=@();$work=Join-Path $env:RUNNER_TEMP 'packs';New-Item -ItemType Directory -Force -Path $work|Out-Null
          foreach($p in $plugins){
            $dst=P $p.n;$safe=($p.n -replace '[@/]','_')
            if($p.t -eq 'embedded'){
              New-Item -ItemType Directory -Force -Path $dst|Out-Null;EmbeddedErrorHandling $dst;$m=Get-Content (Join-Path $dst 'package.json') -Raw|ConvertFrom-Json
              $resolved += [ordered]@{name=$p.n;requested=$p.s;packed='embedded-local';version=$m.version;runtime_dependency_roots=0;provenance='catalog-compatible-mirror';catalog_commit='33802021af78fd8717ce53fe2c731dfd4195bf0d'}
              continue
            }
            $spec=$p.s;if($p.t -eq 'npm'){$v=((& $npm view $spec version --json 2>&1|Out-String)|ConvertFrom-Json);$spec="$spec@$v"}
            $wd=Join-Path $work $safe;New-Item -ItemType Directory -Force -Path $wd|Out-Null;Push-Location $wd
            try{$txt=(& $npm pack $spec --json --ignore-scripts 2>&1|Out-String);if($LASTEXITCODE -ne 0){throw "pack failed $($p.n)`n$txt"};$rows=$txt|ConvertFrom-Json;if($rows -is [array]){$r=$rows[-1]}else{$r=$rows};$ex=Join-Path $wd 'ex';New-Item -ItemType Directory -Force -Path $ex|Out-Null;tar -xzf (Join-Path $wd $r.filename) -C $ex;New-Item -ItemType Directory -Force -Path (Split-Path $dst -Parent)|Out-Null;if(Test-Path $dst){Remove-Item -Recurse -Force $dst};Move-Item (Join-Path $ex 'package') $dst;$mp=Join-Path $dst 'package.json';$m=Get-Content $mp -Raw|ConvertFrom-Json;if($m.name -ne $p.n){throw "name mismatch $($p.n)"};$dc=Deps $m $dst $safe;$resolved += [ordered]@{name=$p.n;requested=$p.s;packed=$spec;version=$m.version;runtime_dependency_roots=$dc;package_json_sha256=(Get-FileHash $mp -Algorithm SHA256).Hash.ToLowerInvariant();provenance='upstream-package'}}finally{Pop-Location}
          }

          $bsk=Join-Path $env:RUNNER_TEMP 'bsk.zip';Invoke-WebRequest -UseBasicParsing 'https://github.com/Tencent/BrowserSkill/releases/download/cli-v0.3.3/bsk-v0.3.3-x86_64-pc-windows-msvc.zip' -OutFile $bsk;$bh=(Get-FileHash $bsk -Algorithm SHA256).Hash.ToLowerInvariant();if($bh -ne '5ed6aa00e60c0538a637febac6bfbc6a0bd55a11083cd90a987968cff4bc0e02'){throw 'bsk sha'};Expand-Archive $bsk $browser -Force;$be=Get-ChildItem $browser -Filter bsk.exe -Recurse|Select-Object -First 1;if(-not $be){throw 'bsk missing'};if($be.FullName -ne (Join-Path $browser 'bsk.exe')){Copy-Item $be.FullName (Join-Path $browser 'bsk.exe') -Force}
          $ez=Join-Path $extension 'browser-skill-extension-v0.3.3-chrome.zip';Invoke-WebRequest -UseBasicParsing 'https://github.com/Tencent/BrowserSkill/releases/download/ext-v0.3.3/browser-skill-extension-v0.3.3-chrome.zip' -OutFile $ez;$eh=(Get-FileHash $ez -Algorithm SHA256).Hash.ToLowerInvariant();if($eh -ne '10ef76e68f352893fa22dd4cce2f1b96cb90ed957b815d656e13180d07d3c6ea'){throw 'ext sha'}
          foreach($p in $plugins){if(-not(Test-Path (Join-Path (P $p.n) 'package.json'))){throw "VERIFY_MISSING $($p.n)"}}
          ([ordered]@{schema='pfc.aitest.offline10.components.v3';target='windows-x64';node=(node --version);npm=(& $npm --version);plugin_count=10;plugins=$resolved;browser_skill=[ordered]@{cli='0.3.3';cli_sha256=$bh;extension='0.3.3';extension_sha256=$eh}}|ConvertTo-Json -Depth 15)|Set-Content -Encoding UTF8 (Join-Path $out 'COMPONENTS_MANIFEST.json')
          $payload=Join-Path $out 'payload\dsh-plugins-offline10-payload.zip';Compress-Archive -Path (Join-Path $vendor '*') -DestinationPath $payload -CompressionLevel Optimal -Force
          $final=Join-Path $env:GITHUB_WORKSPACE 'DSH-OFFLINE10-TURNKEY-COMPONENTS-WIN-X64.zip';Compress-Archive -Path (Join-Path $out '*') -DestinationPath $final -CompressionLevel Optimal -Force
          Write-Host "SIZE=$((Get-Item $final).Length)";Get-FileHash $final -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: DSH-OFFLINE10-TURNKEY-COMPONENTS-WIN-X64
          path: DSH-OFFLINE10-TURNKEY-COMPONENTS-WIN-X64.zip
          if-no-files-found: error
          retention-days: 7
