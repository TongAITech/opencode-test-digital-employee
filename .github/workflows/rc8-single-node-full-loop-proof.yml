name: RC8 Single Node Full Loop Proof

on:
  push:
    branches: [work/rc8]
    paths:
      - 'rc8_node/**'
      - 'tests/test_rc8_single_node_full_loop_proof.py'
      - '.github/workflows/rc8-single-node-full-loop-proof.yml'
  workflow_dispatch:

jobs:
  single-node-full-loop-proof:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Install proof test dependency
        run: python -m pip install pytest
      - name: Run fail-closed SINGLE_NODE proof contract tests
        run: python -m pytest -q tests/test_rc8_single_node_full_loop_proof.py
