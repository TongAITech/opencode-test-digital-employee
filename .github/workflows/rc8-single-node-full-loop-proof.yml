name: RC8 Single Node Full Loop Proof

on:
  push:
    branches:
      - work/rc8
    paths:
      - 'rc8_node/**'
      - 'rc8_center/**'
      - 'tests/test_rc8_autonomous_dispatcher.py'
      - 'tests/test_rc8_single_node_full_loop_proof.py'
      - 'tests/test_rc8_single_node_claim_provenance.py'
      - 'tests/test_rc8_single_node_center_truth.py'
      - 'tests/test_rc8_production_single_node_truth_reader.py'
      - 'tests/test_rc8_production_truth_attempt_set.py'
      - 'tests/test_rc8_production_truth_artifact_preflight.py'
      - 'tests/test_rc8_production_work_item_preflight.py'
      - 'tests/test_rc8_single_node_production_bootstrap.py'
      - 'tests/test_rc8_production_bootstrap_wiring.py'
      - 'tests/test_rc8_single_node_durable_truth_integration.py'
      - 'tests/test_rc8_single_node_integration_proof.py'
      - 'tests/test_rc8_single_node_causality_preflight.py'
      - 'tests/test_rc8_single_node_production_preflight.py'
      - 'tests/test_rc8_single_node_production_denominator.py'
      - 'tests/test_rc8_production_causality_gate.py'
      - 'tests/test_rc8_production_causality_integration.py'
      - 'tests/test_rc8_terminal_center_idle_proof_surface.py'
      - 'tests/test_rc8_bootstrap_materialization_retention.py'
      - 'tests/test_rc8_production_causality_exact_evidence_binding.py'
      - '.github/workflows/rc8-single-node-full-loop-proof.yml'
  workflow_dispatch:

jobs:
  single-node-full-loop-proof:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install proof test dependencies
        run: python -m pip install pytest sqlalchemy redis
      - name: Run production bootstrap wiring regression
        run: python -m pytest -q tests/test_rc8_production_bootstrap_wiring.py
      - name: autonomous dispatcher
        if: always()
        run: python -m pytest -q tests/test_rc8_autonomous_dispatcher.py
      - name: full loop proof
        if: always()
        run: python -m pytest -q tests/test_rc8_single_node_full_loop_proof.py
      - name: claim provenance
        if: always()
        run: python -m pytest -q tests/test_rc8_single_node_claim_provenance.py
      - name: center truth
        if: always()
        run: python -m pytest -q tests/test_rc8_single_node_center_truth.py
      - name: production truth reader
        if: always()
        run: python -m pytest -q tests/test_rc8_production_single_node_truth_reader.py
      - name: attempt set
        if: always()
        run: python -m pytest -q tests/test_rc8_production_truth_attempt_set.py
      - name: artifact preflight
        if: always()
        run: python -m pytest -q tests/test_rc8_production_truth_artifact_preflight.py
      - name: work item preflight
        if: always()
        run: python -m pytest -q tests/test_rc8_production_work_item_preflight.py
      - name: production Center bootstrap
        if: always()
        run: python -m pytest -q tests/test_rc8_single_node_production_bootstrap.py
      - name: durable truth integration
        if: always()
        run: python -m pytest -q tests/test_rc8_single_node_durable_truth_integration.py
      - name: integration proof
        if: always()
        run: python -m pytest -q tests/test_rc8_single_node_integration_proof.py
      - name: causality preflight
        if: always()
        run: python -m pytest -q tests/test_rc8_single_node_causality_preflight.py
      - name: production preflight
        if: always()
        run: python -m pytest -q tests/test_rc8_single_node_production_preflight.py
      - name: production denominator
        if: always()
        run: python -m pytest -q tests/test_rc8_single_node_production_denominator.py
      - name: production causality promotion gate
        if: always()
        run: python -m pytest -q tests/test_rc8_production_causality_gate.py
      - name: composed production causality promotion
        if: always()
        run: python -m pytest -q tests/test_rc8_production_causality_integration.py
      - name: retained terminal Center idle proof
        if: always()
        run: python -m pytest -q tests/test_rc8_terminal_center_idle_proof_surface.py
      - name: retained bootstrap materialization proof
        if: always()
        run: python -m pytest -q tests/test_rc8_bootstrap_materialization_retention.py
      - name: exact promotion evidence identity binding
        if: always()
        run: python -m pytest -q tests/test_rc8_production_causality_exact_evidence_binding.py
