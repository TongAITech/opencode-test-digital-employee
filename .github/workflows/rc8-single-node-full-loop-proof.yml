name: RC8 Single Node Full Loop Proof

on:
  push:
    branches: [work/rc8]
    paths:
      - 'rc8_node/**'
      - 'rc8_center/single_node_truth_reader.py'
      - 'tests/test_rc8_single_node_full_loop_proof.py'
      - 'tests/test_rc8_single_node_center_truth.py'
      - 'tests/test_rc8_production_single_node_truth_reader.py'
      - 'tests/test_rc8_single_node_durable_truth_integration.py'
      - '.github/workflows/rc8-single-node-full-loop-proof.yml'
  workflow_dispatch:

jobs:
  single-node-full-loop-proof:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Install proof test dependencies
        run: python -m pip install pytest sqlalchemy redis
      - name: Run fail-closed SINGLE_NODE proof, Center/R1 truth, production truth-reader, and durable integration tests
        run: python -m pytest -q tests/test_rc8_single_node_full_loop_proof.py tests/test_rc8_single_node_center_truth.py tests/test_rc8_production_single_node_truth_reader.py tests/test_rc8_single_node_durable_truth_integration.py
