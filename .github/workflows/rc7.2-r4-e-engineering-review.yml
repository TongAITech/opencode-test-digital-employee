name: RC7.2 R4 E Technical QA N8 and Real Source Admission (No ZIP)

on:
  pull_request:
    branches: [work/rc7.2-r4-consolidated-1to5-20261110, work/rc7.2]
    paths:
      - 'rc7_runtime/rc72_n8_execution_diagnosis.py'
      - 'rc7_release/rc72_r4_merge_gate.py'
      - 'tests/test_rc72_n8_execution_diagnosis.py'
      - 'tests/test_rc72_r4_merge_gate.py'
      - '.github/workflows/rc7.2-r4-e-engineering-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-n8-source-review:
    name: e-qa-n8-gate-${{ matrix.os }}-${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
        python: ['3.8', '3.11']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Prepare actual RC7.2 qualification tooling
        run: python -m rc7_release.rc72_pytest_bootstrap --requirements rc7_release/requirements-qualification.txt --timeout-seconds 120
      - name: Compile audited product and execute full N8 regression + E gate adversarial suite
        run: |
          python -m compileall -q rc7_runtime/rc72_n8_execution_diagnosis.py rc7_release/rc72_r4_merge_gate.py tests/test_rc72_n8_execution_diagnosis.py tests/test_rc72_r4_merge_gate.py
          python -m pytest -q tests/test_rc72_n8_execution_diagnosis.py tests/test_rc72_n8_retry_continuation.py tests/test_rc72_n8_multi_round.py tests/test_rc72_r4_merge_gate.py --junitxml=rc72-r4-e-qa-source.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc72-r4-e-qa-source-${{ matrix.os }}-${{ matrix.python }}-${{ github.sha }}
          path: rc72-r4-e-qa-source.xml
          retention-days: 14
          if-no-files-found: warn
