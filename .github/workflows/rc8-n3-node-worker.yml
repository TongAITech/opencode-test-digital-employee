name: RC8 N3 Node Worker

on:
  push:
    branches: [work/rc8]
    paths:
      - 'rc8_node/code_analysis_worker.py'
      - 'rc8_node/__main__.py'
      - 'tests/test_rc8_code_analysis_worker.py'
      - 'tests/test_rc8_node_autonomous_entry.py'
      - '.github/workflows/rc8-n3-node-worker.yml'
  workflow_dispatch:

jobs:
  n3-node-worker:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - run: python -m pip install pytest
      - run: python -m py_compile rc8_node/code_analysis_worker.py rc8_node/__main__.py
      - run: python -m pytest -q tests/test_rc8_code_analysis_worker.py tests/test_rc8_node_autonomous_entry.py
