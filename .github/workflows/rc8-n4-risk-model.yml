name: RC8 N4 Risk Model Worker

on:
  push:
    branches: [work/rc8]
    paths:
      - 'rc8_node/risk_test_model_worker.py'
      - 'tests/test_rc8_n4_risk_test_model_worker.py'
      - '.github/workflows/rc8-n4-risk-model.yml'
  workflow_dispatch:

jobs:
  n4-risk-model:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile worker
        run: python -m py_compile rc8_node/risk_test_model_worker.py
      - name: Verify fail-closed risk denominator
        run: python -m pytest -q tests/test_rc8_n4_risk_test_model_worker.py
