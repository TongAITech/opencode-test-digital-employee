name: RC7.2 C10 Deterministic Bank Quota Window Qualification

on:
  push:
    branches: [work/rc7.2-a-c10-deterministic-window]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [work/rc7.2-economy, work/rc7.2]
    paths:
      - 'rc7_runtime/rc72_*economy*.py'
      - 'rc7_runtime/rc72_native_delta_prompt.py'
      - 'rc7_release/rc72_mission_cli.py'
      - 'tests/test_rc72_production_economy_*.py'
      - 'tests/test_rc72_native_delta_prompt.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The latest relevant PR head supersedes old draft qualification runs.
  # Explicit manual runs are retained as independent audit evidence.
  group: rc72-c10-clock-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  c10-native-model-economy:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: c10-real-command-${{ matrix.os }}-py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
        python: ['3.8', '3.11']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install qualification harness
        run: python -m rc7_release.rc72_pytest_bootstrap --requirements rc7_release/requirements-qualification.txt --timeout-seconds 120
      - name: Compile actual C10 production modules
        run: python -m compileall -q rc6_runtime rc7_runtime
      - name: Execute physical native DSH economy and measured usage (no wall-clock flake)
        run: >-
          python -m pytest -q
          tests/test_rc72_production_economy_wiring.py
          tests/test_rc72_native_delta_prompt.py
          tests/test_rc72_production_economy_ingress.py
          --junitxml=rc72-c10-clock.xml
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc72-c10-clock-${{ matrix.os }}-py${{ matrix.python }}-${{ github.sha }}
          path: rc72-c10-clock.xml
          retention-days: 14
          if-no-files-found: warn
