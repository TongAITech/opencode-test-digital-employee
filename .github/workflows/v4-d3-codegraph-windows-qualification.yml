name: V4 D3 real CodeGraph Windows qualification

on:
  push:
    branches:
      - work/v1.13.0-recovery-turnkey-validation
    paths:
      - workspace-template/ai-test/runtime/aitest_runtime/g3/code_intelligence.py
      - workspace-template/ai-test/runtime/aitest_runtime/g3/codegraph_provider.py
      - workspace-template/.pfc-internal-field-validation/tests/test_g3_change_intelligence_broker_wave2.py
      - runtime-lock.json
      - .github/workflows/v4-d3-codegraph-windows-qualification.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-real-codegraph:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify exact source identity
        shell: pwsh
        run: |
          git rev-parse HEAD
          if (git status --porcelain) { throw 'SOURCE_NOT_CLEAN' }

      - name: Acquire pinned CodeGraph 0.20.1
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'd3-codegraph'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $exe = Join-Path $dir 'codegraph-server-win32-x64.exe'
          $dll = Join-Path $dir 'onnxruntime.dll'
          curl.exe -fL --retry 3 -o $exe https://github.com/codegraph-ai/CodeGraph/releases/download/v0.20.1/codegraph-server-win32-x64.exe
          if ($LASTEXITCODE -ne 0) { throw 'CODEGRAPH_EXE_DOWNLOAD_FAILED' }
          curl.exe -fL --retry 3 -o $dll https://github.com/codegraph-ai/CodeGraph/releases/download/v0.20.1/onnxruntime.dll
          if ($LASTEXITCODE -ne 0) { throw 'CODEGRAPH_DLL_DOWNLOAD_FAILED' }
          $exeSha = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          $dllSha = (Get-FileHash -Algorithm SHA256 $dll).Hash.ToLowerInvariant()
          if ($exeSha -ne 'aa1b6108217c119af6ac444b8652a0eadcfe2c343bff78ead2edd15b6b7b15b1') { throw "CODEGRAPH_EXE_SHA_MISMATCH:$exeSha" }
          if ($dllSha -ne '52f8ebe8f08f369a44fed6d1cb680c7c89169795e1c2949ee25b88b538ef0948') { throw "CODEGRAPH_DLL_SHA_MISMATCH:$dllSha" }
          if ((Get-Item $exe).Length -ne 105874432) { throw 'CODEGRAPH_EXE_SIZE_MISMATCH' }
          if ((Get-Item $dll).Length -ne 11567648) { throw 'CODEGRAPH_DLL_SIZE_MISMATCH' }
          "AITEST_D3_CODEGRAPH_BINARY=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "D3_CODEGRAPH_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prove real CodeGraph version
        shell: pwsh
        run: |
          $out = & $env:AITEST_D3_CODEGRAPH_BINARY --info 2>&1 | Out-String
          $out | Write-Host
          if ($LASTEXITCODE -ne 0) { throw 'CODEGRAPH_INFO_FAILED' }
          if ($out -notmatch '0\.20\.1') { throw 'CODEGRAPH_VERSION_NOT_PROVEN' }

      - name: Run D3 real graph qualification
        shell: pwsh
        run: |
          $env:PYTHONPATH = Join-Path $PWD 'workspace-template/ai-test/runtime'
          python -X utf8 workspace-template/.pfc-internal-field-validation/tests/test_g3_change_intelligence_broker_wave2.py 2>&1 | Tee-Object -FilePath D3_REAL_CODEGRAPH_WINDOWS.log
          if ($LASTEXITCODE -ne 0) { throw 'D3_REAL_CODEGRAPH_QUALIFICATION_FAILED' }

      - name: Upload D3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-d3-real-codegraph-windows
          path: D3_REAL_CODEGRAPH_WINDOWS.log
          if-no-files-found: warn
