name: RC7.2 C04 Reproduction to RCA Fix and Impact Proof
on:
  push:
    branches: [work/rc7.2-a5-c04-reproduction-regression-proof]
    paths:
      - rc7_runtime/rc72_n9_reproduction_resolution_audit.py
      - rc7_runtime/rc72_n8_product_recovery.py
      - rc7_runtime/rc72_release_driver.py
      - tests/test_rc72_n9_reproduction_resolution_audit.py
      - tests/test_rc72_n9_approved_reproduction_execution.py
      - .github/workflows/rc72-c04-reproduction-regression-proof.yml
  pull_request:
    branches: [work/rc7.2-c04-approved-real-reproduction]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  c04-resolution-proof:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
        python: ['3.8','3.11']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m rc7_release.rc72_pytest_bootstrap --requirements rc7_release/requirements-qualification.txt --timeout-seconds 120
      - run: python -m py_compile rc7_runtime/rc72_n9_reproduction_resolution_audit.py rc7_runtime/rc72_n8_product_recovery.py rc7_runtime/rc72_release_driver.py tests/test_rc72_n9_reproduction_resolution_audit.py
      - run: python -m pytest -q tests/test_rc72_n9_reproduction_resolution_audit.py tests/test_rc72_n9_approved_reproduction_execution.py tests/test_rc7_defect_resolution_control.py tests/test_rc72_n9_accepted_scope.py --junitxml=c04-bridge-pytest.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c04-reproduction-regression-proof-${{ matrix.python }}-${{ github.sha }}
          path: c04-bridge-pytest.xml
          retention-days: 14
          if-no-files-found: warn
