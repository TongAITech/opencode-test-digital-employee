name: RC8 Single Node N1-N10 Readiness

on:
  push:
    branches: [work/rc8]
    paths:
      - 'rc8_node/**'
      - 'tests/test_rc8_node_autonomous_entry.py'
      - '.github/workflows/rc8-single-node-n1-n10-readiness.yml'
  workflow_dispatch:

jobs:
  single-node-readiness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Install test runner
        run: python -m pip install pytest
      - name: Compile single-node readiness slice
        run: python -m py_compile rc8_node/__main__.py tests/test_rc8_node_autonomous_entry.py
      - name: Verify fail-closed single-node N1-N10 readiness
        run: python -m pytest -q tests/test_rc8_node_autonomous_entry.py
