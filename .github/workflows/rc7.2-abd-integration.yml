name: RC7.2 A/B/C/D Unified Product Integration Qualification

on:
  push:
    branches: [work/rc7.2-abd-integration]
    paths:
      - 'rc7_runtime/**'
      - 'rc7_release/rc72_mission_cli.py'
      - 'tests/test_rc72_*.py'
      - '.github/workflows/rc7.2-abd-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc72-abd-integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  actual-product-factory-and-economy:
    name: abcd-${{ matrix.os }}-python-${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
        python-version: ['3.8', '3.11']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned qualification runner
        run: python -m rc7_release.rc72_pytest_bootstrap --requirements rc7_release/requirements-qualification.txt --timeout-seconds 120
      - name: Compile production source
        run: python -m compileall -q rc6_runtime rc7_runtime rc7_release
      - name: Verify A/B fenced factory C BrowserSkill and D real-model economy wiring
        run: >-
          python -m pytest -q
          tests/test_rc72_mission_factory.py
          tests/test_rc72_c09_ab_product_binding.py
          tests/test_rc72_journey_bsk_native_adapter.py
          tests/test_rc72_journey_bsk_full_chain_contract.py
          tests/test_rc72_native_dsh_actual_launcher_batch.py
          tests/test_rc72_captain_n7_pipeline.py
          tests/test_rc72_fenced_n7_preparation.py
          tests/test_rc72_mission_economy_cli_ingress.py
          tests/test_rc72_production_economy_ingress.py
          tests/test_rc72_production_economy_wiring.py
          tests/test_rc72_native_shared_batch.py
          tests/test_rc72_native_delta_prompt.py
          tests/test_rc72_n8_product_recovery.py
          tests/test_rc72_conclusive_failure_evidence.py
          tests/test_rc72_n9_captain_qualification.py
          tests/test_rc72_n9_professional_dsh_contract.py
          tests/test_rc72_n9_professional_dsh_real_route.py
          tests/test_rc72_n10_terminal.py
          --junitxml=rc72-abd-integration.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc72-abd-${{ matrix.os }}-py${{ matrix.python-version }}-${{ github.sha }}
          path: rc72-abd-integration.xml
          if-no-files-found: warn
          retention-days: 14

  complete-source-with-real-chromium:
    name: abcd-ubuntu-python-3.11-complete-rc7-source
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source qualification and real Chromium/CDP
        shell: bash
        run: |
          set -euo pipefail
          python -m rc7_release.rc72_pytest_bootstrap --requirements rc7_release/requirements-qualification.txt --timeout-seconds 120
          python -m pip install --disable-pip-version-check 'playwright==1.62.0'
          python -m playwright install --with-deps chromium
      - name: Compile unified production source
        run: python -m compileall -q rc6_runtime rc7_runtime rc7_release
      - name: Prove original three C09 regressions against actual browser and R1
        run: >-
          python -m pytest -q
          tests/test_rc72_c09_real_chromium_cdp_smoke.py
          tests/test_rc72_journey_drift_and_failure.py
          tests/test_rc72_journey_playwright_adapter.py
          --junitxml=rc72-abcd-c09.xml
      - name: Run complete inherited RC7/RC7.2 source contracts (no exclusion)
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find tests -maxdepth 1 -type f -name 'test_rc7*.py' -print | sort)
          test "${#tests[@]}" -gt 0
          printf 'Running complete inherited suite of %s modules on %s\n' "${#tests[@]}" "${GITHUB_SHA}"
          python -m pytest -q "${tests[@]}" --junitxml=rc72-abcd-full-source.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc72-abcd-full-source-${{ github.sha }}
          path: |
            rc72-abcd-c09.xml
            rc72-abcd-full-source.xml
          if-no-files-found: warn
          retention-days: 14
