name: RC6 Wave 5 Requirement Code Intelligence

on:
  push:
    branches:
      - work/rc6-runtime-reconstruction
  pull_request:
    paths:
      - 'rc6_runtime/intelligence.py'
      - 'tests/test_intelligence.py'
      - 'docs/RC6_WAVE5_QUALIFICATION.md'
      - '.github/workflows/rc6-wave5.yml'

jobs:
  wave5-intelligence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run all RC6 unit qualification
        run: python -m unittest discover -s tests -v
