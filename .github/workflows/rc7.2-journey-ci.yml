name: RC7.2 C09 Journey Isolated Qualification

on:
  push:
    branches:
      - work/rc7.2-journey
      - work/rc7.2-journey-closure
    paths:
      - 'rc7_runtime/rc72_journey_*.py'
      - 'rc7_runtime/rc72_official_journey_execution.py'
      - 'tests/test_rc72_journey_*.py'
      - 'tests/test_rc72_c09_real_chromium_cdp_smoke.py'
      - 'tests/test_rc72_phase9_*.py'
      - '.github/workflows/rc7.2-journey-ci.yml'
      - 'docs/rc7.2/JOURNEY-C09-CONSTRUCTION-AND-A-B-INTEGRATION.md'
      - 'docs/rc7.2/JOURNEY-C09-BSK-FIELD-QUALIFICATION.md'
      - 'rc7_release/rc72_journey_bsk_qualify.py'
      - 'packaging/rc7.2/QUALIFY-JOURNEY-BSK.sh'
concurrency:
  group: rc72-c09-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  c09-contract:
    name: c09-journey-python-${{ matrix.python-version }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install engineering test harness only
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile production modules and real bank BSK probe
        run: >-
          python -m compileall -q
          rc7_runtime rc7_release/rc72_journey_bsk_qualify.py
      - name: Check Windows Git Bash BSK field launcher syntax
        run: bash -n packaging/rc7.2/QUALIFY-JOURNEY-BSK.sh
      - name: Run all original Phase 9 and new concrete adapter contracts
        run: >-
          python -m pytest -q
          --junitxml=rc72-c09-${{ matrix.python-version }}.xml
          tests/test_rc72_phase9_*.py
          tests/test_rc72_journey_*.py
      - name: Upload diagnostic receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc72-c09-python-${{ matrix.python-version }}
          path: rc72-c09-${{ matrix.python-version }}.xml
          if-no-files-found: warn

  c09-real-chromium-cdp:
    name: c09-real-chromium-cdp
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned real CDP browser harness
        run: python -m pip install --disable-pip-version-check pytest playwright==1.62.1
      - name: Provision actual matching Chromium on GitHub CI
        run: python -m playwright install --with-deps chromium
      - name: Real Chromium CDP HTTP business Oracle and evidence smoke
        env:
          RC72_C09_EVIDENCE_EXPORT_ROOT: rc72-c09-real-cdp-evidence
        run: >-
          python -m pytest -v
          --junitxml=rc72-c09-real-chromium.xml
          tests/test_rc72_c09_real_chromium_cdp_smoke.py
      - name: Upload real Chromium diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc72-c09-real-chromium
          path: |
            rc72-c09-real-chromium.xml
            rc72-c09-real-cdp-evidence/
          if-no-files-found: warn
