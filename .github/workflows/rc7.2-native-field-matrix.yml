name: RC7.2 Native Linux and macOS Field Packages

on:
  push:
    branches:
      - work/rc7.2-native-linux-macos-20261112
    paths:
      - 'rc7_release/rc72_native_field_portable.py'
      - 'rc7_release/rc72_tool_environment.py'
      - 'rc7_release/toolchain_qualification.py'
      - 'packaging/rc7.2/BUILD-NATIVE-FIELD.sh'
      - 'packaging/rc7.2/NATIVE-FIELD-AITEST.sh'
      - 'packaging/rc7.2/start-rc7.2.sh'
      - 'packaging/rc7.2/NATIVE-FIELD-README.md'
      - 'packaging/rc7.2/dsh-alpha/**'
      - 'tests/test_rc72_native_field_portable.py'
      - 'tests/test_rc72_native_tool_environment.py'
      - 'tests/test_rc72_tool_environment.py'
      - '.github/workflows/rc7.2-native-field-matrix.yml'

permissions:
  contents: read

concurrency:
  group: rc72-native-field-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run native packaging contracts
        run: |
          python -m pip install -r rc7_release/requirements-qualification.txt
          python -m compileall -q rc7_release/rc72_native_field_portable.py rc7_release/rc72_tool_environment.py
          python -m pytest -q \
            tests/test_rc72_native_field_portable.py \
            tests/test_rc72_native_tool_environment.py \
            tests/test_rc72_tool_environment.py
          bash -n packaging/rc7.2/BUILD-NATIVE-FIELD.sh
          bash -n packaging/rc7.2/NATIVE-FIELD-AITEST.sh
          bash -n packaging/rc7.2/start-rc7.2.sh
          bash -n packaging/rc7.2/dsh-alpha/install-dsh-alpha.sh

  linux-native:
    needs: contract
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64-rocky8-glibc228
            runner: ubuntu-22.04
            docker_platform: linux/amd64
          - target: linux-arm64-rocky8-glibc228
            runner: ubuntu-22.04-arm
            docker_platform: linux/arm64
    runs-on: \${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Build inside native Rocky Linux 8 userspace
        env:
          GITHUB_SHA: \${{ github.sha }}
        run: |
          docker run --rm --platform "\${{ matrix.docker_platform }}" \
            -e GITHUB_SHA="$GITHUB_SHA" \
            -e RUNNER_TEMP=/out \
            -v "$GITHUB_WORKSPACE:/src" \
            -v "$RUNNER_TEMP:/out" \
            rockylinux:8 bash -lc '
              dnf install -y curl ca-certificates tar xz unzip gzip git findutils which file perl
              cd /src
              bash packaging/rc7.2/BUILD-NATIVE-FIELD.sh
            '
      - name: Upload native Linux field package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RC72-NATIVE-FIELD-\${{ matrix.target }}-\${{ github.sha }}
          path: |
            \${{ runner.temp }}/rc72-native-dist/*.tar.gz
            \${{ runner.temp }}/rc72-native-dist/*.sha256
            \${{ runner.temp }}/rc72-native-dist/*-evidence.json
            \${{ runner.temp }}/rc72-native-dist/*-probe.txt
            \${{ runner.temp }}/rc72-native-dist/*-smoke.txt
            \${{ runner.temp }}/rc72-native-dist/*-version.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  macos-native:
    needs: contract
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-x86_64-intel
            runner: macos-15-intel
          - target: macos-arm64-apple-silicon
            runner: macos-15
    runs-on: \${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Build native macOS field package
        env:
          GITHUB_SHA: \${{ github.sha }}
        run: bash packaging/rc7.2/BUILD-NATIVE-FIELD.sh
      - name: Upload native macOS field package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RC72-NATIVE-FIELD-\${{ matrix.target }}-\${{ github.sha }}
          path: |
            \${{ runner.temp }}/rc72-native-dist/*.tar.gz
            \${{ runner.temp }}/rc72-native-dist/*.sha256
            \${{ runner.temp }}/rc72-native-dist/*-evidence.json
            \${{ runner.temp }}/rc72-native-dist/*-probe.txt
            \${{ runner.temp }}/rc72-native-dist/*-smoke.txt
            \${{ runner.temp }}/rc72-native-dist/*-version.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
