name: RC7.1 Exhaustive Coverage

on:
  push:
    branches:
      - work/rc7.1-exhaustive-coverage
      - work/rc7.1-autonomous-loop
      - work/rc7.1-minimal-hardening
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Install tests
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile RC7 runtime
        run: python -m compileall -q rc6_runtime rc7_runtime
      - name: Exhaustive coverage hard gates
        run: >-
          python -m pytest -q
          tests/test_rc7_1_autonomous_contract.py
          tests/test_rc7_1_contract_validator.py
          tests/test_rc7_1_autonomous_node_control.py
          tests/test_rc7_1_n1_n4_node_adoption.py
          tests/test_rc7_1_n1_reality_adoption.py
          tests/test_rc7_1_node_gate_evidence_integrity.py
          tests/test_rc7_1_n5_autonomous_preparation.py
          tests/test_rc7_1_bank_n5_main_link.py
          tests/test_rc7_1_bank_n5_recovery_closure.py
          tests/test_rc7_1_n6_autonomous_script.py
          tests/test_rc7_1_n7_coverage_closure.py
          tests/test_rc7_1_n7_node_convergence.py
          tests/test_rc7_1_bank_n7_main_link.py
          tests/test_rc7_1_n8_recovery_orchestrator.py
          tests/test_rc7_1_bank_n8_main_link.py
          tests/test_rc7_1_bank_n8_owner_repair.py
          tests/test_rc7_1_bank_n8_non_direct_guard.py
          tests/test_rc7_1_n9_defect_evidence_policy.py
          tests/test_rc7_1_n9_defect_evidence_integration.py
          tests/test_rc7_1_wave_e_node_closure.py
          tests/test_rc7_1_n10_manifest_reconciliation.py
          tests/test_rc7_1_n10_convergence_reporting.py
          tests/test_rc7_1_n10_finalization_projection.py
          tests/test_rc7_1_residual_risk_registry.py
          tests/test_rc7_1_n10_residual_risk_governance.py
          tests/test_rc7_1_residual_risk_receipt_history.py
          tests/test_rc7_1_bank_mission_autopilot.py
          tests/test_rc7_1_bank_mission_start.py
          tests/test_rc7_1_bank_n10_main_link.py
          tests/test_rc7_1_bank_autonomous_node_closure.py
          tests/test_rc7_1_coverage_ledger_contract.py
          tests/test_rc7_1_failure_classification_contract.py
          tests/test_rc7_1_exhaustive_coverage_gate.py
          tests/test_rc7_1_layer_execution_evidence_contract.py
          tests/test_rc7_1_real_executor_provenance.py
          tests/test_rc7_1_bank_field_reality_gate.py
          tests/test_rc7_1_turnkey_hardening_contract.py
          tests/test_rc7_1_l2_database_mcp.py
          tests/test_rc7_1_l3_api_provenance.py
          tests/test_rc7_1_l4_browser_executor.py
          tests/test_rc7_1_l4_browser_mcp.py
          tests/test_rc7_1_l5_e2e_executor.py
          tests/test_rc7_1_l5_e2e_mcp.py
          tests/test_rc7_1_l6_k6_executor.py
          tests/test_rc7_1_l6_k6_mcp.py
          tests/test_rc7_1_l7_zap_executor.py
          tests/test_rc7_1_l7_zap_mcp.py
          tests/test_rc7_1_real_executor_pass_gate.py
          tests/test_rc7_1_execution_profiles.py
          tests/test_rc7_1_agent_teams_orchestration.py
          tests/test_rc7_1_agent_teams_bootstrap.py
          tests/test_rc7_1_layer_execution_production_service.py
          tests/test_rc7_1_runtime_timing_reality.py
          tests/test_rc7_controlled_l3_execution.py
          tests/test_rc7_execution_diagnosis.py
          tests/test_rc7_execution_recovery.py
          tests/test_rc7_gap_router.py
          tests/test_rc7_execution_fanout_production_chain.py
          tests/test_rc7_mission_sufficiency.py
          tests/test_rc7_1_test_design_sufficiency_v2.py
          tests/test_rc7_1_test_design_delta_repair_chain.py
          tests/test_rc7_runtime_execution_control.py
          tests/test_rc7_execution_fanout_conformance.py
          tests/test_rc7_case_fanout_conformance.py

  full-rc7:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Install regression dependencies
        run: python -m pip install --disable-pip-version-check pytest requests python-docx openpyxl python-pptx pypdf
      - name: Full RC7 regression
        shell: bash
        run: |
          mapfile -t tests < <(find tests -maxdepth 1 -type f -name 'test_rc7_*.py' -print | sort)
          if [ "${#tests[@]}" -eq 0 ]; then echo 'No RC7 tests found' >&2; exit 2; fi
          python -m pytest -q "${tests[@]}"
