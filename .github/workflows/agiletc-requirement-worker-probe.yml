name: RC7 AgileTC Requirement Worker Probe

on:
  push:
    branches: [validation/agiletc-worker-timeout-evidence]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agiletc-requirement-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: case_manager
        ports: ['3301:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      PFC_AITEST_STATE_DIR: ${{ github.workspace }}/validation-artifacts/runtime-state
      PFC_WORKSPACE: ${{ github.workspace }}/target/AgileTC
      LOCAL_MODEL_API_KEY: ollama-local
      OLLAMA_HOST: 127.0.0.1:11434
      DSH_PERMISSION_MODE: read-only
      PFC_RC7_DSH_TOOL_AUDIT: '1'
      PFC_REQUIREMENT_PROBE_TIMEOUT_SECONDS: '180'

    steps:
      - uses: actions/checkout@v4

      - name: Checkout frozen AgileTC target
        uses: actions/checkout@v4
        with:
          repository: didi/AgileTC
          ref: 8604b4bedb55b3611035aa4ba3781df4118aa4f2
          path: target/AgileTC
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}

      - uses: actions/setup-node@v4
        with: {node-version: '22'}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
          cache-dependency-path: target/AgileTC/case-server/pom.xml

      - name: Bootstrap probe and authority regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation-artifacts/{dsh,evidence,runtime-state/r1}
          python -m pip install --disable-pip-version-check pytest
          python -m py_compile \
            validation/agiletc_requirement_probe.py \
            validation/ollama_openai_trace_proxy.py
          python -m pytest -q \
            tests/test_rc7_dsh_tool_authority.py \
            tests/test_rc7_external_input_readiness.py \
            tests/test_rc7_bank_dsh_tool_policy.py \
            tests/test_rc7_node_tool_conformance.py
          git -C target/AgileTC rev-parse HEAD | tee validation-artifacts/agiletc-source-revision.txt
          test "$(cat validation-artifacts/agiletc-source-revision.txt)" = "8604b4bedb55b3611035aa4ba3781df4118aa4f2"

      - name: Real AgileTC MySQL Maven HTTP reality
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq default-mysql-client
          mysql -h127.0.0.1 -P3301 -uroot -proot case_manager < target/AgileTC/case-server/sql/case-server.sql
          mysql -h127.0.0.1 -P3301 -uroot -proot -N \
            -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='case_manager';" \
            | tee validation-artifacts/agiletc-db-table-count.txt
          (cd target/AgileTC/case-server && mvn -B -ntp test) \
            2>&1 | tee validation-artifacts/agiletc-maven-test.log
          pushd target/AgileTC/case-server >/dev/null
          nohup mvn -B -ntp -DskipTests spring-boot:run \
            > "$GITHUB_WORKSPACE/validation-artifacts/agiletc-app.log" 2>&1 &
          app_pid=$!
          popd >/dev/null
          echo "$app_pid" > validation-artifacts/agiletc-app.pid
          : > validation-artifacts/agiletc-http-probe.txt
          ok=0
          for i in $(seq 1 90); do
            code=$(curl -sS -o validation-artifacts/agiletc-http-body.html \
              -w '%{http_code}' http://127.0.0.1:8094/case/caseList/1 || true)
            printf 'attempt=%s http_code=%s\n' "$i" "$code" | tee -a validation-artifacts/agiletc-http-probe.txt
            if [[ "$code" =~ ^(200|301|302)$ ]]; then ok=1; break; fi
            sleep 2
          done
          test "$ok" = 1

      - name: Install DSH and Qwen3
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          npm install -g @deepseek-ai/dsh
          dsh --version | tee validation-artifacts/dsh-version.txt
          curl -fsSL https://ollama.com/install.sh | sh
          if ! curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then
            nohup ollama serve > validation-artifacts/ollama.log 2>&1 &
          fi
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null && break
            sleep 2
          done
          ollama pull qwen3:4b | tee validation-artifacts/ollama-pull.log

      - name: Start metadata-only Ollama wire trace
        shell: bash
        run: |
          set -euo pipefail
          : > validation-artifacts/ollama-wire-trace.jsonl
          nohup python validation/ollama_openai_trace_proxy.py \
            --listen-host 127.0.0.1 --listen-port 11435 \
            --upstream-host 127.0.0.1 --upstream-port 11434 \
            --log validation-artifacts/ollama-wire-trace.jsonl \
            > validation-artifacts/ollama-wire-proxy.stdout \
            2> validation-artifacts/ollama-wire-proxy.stderr &
          echo "$!" > validation-artifacts/ollama-wire-proxy.pid
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11435/__trace_health \
              > validation-artifacts/ollama-wire-health.json; then
              ok=1
              break
            fi
            sleep 1
          done
          test "$ok" = 1
          grep -q '"status":"ok"' validation-artifacts/ollama-wire-health.json

      - name: Build governed DSH patch with proven local-Qwen compatibility
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE"
          export PFC_PYTHON="$(which python)"
          export PFC_GIT_BIN="$(which git)"
          export PFC_JAVA_BIN="$(which java)"
          export PFC_MAVEN_BIN="$(which mvn)"
          python -m rc7_release.dsh \
            --output validation-artifacts/dsh/rc7-mcp.patch.yml \
            --home "$GITHUB_WORKSPACE" --python "$(which python)"
          cat validation/dsh/qwen3-ollama-none.patch.yml \
              validation/dsh/rc7-headless-minimal.patch.yml \
              validation-artifacts/dsh/rc7-mcp.patch.yml \
              validation/dsh/ollama-trace-override.patch.yml \
            > validation-artifacts/dsh/agiletc.patch.yml
          dsh --profile headless --patch validation-artifacts/dsh/agiletc.patch.yml --dump-config \
            > validation-artifacts/dsh/effective-config.yml
          grep -Eq "minimal: ['\"]?none['\"]?" validation-artifacts/dsh/effective-config.yml
          grep -q 'supportsReasoningEffort: true' validation-artifacts/dsh/effective-config.yml
          grep -Eq "reasoningEffort: ['\"]?minimal['\"]?" validation-artifacts/dsh/effective-config.yml
          grep -q 'baseURL: http://127.0.0.1:11435/v1' validation-artifacts/dsh/effective-config.yml
          python - <<'PY'
          from pathlib import Path
          lines = Path('validation-artifacts/dsh/effective-config.yml').read_text(encoding='utf-8').splitlines()
          start = next((i for i, line in enumerate(lines) if line.strip() == '- id: session-title-llm'), None)
          if start is None:
              raise SystemExit('session-title-llm component missing')
          end = next((i for i in range(start + 1, len(lines)) if lines[i].startswith('- id: ')), len(lines))
          block = lines[start:end]
          if not any(line.strip() == 'disabled: true' for line in block):
              raise SystemExit('session-title-llm is not disabled in effective config')
          print('SESSION_TITLE_LLM_DISABLED=PASS')
          PY

      - name: Run only real Requirement producer with 180s diagnostic bound
        id: requirement
        continue-on-error: true
        shell: bash
        timeout-minutes: 5
        run: |
          set +e
          export PYTHONPATH="$GITHUB_WORKSPACE"
          export PFC_PYTHON="$(which python)"
          export PFC_GIT_BIN="$(which git)"
          export PFC_JAVA_BIN="$(which java)"
          export PFC_MAVEN_BIN="$(which mvn)"
          revision=$(cat validation-artifacts/agiletc-source-revision.txt)
          python validation/agiletc_requirement_probe.py \
            --target target/AgileTC \
            --source-revision "$revision" \
            --dsh-bin "$(which dsh)" \
            --patch validation-artifacts/dsh/agiletc.patch.yml \
            --output-root validation-artifacts \
            > validation-artifacts/requirement-probe.stdout \
            2> validation-artifacts/requirement-probe.stderr
          rc=$?
          echo "$rc" > validation-artifacts/requirement-probe.exit
          exit "$rc"

      - name: Enforce real Requirement producer proof from R1
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('validation-artifacts')
          r1_path = root / 'runtime-state/r1/event-stream.jsonl'
          rows = []
          if r1_path.exists():
              for line in r1_path.read_text(encoding='utf-8', errors='replace').splitlines():
                  try:
                      rows.append(json.loads(line))
                  except Exception:
                      pass

          task_versions = [r.get('payload', {}) for r in rows
                           if r.get('entity_type') == 'rc7_task'
                           and (r.get('payload') or {}).get('node') == 'REQUIREMENT_ANALYSIS']
          latest_task = task_versions[-1] if task_versions else {}
          task_id = latest_task.get('task_id')
          worker_id = latest_task.get('lease_owner')

          runtime = [r.get('payload', {}) for r in rows
                     if r.get('entity_type') == 'agent_runtime_event'
                     and (r.get('payload') or {}).get('worker_instance_id') == worker_id]
          names = [p.get('event_name') for p in runtime]
          tool_events = [p for p in runtime if p.get('event_name') == 'WORKER_TOOL_CALLED']
          tool_names = []
          for p in tool_events:
              call = p.get('tool_call') or {}
              tool_names.append(call.get('tool_name') or call.get('tool') or '')
          completed_pass = any(p.get('event_name') == 'WORKER_COMPLETED' and p.get('result') == 'PASS' for p in runtime)
          handoff = any(p.get('event_name') == 'HANDOFF_RETURNED' for p in runtime)
          timeout_partial = [r.get('payload', {}) for r in rows
                             if r.get('event_type') == 'ROUTING_INTEGRITY_FAIL'
                             and (r.get('payload') or {}).get('reason') == 'DSH_WORKER_TIMEOUT_PARTIAL'
                             and (r.get('payload') or {}).get('worker_instance_id') == worker_id]
          output_refs = latest_task.get('output_artifact_refs') or []
          mcp_calls = [name for name in tool_names if str(name).startswith('mcp__pfc_aitest_rc7__')]

          evidence_root = root / 'runtime-state/worker-evidence'
          worker_files = []
          if evidence_root.exists():
              for path in evidence_root.rglob('*.jsonl'):
                  worker_files.append({
                      'path': str(path),
                      'bytes': path.stat().st_size,
                      'preview': path.read_text(encoding='utf-8', errors='replace')[-12000:],
                  })

          wire_rows = []
          wire_path = root / 'ollama-wire-trace.jsonl'
          if wire_path.exists():
              for line in wire_path.read_text(encoding='utf-8', errors='replace').splitlines():
                  try:
                      wire_rows.append(json.loads(line))
                  except Exception:
                      pass
          request_rows = [row for row in wire_rows if row.get('event') == 'request_received']
          last_request = request_rows[-1] if request_rows else {}
          safe_wire = {
              key: last_request.get(key)
              for key in (
                  'path', 'body_bytes', 'model', 'stream', 'max_tokens',
                  'reasoning_effort', 'message_count', 'message_chars',
                  'message_roles', 'tool_count', 'tool_schema_bytes',
              )
          } if last_request else {}

          result = {
              'status': 'PASS' if (
                  bool(task_id)
                  and latest_task.get('state') == 'OUTPUT_PRODUCED'
                  and bool(output_refs)
                  and bool(mcp_calls)
                  and completed_pass
                  and handoff
                  and not timeout_partial
              ) else 'FAIL',
              'task_id': task_id,
              'worker_instance_id': worker_id,
              'task_state': latest_task.get('state'),
              'output_artifact_refs': output_refs,
              'runtime_event_names': names,
              'tool_names': tool_names,
              'mcp_tool_call_count': len(mcp_calls),
              'completed_pass': completed_pass,
              'handoff_returned': handoff,
              'timeout_partial_count': len(timeout_partial),
              'wire_request_count': len(request_rows),
              'last_wire_request': safe_wire,
              'scenario_exit': int((root/'requirement-probe.exit').read_text().strip()) if (root/'requirement-probe.exit').exists() else None,
              'scenario_blocking_reason': (json.loads((root/'fullflow-summary.json').read_text()).get('blocking_reason') if (root/'fullflow-summary.json').exists() else None),
              'worker_evidence_files': worker_files,
          }
          (root/'requirement-probe-result.json').write_text(
              json.dumps(result, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps({k:v for k,v in result.items() if k != 'worker_evidence_files'}, ensure_ascii=False, sort_keys=True))
          raise SystemExit(0 if result['status'] == 'PASS' else 2)
          PY

      - name: Upload Requirement diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc7-agiletc-requirement-probe-${{ github.sha }}
          path: validation-artifacts
          if-no-files-found: error
          retention-days: 14
