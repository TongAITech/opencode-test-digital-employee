name: RC8 Formal Center Stack

on:
  push:
    branches: ["work/rc8"]
    paths:
      - "rc8_center/**"
      - "rc8_runtime/**"
      - "rc8_node/**"
      - "center/**"
      - "center-web/**"
      - "docs/rc8/production-requirement-task-model.md"
      - "docs/rc8-production-date-test-round-model.md"
      - "scripts/rc8_formal_center_stack_test.py"
      - "scripts/rc8_formal_center_round_entry_test.py"
      - "scripts/rc8_test_round_concurrency_test.py"
      - "scripts/rc8_formal_artifact_upload_test.py"
      - "scripts/rc8_formal_center_restart_test.py"
      - "tests/test_rc8_formal_node_agent.py"
      - "tests/test_rc8_recovery_state_contract.py"
      - "tests/test_rc8_production_requirement_delivery.py"
      - "tests/test_rc8_production_requirement_api.py"
      - "tests/test_rc8_test_rounds.py"
      - "tests/test_rc8_test_round_api.py"
      - "tests/test_rc8_test_round_runtime_binding.py"
      - "tests/test_rc8_alembic_revision_contract.py"
      - ".github/workflows/rc8-formal-center-stack.yml"
  workflow_dispatch:

jobs:
  formal-center-integration:
    runs-on: ubuntu-latest
    services:
      postgresql:
        image: postgres:16
        env:
          POSTGRES_DB: rc8
          POSTGRES_USER: rc8
          POSTGRES_PASSWORD: rc8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rc8 -d rc8"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      RC8_DATABASE_URL: postgresql+psycopg://rc8:rc8@127.0.0.1:5432/rc8
      RC8_REDIS_URL: redis://127.0.0.1:6379/0
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install formal Center dependencies
        run: pip install -r center/requirements.txt pytest
      - name: Compile formal Center Python
        run: python -m py_compile rc8_center/formal_settings.py rc8_center/formal_app.py rc8_center/formal_artifacts.py rc8_center/delivery.py rc8_center/test_rounds.py rc8_center/api/fastapi_app.py rc8_center/api/delivery_routes.py rc8_center/api/test_round_routes.py rc8_center/api/schemas.py rc8_center/infrastructure/postgres.py rc8_center/infrastructure/postgres_delivery.py rc8_center/infrastructure/postgres_test_round.py rc8_center/infrastructure/redis_coordination.py rc8_node/formal_agent.py scripts/rc8_formal_center_round_entry_test.py scripts/rc8_test_round_concurrency_test.py tests/test_rc8_test_rounds.py tests/test_rc8_test_round_api.py tests/test_rc8_test_round_runtime_binding.py tests/test_rc8_alembic_revision_contract.py
      - name: Run formal Node wire-contract and recovery state regressions
        run: |
          python tests/test_rc8_formal_node_agent.py
          python tests/test_rc8_recovery_state_contract.py
      - name: Verify production-batch requirement task organization
        run: |
          python tests/test_rc8_production_requirement_delivery.py
          python tests/test_rc8_production_requirement_api.py
      - name: Verify production-date multi-round testing invariants, API and runtime lineage
        run: python -m pytest -q tests/test_rc8_test_rounds.py tests/test_rc8_test_round_api.py tests/test_rc8_test_round_runtime_binding.py
      - name: Verify Alembic revision chain contract
        run: python tests/test_rc8_alembic_revision_contract.py
      - name: Apply Alembic schema
        run: alembic -c center/alembic.ini upgrade head
      - name: Prove concurrent next-round allocation on real PostgreSQL
        run: python scripts/rc8_test_round_concurrency_test.py
      - name: Run real FastAPI PostgreSQL Redis integration assertions through TestRound entry
        run: python scripts/rc8_formal_center_round_entry_test.py
      - name: Run lease-governed resumable Artifact upload assertions
        run: python scripts/rc8_formal_artifact_upload_test.py
      - name: Run real Uvicorn process restart and resumable recovery assertions
        run: python scripts/rc8_formal_center_restart_test.py
      - name: Verify schema is at head and reversible SQL is renderable
        run: |
          alembic -c center/alembic.ini current
          alembic -c center/alembic.ini upgrade head
          alembic -c center/alembic.ini downgrade head:base --sql > /tmp/rc8-downgrade.sql
          test -s /tmp/rc8-downgrade.sql

  vue-product-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Vue product dependencies
        working-directory: center-web
        run: npm install
      - name: Typecheck and build frozen 13-route product shell
        working-directory: center-web
        run: npm run build
      - name: Verify frozen navigation and production-first task entry
        run: |
          python - <<'PY'
          from pathlib import Path
          router = Path('center-web/src/router.ts').read_text(encoding='utf-8')
          app = Path('center-web/src/App.vue').read_text(encoding='utf-8')
          production = Path('center-web/src/components/ProductionPage.vue').read_text(encoding='utf-8')
          test_run = Path('center-web/src/components/TestRunPage.vue').read_text(encoding='utf-8')
          production_store = Path('center-web/src/stores/productionBatches.ts').read_text(encoding='utf-8')
          required = ['投产管理','版本管理','需求管理','代码分析','业务流程','测试接口','测试用例','测试任务','测试报告','缺陷管理','知识库','执行节点','系统信息']
          for name in required:
              assert name in router, name
              assert name in app, name
          assert "redirect: '/productions'" in router
          assert '先确定投产日' in production
          assert '系统版本' in production
          assert 'SST' in production
          assert '测试轮次' in production
          assert '新建下一轮' in production
          assert '开始本轮自主测试' in production
          assert '测试任务编号' not in production
          assert '/production-batches/' in production_store
          assert '/test-rounds' in production_store
          assert '/test-runs' in production_store
          assert 'createNextRound' in production_store
          assert 'startRound' in production_store
          assert 'startTestRun' not in production_store
          assert '前往投产管理' in test_run
          assert 'createRun' not in test_run
          assert 'Dashboard' not in router
          print('RC8_VUE_PRODUCTION_ROUND_FIRST_TASK_ENTRY_PASS')
          PY

  container-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose topology
        run: docker compose -f center/docker-compose.yml config > /tmp/rc8-compose.yml
      - name: Build formal Center and Web images
        run: |
          docker build -f center/Dockerfile -t rc8-center:ci .
          docker build -f center-web/Dockerfile -t rc8-web:ci .
