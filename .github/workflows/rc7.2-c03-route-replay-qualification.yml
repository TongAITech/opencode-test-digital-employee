name: RC7.2 C03 N8 Semantic Route Replay Integrity

on:
  push:
    branches:
      - work/rc7.2-c03-backedge-replay-integrity
    paths:
      - 'rc7_runtime/rc72_diagnosis_orchestration.py'
      - 'tests/test_rc72_n8_execution_diagnosis.py'
      - 'tests/test_rc72_n8_product_recovery.py'
      - '.github/workflows/rc7.2-c03-route-replay-qualification.yml'
  pull_request:
    branches:
      - work/rc7.2-abcd-v5-bsk-mobile-qualification
      - work/rc7.2
    paths:
      - 'rc7_runtime/rc72_diagnosis_orchestration.py'
      - 'tests/test_rc72_n8_execution_diagnosis.py'
      - 'tests/test_rc72_n8_product_recovery.py'
      - '.github/workflows/rc7.2-c03-route-replay-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc72-c03-route-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  c03-native-n8-route-replay:
    name: c03-route-${{ matrix.os }}-python-${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
        python: ['3.8', '3.11']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install approved qualification dependencies
        run: python -m rc7_release.rc72_pytest_bootstrap --requirements rc7_release/requirements-qualification.txt --timeout-seconds 120
      - name: Compile actual N8 production and test modules
        run: >-
          python -m py_compile
          rc7_runtime/rc72_state_machine.py
          rc7_runtime/rc72_diagnosis_orchestration.py
          rc7_runtime/rc72_n8_execution_diagnosis.py
          rc7_runtime/rc72_n8_product_recovery.py
          tests/test_rc72_n8_execution_diagnosis.py
          tests/test_rc72_n8_product_recovery.py
      - name: Execute signed real-local-SUT failure, replay, corruption and recovery regressions
        run: >-
          python -m pytest -q
          tests/test_rc72_n8_execution_diagnosis.py
          tests/test_rc72_n8_product_recovery.py
          --junitxml=rc72-c03-route-replay.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc72-c03-route-${{ matrix.os }}-${{ matrix.python }}-${{ github.sha }}
          path: rc72-c03-route-replay.xml
          retention-days: 14
          if-no-files-found: warn
