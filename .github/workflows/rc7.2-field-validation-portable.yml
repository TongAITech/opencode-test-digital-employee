name: RC7.2 Field-Validation Portable Package (External Bank DSH)

on:
  push:
    branches:
      - work/rc7.2
      - work/rc7.2-field-validation-transport-20261111
    paths:
      - 'packaging/rc7.2/AITEST.sh'
      - 'packaging/rc7.2/start-rc7.2.cmd'
      - 'packaging/rc7.2/FIELD-VALIDATION-README.md'
      - 'rc7_release/rc72_dsh_host_binding.py'
      - 'tests/test_rc72_external_dsh_host_binding.py'
      - '.github/workflows/rc7.2-field-validation-portable.yml'
      - '.github/workflows/rc7.2-portable-transport.yml'

permissions:
  contents: read

concurrency:
  group: rc72-field-validation-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-contract:
    name: external-dsh-binding-${{ matrix.os }}-py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
        python: ['3.8', '3.11']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned qualification requirements
        run: python -m rc7_release.rc72_pytest_bootstrap --requirements rc7_release/requirements-qualification.txt --timeout-seconds 120
      - name: Compile and run external DSH binding adversarial tests
        shell: bash
        run: |
          python -m compileall -q rc7_release/rc72_dsh_host_binding.py tests/test_rc72_external_dsh_host_binding.py
          python -m pytest -q tests/test_rc72_external_dsh_host_binding.py tests/test_rc72_windows_clean_unpack_contract.py --junitxml=rc72-external-dsh-binding.xml
          bash -n packaging/rc7.2/AITEST.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc72-external-dsh-binding-${{ matrix.os }}-${{ matrix.python }}-${{ github.sha }}
          path: rc72-external-dsh-binding.xml
          retention-days: 14

  build-field-validation-package:
    if: github.ref == 'refs/heads/work/rc7.2-field-validation-transport-20261111'
    needs: source-contract
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.9.0'
      - name: Install pinned qualification requirements
        shell: pwsh
        run: |
          python -m pip install -r rc7_release/requirements-qualification.txt
          if ($LASTEXITCODE -ne 0) { throw 'qualification requirements failed' }
      - name: Bootstrap verified ripgrep
        shell: pwsh
        run: |
          python -m rc7_release.runtime_build_bootstrap ripgrep --output .build-runtime/ripgrep --github-path $env:GITHUB_PATH
          if ($LASTEXITCODE -ne 0) { throw 'verified ripgrep bootstrap failed' }
      - name: Acquire complete offline DSH plugin payloads
        shell: pwsh
        run: |
          python -m rc7_release.plugin_payload acquire --repo-root .
          if ($LASTEXITCODE -ne 0) { throw 'offline DSH plugin payload acquisition failed' }
      - name: Build exact-source RC7.2 runtime and all offline payloads without redistributing DSH CLI
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'rc72-field-validation-build'
          $stage = Join-Path $out 'stage'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          python -c "import os; from pathlib import Path; from rc7_release.rc72_package import build_package; build_package('.', Path(os.environ['RUNNER_TEMP'])/'rc72-field-validation-build'/'stage', os.environ['GITHUB_SHA'], make_zip=False)"
          if ($LASTEXITCODE -ne 0) { throw 'RC7.2 package source build failed' }
          $pkg = Join-Path $stage 'PFC-AITest-DSH-Turnkey-RC7.2-BANK-WIN10'
          $env:RC72_FIELD_PACKAGE_ROOT = $pkg
          python -m rc7_release.runtime_payload_materializer --package-root $pkg
          if ($LASTEXITCODE -ne 0) { throw 'full offline runtime materialization failed' }
          $node = Join-Path $pkg 'workspace-template/runtime/node/node.exe'
          $nodeVersion = (& $node --version).Trim().TrimStart('v')
          if ([version]$nodeVersion -lt [version]'24.9.0') { throw "RC7.2 packaged Node >=24.9.0 required; found $nodeVersion" }
          Copy-Item packaging/rc7.2/start-rc7.2.cmd (Join-Path $pkg 'start-rc7.2.cmd')
          Copy-Item packaging/rc7.2/FIELD-VALIDATION-README.md (Join-Path $pkg 'READ-ME-FIRST.md')
          python -c "import json,os; from pathlib import Path; p=Path(os.environ['RC72_FIELD_PACKAGE_ROOT']); meta={'schema':'RC72_FIELD_VALIDATION_PACKAGE_V1','package_kind':'FIELD_VALIDATION_EXTERNAL_BANK_DSH','source_commit':os.environ['GITHUB_SHA'],'dsh_main_payload':{'bundled':False,'mode':'EXTERNAL_BANK_HOST_BINDING_REQUIRED','required_host_file_name':'dsh.exe','host_path_env':'PFC_RC72_DSH_HOST_BIN','optional_expected_sha256_env':'PFC_RC72_DSH_HOST_SHA256','vendor_identity_verified':False,'bank_authorization_verified':False},'field_verified':False,'bank_final':False}; (p/'FIELD-VALIDATION-PACKAGE.json').write_text(json.dumps(meta,sort_keys=True,indent=2)+'\n',encoding='utf-8'); m=json.loads((p/'PACKAGE_MANIFEST.json').read_text(encoding='utf-8')); m['dsh_main_payload']=meta['dsh_main_payload']; m['field_validation_package']=True; (p/'PACKAGE_MANIFEST.json').write_text(json.dumps(m,sort_keys=True,indent=2)+'\n',encoding='utf-8')"
          if ($LASTEXITCODE -ne 0) { throw 'field package identity metadata failed' }
          $zip = Join-Path $out ('RC72-FIELD-VALIDATION-WIN10-' + $env:GITHUB_SHA.Substring(0,12) + '.zip')
          $env:RC72_FIELD_ZIP = $zip
          python -c "import os; from pathlib import Path; from rc7_release.rc72_package import _rewrite_manifest,verify_package; from rc7_release.runtime_payload_materializer import _repack; p=Path(os.environ['RC72_FIELD_PACKAGE_ROOT']); _rewrite_manifest(p,Path('.').resolve(),os.environ['GITHUB_SHA']); verify_package(p,expected_source_commit=os.environ['GITHUB_SHA']); print(_repack(p,Path(os.environ['RC72_FIELD_ZIP'])))"
          if ($LASTEXITCODE -ne 0) { throw 'field package manifest seal or ZIP creation failed' }
          "RC72_FIELD_PACKAGE_ROOT=$pkg" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RC72_FIELD_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Clean extraction and exact package identity verification
        shell: pwsh
        run: |
          $clean = Join-Path $env:RUNNER_TEMP 'rc72-field-validation-clean'
          if (Test-Path $clean) { Remove-Item -Recurse -Force $clean }
          New-Item -ItemType Directory -Force -Path $clean | Out-Null
          Expand-Archive -Path $env:RC72_FIELD_ZIP -DestinationPath $clean -Force
          $pkg = Join-Path $clean 'PFC-AITest-DSH-Turnkey-RC7.2-BANK-WIN10'
          $py = Join-Path $pkg 'workspace-template/runtime/python/python.exe'
          if (-not (Test-Path $py)) { throw 'package-local Python missing' }
          if (Test-Path (Join-Path $pkg 'workspace-template/runtime/dsh/dsh.exe')) { throw 'field-validation package must not silently bundle an unapproved DSH binary' }
          Push-Location $pkg
          try {
            $env:PYTHONPATH = ''
            $env:PYTHONNOUSERSITE = '1'
            & $py -m rc7_release.rc72_package verify --package-root $pkg --expected-source-commit $env:GITHUB_SHA | Tee-Object (Join-Path $env:RUNNER_TEMP 'rc72-field-package-identity.json')
            if ($LASTEXITCODE -ne 0) { throw 'package identity/checksum verification failed' }
            & $py -m rc7_release.runtime_delivery_contract --package-root $pkg | Tee-Object (Join-Path $env:RUNNER_TEMP 'rc72-field-runtime-delivery.json')
            if ($LASTEXITCODE -ne 0) { throw 'offline runtime delivery contract failed' }
            & $py -m rc7_release.rc72_complete_payload_inventory --package-root $pkg | Tee-Object (Join-Path $env:RUNNER_TEMP 'rc72-field-full-inventory.json')
            if ($LASTEXITCODE -ne 0) { throw 'full physical capability inventory failed' }
            & $py -c "import json; m=json.load(open('PACKAGE_MANIFEST.json',encoding='utf-8')); d=m.get('dsh_main_payload',{}); assert d.get('bundled') is False and d.get('mode')=='EXTERNAL_BANK_HOST_BINDING_REQUIRED'; assert m.get('field_validation_package') is True; print('EXTERNAL_BANK_DSH_BINDING_REQUIRED')"
            if ($LASTEXITCODE -ne 0) { throw 'field package DSH boundary metadata invalid' }
            & $py -I (Join-Path $pkg 'rc7_release/python_full_capability_probe.py') --runtime-root (Split-Path -Parent $py) --output (Join-Path $env:RUNNER_TEMP 'rc72-field-python-capabilities.json')
            if ($LASTEXITCODE -ne 0) { throw 'package-local Python/document capability qualification failed' }
            $node = Join-Path $pkg 'workspace-template/runtime/node/node.exe'
            Set-NetFirewallProfile -Profile Domain,Private,Public -Enabled True
            $rule = 'RC72-Execution-Node-Offline'
            New-NetFirewallRule -Name $rule -DisplayName 'RC7.2 field package offline Node probe' -Program $node -Direction Outbound -Action Block -Profile Any -Enabled True | Out-Null
            try {
              & $py -m rc7_release.rc72_execution_node_qualification --package-root $pkg --evidence-root (Join-Path $env:RUNNER_TEMP 'rc72-field-node') --require-windows-outbound-block --require-full-text-search
              if ($LASTEXITCODE -ne 0) { throw 'offline execution-node qualification failed' }
            } finally {
              Remove-NetFirewallRule -Name $rule -ErrorAction Stop
            }
            & $py -m rc7_release.rc72_windows_clean_qualification --package-root $pkg --output (Join-Path $env:RUNNER_TEMP 'rc72-field-clean-r1.json') --require-pass
            if ($LASTEXITCODE -ne 0) { throw 'clean R1/session continuity qualification failed' }
            $env:PFC_RC72_LAUNCHER_PROBE_ONLY = '1'
            $env:PFC_RC72_DSH_PROFILE = 'rc7.2-bank'
            & bash -lc './packaging/rc7.2/AITEST.sh' | Tee-Object (Join-Path $env:RUNNER_TEMP 'rc72-field-gitbash-launcher.txt')
            if ($LASTEXITCODE -ne 0) { throw 'Git Bash RC7.2 field launcher probe failed' }
          } finally {
            Pop-Location
          }
      - name: Verify Windows bank PC pip mirror component
        shell: pwsh
        run: |
          $clean = Join-Path $env:RUNNER_TEMP 'rc72-field-validation-clean'
          $pkg = Join-Path $clean 'PFC-AITest-DSH-Turnkey-RC7.2-BANK-WIN10'
          $py = Join-Path $pkg 'workspace-template/runtime/python/python.exe'
          $env:RC72_PIP_MIRROR_COMPONENT = '1'
          if (!(Test-Path -LiteralPath $env:RC72_FIELD_ZIP)) { throw 'Field-validation ZIP missing before pip mirror qualification' }
          if (!(Test-Path -LiteralPath $pkg)) { throw 'Cleanly extracted field-validation package missing before pip mirror qualification' }
          # The ZIP and clean extraction are now the immutable test inputs. Remove the
          # original staging tree so the test proves it does not depend on build residue.
          if (Test-Path -LiteralPath $env:RC72_FIELD_PACKAGE_ROOT) {
            Remove-Item -LiteralPath $env:RC72_FIELD_PACKAGE_ROOT -Recurse -Force
          }
          if (Test-Path -LiteralPath $env:RC72_FIELD_PACKAGE_ROOT) { throw 'Original package staging tree was not removed' }
          $env:RC72_PIP_MIRROR_COMPONENT = '1'
          $env:RC72_PIP_MIRROR_PACKAGE_ROOT = $pkg
          $env:RC72_PIP_MIRROR_PACKAGE_ARCHIVE = $env:RC72_FIELD_ZIP
          $env:RC72_PIP_MIRROR_ORIGINAL_STAGE = $env:RC72_FIELD_PACKAGE_ROOT
          $env:RC72_PIP_MIRROR_EVIDENCE = Join-Path $env:RUNNER_TEMP 'rc72-field-pip-mirror'
          & $py -m pytest tests/test_rc72_bank_pc_pip_mirror_windows.py -q ('--junitxml=' + (Join-Path $env:RUNNER_TEMP 'rc72-field-pip-mirror.xml'))
          if ($LASTEXITCODE -ne 0) { throw 'Windows pip mirror component qualification failed' }
      - name: Upload field-validation package and physical qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: RC72-FIELD-VALIDATION-WIN10-${{ github.sha }}
          path: |
            ${{ runner.temp }}/rc72-field-validation-build/RC72-FIELD-VALIDATION-WIN10-*.zip
            ${{ runner.temp }}/rc72-field-validation-build/RC72-FIELD-VALIDATION-WIN10-*.zip.sha256
            ${{ runner.temp }}/rc72-field-package-identity.json
            ${{ runner.temp }}/rc72-field-runtime-delivery.json
            ${{ runner.temp }}/rc72-field-full-inventory.json
            ${{ runner.temp }}/rc72-field-python-capabilities.json
            ${{ runner.temp }}/rc72-field-clean-r1.json
            ${{ runner.temp }}/rc72-field-gitbash-launcher.txt
            ${{ runner.temp }}/rc72-field-pip-mirror.xml
