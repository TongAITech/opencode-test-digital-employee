name: RC8 N6 Executable Readiness Reality

on:
  push:
    branches: [work/rc8]
    paths:
      - 'rc8_center/prepared_attempt.py'
      - 'rc8_center/executable_readiness.py'
      - 'rc8_center/api/prepared_attempt_routes.py'
      - 'rc8_center/api/executable_readiness_routes.py'
      - 'rc8_center/api/__init__.py'
      - 'rc8_center/formal_control.py'
      - 'rc8_center/infrastructure/postgres_prepared_attempt.py'
      - 'rc8_center/infrastructure/postgres_executable_readiness.py'
      - 'rc8_center/infrastructure/postgres_control.py'
      - 'center/migrations/versions/0014_n5_n6_execution_state.py'
      - 'scripts/rc8_executable_readiness_http_test.py'
      - '.github/workflows/rc8-n6-executable-readiness-reality.yml'
  workflow_dispatch:

jobs:
  n6-real-http-build:
    runs-on: ubuntu-latest
    services:
      postgresql:
        image: postgres:16
        env:
          POSTGRES_DB: rc8
          POSTGRES_USER: rc8
          POSTGRES_PASSWORD: rc8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rc8 -d rc8"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      RC8_DATABASE_URL: postgresql+psycopg://rc8:rc8@127.0.0.1:5432/rc8
      RC8_REDIS_URL: redis://127.0.0.1:6379/0
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install formal Center dependencies
        run: pip install -r center/requirements.txt pytest
      - name: Compile N5 to N6 reality slice
        run: |
          python -m py_compile \
            rc8_center/prepared_attempt.py \
            rc8_center/executable_readiness.py \
            rc8_center/api/prepared_attempt_routes.py \
            rc8_center/api/executable_readiness_routes.py \
            rc8_center/api/__init__.py \
            rc8_center/infrastructure/postgres_prepared_attempt.py \
            rc8_center/infrastructure/postgres_executable_readiness.py \
            scripts/rc8_executable_readiness_http_test.py
      - name: Apply formal PostgreSQL schema
        run: alembic -c center/alembic.ini upgrade head
      - name: Prove N6 governance Attempt is distinct from N5 case execution Attempt
        run: python scripts/rc8_executable_readiness_http_test.py
      - name: Verify schema remains at head
        run: alembic -c center/alembic.ini current
