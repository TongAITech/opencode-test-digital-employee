name: RC8 Code Sufficiency Frozen Ledger

on:
  push:
    branches: [work/rc8]
    paths:
      - 'rc8_center/code_sufficiency.py'
      - 'rc8_runtime/sufficiency.py'
      - 'rc8_center/traceability.py'
      - 'rc8_center/infrastructure/postgres_traceability.py'
      - 'tests/test_rc8_code_sufficiency.py'
      - '.github/workflows/rc8-code-sufficiency.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-code-denominator:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Install test dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check pytest sqlalchemy
      - name: Compile code sufficiency evaluator
        shell: bash
        run: |
          python -m py_compile \
            rc8_center/code_sufficiency.py \
            rc8_runtime/sufficiency.py \
            tests/test_rc8_code_sufficiency.py
      - name: Run frozen denominator and anti-shrink regressions
        shell: bash
        run: python -m pytest -q tests/test_rc8_code_sufficiency.py
