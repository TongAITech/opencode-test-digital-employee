name: RC8 Code Sufficiency Frozen Ledger

on:
  push:
    branches: [work/rc8]
    paths:
      - 'rc8_center/code_sufficiency.py'
      - 'rc8_center/formal_app.py'
      - 'rc8_runtime/sufficiency.py'
      - 'rc8_center/traceability.py'
      - 'rc8_center/infrastructure/postgres_traceability.py'
      - 'rc8_node/code_sufficiency_worker.py'
      - 'tests/test_rc8_node_code_sufficiency_policy.py'
      - 'tests/test_rc8_code_sufficiency.py'
      - 'tests/test_rc8_code_sufficiency_snapshot_authority.py'
      - 'tests/test_rc8_formal_center_integration.py'
      - '.github/workflows/rc8-code-sufficiency.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-code-denominator:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Install test dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check pytest sqlalchemy redis
      - name: Compile code sufficiency evaluators
        shell: bash
        run: |
          python -m py_compile \
            rc8_center/code_sufficiency.py \
            rc8_runtime/sufficiency.py \
            rc8_node/code_sufficiency_worker.py \
            tests/test_rc8_node_code_sufficiency_policy.py \
            tests/test_rc8_code_sufficiency.py \
            tests/test_rc8_code_sufficiency_snapshot_authority.py
      - name: Run frozen denominator and authority regressions
        shell: bash
        run: python -m pytest -q tests/test_rc8_code_sufficiency.py tests/test_rc8_code_sufficiency_snapshot_authority.py tests/test_rc8_node_code_sufficiency_policy.py
