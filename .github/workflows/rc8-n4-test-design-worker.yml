name: RC8 N4 Test Design Worker

on:
  push:
    branches: [work/rc8]
    paths:
      - 'rc8_node/test_design_worker.py'
      - 'tests/test_rc8_n4_test_design_worker.py'
      - '.github/workflows/rc8-n4-test-design-worker.yml'
  workflow_dispatch:

jobs:
  n4-test-design:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - run: python -m pip install pytest
      - run: python -m py_compile rc8_node/test_design_worker.py
      - run: python -m pytest -q tests/test_rc8_n4_test_design_worker.py
