name: RC7.2 A/B Governed Product Integration Qualification

on:
  push:
    branches: [work/rc7.2-ab-integration]
    paths:
      - 'rc7_runtime/**'
      - 'tests/test_rc72_*.py'
      - '.github/workflows/rc7.2-ab-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

# Preserve the running exact-SHA evidence; replace only redundant pending runs.
concurrency:
  group: rc72-ab-integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  governed-product-integration:
    name: ab-product-${{ matrix.os }}-python-${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
        python-version: ['3.8', '3.11']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned pytest runner
        run: python -m rc7_release.rc72_pytest_bootstrap --requirements rc7_release/requirements-qualification.txt --timeout-seconds 120
      - name: Compile both A and B production trees
        run: python -m compileall -q rc6_runtime rc7_runtime rc7_release
      - name: Run real factory N7 Captain preparation and N8/N9/N10 regression
        run: >-
          python -m pytest -q
          tests/test_rc72_mission_factory.py
          tests/test_rc72_captain_n7_pipeline.py
          tests/test_rc72_fenced_n7_preparation.py
          tests/test_rc72_captain_scheduling.py
          tests/test_rc72_n7_tool_dispatch.py
          tests/test_rc72_n8_product_recovery.py
          tests/test_rc72_release_driver_n8.py
          tests/test_rc72_conclusive_failure_evidence.py
          tests/test_rc72_n10_terminal.py
          --junitxml=rc72-ab-integration.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc72-ab-${{ matrix.os }}-py${{ matrix.python-version }}-${{ github.sha }}
          path: rc72-ab-integration.xml
          if-no-files-found: warn
          retention-days: 14
