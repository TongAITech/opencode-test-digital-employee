name: RC8 N5 N6 Mission Order

on:
  push:
    branches:
      - work/rc8
    paths:
      - 'rc8_center/**'
      - 'tests/test_rc8_n5_n6_mission_order.py'
      - 'docs/rc8/N1-N10-CONSTRUCTION-PLAN.md'
      - '.github/workflows/rc8-n5-n6-order.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  n5-n6-order:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Verify N5 before N6 mission ordering
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_rc8_n5_n6_mission_order.py
