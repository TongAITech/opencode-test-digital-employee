name: RC7 MCP Runtime Lease Regression

on:
  push:
    branches: [validation/agiletc-worker-timeout-evidence]
    paths:
      - 'rc7_runtime/authorized_dsh_launcher.py'
      - 'rc7_runtime/mcp_tool_authority.py'
      - 'rc7_release/mcp_server_authorized.py'
      - 'tests/test_rc7_mcp_runtime_lease.py'
      - '.github/workflows/rc7-mcp-runtime-lease-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-lease-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile authority boundary
        run: |
          python -m py_compile \
            rc7_runtime/authorized_dsh_launcher.py \
            rc7_runtime/mcp_tool_authority.py \
            rc7_release/mcp_server_authorized.py \
            tests/test_rc7_mcp_runtime_lease.py
      - name: Run focused runtime lease regressions
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q \
            tests/test_rc7_mcp_runtime_lease.py \
            tests/test_rc7_dsh_tool_authority.py
