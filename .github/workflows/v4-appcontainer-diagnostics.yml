name: V4 AppContainer diagnostics
on:
  push:
    branches: [scratch/v4-appcontainer-diagnostics]
    paths: [tools/v4_review/windows/**, .github/workflows/v4-appcontainer-diagnostics.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  windows-isolation:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reuse qualified portable Python and installed Git Bash
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $incoming = Join-Path $env:RUNNER_TEMP 'v4-interpreter-input'
          gh run download 34278790485 --name recovery-qualified-package --dir $incoming
          if ($LASTEXITCODE -ne 0) { throw 'Offline payload artifact unavailable' }
          $zip = Join-Path $incoming 'AITest-V1.13.0-Recovery-Turnkey-Windows-x64.zip'
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '49d8e4dc0a38a1ea89b5872bb7926151b938172650bec2534ce73c43f76e9be2') { throw 'Offline payload hash mismatch' }
          $expanded = Join-Path $env:RUNNER_TEMP 'v4-interpreters'
          Expand-Archive $zip -DestinationPath $expanded
          $bundle = Get-ChildItem $expanded -Directory | Select-Object -First 1
          "V4_RUNTIME=$($bundle.FullName)/workspace-template/runtime" | Out-File $env:GITHUB_ENV -Append
          $git = Join-Path $env:ProgramFiles 'Git'
          if (-not (Test-Path "$git/bin/bash.exe")) { throw 'EXISTING_GIT_BASH_UNAVAILABLE' }
          "V4_GIT=$git" | Out-File $env:GITHUB_ENV -Append
      - name: Start independent Windows filtering observer
        shell: pwsh
        run: |
          $trace = Join-Path $env:RUNNER_TEMP 'v4-wfp-observer'
          New-Item -ItemType Directory -Path $trace | Out-Null
          "V4_WFP_OUTPUT=$trace" | Out-File $env:GITHUB_ENV -Append
          netsh wfp show options optionsfor=netevents | Out-File (Join-Path $trace 'options-before.log')
          netsh wfp capture start cab=off traceonly=off file="$trace/capture" | Out-File (Join-Path $trace 'capture-start.log')
          netsh wfp set options netevents=on | Out-File (Join-Path $trace 'events-start.log')
      - name: Probe Windows confinement using synthetic disposable files
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP ('v4-isolation-' + [Guid]::NewGuid().ToString('N'))
          "V4_PROBE_OUTPUT=$output" | Out-File $env:GITHUB_ENV -Append
          & ./tools/v4_review/windows/run-spike.ps1 -OutputDirectory $output -UseDisposableCiUser -RuntimeDirectory $env:V4_RUNTIME -GitDirectory $env:V4_GIT
      - name: Collect independent filter decision evidence
        if: always()
        shell: pwsh
        run: |
          $trace = $env:V4_WFP_OUTPUT
          if ($trace) {
            netsh wfp show netevents file="$trace/netevents.xml" timewindow=300 | Out-File (Join-Path $trace 'events-export.log')
            netsh wfp show filters file="$trace/filters.xml" verbose=on | Out-File (Join-Path $trace 'filters-export.log')
            netsh wfp capture stop | Out-File (Join-Path $trace 'capture-stop.log')
            @{ role='CI_ONLY_INDEPENDENT_OBSERVER'; probe_admin_required=$false; firewall_rules_modified=$false; loopback_exemptions_added=$false; trace_is_not_a_runtime_dependency=$true } | ConvertTo-Json | Set-Content (Join-Path $trace 'observer-role.json')
          }
      - name: Record actual workflow identity and evidence
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path review-evidence -Force | Out-Null
          @{
            source_head = $env:GITHUB_SHA
            repository = $env:GITHUB_REPOSITORY
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            runner_os = $env:RUNNER_OS
            qualification_scope = 'ISOLATED_WINDOWS_OS_PRIMITIVE_ONLY'
            final_product_l3 = 'NOT_RUN'
            bank_l5 = 'NOT_RUN'
          } | ConvertTo-Json | Set-Content review-evidence/workflow-identity.json
          if ($env:V4_PROBE_OUTPUT -and (Test-Path $env:V4_PROBE_OUTPUT)) {
            Get-ChildItem $env:V4_PROBE_OUTPUT -File | Where-Object { $_.Extension -in '.json','.log' } | Copy-Item -Destination review-evidence
            $notes = Join-Path $env:V4_PROBE_OUTPUT 'notes'
            if (Test-Path $notes) {
              Get-ChildItem $notes -File | Where-Object { $_.Extension -in '.json','.log' } | Copy-Item -Destination review-evidence
            }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v4-windows-isolation-review
          path: review-evidence/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v4-wfp-observer
          path: ${{ env.V4_WFP_OUTPUT }}/*
          if-no-files-found: warn
