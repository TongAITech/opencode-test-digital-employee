name: Build Hermes Bank Portable

on:
  push:
    branches:
      - work/hermes-bank-portable-package
    paths:
      - '.github/workflows/build-hermes-bank-portable.yml'
      - 'tools/hermes-portable/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-portable:
    name: Windows x64 portable package
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch portable builder for Windows runner
        shell: powershell
        run: |
          $p = '.\tools\hermes-portable\build-hermes-bank-portable.ps1'
          $text = Get-Content -LiteralPath $p -Raw
          $text = $text.Replace('$LASTEXITCODE:', '${LASTEXITCODE}:')

          $oldBrowser = @'
              Invoke-Checked $agentBrowser 'install'
              $chromiumDir = Get-ChildItem -Path $env:PLAYWRIGHT_BROWSERS_PATH -Directory -ErrorAction SilentlyContinue | Where-Object { $_.Name -match '^chromium' } | Select-Object -First 1
              if (-not $chromiumDir) { throw "Chromium was not installed under $env:PLAYWRIGHT_BROWSERS_PATH" }
          '@.Replace('              ','    ')
          $newBrowser = @'
              Invoke-Checked $agentBrowser 'install'
              # agent-browser keeps its Chrome-for-Testing cache in ~/.agent-browser rather than PLAYWRIGHT_BROWSERS_PATH.
              # Copy the complete chrome.exe directory into the portable payload and pin Hermes to that fixed path.
              $agentBrowserCache = Join-Path $env:USERPROFILE '.agent-browser\browsers'
              $sourceChromeExe = Get-ChildItem -Path $agentBrowserCache -Filter 'chrome.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if (-not $sourceChromeExe) { throw "agent-browser Chrome install succeeded but chrome.exe was not found under $agentBrowserCache" }
              $portableChromeDir = Join-Path $env:PLAYWRIGHT_BROWSERS_PATH 'chromium-bundled'
              Remove-Item -Recurse -Force $portableChromeDir -ErrorAction SilentlyContinue
              New-Item -ItemType Directory -Force -Path $portableChromeDir | Out-Null
              Copy-Item -Path (Join-Path $sourceChromeExe.Directory.FullName '*') -Destination $portableChromeDir -Recurse -Force
              if (-not (Test-Path (Join-Path $portableChromeDir 'chrome.exe'))) { throw 'Portable chrome.exe copy failed' }
              $chromiumDir = Get-Item $portableChromeDir
          '@.Replace('              ','    ')
          if (-not $text.Contains($oldBrowser)) { throw 'Browser block patch target not found' }
          $text = $text.Replace($oldBrowser, $newBrowser)

          $oldEnv = 'HERMES_GIT_BASH_PATH=R:\hermes\git\bin\bash.exe'
          $newEnv = "HERMES_GIT_BASH_PATH=R:\hermes\git\bin\bash.exe`nAGENT_BROWSER_EXECUTABLE_PATH=R:\hermes\browser\ms-playwright\chromium-bundled\chrome.exe"
          $text = $text.Replace($oldEnv, $newEnv)

          Set-Content -LiteralPath $p -Value $text -Encoding UTF8

      - name: Build and relocation-verify package
        shell: powershell
        run: .\tools\hermes-portable\build-hermes-bank-portable.ps1

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Hermes-Agent-Bank-Portable-v2026.9.14-Win10-x64
          path: |
            out/Hermes-Agent-Bank-Portable-v2026.9.14-Win10-x64.zip
            out/Hermes-Agent-Bank-Portable-v2026.9.14-Win10-x64.sha256.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
