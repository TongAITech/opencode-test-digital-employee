name: RC7.2 One-Time Batch Cancel

# The initial creation on main starts cleanup automatically.
# Later cleanup can be manually dispatched.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rc72-batch-cancel-once.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  cancel-rc72-backlog:
    name: Cancel all RC7.2 active Actions runs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Find and cancel every RC7.2 active run (including old SHAs)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const {owner, repo} = context.repo;
            const statuses = ['queued', 'pending', 'waiting', 'requested', 'in_progress'];
            const matches = new Map();
            const isRC72 = branch => branch === 'work/rc7.2' || branch.startsWith('work/rc7.2-');

            // Query every page of every nonterminal status (not just one commit or PR).
            for (const status of statuses) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                owner, repo, status, per_page: 100
              });
              for (const run of runs) {
                if (run.id === context.runId) continue;
                if (!isRC72(run.head_branch || '')) continue;
                matches.set(run.id, run);
              }
              core.info(`status=${status}; repo_runs=${runs.length}`);
            }

            core.info(`Found ${matches.size} active RC7.2 workflow runs`);
            let accepted = 0, finished = 0, failed = 0;
            const errors = [];
            for (const run of matches.values()) {
              try {
                await github.rest.actions.cancelWorkflowRun({
                  owner, repo, run_id: run.id
                });
                accepted++;
                core.info(`Cancel accepted #${run.id} [${run.status}] ${run.head_branch} / ${run.name}`);
              } catch (err) {
                if ([409, 422].includes(err.status)) {
                  finished++;
                  core.info(`Already finished/not cancellable #${run.id}: ${err.message}`);
                } else {
                  failed++;
                  errors.push(`#${run.id} (${err.status || 'error'}): ${err.message}`);
                  core.warning(`Cancel failure #${run.id}: ${err.message}`);
                }
              }
            }
            await core.summary
              .addHeading('RC7.2 one-time CI queue cleanup')
              .addRaw(`Active RC7.2 runs found: ${matches.size}\n\n`)
              .addRaw(`Cancel API accepted: ${accepted}\n\n`)
              .addRaw(`Already terminal/noncancellable: ${finished}\n\n`)
              .addRaw(`Failed requests: ${failed}\n\n`)
              .addRaw('Scope: work/rc7.2 and work/rc7.2-*; RC8 and main intentionally excluded.\n\n')
              .write();
            if (errors.length) {
              core.setFailed(errors.slice(0, 20).join('\n'));
            }
