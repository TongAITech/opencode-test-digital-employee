name: RC8 Zero Denominator Autofix

on:
  push:
    branches:
      - work/rc8
    paths:
      - .github/workflows/rc8-zero-denominator-autofix.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/rc8
          fetch-depth: 0
      - name: Apply fail-closed zero denominator semantics
        shell: bash
        run: >-
          python -c 'from pathlib import Path; p=Path("rc8_runtime/governance.py"); s=p.read_text(); old="    @property\n    def ratio(self) -> float:\n        if self.total == 0:\n            return 1.0\n        return float(self.covered) / float(self.total)\n\n    @property\n    def satisfied(self) -> bool:\n        return self.ratio >= float(self.threshold)\n"; new="    @property\n    def ratio(self) -> float:\n        # Empty frozen denominators are UNKNOWN, never full coverage.\n        if self.total == 0:\n            return 0.0\n        return float(self.covered) / float(self.total)\n\n    @property\n    def satisfied(self) -> bool:\n        # Fail closed even when threshold is zero: UNKNOWN cannot be SUFFICIENT.\n        if self.total == 0:\n            return False\n        return self.ratio >= float(self.threshold)\n"; assert old in s, "expected CoverageMetric block not found; refusing unsafe rewrite"; p.write_text(s.replace(old,new,1))'
      - name: Verify runtime and frozen ledger contract
        shell: bash
        run: |
          python -m py_compile rc8_runtime/governance.py
          python - <<'PY'
          from pathlib import Path
          source = Path("rc8_runtime/governance.py").read_text(encoding="utf-8")
          forbidden = "if self.total == 0:\n            return 1.0"
          assert forbidden not in source, "ZERO_DENOMINATOR_MUST_NOT_EQUAL_FULL_COVERAGE"
          assert "if self.total == 0:\n            return False" in source, "ZERO_DENOMINATOR_MUST_FAIL_CLOSED"
          PY
      - name: Commit production fix
        shell: bash
        run: |
          git config user.name "TongAITech RC8 Guard"
          git config user.email "actions@users.noreply.github.com"
          git add rc8_runtime/governance.py
          git diff --cached --quiet && exit 0
          git commit -m "fix(rc8): fail closed on zero coverage denominator"
          git push origin HEAD:work/rc8
