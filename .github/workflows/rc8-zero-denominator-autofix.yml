name: RC8 Zero Denominator Autofix

on:
  push:
    branches:
      - work/rc8
    paths:
      - .github/workflows/rc8-zero-denominator-autofix.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/rc8
          fetch-depth: 0
      - name: Apply fail-closed zero denominator semantics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('rc8_runtime/governance.py')
          s = p.read_text()
          old = '''    @property
              def ratio(self) -> float:
                  if self.total == 0:
                      return 1.0
                  return float(self.covered) / float(self.total)

              @property
              def satisfied(self) -> bool:
                  return self.ratio >= float(self.threshold)
          '''.replace('          ', '')
          new = '''    @property
              def ratio(self) -> float:
                  # Empty frozen denominators are UNKNOWN, never full coverage.
                  if self.total == 0:
                      return 0.0
                  return float(self.covered) / float(self.total)

              @property
              def satisfied(self) -> bool:
                  # Fail closed even when threshold is zero: UNKNOWN cannot be SUFFICIENT.
                  if self.total == 0:
                      return False
                  return self.ratio >= float(self.threshold)
          '''.replace('          ', '')
          if old not in s:
              raise SystemExit('expected CoverageMetric block not found; refusing unsafe rewrite')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Verify runtime and frozen ledger contract
        run: |
          python -m py_compile rc8_runtime/governance.py
          python -m pytest -q tests/test_rc8_coverage_zero_denominator_contract.py
      - name: Commit production fix
        shell: bash
        run: |
          git config user.name "TongAITech RC8 Guard"
          git config user.email "actions@users.noreply.github.com"
          git add rc8_runtime/governance.py
          git diff --cached --quiet && exit 0
          git commit -m "fix(rc8): fail closed on zero coverage denominator"
          git push origin HEAD:work/rc8
