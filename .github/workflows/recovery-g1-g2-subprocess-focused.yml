name: Recovery G1-G2 subprocess focused qualification

on:
  push:
    branches: [work/v1.13.0-recovery-turnkey-validation]
    paths:
      - workspace-template/.pfc-internal-field-validation/tests/host_interaction_fixture.py
      - workspace-template/.pfc-internal-field-validation/tests/test_g1_g2_product_path_subprocess.py
      - workspace-template/ai-test/runtime/aitest_runtime/product_entry.py
      - workspace-template/ai-test/runtime/aitest_runtime/host_tool_call.py
      - .github/workflows/recovery-g1-g2-subprocess-focused.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  product-path:
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Reuse qualified portable Python
        shell: pwsh
        run: |
          $incoming = Join-Path $env:RUNNER_TEMP 'g1-g2-focused-payload'
          gh run download 34278790485 --name recovery-qualified-package --dir $incoming
          if ($LASTEXITCODE -ne 0) { throw 'Prior qualified offline payload unavailable' }
          $zip = Join-Path $incoming 'AITest-V1.13.0-Recovery-Turnkey-Windows-x64.zip'
          $expected = '49d8e4dc0a38a1ea89b5872bb7926151b938172650bec2534ce73c43f76e9be2'
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'Offline payload input hash mismatch'
          }
          $expanded = Join-Path $env:RUNNER_TEMP 'g1-g2-focused-expanded'
          Expand-Archive $zip -DestinationPath $expanded
          $bundle = Get-ChildItem $expanded -Directory | Select-Object -First 1
          if (-not $bundle) { throw 'Qualified payload root missing' }
          $python = Join-Path $bundle.FullName 'workspace-template/runtime/python/python.exe'
          if (-not (Test-Path $python)) { throw 'Portable Python missing' }
          "FOCUSED_PYTHON=$python" | Out-File $env:GITHUB_ENV -Append

      - name: Run G1-G2 independent subprocess product path
        shell: pwsh
        run: |
          $env:GH_TOKEN = ''
          $env:GITHUB_TOKEN = ''
          $env:PYTHONNOUSERSITE = '1'
          $env:PYTHONDONTWRITEBYTECODE = '1'
          $env:PYTHONUTF8 = '1'
          & "$env:FOCUSED_PYTHON" -X utf8 workspace-template/.pfc-internal-field-validation/tests/test_g1_g2_product_path_subprocess.py 2>&1 | Tee-Object -FilePath RECOVERY_G1_G2_SUBPROCESS_FOCUSED.log
          if ($LASTEXITCODE -ne 0) { throw 'G1-G2 subprocess focused regression failed' }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-g1-g2-subprocess-focused
          path: RECOVERY_G1_G2_SUBPROCESS_FOCUSED.log
          if-no-files-found: warn
