name: RC7.2 R4 AgentTeams 32 Member Engineering Qualification (No ZIP)

on:
  pull_request:
    branches: [work/rc7.2]
    paths:
      - 'rc7_runtime/rc72_agentteams_capacity.py'
      - 'rc7_runtime/rc72_captain_scheduling.py'
      - 'rc7_release/rc72_team_profile_capacity.py'
      - 'packaging/rc7/AITEST.sh'
      - 'packaging/rc7.2/AITEST.sh'
      - 'tests/test_rc72_r4_*.py'
      - '.github/workflows/rc7.2-r4-capacity32.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc72-r4-capacity32-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  r4-safe-capacity-contract:
    name: r4-32-${{ matrix.os }}-python-${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04]
        python: ['3.8', '3.11']
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Pinned test harness
        run: python -m rc7_release.rc72_pytest_bootstrap --requirements rc7_release/requirements-qualification.txt --timeout-seconds 120
      - name: Compilation and R4 exact contract
        run: |
          python -m compileall -q rc7_runtime rc7_release tests
          python -m pytest -q tests/test_rc72_r4_team_capacity32.py tests/test_rc72_r4_profile_capacity32.py tests/test_rc72_captain_scheduling.py tests/test_rc72_captain_n7_pipeline.py tests/test_rc7_dsh_runtime_profile.py --junitxml=rc72-r4-capacity.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc72-r4-capacity-${{ matrix.os }}-${{ matrix.python }}-${{ github.sha }}
          path: rc72-r4-capacity.xml
          retention-days: 14
          if-no-files-found: warn
