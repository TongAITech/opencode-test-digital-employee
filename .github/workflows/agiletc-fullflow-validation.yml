name: AgileTC RC7 DSH Fullflow Validation

on:
  push:
    branches:
      - validation/agiletc-fullflow
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agiletc-rc7-fullflow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agiletc-fullflow:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: case_manager
        ports:
          - 3301:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      PFC_AITEST_STATE_DIR: ${{ github.workspace }}/validation-artifacts/runtime-state
      PFC_WORKSPACE: ${{ github.workspace }}/target/AgileTC
      LOCAL_MODEL_API_KEY: ollama-local
      OLLAMA_HOST: 127.0.0.1:11434

    steps:
      - name: Checkout RC7 validation branch
        uses: actions/checkout@v4

      - name: Checkout AgileTC target
        uses: actions/checkout@v4
        with:
          repository: didi/AgileTC
          ref: master
          path: target/AgileTC
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node for DSH
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 8 for AgileTC
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
          cache-dependency-path: target/AgileTC/case-server/pom.xml

      - name: Capture target source revision
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation-artifacts
          git -C target/AgileTC rev-parse HEAD | tee validation-artifacts/agiletc-source-revision.txt
          git -C target/AgileTC status --short | tee validation-artifacts/agiletc-git-status.txt
          git -C target/AgileTC log -1 --format=fuller | tee validation-artifacts/agiletc-source-commit.txt

      - name: Initialize real AgileTC MySQL schema
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq default-mysql-client
          for i in $(seq 1 30); do
            if mysqladmin ping -h127.0.0.1 -P3301 -uroot -proot --silent; then break; fi
            sleep 2
          done
          mysql -h127.0.0.1 -P3301 -uroot -proot -e 'CREATE DATABASE IF NOT EXISTS case_manager CHARACTER SET utf8mb4;'
          mysql -h127.0.0.1 -P3301 -uroot -proot case_manager < target/AgileTC/case-server/sql/case-server.sql
          mysql -h127.0.0.1 -P3301 -uroot -proot -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='case_manager';" | tee validation-artifacts/agiletc-db-table-count.txt

      - name: Run real AgileTC Maven test
        id: maven_test
        continue-on-error: true
        shell: bash
        run: |
          set +e
          cd target/AgileTC/case-server
          mvn -B -ntp test 2>&1 | tee ../../../validation-artifacts/agiletc-maven-test.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > ../../../validation-artifacts/agiletc-maven-test.exit
          exit "$rc"

      - name: Start AgileTC and probe real HTTP surface
        id: app_probe
        continue-on-error: true
        shell: bash
        timeout-minutes: 5
        run: |
          set +e
          cd target/AgileTC/case-server
          nohup mvn -B -ntp -DskipTests spring-boot:run > ../../../validation-artifacts/agiletc-app.log 2>&1 &
          echo $! > ../../../validation-artifacts/agiletc-app.pid
          cd ../../..
          rc=1
          : > validation-artifacts/agiletc-http-probe.txt
          for i in $(seq 1 90); do
            code=$(curl -k -sS -o validation-artifacts/agiletc-http-body.html -w '%{http_code}' http://127.0.0.1:8094/case/caseList/1 || true)
            printf 'attempt=%s http_code=%s\n' "$i" "$code" | tee -a validation-artifacts/agiletc-http-probe.txt
            if [[ "$code" =~ ^(200|301|302)$ ]]; then rc=0; break; fi
            sleep 2
          done
          exit "$rc"

      - name: Install real DeepSeek Harness
        shell: bash
        run: |
          set -euo pipefail
          npm install -g @deepseek-ai/dsh
          which dsh
          dsh --version | tee validation-artifacts/dsh-version.txt

      - name: Start local OpenAI-compatible model for DSH
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > validation-artifacts/ollama.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null && break
            sleep 2
          done
          ollama pull qwen3:4b | tee validation-artifacts/ollama-pull.log
          curl -fsS http://127.0.0.1:11434/v1/models | tee validation-artifacts/ollama-models.json

      - name: Install real CodeGraph Linux capability
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          mkdir -p validation-tools/codegraph
          curl -fL --retry 3 -o validation-tools/codegraph/codegraph-server-linux-x64 \
            https://github.com/codegraph-ai/CodeGraph/releases/download/v0.21.0/codegraph-server-linux-x64
          echo '15ef4a714bb163284a00dfdad88a244280659c4b240328c38953cfcd4bfbffba  validation-tools/codegraph/codegraph-server-linux-x64' | sha256sum -c -
          chmod +x validation-tools/codegraph/codegraph-server-linux-x64
          validation-tools/codegraph/codegraph-server-linux-x64 --help > validation-artifacts/codegraph-help.txt
          echo "PFC_CODEGRAPH_BIN=$GITHUB_WORKSPACE/validation-tools/codegraph/codegraph-server-linux-x64" >> "$GITHUB_ENV"

      - name: Build RC7 MCP plus local-model DSH patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation-artifacts/runtime-state/r1 validation-artifacts/dsh validation-artifacts/evidence
          export PFC_PYTHON="$(which python)"
          export PFC_GIT_BIN="$(which git)"
          export PFC_JAVA_BIN="$(which java)"
          export PFC_MAVEN_BIN="$(which mvn)"
          export PYTHONPATH="$GITHUB_WORKSPACE"
          python -m rc7_release.dsh --output validation-artifacts/dsh/rc7-mcp.patch.yml --home "$GITHUB_WORKSPACE" --python "$(which python)"
          cat > validation-artifacts/dsh/model.patch.yml <<'YAML'
          - id: llm-pi-ai
            config:
              providers:
                local-ollama:
                  apiKeyEnv: LOCAL_MODEL_API_KEY
                  api: openai-completions
                  baseURL: http://127.0.0.1:11434/v1
                  models:
                    - id: qwen3:4b
                      contextWindow: 32768
                      maxTokens: 4096
          - id: agent-default-model
            config:
              provider: local-ollama
              model: qwen3:4b
          YAML
          cat validation-artifacts/dsh/model.patch.yml validation-artifacts/dsh/rc7-mcp.patch.yml > validation-artifacts/dsh/agiletc.patch.yml
          cat validation-artifacts/dsh/agiletc.patch.yml

      - name: Prove DSH headless can call the real RC7 MCP tool
        id: dsh_smoke
        continue-on-error: true
        timeout-minutes: 6
        shell: bash
        run: |
          set +e
          export PYTHONPATH="$GITHUB_WORKSPACE"
          export PFC_PYTHON="$(which python)"
          export PFC_GIT_BIN="$(which git)"
          export PFC_JAVA_BIN="$(which java)"
          export PFC_MAVEN_BIN="$(which mvn)"
          timeout --signal=TERM --kill-after=15s 300s \
            dsh --profile headless --patch validation-artifacts/dsh/agiletc.patch.yml --json \
            '/no_think Call the mcp__pfc_aitest_rc7__runtime_status tool exactly once. A text-only answer is failure. After the tool result, return exactly {"status":"PASS","proof":"runtime_status_called"}.' \
            > validation-artifacts/dsh-smoke.jsonl 2> validation-artifacts/dsh-smoke.stderr
          rc=$?
          echo "$rc" > validation-artifacts/dsh-smoke.exit
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('validation-artifacts/dsh-smoke.jsonl')
          events=[]
          for line in path.read_text(encoding='utf-8', errors='replace').splitlines():
              try:
                  value=json.loads(line)
              except Exception:
                  continue
              if isinstance(value, dict):
                  events.append(value)
          calls=[e for e in events if str(e.get('type','')).lower() == 'tool_call']
          results=[e for e in events if str(e.get('type','')).lower() == 'tool_result']
          matching=[e for e in calls if 'runtime_status' in json.dumps(e, ensure_ascii=False)]
          proof={
              'event_count': len(events),
              'tool_call_count': len(calls),
              'tool_result_count': len(results),
              'runtime_status_call_count': len(matching),
              'status': 'PASS' if matching and results else 'FAIL',
          }
          Path('validation-artifacts/dsh-smoke-proof.json').write_text(json.dumps(proof, indent=2)+'\n', encoding='utf-8')
          print(json.dumps(proof))
          raise SystemExit(0 if proof['status']=='PASS' else 3)
          PY
          proof_rc=$?
          if [[ "$rc" == "124" || "$rc" == "137" ]]; then
            echo 'DSH_SMOKE_TIMEOUT' | tee validation-artifacts/dsh-smoke.boundary
          else
            echo "DSH_SMOKE_EXIT=$rc PROOF_EXIT=$proof_rc" | tee validation-artifacts/dsh-smoke.boundary
          fi
          if [[ "$rc" -ne 0 ]]; then exit "$rc"; fi
          exit "$proof_rc"

      - name: Run RC7 digital employee against AgileTC
        id: rc7_fullflow
        continue-on-error: true
        timeout-minutes: 45
        shell: bash
        run: |
          set +e
          export PYTHONPATH="$GITHUB_WORKSPACE"
          export PFC_PYTHON="$(which python)"
          export PFC_GIT_BIN="$(which git)"
          export PFC_JAVA_BIN="$(which java)"
          export PFC_MAVEN_BIN="$(which mvn)"
          revision=$(cat validation-artifacts/agiletc-source-revision.txt)
          timeout --signal=TERM --kill-after=30s 2640s \
            python validation/agiletc_rc7_fullflow.py \
              --target target/AgileTC \
              --source-revision "$revision" \
              --dsh-bin "$(which dsh)" \
              --patch validation-artifacts/dsh/agiletc.patch.yml \
              --output-root validation-artifacts
          rc=$?
          echo "$rc" > validation-artifacts/rc7-fullflow.exit
          exit "$rc"

      - name: Print validation boundary
        if: always()
        shell: bash
        run: |
          echo '===== Maven ====='
          cat validation-artifacts/agiletc-maven-test.exit 2>/dev/null || true
          echo '===== DSH smoke ====='
          cat validation-artifacts/dsh-smoke.exit 2>/dev/null || true
          cat validation-artifacts/dsh-smoke.boundary 2>/dev/null || true
          cat validation-artifacts/dsh-smoke-proof.json 2>/dev/null || true
          echo '===== RC7 fullflow ====='
          cat validation-artifacts/rc7-fullflow.exit 2>/dev/null || true
          cat validation-artifacts/fullflow-summary.json 2>/dev/null || true

      - name: Upload durable AgileTC RC7 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agiletc-rc7-fullflow-${{ github.sha }}
          path: validation-artifacts
          if-no-files-found: error
          retention-days: 30

      - name: Enforce validation result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f validation-artifacts/fullflow-summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('validation-artifacts/fullflow-summary.json').read_text(encoding='utf-8'))
          print('FINAL_RC7_VALIDATION_STATUS=' + str(data.get('status')))
          print('BLOCKING_REASON=' + str(data.get('blocking_reason')))
          print('KNOWN_PRODUCT_GAPS=' + str(len(data.get('known_product_gaps', []))))
          raise SystemExit(0 if data.get('status') == 'PASS' else 2)
          PY
