name: AgileTC RC7 DSH Fullflow Validation

on:
  push:
    branches:
      - validation/agiletc-fullflow
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agiletc-rc7-fullflow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agiletc-fullflow:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: case_manager
        ports:
          - 3301:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      PFC_AITEST_STATE_DIR: ${{ github.workspace }}/validation-artifacts/runtime-state
      PFC_WORKSPACE: ${{ github.workspace }}/target/AgileTC
      LOCAL_MODEL_API_KEY: ollama-local
      OLLAMA_HOST: 127.0.0.1:11434

    steps:
      - name: Checkout RC7 validation branch
        uses: actions/checkout@v4

      - name: Checkout AgileTC target
        uses: actions/checkout@v4
        with:
          repository: didi/AgileTC
          ref: master
          path: target/AgileTC
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bootstrap validation harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation-artifacts
          python -m pip install --disable-pip-version-check pytest

      - name: RC7 external-input readiness regression
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_rc7_external_input_readiness.py

      - name: Set up Node for DSH
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 8 for AgileTC
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
          cache-dependency-path: target/AgileTC/case-server/pom.xml

      - name: Capture target source revision
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation-artifacts
          git -C target/AgileTC rev-parse HEAD | tee validation-artifacts/agiletc-source-revision.txt
          git -C target/AgileTC status --short | tee validation-artifacts/agiletc-git-status.txt
          git -C target/AgileTC log -1 --format=fuller | tee validation-artifacts/agiletc-source-commit.txt

      - name: Initialize real AgileTC MySQL schema
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq default-mysql-client
          for i in $(seq 1 30); do
            if mysqladmin ping -h127.0.0.1 -P3301 -uroot -proot --silent; then break; fi
            sleep 2
          done
          mysql -h127.0.0.1 -P3301 -uroot -proot -e 'CREATE DATABASE IF NOT EXISTS case_manager CHARACTER SET utf8mb4;'
          mysql -h127.0.0.1 -P3301 -uroot -proot case_manager < target/AgileTC/case-server/sql/case-server.sql
          mysql -h127.0.0.1 -P3301 -uroot -proot -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='case_manager';" | tee validation-artifacts/agiletc-db-table-count.txt

      - name: Run real AgileTC Maven test
        id: maven_test
        continue-on-error: true
        shell: bash
        run: |
          set +e
          cd target/AgileTC/case-server
          mvn -B -ntp test 2>&1 | tee ../../../validation-artifacts/agiletc-maven-test.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > ../../../validation-artifacts/agiletc-maven-test.exit
          exit "$rc"

      - name: Start AgileTC and probe real HTTP surface
        id: app_probe
        continue-on-error: true
        shell: bash
        timeout-minutes: 5
        run: |
          set +e
          cd target/AgileTC/case-server
          nohup mvn -B -ntp -DskipTests spring-boot:run > ../../../validation-artifacts/agiletc-app.log 2>&1 &
          echo $! > ../../../validation-artifacts/agiletc-app.pid
          cd ../../..
          rc=1
          : > validation-artifacts/agiletc-http-probe.txt
          for i in $(seq 1 90); do
            code=$(curl -k -sS -o validation-artifacts/agiletc-http-body.html -w '%{http_code}' http://127.0.0.1:8094/case/caseList/1 || true)
            printf 'attempt=%s http_code=%s\n' "$i" "$code" | tee -a validation-artifacts/agiletc-http-probe.txt
            if [[ "$code" =~ ^(200|301|302)$ ]]; then rc=0; break; fi
            sleep 2
          done
          exit "$rc"

      - name: Install real DeepSeek Harness
        shell: bash
        run: |
          set -euo pipefail
          npm install -g @deepseek-ai/dsh
          which dsh
          dsh --version | tee validation-artifacts/dsh-version.txt
          dsh --profile headless --help | tee validation-artifacts/dsh-headless-help.txt

      - name: Start local OpenAI-compatible model for DSH
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > validation-artifacts/ollama.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null && break
            sleep 2
          done
          ollama pull qwen3:1.7b | tee validation-artifacts/ollama-pull.log
          curl -fsS http://127.0.0.1:11434/v1/models | tee validation-artifacts/ollama-models.json

      - name: Install real CodeGraph Linux capability
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          mkdir -p validation-tools/codegraph
          curl -fL --retry 3 -o validation-tools/codegraph/codegraph-server-linux-x64 \
            https://github.com/codegraph-ai/CodeGraph/releases/download/v0.21.0/codegraph-server-linux-x64
          echo '15ef4a714bb163284a00dfdad88a244280659c4b240328c38953cfcd4bfbffba  validation-tools/codegraph/codegraph-server-linux-x64' | sha256sum -c -
          chmod +x validation-tools/codegraph/codegraph-server-linux-x64
          validation-tools/codegraph/codegraph-server-linux-x64 --help > validation-artifacts/codegraph-help.txt
          echo "PFC_CODEGRAPH_BIN=$GITHUB_WORKSPACE/validation-tools/codegraph/codegraph-server-linux-x64" >> "$GITHUB_ENV"

      - name: Build RC7 MCP plus local-model DSH patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation-artifacts/runtime-state/r1 validation-artifacts/dsh validation-artifacts/evidence
          export PFC_PYTHON="$(which python)"
          export PFC_GIT_BIN="$(which git)"
          export PFC_JAVA_BIN="$(which java)"
          export PFC_MAVEN_BIN="$(which mvn)"
          export PYTHONPATH="$GITHUB_WORKSPACE"
          python -m rc7_release.dsh --output validation-artifacts/dsh/rc7-mcp.patch.yml --home "$GITHUB_WORKSPACE" --python "$(which python)"
          cat > validation-artifacts/dsh/model.patch.yml <<'YAML'
          - id: llm-pi-ai
            config:
              providers:
                local-ollama:
                  apiKeyEnv: LOCAL_MODEL_API_KEY
                  api: openai-completions
                  baseURL: http://127.0.0.1:11434/v1
                  models:
                    - id: qwen3:1.7b
                      contextWindow: 32768
                      maxTokens: 4096
          - id: agent-default-model
            config:
              provider: local-ollama
              model: qwen3:1.7b
          YAML
          cat validation-artifacts/dsh/model.patch.yml validation-artifacts/dsh/rc7-mcp.patch.yml > validation-artifacts/dsh/agiletc.patch.yml
          cat validation-artifacts/dsh/agiletc.patch.yml

      - name: Prove DSH headless receives the positional task
        id: dsh_task_probe
        continue-on-error: true
        timeout-minutes: 4
        shell: bash
        run: |
          set +e
          export PYTHONPATH="$GITHUB_WORKSPACE"
          timeout --signal=TERM --kill-after=15s 210s \
            dsh --profile headless --patch validation-artifacts/dsh/agiletc.patch.yml --json \
            'Return exactly one JSON object and nothing else: {"status":"PASS","proof":"positional_task_received"}. Do not call any tool.' \
            2>&1 | tee validation-artifacts/dsh-task-probe.jsonl
          rc=${PIPESTATUS[0]}
          echo "$rc" > validation-artifacts/dsh-task-probe.exit
          python - <<'PY'
          import json
          from pathlib import Path
          from rc6_runtime.agent_runtime import DshHeadlessWorkerLauncher
          text=Path('validation-artifacts/dsh-task-probe.jsonl').read_text(encoding='utf-8', errors='replace')
          events=tuple(DshHeadlessWorkerLauncher._parse_json_lines(text))
          final=DshHeadlessWorkerLauncher._final_json(events)
          result={'process_exit': int(Path('validation-artifacts/dsh-task-probe.exit').read_text().strip()), 'final_json': final}
          ok=(result['process_exit']==0 and isinstance(final, dict) and final.get('status')=='PASS' and final.get('proof')=='positional_task_received')
          result['status']='PASS' if ok else 'FAIL'
          Path('validation-artifacts/dsh-task-probe-result.json').write_text(json.dumps(result, indent=2, sort_keys=True)+'\n')
          print(json.dumps(result, sort_keys=True))
          raise SystemExit(0 if ok else 2)
          PY

      - name: Prove DSH headless can call the real RC7 MCP tool
        id: dsh_smoke
        if: steps.dsh_task_probe.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 7
        shell: bash
        run: |
          set +e
          export PYTHONPATH="$GITHUB_WORKSPACE"
          export PFC_PYTHON="$(which python)"
          export PFC_GIT_BIN="$(which git)"
          export PFC_JAVA_BIN="$(which java)"
          export PFC_MAVEN_BIN="$(which mvn)"
          timeout --signal=TERM --kill-after=15s 390s \
            dsh --profile headless --patch validation-artifacts/dsh/agiletc.patch.yml --json \
            'You have a concrete task now: call the pfc_aitest_rc7 runtime_status tool exactly once. You MUST actually invoke the tool; a text-only answer is failure. After the tool result, return exactly one JSON object: {"status":"PASS","proof":"runtime_status_called"}.' \
            2>&1 | tee validation-artifacts/dsh-smoke.jsonl
          rc=${PIPESTATUS[0]}
          echo "$rc" > validation-artifacts/dsh-smoke.exit
          exit "$rc"

      - name: Validate DSH RC7 MCP smoke semantics
        id: dsh_smoke_semantics
        if: steps.dsh_task_probe.outcome == 'success' && steps.dsh_smoke.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE"
          python validation/validate_dsh_smoke.py \
            --input validation-artifacts/dsh-smoke.jsonl \
            --output validation-artifacts/dsh-smoke-result.json

      - name: Run RC7 digital employee against AgileTC
        id: rc7_fullflow
        if: steps.dsh_task_probe.outcome == 'success' && steps.dsh_smoke.outcome == 'success' && steps.dsh_smoke_semantics.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 45
        shell: bash
        run: |
          set +e
          export PYTHONPATH="$GITHUB_WORKSPACE"
          export PFC_PYTHON="$(which python)"
          export PFC_GIT_BIN="$(which git)"
          export PFC_JAVA_BIN="$(which java)"
          export PFC_MAVEN_BIN="$(which mvn)"
          revision=$(cat validation-artifacts/agiletc-source-revision.txt)
          timeout --signal=TERM --kill-after=30s 2640s \
            python validation/agiletc_rc7_fullflow.py \
              --target target/AgileTC \
              --source-revision "$revision" \
              --dsh-bin "$(which dsh)" \
              --patch validation-artifacts/dsh/agiletc.patch.yml \
              --output-root validation-artifacts
          rc=$?
          echo "$rc" > validation-artifacts/rc7-fullflow.exit
          exit "$rc"

      - name: Persist pre-fullflow DSH boundary
        if: always() && steps.rc7_fullflow.outcome == 'skipped'
        shell: bash
        run: |
          mkdir -p validation-artifacts
          python - <<'PY'
          import json
          from pathlib import Path
          reason='DSH_TASK_PROBE_FAILED'
          p=Path('validation-artifacts/dsh-task-probe-result.json')
          if p.exists() and json.loads(p.read_text()).get('status')=='PASS':
              reason='DSH_RC7_MCP_SMOKE_FAILED'
          s=Path('validation-artifacts/dsh-smoke-result.json')
          if s.exists() and json.loads(s.read_text()).get('status')=='FAIL':
              reason='DSH_RC7_MCP_TOOL_CALL_MISSING_OR_FINAL_CONTRACT_FAILED'
          payload={'schema_version':'pfc.aitest.rc7.agiletc-fullflow-validation.v1','status':'HOLD','blocking_reason':reason,'phase':'DSH_BOUNDARY'}
          Path('validation-artifacts/fullflow-summary.json').write_text(json.dumps(payload, indent=2, sort_keys=True)+'\n')
          print(json.dumps(payload, sort_keys=True))
          PY

      - name: Print validation boundary
        if: always()
        shell: bash
        run: |
          echo '===== Maven ====='
          cat validation-artifacts/agiletc-maven-test.exit 2>/dev/null || true
          echo '===== DSH task probe ====='
          cat validation-artifacts/dsh-task-probe-result.json 2>/dev/null || true
          echo '===== DSH smoke ====='
          cat validation-artifacts/dsh-smoke-result.json 2>/dev/null || true
          echo '===== RC7 fullflow ====='
          cat validation-artifacts/rc7-fullflow.exit 2>/dev/null || true
          cat validation-artifacts/fullflow-summary.json 2>/dev/null || true

      - name: Upload durable AgileTC RC7 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agiletc-rc7-fullflow-${{ github.sha }}
          path: validation-artifacts
          if-no-files-found: error
          retention-days: 30

      - name: Enforce validation result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f validation-artifacts/fullflow-summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('validation-artifacts/fullflow-summary.json').read_text(encoding='utf-8'))
          print('FINAL_RC7_VALIDATION_STATUS=' + str(data.get('status')))
          print('BLOCKING_REASON=' + str(data.get('blocking_reason')))
          raise SystemExit(0 if data.get('status') == 'PASS' else 2)
          PY
