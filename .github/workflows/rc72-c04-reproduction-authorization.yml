name: RC7.2 C04 N9 Reproduction Authorization Without Replay

on:
  push:
    branches: [work/rc7.2-c04-reproduction-approval-request]
    paths:
      - 'rc7_runtime/rc72_n9_reproduction_authorization.py'
      - 'rc7_runtime/rc72_n8_product_recovery.py'
      - 'tests/test_rc72_n9_reproduction_authorization.py'
      - 'tests/test_rc72_n9_captain_signed_dsh_bridge.py'
      - '.github/workflows/rc72-c04-reproduction-authorization.yml'
  pull_request:
    branches: [work/rc7.2-abcd-v5-bsk-mobile-qualification]
    paths:
      - 'rc7_runtime/rc72_n9_reproduction_authorization.py'
      - 'rc7_runtime/rc72_n8_product_recovery.py'
      - 'tests/test_rc72_n9_reproduction_authorization.py'
      - 'tests/test_rc72_n9_captain_signed_dsh_bridge.py'
      - '.github/workflows/rc72-c04-reproduction-authorization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-n9-reproduction-request:
    name: c04-reproduction-request-${{ matrix.os }}-py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
        python: ['3.8', '3.11']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Approved repository harness
        run: python -m rc7_release.rc72_pytest_bootstrap --requirements rc7_release/requirements-qualification.txt --timeout-seconds 120
      - name: Compile native C04 product gate and tests
        run: >-
          python -m py_compile
          rc7_runtime/rc72_n9_reproduction_authorization.py
          rc7_runtime/rc72_n8_product_recovery.py
          tests/test_rc72_n9_reproduction_authorization.py
          tests/test_rc72_n9_captain_signed_dsh_bridge.py
      - name: Actual N8-N9 product cause, negative, cold R1 and inherited no-replay
        run: >-
          python -m pytest -q
          tests/test_rc72_n9_reproduction_authorization.py
          tests/test_rc72_n9_captain_signed_dsh_bridge.py
          tests/test_rc72_n9_professional_dsh_contract.py
          tests/test_rc72_n9_professional_dsh_real_route.py
          tests/test_rc72_n9_captain_qualification.py
          tests/test_rc72_n9_professional_lineage.py
          --junitxml=rc72-c04-reproduction-request.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c04-reproduction-request-${{ matrix.os }}-${{ matrix.python }}-${{ github.sha }}
          path: rc72-c04-reproduction-request.xml
          retention-days: 14
          if-no-files-found: warn
