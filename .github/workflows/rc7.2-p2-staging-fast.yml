name: RC7.2 P2 C04 and C12 Fail-Closed Source Regression (No ZIP)
on:
  push:
    branches:
      - work/rc7.2-p2-stage-20261108
permissions:
  contents: read
concurrency:
  group: rc72-p2-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  p2-source-contracts:
    name: p2-${{ matrix.os }}-python-${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
        python: ['3.8', '3.11']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile P2 source and security cases
        run: >-
          python -m py_compile
          rc7_runtime/rc72_release_driver.py
          rc7_release/rc72_dsh_main_payload.py
          tests/test_rc72_dsh_main_payload.py
          tests/test_rc72_p2_n9_fail_closed_route.py
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Verify full C04 negative/rerun and C12 source boundaries
        run: >-
          python -m pytest -q
          tests/test_rc72_p2_n9_fail_closed_route.py
          tests/test_rc72_dsh_main_payload.py
          tests/test_rc72_n9_professional_disposition_gate.py
          tests/test_rc72_n9_reproduction_resolution_audit.py
          tests/test_rc72_p1_product_entry_non_bypass.py
          tests/test_rc72_qa_offline_payload.py
          tests/test_rc72_release_driver.py
          tests/test_rc72_c12_source_contract.py
      - name: Ban source-stage ZIP construction
        shell: bash
        run: |
          test ! -d dist/PFC-AITest-DSH-Turnkey-RC7.2-BANK-WIN10
          echo "P2_SOURCE_NO_OFFLINE_ZIP"
