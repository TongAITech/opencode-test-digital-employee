name: RC7.1 Case Truth Resolution Focused Gate

on:
  push:
    branches:
      - work/rc7.1-minimal-hardening
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-case-truth-resolution:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Case truth resolution durable blocker focused test
        run: >-
          python -m pytest -q
          tests/test_rc7_1_bank_execution_case_truth_blocker.py::test_case_truth_resolution_failure_becomes_durable_block_before_case_execution
