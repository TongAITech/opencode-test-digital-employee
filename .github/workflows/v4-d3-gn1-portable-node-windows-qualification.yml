name: V4 D3-GN1 portable Node Windows qualification

on:
  push:
    branches:
      - work/v1.13.0-recovery-turnkey-validation
    paths:
      - ".github/workflows/v4-d3-gn1-portable-node-windows-qualification.yml"
      - "runtime-lock.json"
      - "docs/reviews/v4/D3_GN1_GITNEXUS_CANDIDATE_RECON.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-portable-node:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify exact source identity
        shell: pwsh
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne "${{ github.sha }}") { throw "SOURCE_HEAD_MISMATCH:$head" }
          if (git status --porcelain) { throw "SOURCE_NOT_CLEAN" }
          "SOURCE_HEAD=$head" | Write-Host

      - name: Acquire pinned portable Node 22.18.0
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "d3-gn1-node"
          $zip = Join-Path $root "node-v22.18.0-win-x64.zip"
          $extract = Join-Path $root "extract"
          New-Item -ItemType Directory -Force -Path $root,$extract | Out-Null
          curl.exe -fL --retry 3 --retry-delay 2 -o $zip https://nodejs.org/download/release/v22.18.0/node-v22.18.0-win-x64.zip
          if ($LASTEXITCODE -ne 0) { throw "NODE_DOWNLOAD_FAILED" }

          $sha = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          $expected = "c95d8a7e1c99e669cc08c9f1176e068c1f50847c37908fcb8c35b62482366511"
          if ($sha -ne $expected) { throw "NODE_ARCHIVE_SHA_MISMATCH:expected=$expected actual=$sha" }

          Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force
          $home = Join-Path $extract "node-v22.18.0-win-x64"
          $node = Join-Path $home "node.exe"
          $npm = Join-Path $home "npm.cmd"
          if (-not (Test-Path $node)) { throw "PORTABLE_NODE_EXE_MISSING" }
          if (-not (Test-Path $npm)) { throw "PORTABLE_NPM_MISSING" }

          "D3_GN1_NODE_HOME=$home" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "D3_GN1_NODE_EXE=$node" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "D3_GN1_NPM_CMD=$npm" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "D3_GN1_NODE_ARCHIVE_SHA=$sha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prove portable Node and npm without host Node authority
        shell: pwsh
        run: |
          $nodeVersion = (& $env:D3_GN1_NODE_EXE --version 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $nodeVersion -ne "v22.18.0") {
            throw "PORTABLE_NODE_VERSION_MISMATCH:$nodeVersion"
          }
          $execPath = (& $env:D3_GN1_NODE_EXE -p "process.execPath" 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "PORTABLE_NODE_EXECPATH_FAILED" }
          if ([IO.Path]::GetFullPath($execPath) -ne [IO.Path]::GetFullPath($env:D3_GN1_NODE_EXE)) {
            throw "HOST_NODE_LEAK:execPath=$execPath expected=$env:D3_GN1_NODE_EXE"
          }
          $npmVersion = (& $env:D3_GN1_NPM_CMD --version 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $npmVersion -ne "10.9.3") {
            throw "PORTABLE_NPM_VERSION_MISMATCH:$npmVersion"
          }
          $probe = & $env:D3_GN1_NODE_EXE -e "console.log(JSON.stringify({node:process.version,execPath:process.execPath,platform:process.platform,arch:process.arch}))"
          if ($LASTEXITCODE -ne 0) { throw "PORTABLE_NODE_PROBE_FAILED" }
          $probe | Write-Host

          $result = [ordered]@{
            schema_version = "aitest.v4.d3-gn1.portable-node-windows.v1"
            status = "PASS"
            source_head = "${{ github.sha }}"
            node_version = $nodeVersion
            npm_version = $npmVersion
            node_exec_path = $execPath
            node_archive_sha256 = $env:D3_GN1_NODE_ARCHIVE_SHA
            node_archive = "node-v22.18.0-win-x64.zip"
            node_source = "https://nodejs.org/download/release/v22.18.0/"
            host_node_is_runtime_authority = $false
            gitnexus_execution = "NOT_EXECUTED_LICENSE_AUTHORIZATION_REQUIRED"
            gitnexus_candidate_version = "1.6.12"
          }
          $result | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath D3_GN1_PORTABLE_NODE_WINDOWS.json -Encoding utf8

      - name: Upload D3-GN1 evidence
        uses: actions/upload-artifact@v4
        with:
          name: v4-d3-gn1-portable-node-windows-${{ github.sha }}
          path: D3_GN1_PORTABLE_NODE_WINDOWS.json
          if-no-files-found: error
          retention-days: 30
