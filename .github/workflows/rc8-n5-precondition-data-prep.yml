name: RC8 N5 Precondition Data Prep Worker

on:
  push:
    branches: [work/rc8]
    paths:
      - 'rc8_node/precondition_data_prep_worker.py'
      - 'tests/test_rc8_n5_precondition_data_prep_worker.py'
      - '.github/workflows/rc8-n5-precondition-data-prep.yml'
  workflow_dispatch:

jobs:
  n5-precondition-data-prep:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Install targeted test dependency
        run: python -m pip install pytest
      - name: Compile N5 worker
        run: python -m py_compile rc8_node/precondition_data_prep_worker.py
      - name: Run N5 targeted contract
        run: python -m pytest -q tests/test_rc8_n5_precondition_data_prep_worker.py
