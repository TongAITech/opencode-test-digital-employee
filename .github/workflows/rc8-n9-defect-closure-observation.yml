name: RC8 N9 Defect Closure Observation

on:
  push:
    branches: [work/rc8]
    paths:
      - 'rc8_node/defect_closure_observation_worker.py'
      - 'tests/test_rc8_n9_defect_closure_observation_worker.py'
      - '.github/workflows/rc8-n9-defect-closure-observation.yml'
  workflow_dispatch:

jobs:
  n9-defect-closure-observation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Compile N9 observation contract
        run: python -m py_compile rc8_node/defect_closure_observation_worker.py
      - name: Run N9 targeted tests
        run: python -m pytest -q tests/test_rc8_n9_defect_closure_observation_worker.py
