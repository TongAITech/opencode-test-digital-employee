name: RC6 Wave 1 Runtime Kernel

on:
  push:
    branches:
      - work/rc6-runtime-reconstruction
  pull_request:
    paths:
      - 'rc6_runtime/**'
      - 'tests/test_runtime_kernel.py'
      - 'docs/RC6_WAVE1_QUALIFICATION.md'
      - '.github/workflows/rc6-wave1.yml'

jobs:
  wave1-runtime-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Install inherited RC6/RC7 test dependencies
        run: python -m pip install --disable-pip-version-check -r rc7_release/requirements-qualification.txt
      - name: Run RC6 Wave 1 qualification
        run: python -m unittest discover -s tests -v
