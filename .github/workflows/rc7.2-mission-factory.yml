name: RC7.2 Native Mission Factory Qualification

on:
  push:
    branches: [work/rc7.2-mission-factory]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owned-composition:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Bootstrap pinned engineering test runner
        run: python -m rc7_release.rc72_pytest_bootstrap --requirements rc7_release/requirements-qualification.txt --timeout-seconds 120
      - name: Validate owned factory, CLI, admission and original denominator
        shell: python
        run: |
          import os, sys
          sys.path.insert(0, os.getcwd())
          from rc7_release.rc72_bounded_pytest import run_files
          files = [
              'tests/test_rc72_mission_factory.py',
              'tests/test_rc72_code_tool_binding.py',
              'tests/test_rc72_controller_secret_paths.py',
              'tests/test_rc72_configured_mission.py',
              'tests/test_rc72_tool_environment.py',
              'tests/test_rc72_mission_bindings.py',
              'tests/test_rc72_q2b_clean_runtime_contract.py',
              'tests/test_rc72_release_driver.py',
              'tests/test_rc7_dsh_proof.py',
              'tests/test_rc7_dsh_code_evaluator.py',
              'tests/test_rc72_release_driver_n10.py',
          ]
          raise SystemExit(run_files(files, timeout_seconds=180,
              file_timeouts={'tests/test_rc72_release_driver_n10.py': 900},
              junit_dir='mission-factory-evidence'))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc72-mission-factory-${{ matrix.os }}-${{ github.sha }}
          path: mission-factory-evidence/*.xml
          retention-days: 30

  configured-mirror-cli:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      RC72_PIP_MIRROR_COMPONENT: '1'
      RC72_PIP_MIRROR_EVIDENCE: '${{ github.workspace }}/configured-mirror-public'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bootstrap pinned engineering test runner
        run: python -m rc7_release.rc72_pytest_bootstrap --requirements rc7_release/requirements-qualification.txt --timeout-seconds 120
      - name: Actual package Python mirror install and cold native CLI re-entry
        run: python -m pytest -q tests/test_rc72_bank_pc_pip_mirror_windows.py --junitxml=configured-mirror-public/windows-native-cli.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc72-configured-mirror-cli-${{ github.sha }}
          path: configured-mirror-public/*
          retention-days: 30

  windows-38-compatibility:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Bootstrap pinned engineering test runner
        run: python -m rc7_release.rc72_pytest_bootstrap --requirements rc7_release/requirements-qualification.txt --timeout-seconds 120
      - name: Windows reserved config paths remain explicit refusals
        run: python -m pytest -q tests/test_rc72_bank_pc_pip_mirror.py --junitxml=compatibility-evidence/pip-config-windows-38.xml
      - name: Diagnose complete actual Libra workload with a finite budget
        run: >-
          python -m rc7_release.rc72_bounded_pytest
          --pattern "tests/test_rc72_libra_measurement.py"
          --timeout-seconds 360
          --junit-dir compatibility-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc72-windows-38-compatibility-${{ github.sha }}
          path: compatibility-evidence/*.xml
          retention-days: 30
