name: RC7 Closed-loop Core

on:
  push:
    branches:
      - work/rc7-closed-loop-runtime
    paths:
      - 'rc7_runtime/**'
      - 'rc7_release/**'
      - 'rc7_admin/**'
      - 'packaging/rc7/**'
      - 'tests/test_rc7_*.py'
      - '.github/workflows/rc7-core.yml'
  workflow_dispatch:

jobs:
  core:
    name: core-python-${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install qualification dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile RC7 runtime, release qualification and admin platform
        run: python -m compileall -q rc7_runtime rc7_release rc7_admin
      - name: Import inherited RC6 runtime and RC7 modules
        run: python -c "import rc6_runtime; import rc6_runtime.truth; import rc7_admin; import rc7_admin.server; import rc7_release.mcp_server; import rc7_release.qualification; import rc7_release.code_qualification_strict; import rc7_release.test_design_qualification_strict; import rc7_release.script_qualification_strict; import rc7_release.execution_environment; import rc7_release.execution_qualification_strict; import rc7_release.real_mission_qualification; import rc7_release.delivery_qualification; import rc7_release.final_qualification; import rc7_release.package"
      - name: Validate RC7 shell qualification and admin entrypoints
        run: |
          bash -n packaging/rc7/QUALIFY-DSH-REQUIREMENT.sh
          bash -n packaging/rc7/QUALIFY-DSH-CODE.sh
          bash -n packaging/rc7/QUALIFY-DSH-TEST-DESIGN.sh
          bash -n packaging/rc7/QUALIFY-DSH-SCRIPT.sh
          bash -n packaging/rc7/QUALIFY-EXECUTION.sh
          bash -n packaging/rc7/QUALIFY-FINAL.sh
          bash -n packaging/rc7/QUALIFY-BANK-FINAL.sh
          bash -n packaging/rc7/START-RC7-ADMIN.sh
          grep -q 'rc7_release.code_qualification_strict' packaging/rc7/QUALIFY-DSH-CODE.sh
          grep -q 'rc7_release.test_design_qualification_strict' packaging/rc7/QUALIFY-DSH-TEST-DESIGN.sh
          grep -q 'PFC_RC7_REQUIREMENT_RESULT' packaging/rc7/QUALIFY-DSH-TEST-DESIGN.sh
          grep -q 'PFC_RC7_CODE_RESULT' packaging/rc7/QUALIFY-DSH-TEST-DESIGN.sh
          grep -q 'rc7_release.script_qualification_strict' packaging/rc7/QUALIFY-DSH-SCRIPT.sh
          grep -q 'PFC_RC7_TEST_DESIGN_RESULT' packaging/rc7/QUALIFY-DSH-SCRIPT.sh
          grep -q 'PFC_RC7_SCRIPT_TC_ID' packaging/rc7/QUALIFY-DSH-SCRIPT.sh
          grep -q 'rc7_release.execution_qualification_strict' packaging/rc7/QUALIFY-EXECUTION.sh
          grep -q 'PFC_RC7_SCRIPT_RESULT' packaging/rc7/QUALIFY-EXECUTION.sh
          grep -q 'PFC_RC7_EXECUTION_ENV_MODULE' packaging/rc7/QUALIFY-EXECUTION.sh
          grep -q 'PFC_RC7_EXECUTION_TARGET_ID' packaging/rc7/QUALIFY-EXECUTION.sh
          grep -q 'rc7-execution-result.json' packaging/rc7/QUALIFY-EXECUTION.sh
          grep -q 'rc7_release.real_mission_qualification' packaging/rc7/QUALIFY-FINAL.sh
          grep -q 'rc7_release.final_qualification' packaging/rc7/QUALIFY-FINAL.sh
          grep -q 'PFC_RC7_R1_PATH' packaging/rc7/QUALIFY-FINAL.sh
          grep -q 'PFC_RC7_MISSION_ID' packaging/rc7/QUALIFY-FINAL.sh
          grep -q 'PFC_RC7_REAL_MISSION_EVIDENCE' packaging/rc7/QUALIFY-FINAL.sh
          grep -q 'PFC_RC7_DELIVERY_EVIDENCE' packaging/rc7/QUALIFY-FINAL.sh
          grep -q 'PFC_RC7_R1_PATH' packaging/rc7/QUALIFY-BANK-FINAL.sh
          grep -q 'PFC_RC7_MISSION_ID' packaging/rc7/QUALIFY-BANK-FINAL.sh
          grep -q 'PFC_RC7_ENGINEERING_EVIDENCE' packaging/rc7/QUALIFY-BANK-FINAL.sh
          grep -q 'PFC_RC7_ADMIN_EVIDENCE' packaging/rc7/QUALIFY-BANK-FINAL.sh
          grep -q 'PFC_RC7_DELIVERY_EVIDENCE' packaging/rc7/QUALIFY-BANK-FINAL.sh
          grep -q 'PFC_RC7_REQUIRE_FINAL_PASS' packaging/rc7/QUALIFY-BANK-FINAL.sh
          grep -q 'QUALIFY-FINAL.sh' packaging/rc7/QUALIFY-BANK-FINAL.sh
          grep -q 'rc7_admin' packaging/rc7/START-RC7-ADMIN.sh
      - name: Run RC7 closed-loop core tests
        run: python -m pytest -q tests/test_rc7_*.py

  packaging-windows:
    name: packaging-windows-python-3.8
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Parse RC7 Windows qualification and admin entrypoints
        shell: pwsh
        run: |
          $requirement = Get-Content -Raw 'packaging/rc7/QUALIFY-DSH-REQUIREMENT.cmd'
          if ($requirement -notmatch 'rc7_release\.qualification') { throw 'RC7 Requirement qualification module invocation missing' }
          if ($requirement -notmatch 'rc7-dsh-bridge-result\.json') { throw 'RC7 Requirement qualification result contract missing' }
          if ($requirement -match 'DSH_ARGS=--dsh-bin') { throw 'Unsafe concatenated DSH path quoting regression' }
          $code = Get-Content -Raw 'packaging/rc7/QUALIFY-DSH-CODE.cmd'
          if ($code -notmatch 'rc7_release\.code_qualification_strict') { throw 'RC7 strict Code qualification module invocation missing' }
          if ($code -notmatch 'rc7-dsh-code-result\.json') { throw 'RC7 Code qualification result contract missing' }
          if ($code -notmatch 'PFC_RC7_CODEGRAPH_QUERY_ARGS_JSON') { throw 'RC7 CodeGraph query contract missing' }
          $design = Get-Content -Raw 'packaging/rc7/QUALIFY-DSH-TEST-DESIGN.cmd'
          if ($design -notmatch 'rc7_release\.test_design_qualification_strict') { throw 'RC7 strict Test Design qualification module invocation missing' }
          if ($design -notmatch 'rc7-dsh-test-design-result\.json') { throw 'RC7 Test Design result contract missing' }
          if ($design -notmatch 'PFC_RC7_REQUIREMENT_RESULT') { throw 'RC7 Test Design upstream Requirement result contract missing' }
          if ($design -notmatch 'PFC_RC7_CODE_RESULT') { throw 'RC7 Test Design upstream Code result contract missing' }
          $script = Get-Content -Raw 'packaging/rc7/QUALIFY-DSH-SCRIPT.cmd'
          if ($script -notmatch 'rc7_release\.script_qualification_strict') { throw 'RC7 strict Script qualification module invocation missing' }
          if ($script -notmatch 'rc7-dsh-script-result\.json') { throw 'RC7 Script qualification result contract missing' }
          if ($script -notmatch 'PFC_RC7_TEST_DESIGN_RESULT') { throw 'RC7 Script upstream Test Design result contract missing' }
          if ($script -notmatch 'PFC_RC7_SCRIPT_TC_ID') { throw 'RC7 Script TestCase identity contract missing' }
          $execution = Get-Content -Raw 'packaging/rc7/QUALIFY-EXECUTION.cmd'
          if ($execution -notmatch 'rc7_release\.execution_qualification_strict') { throw 'RC7 strict Execution qualification module invocation missing' }
          if ($execution -notmatch 'rc7-execution-result\.json') { throw 'RC7 Execution result contract missing' }
          if ($execution -notmatch 'PFC_RC7_SCRIPT_RESULT') { throw 'RC7 Execution upstream Script result contract missing' }
          if ($execution -notmatch 'PFC_RC7_EXECUTION_ENV_MODULE') { throw 'RC7 Execution environment adapter contract missing' }
          if ($execution -notmatch 'PFC_RC7_EXECUTION_TARGET_ID') { throw 'RC7 Execution target identity contract missing' }
          $final = Get-Content -Raw 'packaging/rc7/QUALIFY-FINAL.cmd'
          if ($final -notmatch 'rc7_release\.real_mission_qualification') { throw 'RC7 real Mission qualification invocation missing' }
          if ($final -notmatch 'rc7_release\.final_qualification') { throw 'RC7 final qualification module invocation missing' }
          if ($final -notmatch 'PFC_RC7_R1_PATH') { throw 'RC7 final R1 input contract missing' }
          if ($final -notmatch 'PFC_RC7_MISSION_ID') { throw 'RC7 final Mission identity contract missing' }
          if ($final -notmatch 'PFC_RC7_REAL_MISSION_EVIDENCE') { throw 'RC7 real Mission evidence contract missing' }
          if ($final -notmatch 'PFC_RC7_DELIVERY_EVIDENCE') { throw 'RC7 delivery evidence contract missing' }
          $bankFinal = Get-Content -Raw 'packaging/rc7/QUALIFY-BANK-FINAL.cmd'
          if ($bankFinal -notmatch 'PFC_RC7_R1_PATH') { throw 'RC7 bank final R1 input missing' }
          if ($bankFinal -notmatch 'PFC_RC7_MISSION_ID') { throw 'RC7 bank final Mission identity missing' }
          if ($bankFinal -notmatch 'PFC_RC7_ENGINEERING_EVIDENCE') { throw 'RC7 bank final engineering evidence binding missing' }
          if ($bankFinal -notmatch 'PFC_RC7_ADMIN_EVIDENCE') { throw 'RC7 bank final admin evidence binding missing' }
          if ($bankFinal -notmatch 'PFC_RC7_DELIVERY_EVIDENCE') { throw 'RC7 bank final delivery evidence binding missing' }
          if ($bankFinal -notmatch 'PFC_RC7_REQUIRE_FINAL_PASS') { throw 'RC7 bank final fail-closed requirement missing' }
          if ($bankFinal -notmatch 'QUALIFY-FINAL\.cmd') { throw 'RC7 bank final final-gate delegation missing' }
          $admin = Get-Content -Raw 'packaging/rc7/START-RC7-ADMIN.cmd'
          if ($admin -notmatch 'rc7_admin') { throw 'RC7 admin module invocation missing' }
          if ($admin -notmatch 'PFC_RC7_R1_PATH') { throw 'RC7 admin R1 truth path contract missing' }
      - name: Python 3.8 imports RC7 qualification, packaging, MCP and admin modules
        run: python -c "import rc7_admin; import rc7_admin.server; import rc7_release.qualification; import rc7_release.code_qualification_strict; import rc7_release.test_design_qualification_strict; import rc7_release.script_qualification_strict; import rc7_release.execution_environment; import rc7_release.execution_qualification_strict; import rc7_release.real_mission_qualification; import rc7_release.delivery_qualification; import rc7_release.final_qualification; import rc7_release.package; import rc7_release.mcp_server"

  delivery-candidate:
    name: turnkey-windows-candidate
    needs: [core, packaging-windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Build immutable RC7 turnkey candidate
        shell: pwsh
        run: python -m rc7_release.package build --repo-root . --output dist --source-commit $env:GITHUB_SHA
      - name: Verify built RC7 package
        shell: pwsh
        run: python -m rc7_release.package verify --package-root dist/PFC-AITest-DSH-Turnkey-RC7-BANK-WIN10
      - name: Create current-head engineering and admin evidence
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force 'dist/qualification' | Out-Null
          @{
            gate = 'ENGINEERING_PASS'
            status = 'PASS'
            source_commit = $env:GITHUB_SHA
            evidence_refs = @('github-actions:RC7 Closed-loop Core:core', 'github-actions:RC7 Closed-loop Core:packaging-windows')
          } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 'dist/qualification/engineering.json'
          @{
            gate = 'ADMIN_PLATFORM_PASS'
            status = 'PASS'
            source_commit = $env:GITHUB_SHA
            evidence_refs = @('tests/test_rc7_admin.py', 'github-actions:RC7 Closed-loop Core:core')
          } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 'dist/qualification/admin.json'
      - name: Prove final gate fails closed before field and delivery qualification
        shell: pwsh
        run: |
          python -m rc7_release.final_qualification --source-commit $env:GITHUB_SHA --engineering dist/qualification/engineering.json --admin dist/qualification/admin.json --output dist/qualification/final-before-delivery.json
          $q = Get-Content 'dist/qualification/final-before-delivery.json' | ConvertFrom-Json
          if ($q.status -ne 'HOLD') { throw 'CI candidate must not become final PASS without real Mission and delivery evidence' }
          if ($q.gates.ENGINEERING_PASS -ne 'PASS') { throw 'Engineering gate should be PASS' }
          if ($q.gates.ADMIN_PLATFORM_PASS -ne 'PASS') { throw 'Admin gate should be PASS' }
          if ($q.gates.REAL_MISSION_PASS -ne 'HOLD') { throw 'Real Mission gate must remain HOLD' }
          if ($q.gates.DELIVERY_PASS -ne 'HOLD') { throw 'Delivery gate must remain HOLD before clean qualification' }
      - name: Qualify clean Windows turnkey delivery
        shell: pwsh
        run: |
          $zip = Get-ChildItem 'dist/PFC-AITest-DSH-Turnkey-RC7-BANK-WIN10-*.zip' | Select-Object -First 1
          if (-not $zip) { throw 'RC7 ZIP missing' }
          python -m rc7_release.delivery_qualification --zip $zip.FullName --source-commit $env:GITHUB_SHA --output dist/qualification/delivery.json --require-pass
          $delivery = Get-Content 'dist/qualification/delivery.json' | ConvertFrom-Json
          if ($delivery.status -ne 'PASS') { throw 'RC7 delivery qualification did not PASS' }
          if ($delivery.clean_windows_unpack -ne 'PASS') { throw 'Clean Windows unpack not proven' }
          if ($delivery.package_verify -ne 'PASS') { throw 'Package-local verify not proven' }
          if ($delivery.package_entrypoint_verify -ne 'PASS') { throw 'Package final entrypoint not proven' }
          if ($delivery.admin_startup_verify -ne 'PASS') { throw 'Package admin startup not proven' }
          if ($delivery.admin_health.truth -ne 'R1_EVENT_STREAM') { throw 'Admin health is not R1-backed' }
      - name: Prove only real bank Mission gate remains
        shell: pwsh
        run: |
          python -m rc7_release.final_qualification --source-commit $env:GITHUB_SHA --engineering dist/qualification/engineering.json --admin dist/qualification/admin.json --delivery dist/qualification/delivery.json --output dist/qualification/final-candidate.json
          $q = Get-Content 'dist/qualification/final-candidate.json' | ConvertFrom-Json
          if ($q.status -ne 'HOLD') { throw 'Engineering candidate must stay HOLD without real bank Mission evidence' }
          if ($q.gates.ENGINEERING_PASS -ne 'PASS') { throw 'Engineering gate should be PASS' }
          if ($q.gates.ADMIN_PLATFORM_PASS -ne 'PASS') { throw 'Admin gate should be PASS' }
          if ($q.gates.DELIVERY_PASS -ne 'PASS') { throw 'Delivery gate should be PASS after clean Windows qualification' }
          if ($q.gates.REAL_MISSION_PASS -ne 'HOLD') { throw 'Real bank Mission must be the only remaining HOLD gate' }
          if ($q.blocking_reasons.Count -ne 1) { throw 'Unexpected final candidate blocker count' }
          if ($q.blocking_reasons[0] -ne 'REAL_MISSION_PASS:EVIDENCE_MISSING') { throw "Unexpected final blocker: $($q.blocking_reasons[0])" }
      - name: Upload RC7 turnkey delivery-qualified candidate
        uses: actions/upload-artifact@v4
        with:
          name: PFC-AITest-DSH-Turnkey-RC7-BANK-WIN10-${{ github.sha }}
          path: |
            dist/PFC-AITest-DSH-Turnkey-RC7-BANK-WIN10-*.zip
            dist/PFC-AITest-DSH-Turnkey-RC7-BANK-WIN10-*.zip.sha256
            dist/qualification/*.json
          if-no-files-found: error
          retention-days: 14
