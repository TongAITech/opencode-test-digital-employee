name: RC7 Closed-loop Core

on:
  push:
    branches:
      - work/rc7-closed-loop-runtime
    paths:
      - 'rc7_runtime/**'
      - 'rc7_release/**'
      - 'rc7_admin/**'
      - 'packaging/rc7/**'
      - 'tests/test_rc7_*.py'
      - '.github/workflows/rc7-core.yml'
  workflow_dispatch:

jobs:
  core:
    name: core-python-${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install qualification dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile RC7 runtime, release qualification and admin platform
        run: python -m compileall -q rc7_runtime rc7_release rc7_admin
      - name: Import inherited RC6 runtime and RC7 modules
        run: python -c "import rc6_runtime; import rc6_runtime.truth; import rc7_admin; import rc7_admin.server; import rc7_release.mcp_server; import rc7_release.qualification; import rc7_release.code_qualification_strict; import rc7_release.test_design_qualification_strict; import rc7_release.script_qualification_strict; import rc7_release.execution_environment; import rc7_release.execution_qualification_strict"
      - name: Validate RC7 shell qualification and admin entrypoints
        run: |
          bash -n packaging/rc7/QUALIFY-DSH-REQUIREMENT.sh
          bash -n packaging/rc7/QUALIFY-DSH-CODE.sh
          bash -n packaging/rc7/QUALIFY-DSH-TEST-DESIGN.sh
          bash -n packaging/rc7/QUALIFY-DSH-SCRIPT.sh
          bash -n packaging/rc7/QUALIFY-EXECUTION.sh
          bash -n packaging/rc7/START-RC7-ADMIN.sh
          grep -q 'rc7_release.code_qualification_strict' packaging/rc7/QUALIFY-DSH-CODE.sh
          grep -q 'rc7_release.test_design_qualification_strict' packaging/rc7/QUALIFY-DSH-TEST-DESIGN.sh
          grep -q 'PFC_RC7_REQUIREMENT_RESULT' packaging/rc7/QUALIFY-DSH-TEST-DESIGN.sh
          grep -q 'PFC_RC7_CODE_RESULT' packaging/rc7/QUALIFY-DSH-TEST-DESIGN.sh
          grep -q 'rc7_release.script_qualification_strict' packaging/rc7/QUALIFY-DSH-SCRIPT.sh
          grep -q 'PFC_RC7_TEST_DESIGN_RESULT' packaging/rc7/QUALIFY-DSH-SCRIPT.sh
          grep -q 'PFC_RC7_SCRIPT_TC_ID' packaging/rc7/QUALIFY-DSH-SCRIPT.sh
          grep -q 'rc7_release.execution_qualification_strict' packaging/rc7/QUALIFY-EXECUTION.sh
          grep -q 'PFC_RC7_SCRIPT_RESULT' packaging/rc7/QUALIFY-EXECUTION.sh
          grep -q 'PFC_RC7_EXECUTION_ENV_MODULE' packaging/rc7/QUALIFY-EXECUTION.sh
          grep -q 'PFC_RC7_EXECUTION_TARGET_ID' packaging/rc7/QUALIFY-EXECUTION.sh
          grep -q 'rc7-execution-result.json' packaging/rc7/QUALIFY-EXECUTION.sh
          grep -q 'rc7_admin' packaging/rc7/START-RC7-ADMIN.sh
      - name: Run RC7 closed-loop core tests
        run: python -m pytest -q tests/test_rc7_*.py

  packaging-windows:
    name: packaging-windows-python-3.8
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Parse RC7 Windows qualification and admin entrypoints
        shell: pwsh
        run: |
          $requirement = Get-Content -Raw 'packaging/rc7/QUALIFY-DSH-REQUIREMENT.cmd'
          if ($requirement -notmatch 'rc7_release\.qualification') { throw 'RC7 Requirement qualification module invocation missing' }
          if ($requirement -notmatch 'rc7-dsh-bridge-result\.json') { throw 'RC7 Requirement qualification result contract missing' }
          if ($requirement -match 'DSH_ARGS=--dsh-bin') { throw 'Unsafe concatenated DSH path quoting regression' }
          $code = Get-Content -Raw 'packaging/rc7/QUALIFY-DSH-CODE.cmd'
          if ($code -notmatch 'rc7_release\.code_qualification_strict') { throw 'RC7 strict Code qualification module invocation missing' }
          if ($code -notmatch 'rc7-dsh-code-result\.json') { throw 'RC7 Code qualification result contract missing' }
          if ($code -notmatch 'PFC_RC7_CODEGRAPH_QUERY_ARGS_JSON') { throw 'RC7 CodeGraph query contract missing' }
          $design = Get-Content -Raw 'packaging/rc7/QUALIFY-DSH-TEST-DESIGN.cmd'
          if ($design -notmatch 'rc7_release\.test_design_qualification_strict') { throw 'RC7 strict Test Design qualification module invocation missing' }
          if ($design -notmatch 'rc7-dsh-test-design-result\.json') { throw 'RC7 Test Design result contract missing' }
          if ($design -notmatch 'PFC_RC7_REQUIREMENT_RESULT') { throw 'RC7 Test Design upstream Requirement result contract missing' }
          if ($design -notmatch 'PFC_RC7_CODE_RESULT') { throw 'RC7 Test Design upstream Code result contract missing' }
          $script = Get-Content -Raw 'packaging/rc7/QUALIFY-DSH-SCRIPT.cmd'
          if ($script -notmatch 'rc7_release\.script_qualification_strict') { throw 'RC7 strict Script qualification module invocation missing' }
          if ($script -notmatch 'rc7-dsh-script-result\.json') { throw 'RC7 Script result contract missing' }
          if ($script -notmatch 'PFC_RC7_TEST_DESIGN_RESULT') { throw 'RC7 Script upstream Test Design result contract missing' }
          if ($script -notmatch 'PFC_RC7_SCRIPT_TC_ID') { throw 'RC7 Script TestCase identity contract missing' }
          $execution = Get-Content -Raw 'packaging/rc7/QUALIFY-EXECUTION.cmd'
          if ($execution -notmatch 'rc7_release\.execution_qualification_strict') { throw 'RC7 strict Execution qualification module invocation missing' }
          if ($execution -notmatch 'rc7-execution-result\.json') { throw 'RC7 Execution result contract missing' }
          if ($execution -notmatch 'PFC_RC7_SCRIPT_RESULT') { throw 'RC7 Execution upstream Script result contract missing' }
          if ($execution -notmatch 'PFC_RC7_EXECUTION_ENV_MODULE') { throw 'RC7 Execution environment adapter contract missing' }
          if ($execution -notmatch 'PFC_RC7_EXECUTION_TARGET_ID') { throw 'RC7 Execution target identity contract missing' }
          $admin = Get-Content -Raw 'packaging/rc7/START-RC7-ADMIN.cmd'
          if ($admin -notmatch 'rc7_admin') { throw 'RC7 admin module invocation missing' }
          if ($admin -notmatch 'PFC_RC7_R1_PATH') { throw 'RC7 admin R1 truth path contract missing' }
      - name: Python 3.8 imports RC7 qualification, MCP and admin modules
        run: python -c "import rc7_admin; import rc7_admin.server; import rc7_release.qualification; import rc7_release.code_qualification_strict; import rc7_release.test_design_qualification_strict; import rc7_release.script_qualification_strict; import rc7_release.execution_environment; import rc7_release.execution_qualification_strict; import rc7_release.mcp_server"
