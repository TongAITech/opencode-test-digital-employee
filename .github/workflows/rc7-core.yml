name: RC7 Closed-loop Core

on:
  push:
    branches:
      - work/rc7-closed-loop-runtime
    paths:
      - 'rc7_runtime/**'
      - 'rc7_release/**'
      - 'packaging/rc7/**'
      - 'tests/test_rc7_*.py'
      - '.github/workflows/rc7-core.yml'
  workflow_dispatch:

jobs:
  core:
    name: core-python-${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install qualification dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile RC7 runtime and release qualification
        run: python -m compileall -q rc7_runtime rc7_release
      - name: Import inherited RC6 runtime and RC7 MCP
        run: python -c "import rc6_runtime; import rc6_runtime.truth; import rc7_release.mcp_server; import rc7_release.qualification; import rc7_release.code_qualification; import rc7_release.code_qualification_strict; import rc7_release.test_design_qualification"
      - name: Validate RC7 shell qualification entrypoints
        run: |
          bash -n packaging/rc7/QUALIFY-DSH-REQUIREMENT.sh
          bash -n packaging/rc7/QUALIFY-DSH-CODE.sh
          bash -n packaging/rc7/QUALIFY-DSH-TEST-DESIGN.sh
          grep -q 'rc7_release.code_qualification_strict' packaging/rc7/QUALIFY-DSH-CODE.sh
          grep -q 'rc7_release.test_design_qualification' packaging/rc7/QUALIFY-DSH-TEST-DESIGN.sh
          grep -q 'PFC_RC7_REQUIREMENT_RESULT' packaging/rc7/QUALIFY-DSH-TEST-DESIGN.sh
          grep -q 'PFC_RC7_CODE_RESULT' packaging/rc7/QUALIFY-DSH-TEST-DESIGN.sh
      - name: Run RC7 closed-loop core tests
        run: python -m pytest -q tests/test_rc7_*.py

  packaging-windows:
    name: packaging-windows-python-3.8
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Parse RC7 Windows qualification entrypoints
        shell: pwsh
        run: |
          $requirement = Get-Content -Raw 'packaging/rc7/QUALIFY-DSH-REQUIREMENT.cmd'
          if ($requirement -notmatch 'rc7_release\.qualification') { throw 'RC7 Requirement qualification module invocation missing' }
          if ($requirement -notmatch 'rc7-dsh-bridge-result\.json') { throw 'RC7 Requirement qualification result contract missing' }
          if ($requirement -match 'DSH_ARGS=--dsh-bin') { throw 'Unsafe concatenated DSH path quoting regression' }
          $code = Get-Content -Raw 'packaging/rc7/QUALIFY-DSH-CODE.cmd'
          if ($code -notmatch 'rc7_release\.code_qualification_strict') { throw 'RC7 strict Code qualification module invocation missing' }
          if ($code -notmatch 'rc7-dsh-code-result\.json') { throw 'RC7 Code qualification result contract missing' }
          if ($code -notmatch 'PFC_RC7_CODEGRAPH_QUERY_ARGS_JSON') { throw 'RC7 CodeGraph query contract missing' }
          $design = Get-Content -Raw 'packaging/rc7/QUALIFY-DSH-TEST-DESIGN.cmd'
          if ($design -notmatch 'rc7_release\.test_design_qualification') { throw 'RC7 Test Design qualification module invocation missing' }
          if ($design -notmatch 'rc7-dsh-test-design-result\.json') { throw 'RC7 Test Design result contract missing' }
          if ($design -notmatch 'PFC_RC7_REQUIREMENT_RESULT') { throw 'RC7 Test Design upstream Requirement result contract missing' }
          if ($design -notmatch 'PFC_RC7_CODE_RESULT') { throw 'RC7 Test Design upstream Code result contract missing' }
      - name: Python 3.8 imports RC7 qualification and MCP modules
        run: python -c "import rc7_release.qualification; import rc7_release.code_qualification; import rc7_release.code_qualification_strict; import rc7_release.test_design_qualification; import rc7_release.mcp_server"
