name: RC7 Closed-loop Core

on:
  push:
    branches:
      - work/rc7-closed-loop-runtime
    paths:
      - 'rc7_runtime/**'
      - 'rc7_release/**'
      - 'packaging/rc7/**'
      - 'tests/test_rc7_*.py'
      - '.github/workflows/rc7-core.yml'
  workflow_dispatch:

jobs:
  core:
    name: core-python-${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install qualification dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile RC7 runtime and release qualification
        run: python -m compileall -q rc7_runtime rc7_release
      - name: Import inherited RC6 runtime and RC7 MCP
        run: python -c "import rc6_runtime; import rc6_runtime.truth; import rc7_release.mcp_server; import rc7_release.qualification"
      - name: Validate RC7 shell qualification entrypoint
        run: bash -n packaging/rc7/QUALIFY-DSH-REQUIREMENT.sh
      - name: Run RC7 closed-loop core tests
        run: python -m pytest -q tests/test_rc7_*.py

  packaging-windows:
    name: packaging-windows-python-3.8
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Parse RC7 Windows qualification entrypoint
        shell: pwsh
        run: |
          $content = Get-Content -Raw 'packaging/rc7/QUALIFY-DSH-REQUIREMENT.cmd'
          if ($content -notmatch 'rc7_release\.qualification') { throw 'RC7 qualification module invocation missing' }
          if ($content -notmatch 'rc7-dsh-bridge-result\.json') { throw 'RC7 qualification result contract missing' }
          if ($content -match 'DSH_ARGS=--dsh-bin') { throw 'Unsafe concatenated DSH path quoting regression' }
      - name: Python 3.8 imports RC7 field qualification and MCP modules
        run: python -c "import rc7_release.qualification; import rc7_release.mcp_server"
