name: Wave2 Final Two Oracles

on:
  push:
    branches:
      - repair/g3-g4-wave2

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[wave2-two-oracles-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Fix two remaining stale test oracles
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          replacements={
            'workspace-template/.pfc-internal-field-validation/tests/test_g4_full_same_mission_product_e2e.py':[
              ("auto_waited_for_runtime_observation and auto_waited and ","auto_waited and "),
            ],
            'workspace-template/.pfc-internal-field-validation/tests/test_g3_g4_post_closure_adversarial.py':[
              ('return {"case_spec_fact_id":case["fact_id"],"focused_execution_binding_id":focused["binding"]["payload"]["binding_id"]}',
               'return {"case_spec_fact_id":case["fact_id"],"focused_execution_binding_id":focused["binding_id"],"execution_batch_id":focused["execution_batch_id"]}'),
            ],
          }
          for path,pairs in replacements.items():
            p=Path(path); text=p.read_text(encoding='utf-8')
            for old,new in pairs:
              if old not in text:
                if new in text: continue
                raise SystemExit('PATTERN_NOT_FOUND:'+path+':'+old)
              text=text.replace(old,new,1)
            p.write_text(text,encoding='utf-8')
          PY
          git rm .github/workflows/wave2-final-two-oracles.yml
          git diff --check
      - name: Commit and push clean fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test(wave2): fix last two stale oracles [wave2-two-oracles-fixed]'
          git push origin HEAD:repair/g3-g4-wave2
