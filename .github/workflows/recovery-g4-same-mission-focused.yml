name: Recovery G4 same-Mission focused qualification

on:
  push:
    branches: [work/v1.13.0-recovery-turnkey-validation]
    paths:
      - workspace-template/.pfc-internal-field-validation/tests/test_g4_full_same_mission_product_e2e.py
      - workspace-template/.pfc-internal-field-validation/tests/test_g4_governed_execution_binding_wave2.py
      - workspace-template/.pfc-internal-field-validation/tests/test_g3_testing_intelligence_product_path.py
      - workspace-template/.pfc-internal-field-validation/tests/test_g2_1_session_router_control_loop.py
      - workspace-template/ai-test/runtime/aitest_runtime/g2_1/**
      - workspace-template/ai-test/runtime/aitest_runtime/g3/**
      - workspace-template/ai-test/runtime/aitest_runtime/g4/**
      - workspace-template/ai-test/runtime/aitest_runtime/mission_tool_admission.py
      - workspace-template/ai-test/runtime/aitest_runtime/mission_session_authority.py
      - workspace-template/ai-test/runtime/aitest_runtime/product_entry.py
      - .github/workflows/recovery-g4-same-mission-focused.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  g4-same-mission:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Reuse qualified portable Python
        shell: pwsh
        run: |
          $incoming = Join-Path $env:RUNNER_TEMP 'g4-focused-payload'
          gh run download 34278790485 --name recovery-qualified-package --dir $incoming
          if ($LASTEXITCODE -ne 0) { throw 'Prior qualified offline payload unavailable' }
          $zip = Join-Path $incoming 'AITest-V1.13.0-Recovery-Turnkey-Windows-x64.zip'
          $expected = '49d8e4dc0a38a1ea89b5872bb7926151b938172650bec2534ce73c43f76e9be2'
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'Offline payload input hash mismatch'
          }
          $expanded = Join-Path $env:RUNNER_TEMP 'g4-focused-expanded'
          Expand-Archive $zip -DestinationPath $expanded
          $bundle = Get-ChildItem $expanded -Directory | Select-Object -First 1
          if (-not $bundle) { throw 'Qualified payload root missing' }
          $python = Join-Path $bundle.FullName 'workspace-template/runtime/python/python.exe'
          if (-not (Test-Path $python)) { throw 'Portable Python missing' }
          "FOCUSED_PYTHON=$python" | Out-File $env:GITHUB_ENV -Append

      - name: Run G4 full same-Mission product E2E
        shell: pwsh
        env:
          AITEST_G4_E2E_STAGE_DEBUG: '1'
        run: |
          $env:GH_TOKEN = ''
          $env:GITHUB_TOKEN = ''
          $env:PYTHONNOUSERSITE = '1'
          $env:PYTHONDONTWRITEBYTECODE = '1'
          $env:PYTHONUTF8 = '1'
          $test = 'workspace-template/.pfc-internal-field-validation/tests/test_g4_full_same_mission_product_e2e.py'
          & "$env:FOCUSED_PYTHON" -X utf8 -c "import sys,runpy; from pathlib import Path; p=sys.argv[1]; sys.path.insert(0,str(Path(p).parent)); sys.argv=[p]; runpy.run_path(p,run_name='__main__')" $test 2>&1 | Tee-Object -FilePath RECOVERY_G4_SAME_MISSION_FOCUSED.log
          if ($LASTEXITCODE -ne 0) { throw 'G4 same-Mission focused regression failed' }

      - name: Run G4 governed execution binding Wave2
        shell: pwsh
        run: |
          $env:GH_TOKEN = ''
          $env:GITHUB_TOKEN = ''
          $env:PYTHONNOUSERSITE = '1'
          $env:PYTHONDONTWRITEBYTECODE = '1'
          $env:PYTHONUTF8 = '1'
          $test = 'workspace-template/.pfc-internal-field-validation/tests/test_g4_governed_execution_binding_wave2.py'
          & "$env:FOCUSED_PYTHON" -X utf8 -c "import sys,runpy; from pathlib import Path; p=sys.argv[1]; sys.path.insert(0,str(Path(p).parent)); sys.argv=[p]; runpy.run_path(p,run_name='__main__')" $test 2>&1 | Tee-Object -FilePath RECOVERY_G4_WAVE2_BINDING_FOCUSED.log
          if ($LASTEXITCODE -ne 0) { throw 'G4 governed execution binding Wave2 focused regression failed' }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-g4-same-mission-focused
          path: |
            RECOVERY_G4_SAME_MISSION_FOCUSED.log
            RECOVERY_G4_WAVE2_BINDING_FOCUSED.log
          if-no-files-found: warn
