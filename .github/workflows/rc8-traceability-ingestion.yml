name: RC8 Center Traceability Ingestion

on:
  push:
    branches: [work/rc8]
    paths:
      - 'rc8_center/traceability_ingestion.py'
      - 'tests/test_rc8_traceability_ingestion.py'
      - '.github/workflows/rc8-traceability-ingestion.yml'
  workflow_dispatch:

jobs:
  traceability-ingestion:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Install formal Center infrastructure dependencies
        run: python -m pip install --disable-pip-version-check 'SQLAlchemy>=2,<3' 'redis>=5,<6'
      - name: Compile controlled ingestion
        run: >-
          python -m py_compile
          rc8_center/traceability_ingestion.py
          rc8_center/traceability.py
          rc8_center/code_sufficiency.py
          rc8_center/infrastructure/postgres_traceability.py
          tests/test_rc8_traceability_ingestion.py
      - name: Run controlled ingestion and Code Sufficiency regression
        run: >-
          python -m unittest
          tests.test_rc8_traceability_ingestion
          -v
