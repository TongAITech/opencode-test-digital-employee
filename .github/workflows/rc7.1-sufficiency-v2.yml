name: RC7.1 Sufficiency v2

on:
  push:
    branches:
      - work/rc7.1-sufficiency-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Install tests
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile RC7 runtime
        run: python -m compileall -q rc6_runtime rc7_runtime
      - name: RC7.1 sufficiency autonomous-repair model-resilience and production-autopilot discriminating tests
        run: >-
          python -m pytest -q
          tests/test_rc7_1_test_design_sufficiency_v2.py
          tests/test_rc7_1_requirement_sufficiency_v2.py
          tests/test_rc7_1_code_sufficiency_v2.py
          tests/test_rc7_1_obligation_denominator_expansion.py
          tests/test_rc7_1_autonomous_repair_routing.py
          tests/test_rc7_1_worker_sufficiency_contract.py
          tests/test_rc7_1_sufficiency_repair_cycle.py
          tests/test_rc7_1_model_resilience.py
          tests/test_rc7_1_worker_timeout_reality.py
          tests/test_rc7_1_bank_mission_autopilot.py
      - name: Existing Requirement Code Test Design and execution regressions
        run: >-
          python -m pytest -q
          tests/test_rc7_requirement_loop.py
          tests/test_rc7_dsh_requirement_evaluator.py
          tests/test_rc7_code_loop.py
          tests/test_rc7_dsh_code_evaluator.py
          tests/test_rc7_test_design_loop.py
          tests/test_rc7_test_design_parent_inventory.py
          tests/test_rc7_dsh_test_design_evaluator.py
          tests/test_rc7_same_mission_semantic_e2e.py
          tests/test_rc7_closed_loop_control.py
          tests/test_rc7_mission_stage_dispatch.py
          tests/test_rc7_runtime_execution_control.py

  full-rc7:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Install regression dependencies
        run: python -m pip install --disable-pip-version-check pytest requests python-docx openpyxl python-pptx pypdf
      - name: Full RC7 regression
        shell: bash
        run: |
          mapfile -t tests < <(find tests -maxdepth 1 -type f -name 'test_rc7_*.py' -print | sort)
          if [ "${#tests[@]}" -eq 0 ]; then echo 'No RC7 tests found' >&2; exit 2; fi
          python -m pytest -q "${tests[@]}"
