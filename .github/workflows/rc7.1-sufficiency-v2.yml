name: RC7.1 Sufficiency v2

on:
  push:
    branches:
      - work/rc7.1-sufficiency-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Install tests
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile RC7 runtime
        run: python -m compileall -q rc6_runtime rc7_runtime
      - name: Sufficiency v2 discriminating tests
        run: python -m pytest -q tests/test_rc7_1_test_design_sufficiency_v2.py
      - name: Existing Test Design regressions
        run: >-
          python -m pytest -q
          tests/test_rc7_test_design_loop.py
          tests/test_rc7_test_design_parent_inventory.py
          tests/test_rc7_dsh_test_design_evaluator.py
          tests/test_rc7_same_mission_semantic_e2e.py

  full-rc7:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Install regression dependencies
        run: python -m pip install --disable-pip-version-check pytest requests python-docx openpyxl python-pptx pypdf
      - name: Full RC7 regression
        shell: bash
        run: |
          mapfile -t tests < <(find tests -maxdepth 1 -type f -name 'test_rc7_*.py' -print | sort)
          python -m pytest -q "${tests[@]}"
