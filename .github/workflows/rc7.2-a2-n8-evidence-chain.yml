name: RC7.2 A2 N8 Process Evidence and Cold Recovery Qualification

on:
  push:
    branches: [work/rc7.2-a2-n8-evidence-chain]
    paths:
      - 'rc7_runtime/rc72_n8_execution_diagnosis.py'
      - 'tests/test_rc72_n8_execution_diagnosis.py'
      - '.github/workflows/rc7.2-a2-n8-evidence-chain.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc72-a2-n8-evidence-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  process-evidence:
    name: n8-evidence-${{ matrix.os }}-python-${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
        python: ['3.8', '3.11']
    steps:
      - name: Checkout exact N8 source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Use declared Python interpreter
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned qualification dependencies
        run: python -m rc7_release.rc72_pytest_bootstrap --requirements rc7_release/requirements-qualification.txt --timeout-seconds 120
      - name: Compile production and negative tests
        run: python -m compileall -q rc6_runtime rc7_runtime rc7_release tests
      - name: Qualify N8 original evidence, signed delivery, negative tamper and cold replay
        run: >-
          python -m pytest -q
          tests/test_rc72_n8_execution_diagnosis.py
          tests/test_rc72_n8_product_recovery.py
          tests/test_rc72_n8_multi_round.py
          --junitxml=rc72-a2-n8-evidence.xml
      - name: Upload actual same-SHA test receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc72-a2-n8-evidence-${{ matrix.os }}-${{ matrix.python }}-${{ github.sha }}
          path: rc72-a2-n8-evidence.xml
          if-no-files-found: warn
          retention-days: 14
