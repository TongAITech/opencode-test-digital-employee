name: RC6 Wave 7 Coverage Oracle Closure

on:
  push:
    branches:
      - work/rc6-runtime-reconstruction
  pull_request:
    paths:
      - 'rc6_runtime/coverage.py'
      - 'tests/test_coverage_closure.py'
      - 'docs/RC6_WAVE7_QUALIFICATION.md'
      - '.github/workflows/rc6-wave7.yml'

jobs:
  wave7-coverage-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run all RC6 unit qualification
        run: python -m unittest discover -s tests -v
