name: RC7.2 C04 N9 DSH Raw Session Tool Provenance

on:
  push:
    branches: [work/rc7.2-c04-n9-dsh-raw-provenance]
    paths:
      - 'rc7_runtime/rc72_n9_professional_dsh.py'
      - 'tests/test_rc72_n9_professional_dsh_contract.py'
      - '.github/workflows/rc72-c04-n9-dsh-raw-provenance.yml'
  pull_request:
    branches: [work/rc7.2-abcd-v5-bsk-mobile-qualification]
    paths:
      - 'rc7_runtime/rc72_n9_professional_dsh.py'
      - 'tests/test_rc72_n9_professional_dsh_contract.py'
      - '.github/workflows/rc72-c04-n9-dsh-raw-provenance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  n9-raw-provenance:
    name: c04-n9-raw-${{ matrix.os }}-py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
        python: ['3.8', '3.11']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install approved test harness
        run: python -m rc7_release.rc72_pytest_bootstrap --requirements rc7_release/requirements-qualification.txt --timeout-seconds 120
      - name: Compile professional N9 and evidence security tests
        run: >-
          python -m py_compile
          rc7_runtime/rc72_n9_professional_dsh.py
          tests/test_rc72_n9_professional_dsh_contract.py
      - name: Exercise actual N8 to N9 signatures, fraud rejection, crash recovery and old routes
        run: >-
          python -m pytest -q
          tests/test_rc72_n9_professional_dsh_contract.py
          tests/test_rc72_n9_professional_dsh_real_route.py
          tests/test_rc72_n9_captain_signed_dsh_bridge.py
          tests/test_rc72_c07_n9_professional_dsh_fence.py
          tests/test_rc72_n9_captain_qualification.py
          tests/test_rc72_n9_professional_lineage.py
          --junitxml=rc72-c04-n9-raw.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c04-n9-raw-${{ matrix.os }}-${{ matrix.python }}-${{ github.sha }}
          path: rc72-c04-n9-raw.xml
          retention-days: 14
          if-no-files-found: warn
