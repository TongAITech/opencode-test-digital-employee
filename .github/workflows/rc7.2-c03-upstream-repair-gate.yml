name: RC7.2 C03 Verified Upstream Repair Gate Source Qualification

on:
  push:
    branches: [work/rc7.2-c03-upstream-repair-active-gate]
    paths:
      - 'rc7_runtime/rc72_diagnosis_orchestration.py'
      - 'tests/test_rc72_phase6_repair_reexecution_contract.py'
      - '.github/workflows/rc7.2-c03-upstream-repair-gate.yml'
  pull_request:
    branches: [work/rc7.2-abcd-v5-bsk-mobile-qualification]
    paths:
      - 'rc7_runtime/rc72_diagnosis_orchestration.py'
      - 'tests/test_rc72_phase6_repair_reexecution_contract.py'
      - '.github/workflows/rc7.2-c03-upstream-repair-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream-repair-gate:
    name: c03-repair-${{ matrix.os }}-py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
        python: ['3.8', '3.11']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install approved test dependencies
        run: python -m rc7_release.rc72_pytest_bootstrap --requirements rc7_release/requirements-qualification.txt --timeout-seconds 120
      - name: Compile source, accepted gate and recovery tests
        run: >-
          python -m py_compile
          rc7_runtime/rc72_diagnosis_orchestration.py
          tests/test_rc72_phase6_repair_reexecution_contract.py
          tests/test_rc72_phase6_diagnosis_orchestration_contract.py
      - name: Real R1 Gate admission, stale impact and interrupted recovery tests
        run: >-
          python -m pytest -q
          tests/test_rc72_phase6_repair_reexecution_contract.py
          tests/test_rc72_phase6_diagnosis_orchestration_contract.py
          --junitxml=rc72-c03-upstream-gate.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc72-c03-upstream-${{ matrix.os }}-${{ matrix.python }}-${{ github.sha }}
          path: rc72-c03-upstream-gate.xml
          retention-days: 14
          if-no-files-found: warn
