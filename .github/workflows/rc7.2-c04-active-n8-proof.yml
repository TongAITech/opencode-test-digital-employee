name: RC7.2 C04 Active N8 Gate Professional Intake Qualification

on:
  push:
    branches: [work/rc7.2-c04-active-n8-proof]
    paths:
      - 'rc7_runtime/rc72_n9_professional_intake.py'
      - 'tests/test_rc72_n9_professional_lineage.py'
      - '.github/workflows/rc7.2-c04-active-n8-proof.yml'
  pull_request:
    branches: [work/rc7.2-abcd-v5-bsk-mobile-qualification]
    paths:
      - 'rc7_runtime/rc72_n9_professional_intake.py'
      - 'tests/test_rc72_n9_professional_lineage.py'
      - '.github/workflows/rc7.2-c04-active-n8-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  n9-current-n8-gate:
    name: c04-current-n8-${{ matrix.os }}-python-${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
        python: ['3.8', '3.11']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install approved qualification harness
        run: python -m rc7_release.rc72_pytest_bootstrap --requirements rc7_release/requirements-qualification.txt --timeout-seconds 120
      - name: Compile actual N8 and N9 proof code
        run: python -m py_compile rc7_runtime/rc72_n9_professional_intake.py tests/test_rc72_n9_professional_lineage.py
      - name: Real local SUT, active N8 Gate and independent professional rejection/acceptance
        run: >-
          python -m pytest -q
          tests/test_rc72_n9_professional_lineage.py
          tests/test_rc72_n9_professional_dsh_real_route.py
          tests/test_rc72_n9_captain_qualification.py
          --junitxml=rc72-c04-active-n8.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc72-c04-n8-${{ matrix.os }}-${{ matrix.python }}-${{ github.sha }}
          path: rc72-c04-active-n8.xml
          retention-days: 14
          if-no-files-found: warn
