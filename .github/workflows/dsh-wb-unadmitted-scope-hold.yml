name: DSH Workbench unadmitted Scope HOLD
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'rc7_runtime/unadmitted_scope_guard.py'
      - 'rc7_runtime/closed_loop_control.py'
      - 'rc7_runtime/bank_mission.py'
      - 'rc7_runtime/rc72_mission_node_dispatch.py'
      - 'rc7_release/package.py'
      - 'tests/test_rc7_unadmitted_scope_hold.py'
      - 'tests/test_rc7_script_fanout_control_gate.py'
      - '.github/workflows/dsh-wb-unadmitted-scope-hold.yml'
permissions:
  contents: read
jobs:
  local-negative-guard:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.11']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test runner
        run: python -m pip install pytest==8.3.5
      - name: Verify exact source and runtime
        run: |
          git rev-parse HEAD
          python --version
      - name: Local guard and affected legacy regression
        run: >-
          python -m pytest -q
          tests/test_rc7_unadmitted_scope_hold.py
          tests/test_rc7_script_fanout_control_gate.py
          tests/test_rc7_closed_loop_control.py tests/test_rc7_closed_loop_core.py
          tests/test_rc7_control_plane.py
          tests/test_rc7_multi_case_defect_control_plane_bridge.py
          tests/test_rc7_bank_mission_entrypoint.py
          tests/test_rc7_1_bank_mission_start.py tests/test_rc7_1_bank_mission_autopilot.py
          tests/test_rc7_bank_mission_turnkey_cli.py
          tests/test_rc72_mission_node_dispatch.py tests/test_rc72_scheduler_integration.py
          tests/test_rc7_session_continuity.py tests/test_rc72_critical_path_no_delay.py
          tests/test_rc72_n2_revision_closed_loop.py
          tests/test_rc72_q2b_clean_runtime_contract.py
          tests/test_rc72_windows_clean_unpack_contract.py
