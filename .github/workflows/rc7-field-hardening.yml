name: RC7 Field Hardening

on:
  push:
    branches:
      - work/rc7-field-hardening
  pull_request:
    paths:
      - 'rc7_release/**'
      - 'rc7_runtime/**'
      - 'packaging/rc7/**'
      - 'tests/test_rc7*.py'
      - '.github/workflows/rc7-field-hardening.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  field-hardening-source-regression:
    name: Source regression (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile hardened modules
        run: >-
          python -m py_compile
          rc7_release/runtime_delivery_contract.py
          rc7_release/mcp_server.py
          rc7_release/mcp_server_field.py
          rc7_release/mcp_stdio.py
          rc7_release/codegraph_mcp.py
          rc7_release/contracted_runner.py
          rc7_release/plugin_payload.py
          rc7_release/dsh_plugins.py
          rc7_release/dsh_runtime_profile.py
          rc7_release/dsh_plugin_qualification.py
          rc7_release/plugin_effect_qualification.py
          rc7_release/dsh.py
          rc7_release/professional_tools.py
          rc7_release/final_unified_qualification.py
          rc7_release/windows_clean_qualification.py
          rc7_release/real_mission_qualification_strict.py
          rc7_runtime/truth_overlay.py
          rc7_runtime/reality_recon.py
          rc7_runtime/mission_conformance.py
          rc7_runtime/mission_stage_dispatch.py
          rc7_runtime/control_plane.py
          rc7_runtime/closed_loop_control.py
          rc7_runtime/case_runtime.py
          rc7_runtime/case_fanout_conformance.py
          rc7_runtime/case_coverage_field_summary.py
          rc7_runtime/case_script_bundle_resolver.py
          rc7_runtime/script_fanout_evaluator.py
          rc7_runtime/execution_fanout_conformance.py
          rc7_runtime/execution_fanout_evaluator.py
          rc7_runtime/runtime_execution_control.py
          rc7_runtime/autonomous_execution_service.py
          rc7_runtime/bank_field_services.py
          rc7_runtime/execution_recovery_conformance.py
          rc7_runtime/oracle_runtime.py
          rc7_runtime/oracle_conformance.py
          rc7_runtime/defect_review_conformance.py
          rc7_runtime/mission_convergence_conformance.py
          rc7_runtime/mission_formal_evidence_builder.py
          rc7_runtime/final_report.py
      - name: Run field-hardening regressions
        run: >-
          python -m pytest -q
          tests/test_rc7_runtime_delivery_contract.py
          tests/test_rc7_field_hardening.py
          tests/test_rc7_plugin_payload.py
          tests/test_rc7_dsh_runtime_profile.py
          tests/test_rc7_dsh_plugin_qualification.py
          tests/test_rc7_plugin_effect_qualification.py
          tests/test_rc7_plugin_effect_bank_entrypoint.py
          tests/test_rc7_bank_field_conformance.py
          tests/test_rc7_bank_field_services.py
          tests/test_rc7_bank_field_services_entrypoint.py
          tests/test_rc7_mcp_stdio.py
          tests/test_rc7_mcp_server_field.py
          tests/test_rc7_professional_windows_decode.py
          tests/test_rc7_truth_overlay.py
          tests/test_rc7_case_runtime.py
          tests/test_rc7_case_fanout_conformance.py
          tests/test_rc7_case_coverage_field_summary.py
          tests/test_rc7_case_script_bundle_resolver.py
          tests/test_rc7_script_fanout_control_gate.py
          tests/test_rc7_execution_fanout_conformance.py
          tests/test_rc7_execution_fanout_defect_handoff.py
          tests/test_rc7_multi_case_defect_control_plane_bridge.py
          tests/test_rc7_bank_fanout_preparation_guard.py
          tests/test_rc7_active_execution_preparation.py
          tests/test_rc7_three_case_execution_qualification.py
          tests/test_rc7_runtime_execution_control.py
          tests/test_rc7_execution_recovery_conformance.py
          tests/test_rc7_contracted_runner.py
          tests/test_rc7_oracle_conformance.py
          tests/test_rc7_defect_review_conformance.py
          tests/test_rc7_mission_convergence_conformance.py
          tests/test_rc7_mission_formal_evidence_builder.py
          tests/test_rc7_final_report.py
          tests/test_rc7_final_report_convergence_guard.py
          tests/test_rc7_product_defect_mission_e2e.py

  rc7-source-suite:
    name: RC7 source suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run RC7-focused source tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find tests -maxdepth 1 -type f -name 'test_rc7*.py' -print | sort)
          printf 'RC7 tests (%s):\n' "${#tests[@]}"
          printf ' - %s\n' "${tests[@]}"
          python -m pytest -q "${tests[@]}"

  windows-clean-qualification:
    name: Windows clean package qualification
    needs:
      - field-hardening-source-regression
      - rc7-source-suite
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Materialize package-local DSH plugin payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm --version
          if ($LASTEXITCODE -ne 0) { throw 'npm is required to build the offline DSH plugin payload' }
          python -m rc7_release.plugin_payload acquire --repo-root .
          if ($LASTEXITCODE -ne 0) { throw 'RC7 DSH plugin payload acquisition failed' }
      - name: Build, checksum, re-extract and qualify clean Windows package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $commit = (git rev-parse HEAD).Trim()
          $packageName = 'PFC-AITest-DSH-Turnkey-RC7-BANK-WIN10'
          python -m rc7_release.package build --repo-root . --output .\dist-clean --source-commit $commit
          if ($LASTEXITCODE -ne 0) { throw 'RC7 package build failed' }

          $builtRoot = Join-Path (Resolve-Path .\dist-clean).Path $packageName
          python -m rc7_release.runtime_delivery_contract --package-root $builtRoot
          if ($LASTEXITCODE -ne 0) { throw 'RC7 turnkey runtime contract failed on built package' }

          $zips = @(Get-ChildItem -Path .\dist-clean -Filter '*.zip' -File)
          if ($zips.Count -ne 1) { throw "Expected exactly one RC7 zip, got $($zips.Count)" }
          $zip = $zips[0]
          $checksumPath = "$($zip.FullName).sha256"
          if (-not (Test-Path -LiteralPath $checksumPath)) { throw 'ZIP checksum sidecar missing' }
          $expected = ((Get-Content -LiteralPath $checksumPath -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash -LiteralPath $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw 'ZIP checksum mismatch before extraction' }

          if (Test-Path -LiteralPath $builtRoot) { Remove-Item -LiteralPath $builtRoot -Recurse -Force }
          $cleanRoot = [System.IO.Path]::GetFullPath((Join-Path $PWD 'clean-extract'))
          if (Test-Path -LiteralPath $cleanRoot) { Remove-Item -LiteralPath $cleanRoot -Recurse -Force }
          New-Item -ItemType Directory -Path $cleanRoot | Out-Null
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $cleanRoot -Force

          $packageRoot = Join-Path $cleanRoot $packageName
          $packagePython = Join-Path $packageRoot 'workspace-template\runtime\python\python.exe'
          if (-not (Test-Path -LiteralPath $packagePython)) { throw 'Package-local Python missing after clean extraction' }
          Push-Location $packageRoot
          try {
            & $packagePython -m rc7_release.runtime_delivery_contract --package-root $packageRoot
            if ($LASTEXITCODE -ne 0) { throw 'RC7 turnkey runtime contract failed after clean extraction' }
            & $packagePython -m rc7_release.plugin_payload inspect --home $packageRoot
            if ($LASTEXITCODE -ne 0) { throw 'Package-local DSH plugin payload missing after clean extraction' }
            & $packagePython -m rc7_release.windows_clean_qualification --package-root $packageRoot
            if ($LASTEXITCODE -ne 0) { throw 'Windows clean package qualification failed' }
            if (-not (Test-Path -LiteralPath (Join-Path $packageRoot 'packaging\rc7\QUALIFY-BANK-SERVICES.cmd'))) { throw 'Bank service qualification entrypoint missing from final package' }
            if (-not (Test-Path -LiteralPath (Join-Path $packageRoot 'packaging\rc7\bank-field-providers.example.json'))) { throw 'Bank field provider template missing from final package' }
          }
          finally {
            Pop-Location
          }
      - name: Qualify final package through real Git Bash entrypoint
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_ROOT="$GITHUB_WORKSPACE/clean-extract/PFC-AITest-DSH-Turnkey-RC7-BANK-WIN10"
          FAKE_ROOT="$RUNNER_TEMP/rc7-git-bash-dsh"
          DSH_HOME="$FAKE_ROOT/home"
          BIN="$FAKE_ROOT/bin"
          rm -rf "$FAKE_ROOT"
          mkdir -p "$BIN" "$DSH_HOME/profiles/web/node_modules/wizard-opencode-plugin"
          cat > "$DSH_HOME/profiles/web/package.json" <<'JSON'
          {"name":"bank-web","dependencies":{"wizard-opencode-plugin":"file:bank"}}
          JSON
          cat > "$DSH_HOME/profiles/web/node_modules/wizard-opencode-plugin/package.json" <<'JSON'
          {"name":"wizard-opencode-plugin","version":"bank-private-ci"}
          JSON
          BEFORE="$(sha256sum "$DSH_HOME/profiles/web/package.json" "$DSH_HOME/profiles/web/node_modules/wizard-opencode-plugin/package.json")"
          cat > "$BIN/dsh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "${1:-}" == "--version" ]]; then
            echo "dsh-engineering-host-stub"
            exit 0
          fi
          if [[ "${1:-}" == "plugin" ]]; then
            exit 0
          fi
          if [[ "$*" == *"--dump-config"* ]]; then
            echo '[]'
            exit 0
          fi
          printf '%s\n' "$*" > "${RUNNER_TEMP}/rc7-dsh-final-invocation.txt"
          exit 0
          SH
          chmod +x "$BIN/dsh"
          export DSH_HOME
          export PATH="$BIN:$PATH"
          cd "$PACKAGE_ROOT"
          ./packaging/rc7/AITEST.sh
          AFTER="$(sha256sum "$DSH_HOME/profiles/web/package.json" "$DSH_HOME/profiles/web/node_modules/wizard-opencode-plugin/package.json")"
          [[ "$BEFORE" == "$AFTER" ]]
          grep -q '"status": "PASS"' state/rc7-dsh-runtime-profile.json
          grep -q '"protected_bank_profile_integrity": "PASS"' state/rc7-dsh-runtime-profile.json
          grep -q -- '--profile rc7-bank' "$RUNNER_TEMP/rc7-dsh-final-invocation.txt"
          grep -q -- '--patch' "$RUNNER_TEMP/rc7-dsh-final-invocation.txt"
          test -x ./packaging/rc7/QUALIFY-BANK-SERVICES.sh

  field-hardened-package:
    name: Rebuild RC7 Field-Hardened transport package
    needs: windows-clean-qualification
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Materialize package-local DSH plugin payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm --version
          if ($LASTEXITCODE -ne 0) { throw 'npm is required to build the offline DSH plugin payload' }
          python -m rc7_release.plugin_payload acquire --repo-root .
          if ($LASTEXITCODE -ne 0) { throw 'RC7 DSH plugin payload acquisition failed' }
      - name: Rebuild final transport artifact from qualified HEAD
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $commit = (git rev-parse HEAD).Trim()
          $packageName = 'PFC-AITest-DSH-Turnkey-RC7-BANK-WIN10'
          python -m rc7_release.package build --repo-root . --output .\dist --source-commit $commit
          if ($LASTEXITCODE -ne 0) { throw 'RC7 final transport package build failed' }
          $packageRoot = [System.IO.Path]::GetFullPath((Join-Path '.\dist' $packageName))
          $packagePython = Join-Path $packageRoot 'workspace-template\runtime\python\python.exe'
          Push-Location $packageRoot
          try {
            & $packagePython -m rc7_release.runtime_delivery_contract --package-root $packageRoot
            if ($LASTEXITCODE -ne 0) { throw 'RC7 final transport runtime contract failed' }
            & $packagePython -m rc7_release.plugin_payload inspect --home $packageRoot
            if ($LASTEXITCODE -ne 0) { throw 'RC7 final transport DSH plugin payload verification failed' }
            & $packagePython -m rc7_release.package verify --package-root $packageRoot
            if ($LASTEXITCODE -ne 0) { throw 'RC7 final transport package verification failed' }
          }
          finally {
            Pop-Location
          }
      - name: Upload RC7 Field-Hardened transport package
        uses: actions/upload-artifact@v4
        with:
          name: RC7-Field-Hardened-${{ github.sha }}
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*.zip.sha256