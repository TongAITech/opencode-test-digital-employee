name: RC7 Field Hardening

on:
  push:
    branches:
      - work/rc7-field-hardening
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'rc7_release/**'
      - 'rc7_runtime/**'
      - 'packaging/rc7/**'
      - 'tests/test_rc7*.py'
      - '.github/workflows/rc7-field-hardening.yml'
  workflow_dispatch:
    inputs:
      final_qualification:
        description: 'Final engineering gate only: full source + one certified offline ZIP'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

# PR Actions normally check out a synthetic refs/pull/*/merge SHA. An offline
# transport artifact must instead attest the real proposed source HEAD.
env:
  RC7_PACKAGE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  field-hardening-source-regression:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Source regression (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RC7_PACKAGE_SOURCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile hardened modules
        run: >-
          python -m py_compile
          rc7_release/runtime_delivery_contract.py
          rc7_release/runtime_clean_smoke.py
          rc7_release/runtime_turnkey_certificate.py
          rc7_release/runtime_payload_materializer.py
          rc7_release/runtime_build_bootstrap.py
          rc7_release/mcp_server.py
          rc7_release/mcp_server_field.py
          rc7_release/mcp_stdio.py
          rc7_release/codegraph_mcp.py
          rc7_release/contracted_runner.py
          rc7_release/plugin_payload.py
          rc7_release/dsh_plugins.py
          rc7_release/dsh_runtime_profile.py
          rc7_release/dsh_plugin_qualification.py
          rc7_release/plugin_effect_qualification.py
          rc7_release/dsh.py
          rc7_release/professional_tools.py
          rc7_release/final_unified_qualification.py
          rc7_release/windows_clean_qualification.py
          rc7_release/real_mission_qualification_strict.py
          rc7_runtime/truth_overlay.py
          rc7_runtime/reality_recon.py
          rc7_runtime/mission_conformance.py
          rc7_runtime/mission_stage_dispatch.py
          rc7_runtime/control_plane.py
          rc7_runtime/closed_loop_control.py
          rc7_runtime/case_runtime.py
          rc7_runtime/case_fanout_conformance.py
          rc7_runtime/case_coverage_field_summary.py
          rc7_runtime/case_script_bundle_resolver.py
          rc7_runtime/script_fanout_evaluator.py
          rc7_runtime/execution_fanout_conformance.py
          rc7_runtime/execution_fanout_evaluator.py
          rc7_runtime/runtime_execution_control.py
          rc7_runtime/autonomous_execution_service.py
          rc7_runtime/bank_field_services.py
          rc7_runtime/execution_recovery_conformance.py
          rc7_runtime/oracle_runtime.py
          rc7_runtime/oracle_conformance.py
          rc7_runtime/defect_review_conformance.py
          rc7_runtime/mission_convergence_conformance.py
          rc7_runtime/mission_formal_evidence_builder.py
          rc7_runtime/final_report.py
      - name: Run field-hardening regressions
        run: >-
          python -m pytest -q
          tests/test_rc7_runtime_delivery_contract.py
          tests/test_rc7_runtime_clean_smoke.py
          tests/test_rc7_runtime_turnkey_certificate.py
          tests/test_rc7_runtime_payload_materializer.py
          tests/test_rc7_runtime_build_bootstrap.py
          tests/test_rc7_field_hardening.py
          tests/test_rc7_workflow_source_identity.py
          tests/test_rc7_plugin_payload.py
          tests/test_rc7_dsh_runtime_profile.py
          tests/test_rc7_dsh_plugin_qualification.py
          tests/test_rc7_plugin_effect_qualification.py
          tests/test_rc7_plugin_effect_bank_entrypoint.py
          tests/test_rc7_bank_field_conformance.py
          tests/test_rc7_bank_field_services.py
          tests/test_rc7_bank_field_services_entrypoint.py
          tests/test_rc7_mcp_stdio.py
          tests/test_rc7_mcp_server_field.py
          tests/test_rc7_professional_windows_decode.py
          tests/test_rc7_truth_overlay.py
          tests/test_rc7_case_runtime.py
          tests/test_rc7_case_fanout_conformance.py
          tests/test_rc7_case_coverage_field_summary.py
          tests/test_rc7_case_script_bundle_resolver.py
          tests/test_rc7_script_fanout_control_gate.py
          tests/test_rc7_execution_fanout_conformance.py
          tests/test_rc7_execution_fanout_defect_handoff.py
          tests/test_rc7_multi_case_defect_control_plane_bridge.py
          tests/test_rc7_bank_fanout_preparation_guard.py
          tests/test_rc7_active_execution_preparation.py
          tests/test_rc7_three_case_execution_qualification.py
          tests/test_rc7_runtime_execution_control.py
          tests/test_rc7_execution_recovery_conformance.py
          tests/test_rc7_contracted_runner.py
          tests/test_rc7_oracle_conformance.py
          tests/test_rc7_defect_review_conformance.py
          tests/test_rc7_mission_convergence_conformance.py
          tests/test_rc7_mission_formal_evidence_builder.py
          tests/test_rc7_final_report.py
          tests/test_rc7_final_report_convergence_guard.py
          tests/test_rc7_product_defect_mission_e2e.py

  rc7-source-suite:
    name: RC7 source suite
    # No 2,500+ test full sweep on each defect/function commit.
    if: github.event_name == 'workflow_dispatch' && inputs.final_qualification == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RC7_PACKAGE_SOURCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Install real C09 Chromium CDP smoke dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'playwright==1.62.0'
          python -m playwright install --with-deps chromium
      - name: Run RC7-focused source tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find tests -maxdepth 1 -type f -name 'test_rc7*.py' -print | sort)
          printf 'RC7 tests (%s):\n' "${#tests[@]}"
          printf ' - %s\n' "${tests[@]}"
          python -m pytest -q "${tests[@]}"

  field-hardened-package:
    name: "Final certified offline ZIP: single build and independent re-extract"
    # Explicit only, NEVER on ordinary pushes or PR commits.
    if: github.event_name == 'workflow_dispatch' && inputs.final_qualification == true
    needs:
      - field-hardening-source-regression
      - rc7-source-suite
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RC7_PACKAGE_SOURCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bootstrap SHA-verified Windows build tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m rc7_release.runtime_build_bootstrap ripgrep --output .\.build-runtime\ripgrep --github-path $env:GITHUB_PATH
          if ($LASTEXITCODE -ne 0) { throw 'RC7 ripgrep build bootstrap failed' }
      - name: Materialize package-local DSH plugin payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm --version
          if ($LASTEXITCODE -ne 0) { throw 'npm is required to build the offline DSH plugin payload' }
          python -m rc7_release.plugin_payload acquire --repo-root .
          if ($LASTEXITCODE -ne 0) { throw 'RC7 DSH plugin payload acquisition failed' }
      - name: Rebuild, clean-smoke, certify and verify final transport artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $commit = (git rev-parse HEAD).Trim()
          $expected = $env:RC7_PACKAGE_SOURCE_SHA
          if ($commit -ne $expected) { throw "RC7_PACKAGE_SOURCE_IDENTITY_MISMATCH:HEAD=$commit:EXPECTED=$expected" }
          $packageName = 'PFC-AITest-DSH-Turnkey-RC7-BANK-WIN10'
          python -m rc7_release.package build --repo-root . --output .\dist --source-commit $commit
          if ($LASTEXITCODE -ne 0) { throw 'RC7 final transport package build failed' }
          $packageRoot = [System.IO.Path]::GetFullPath((Join-Path '.\dist' $packageName))
          $zips = @(Get-ChildItem -Path .\dist -Filter '*.zip' -File)
          if ($zips.Count -ne 1) { throw "Expected exactly one RC7 final zip, got $($zips.Count)" }
          $zip = $zips[0]

          python -m rc7_release.runtime_payload_materializer --package-root $packageRoot --zip $zip.FullName
          if ($LASTEXITCODE -ne 0) { throw 'RC7 final runtime payload materialization failed' }
          $packagePython = Join-Path $packageRoot 'workspace-template\runtime\python\python.exe'
          Push-Location $packageRoot
          try {
            & $packagePython -m rc7_release.runtime_delivery_contract --package-root $packageRoot
            if ($LASTEXITCODE -ne 0) { throw 'RC7 final transport runtime contract failed' }
            & $packagePython -m rc7_release.plugin_payload inspect --home $packageRoot
            if ($LASTEXITCODE -ne 0) { throw 'RC7 final transport DSH plugin payload verification failed' }
            & $packagePython -m rc7_release.package verify --package-root $packageRoot
            if ($LASTEXITCODE -ne 0) { throw 'RC7 final transport package verification failed before certificate' }
          }
          finally {
            Pop-Location
          }

          $preCertExtract = [System.IO.Path]::GetFullPath((Join-Path $PWD 'final-pre-cert-extract'))
          if (Test-Path -LiteralPath $preCertExtract) { Remove-Item -LiteralPath $preCertExtract -Recurse -Force }
          New-Item -ItemType Directory -Path $preCertExtract | Out-Null
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $preCertExtract -Force
          $cleanPackageRoot = Join-Path $preCertExtract $packageName

          python -m rc7_release.runtime_turnkey_certificate issue --package-root $packageRoot --clean-package-root $cleanPackageRoot --transport-zip $zip.FullName
          if ($LASTEXITCODE -ne 0) { throw 'RC7 turnkey runtime certificate issuance failed' }

          $finalExpected = ((Get-Content -LiteralPath "$($zip.FullName).sha256" -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $finalActual = (Get-FileHash -LiteralPath $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($finalExpected -ne $finalActual) { throw 'Certified final ZIP checksum mismatch' }

          Push-Location $packageRoot
          try {
            & $packagePython -m rc7_release.runtime_turnkey_certificate verify --package-root $packageRoot
            if ($LASTEXITCODE -ne 0) { throw 'RC7 built-root turnkey runtime certificate verification failed' }
            & $packagePython -m rc7_release.package verify --package-root $packageRoot
            if ($LASTEXITCODE -ne 0) { throw 'RC7 final transport package verification failed after certificate' }
          }
          finally {
            Pop-Location
          }

          $certifiedExtract = [System.IO.Path]::GetFullPath((Join-Path $PWD 'final-certified-extract'))
          if (Test-Path -LiteralPath $certifiedExtract) { Remove-Item -LiteralPath $certifiedExtract -Recurse -Force }
          New-Item -ItemType Directory -Path $certifiedExtract | Out-Null
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $certifiedExtract -Force
          $certifiedRoot = Join-Path $certifiedExtract $packageName
          $certifiedPython = Join-Path $certifiedRoot 'workspace-template\runtime\python\python.exe'
          Push-Location $certifiedRoot
          try {
            & $certifiedPython -m rc7_release.runtime_turnkey_certificate verify --package-root $certifiedRoot --rerun-smoke
            if ($LASTEXITCODE -ne 0) { throw 'RC7 certified ZIP offline rerun-smoke verification failed' }
            # Reuse the original RC7 clean Windows Mission v2 and R1 A->B->C
            # session-handoff proof on the ONE certified, re-extracted package.
            # Do not rebuild or certify a second ZIP on feature commits.
            & $certifiedPython -m rc7_release.windows_clean_qualification --package-root $certifiedRoot
            if ($LASTEXITCODE -ne 0) { throw 'RC7 certified ZIP Windows clean-session qualification failed' }
            & $certifiedPython -m rc7_release.runtime_delivery_contract --package-root $certifiedRoot
            if ($LASTEXITCODE -ne 0) { throw 'RC7 certified ZIP runtime contract failed' }
            & $certifiedPython -m rc7_release.package verify --package-root $certifiedRoot
            if ($LASTEXITCODE -ne 0) { throw 'RC7 certified ZIP package verification failed' }
          }
          finally {
            Pop-Location
          }
      - name: Qualify final package through real Git Bash entrypoint
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_ROOT="$GITHUB_WORKSPACE/final-certified-extract/PFC-AITest-DSH-Turnkey-RC7-BANK-WIN10"
          FAKE_ROOT="$RUNNER_TEMP/rc7-git-bash-dsh"
          DSH_HOME="$FAKE_ROOT/home"
          BIN="$FAKE_ROOT/bin"
          rm -rf "$FAKE_ROOT"
          mkdir -p "$BIN" "$DSH_HOME/profiles/web/node_modules/wizard-opencode-plugin"
          cat > "$DSH_HOME/profiles/web/package.json" <<'JSON'
          {"name":"bank-web","dependencies":{"wizard-opencode-plugin":"file:bank"}}
          JSON
          cat > "$DSH_HOME/profiles/web/node_modules/wizard-opencode-plugin/package.json" <<'JSON'
          {"name":"wizard-opencode-plugin","version":"bank-private-ci"}
          JSON
          BEFORE="$(sha256sum "$DSH_HOME/profiles/web/package.json" "$DSH_HOME/profiles/web/node_modules/wizard-opencode-plugin/package.json")"
          cat > "$BIN/dsh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "${1:-}" == "--version" ]]; then
            echo "dsh-engineering-host-stub"
            exit 0
          fi
          if [[ "${1:-}" == "plugin" ]]; then
            exit 0
          fi
          if [[ "$*" == *"--dump-config"* ]]; then
            echo '[]'
            exit 0
          fi
          printf '%s\n' "$*" > "${RUNNER_TEMP}/rc7-dsh-final-invocation.txt"
          exit 0
          SH
          chmod +x "$BIN/dsh"
          export DSH_HOME
          export PATH="$BIN:$PATH"
          cd "$PACKAGE_ROOT"
          ./packaging/rc7/AITEST.sh
          AFTER="$(sha256sum "$DSH_HOME/profiles/web/package.json" "$DSH_HOME/profiles/web/node_modules/wizard-opencode-plugin/package.json")"
          [[ "$BEFORE" == "$AFTER" ]]
          grep -q '"status": "PASS"' state/rc7-dsh-runtime-profile.json
          grep -q '"protected_bank_profile_integrity": "PASS"' state/rc7-dsh-runtime-profile.json
          grep -q -- '--profile rc7-bank' "$RUNNER_TEMP/rc7-dsh-final-invocation.txt"
          grep -q -- '--patch' "$RUNNER_TEMP/rc7-dsh-final-invocation.txt"
          test -x ./packaging/rc7/QUALIFY-BANK-SERVICES.sh
      - name: Upload RC7 Field-Hardened transport package
        uses: actions/upload-artifact@v4
        with:
          name: RC7-Field-Hardened-${{ env.RC7_PACKAGE_SOURCE_SHA }}
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*.zip.sha256
