name: RC7 AgileTC Worker Timeout Qualification

on:
  push:
    branches: [validation/agiletc-worker-timeout-evidence]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LOCAL_MODEL_API_KEY: ollama-local
      OLLAMA_HOST: 127.0.0.1:11434
      DSH_PERMISSION_MODE: read-only

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}

      - uses: actions/setup-node@v4
        with: {node-version: '22'}

      - name: Unit qualification
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q \
            tests/test_rc7_dsh_tool_authority.py \
            tests/test_rc7_external_input_readiness.py \
            tests/test_rc7_bank_dsh_tool_policy.py \
            tests/test_rc7_node_tool_conformance.py

      - name: Install DSH and local Qwen3
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          npm install -g @deepseek-ai/dsh
          dsh --version | tee dsh-version.txt
          curl -fsSL https://ollama.com/install.sh | sh
          if curl -fsS http://127.0.0.1:11434/api/tags > ollama-prestart-tags.json 2>/dev/null; then
            echo prestarted | tee ollama-service-mode.txt
          else
            echo explicit-serve | tee ollama-service-mode.txt
            nohup ollama serve > ollama.log 2>&1 &
          fi
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:11434/api/tags > ollama-tags.json && break
            sleep 2
          done
          test -s ollama-tags.json
          ollama pull qwen3:4b | tee ollama-pull.log

      - name: Direct Ollama latency probes
        shell: bash
        run: |
          set +e
          prompt='Return exactly one JSON object and nothing else: {"status":"PASS","proof":"direct_probe"}.'

          native_started=$(date +%s)
          curl -sS --max-time 180 \
            -H 'Content-Type: application/json' \
            http://127.0.0.1:11434/api/chat \
            -d "$(python -c 'import json,sys; print(json.dumps({"model":"qwen3:4b","messages":[{"role":"user","content":sys.argv[1]}],"think":False,"stream":False,"options":{"num_predict":64}}))' "$prompt")" \
            > native-chat.json 2> native-chat.stderr
          native_rc=$?
          native_elapsed=$(($(date +%s)-native_started))
          printf '%s\n' "$native_rc" > native-chat.exit
          printf '%s\n' "$native_elapsed" > native-chat.elapsed

          openai_started=$(date +%s)
          curl -sS --max-time 180 \
            -H 'Content-Type: application/json' \
            -H 'Authorization: Bearer ollama-local' \
            http://127.0.0.1:11434/v1/chat/completions \
            -d "$(python -c 'import json,sys; print(json.dumps({"model":"qwen3:4b","messages":[{"role":"user","content":sys.argv[1]}],"stream":False,"max_tokens":64,"chat_template_kwargs":{"enable_thinking":False}}))' "$prompt")" \
            > openai-chat.json 2> openai-chat.stderr
          openai_rc=$?
          openai_elapsed=$(($(date +%s)-openai_started))
          printf '%s\n' "$openai_rc" > openai-chat.exit
          printf '%s\n' "$openai_elapsed" > openai-chat.elapsed

          python - <<'PY'
          import json
          from pathlib import Path

          def read_json(path):
              try:
                  return json.loads(Path(path).read_text(encoding='utf-8'))
              except Exception as exc:
                  return {'_parse_error': repr(exc), '_raw': Path(path).read_text(encoding='utf-8', errors='replace') if Path(path).exists() else ''}

          native = read_json('native-chat.json')
          openai = read_json('openai-chat.json')
          native_message = native.get('message') if isinstance(native, dict) else None
          native_content = native_message.get('content') if isinstance(native_message, dict) else None
          native_thinking = native_message.get('thinking') if isinstance(native_message, dict) else None
          choices = openai.get('choices') if isinstance(openai, dict) else None
          openai_message = choices[0].get('message') if isinstance(choices, list) and choices and isinstance(choices[0], dict) else None
          result = {
              'native': {
                  'exit': int(Path('native-chat.exit').read_text()),
                  'elapsed_seconds': int(Path('native-chat.elapsed').read_text()),
                  'content_chars': len(str(native_content or '')),
                  'thinking_chars': len(str(native_thinking or '')),
                  'done': native.get('done') if isinstance(native, dict) else None,
                  'error': native.get('error') if isinstance(native, dict) else None,
              },
              'openai': {
                  'exit': int(Path('openai-chat.exit').read_text()),
                  'elapsed_seconds': int(Path('openai-chat.elapsed').read_text()),
                  'content_chars': len(str(openai_message.get('content') or '')) if isinstance(openai_message, dict) else 0,
                  'reasoning_chars': len(str(openai_message.get('reasoning_content') or '')) if isinstance(openai_message, dict) else 0,
                  'error': openai.get('error') if isinstance(openai, dict) else None,
              },
          }
          Path('direct-probe-result.json').write_text(json.dumps(result, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(result, sort_keys=True))
          PY
          exit 0

      - name: Build reasoning-off patch
        shell: bash
        run: |
          set -euo pipefail
          cat > qwen-reasoning-off.patch.yml <<'YAML'
          - id: llm-pi-ai
            config:
              providers:
                local-ollama:
                  apiKeyEnv: LOCAL_MODEL_API_KEY
                  api: openai-completions
                  baseURL: http://127.0.0.1:11434/v1
                  reasoning: off
                  models:
                    - id: qwen3:4b
                      contextWindow: 32768
                      maxTokens: 128
                      reasoningEfforts:
                        off:
                        medium: medium
                      compat:
                        thinkingFormat: qwen-chat-template
                        chatTemplateKwargs:
                          enable_thinking:
                            $var: thinking.enabled
          - id: agent-default-model
            config:
              provider: local-ollama
              model: qwen3:4b
              reasoningEffort: off
          YAML
          cat qwen-reasoning-off.patch.yml \
              validation/dsh/rc7-headless-minimal.patch.yml \
            > effective.patch.yml
          dsh --profile headless --patch effective.patch.yml --dump-config \
            > effective-config.yml
          grep -q 'thinkingFormat: qwen-chat-template' effective-config.yml
          grep -q 'enable_thinking:' effective-config.yml
          grep -Eq "reasoningEffort: ['\"]?off['\"]?" effective-config.yml

      - name: Prove DSH Qwen3 reasoning-off path
        shell: bash
        timeout-minutes: 4
        run: |
          set +e
          started=$(date +%s)
          timeout --signal=TERM --kill-after=15s 180s \
            dsh --profile headless --patch effective.patch.yml --json \
              'Return exactly one JSON object and nothing else: {"status":"PASS","proof":"reasoning_off"}. Do not call any tool.' \
            > reasoning-off.jsonl 2> reasoning-off.stderr
          rc=$?
          ended=$(date +%s)
          echo "$rc" > reasoning-off.exit
          echo "$((ended-started))" > reasoning-off.elapsed
          python - <<'PY'
          import json
          from pathlib import Path
          from rc6_runtime.agent_runtime import DshHeadlessWorkerLauncher

          text = Path('reasoning-off.jsonl').read_text(encoding='utf-8', errors='replace')
          events = tuple(DshHeadlessWorkerLauncher._parse_json_lines(text))
          final = DshHeadlessWorkerLauncher._final_json(events)
          thinking_chars = sum(
              len(str(event.get('text') or ''))
              for event in events
              if str(event.get('type') or '').lower() == 'thinking'
          )
          exit_code = int(Path('reasoning-off.exit').read_text().strip())
          elapsed = int(Path('reasoning-off.elapsed').read_text().strip())
          result = {
              'process_exit': exit_code,
              'elapsed_seconds': elapsed,
              'thinking_chars': thinking_chars,
              'event_count': len(events),
              'final_json': final,
          }
          ok = (
              exit_code == 0
              and thinking_chars == 0
              and isinstance(final, dict)
              and final.get('status') == 'PASS'
              and final.get('proof') == 'reasoning_off'
          )
          result['status'] = 'PASS' if ok else 'FAIL'
          Path('reasoning-off-result.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(result, sort_keys=True))
          raise SystemExit(0 if ok else 2)
          PY

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc7-worker-timeout-qualification-${{ github.sha }}
          path: |
            dsh-version.txt
            ollama-service-mode.txt
            ollama-prestart-tags.json
            ollama-tags.json
            ollama.log
            ollama-pull.log
            native-chat.json
            native-chat.stderr
            native-chat.exit
            native-chat.elapsed
            openai-chat.json
            openai-chat.stderr
            openai-chat.exit
            openai-chat.elapsed
            direct-probe-result.json
            qwen-reasoning-off.patch.yml
            effective.patch.yml
            effective-config.yml
            reasoning-off.jsonl
            reasoning-off.stderr
            reasoning-off.exit
            reasoning-off.elapsed
            reasoning-off-result.json
          if-no-files-found: warn
          retention-days: 14
