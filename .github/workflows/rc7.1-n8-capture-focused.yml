name: RC7.1 N8 Capture Failure Focused Gate

on:
  push:
    branches:
      - work/rc7.1-minimal-hardening
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-n8-capture-failure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: N8 capture failure durable blocker focused test
        run: >-
          python -m pytest -q
          tests/test_rc7_1_bank_n8_recovery_blocker.py
          -k capture_after_execution_failure
