name: RC8 Distributed Node Team Runtime

on:
  push:
    branches: [work/rc8]
    paths:
      - 'rc8_center/control_plane.py'
      - 'rc8_center/distributed_orchestration.py'
      - 'rc8_center/node_team_runtime.py'
      - 'rc8_runtime/contracts.py'
      - 'rc8_runtime/r1_runtime.py'
      - 'tests/test_rc8_distributed_orchestration.py'
      - 'tests/test_rc8_node_team_runtime.py'
      - '.github/workflows/rc8-node-team-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-team-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Install test dependency
        shell: bash
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile distributed runtime
        shell: bash
        run: |
          python -m py_compile \
            rc8_center/distributed_orchestration.py \
            rc8_center/node_team_runtime.py \
            tests/test_rc8_distributed_orchestration.py \
            tests/test_rc8_node_team_runtime.py
      - name: Run distributed orchestration and node-team regressions
        shell: bash
        run: >-
          python -m pytest -q
          tests/test_rc8_distributed_orchestration.py
          tests/test_rc8_node_team_runtime.py
