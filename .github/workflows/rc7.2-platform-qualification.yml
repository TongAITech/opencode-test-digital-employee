name: RC7.2 Platform Qualification Baseline

on:
  push:
    branches:
      - work/rc7.2
    paths:
      - 'rc6_runtime/**'
      - 'rc7_runtime/**'
      - 'rc7_release/**'
      - 'tests/test_rc72_*.py'
      - 'tests/test_rc7_*.py'
      - 'docs/rc7.2/**'
      - '.github/workflows/rc7.2-platform-qualification.yml'
  # PR runs only the two platform/browser admission probes, not two more
  # 60-minute complete RC7.2 suites. Full Q1 still runs on main push.
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [work/rc7.2]
    paths:
      - '.github/workflows/rc7.2-platform-qualification.yml'
      - 'tests/test_rc72_c09_real_chromium_cdp_smoke.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc72-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-platform-baseline:
    name: q1-${{ matrix.label }}-python-3.8
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-engineering
            qualification_kind: WINDOWS_ENGINEERING
          - os: ubuntu-22.04
            label: linux-engineering-proxy
            qualification_kind: LINUX_ENGINEERING_PROXY
    runs-on: ${{ matrix.os }}
    # The full Windows suite exceeded 30m on b032924 (check run 125533816804).
    # Existing contract files retain 180s. The full N1..N7 integration drives
    # all 28 approved Cases through actual processes, cleanup and cold audit;
    # give only that explicit workload a separate finite 900s budget.
    timeout-minutes: 120
    steps:
      - name: Checkout exact RC7.2 source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          cache: 'pip'
          cache-dependency-path: rc7_release/requirements-qualification.txt

      - name: Bootstrap pinned qualification dependency with hard timeout
        run: >-
          python -m rc7_release.rc72_pytest_bootstrap
          --requirements rc7_release/requirements-qualification.txt
          --timeout-seconds 120

      # Playwright 1.62.x requires Python >=3.10. Q1 mandates Python 3.8;
      # pin the last compatible harness for Q1 only. Modern C09 CDP
      # remains independently validated on Python 3.11 / Playwright 1.62.
      - name: Install pinned Python 3.8-compatible Playwright
        run: python -m pip install --disable-pip-version-check playwright==1.48.0

      - name: Provision actual matching Chromium and Linux libraries
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium

      - name: Provision actual matching Chromium on Windows
        if: runner.os == 'Windows'
        run: python -m playwright install chromium

      - name: Fail if real Python 3.8 browser runtime is missing
        run: >-
          python -c "import importlib.metadata as m; from pathlib import Path;
          from playwright.sync_api import sync_playwright;
          assert m.version('playwright')=='1.48.0';
          p=sync_playwright().start();
          assert Path(p.chromium.executable_path).is_file(), 'Q1_REAL_CHROMIUM_REQUIRED';
          p.stop()"

      - name: Compile RC7.2 and inherited runtime
        run: python -m compileall -q rc6_runtime rc7_runtime rc7_release

      - name: Run RC7.2 contract suite with bounded file diagnostics
        # Libra creates 14 independent actual N1/N7/N9/report contexts. a58
        # completed 13 before the Windows 180s file limit. Isolated Windows
        # rerun passed all 14 in 141.979s; retain every case with finite margin.
        run: >-
          python -m rc7_release.rc72_bounded_pytest
          --pattern "tests/test_rc72_*.py"
          --timeout-seconds 180
          --file-timeout tests/test_rc72_release_driver_n7.py=900
          --file-timeout tests/test_rc72_release_driver_n10.py=900
          --file-timeout tests/test_rc72_libra_measurement.py=300
          --junit-dir rc72-platform-junit

      - name: Run inherited RC7 regression with bounded file diagnostics
        run: >-
          python -m rc7_release.rc72_bounded_pytest
          --pattern "tests/test_rc7_*.py"
          --timeout-seconds 180
          --junit-dir rc7-inherited-junit

      - name: Emit Q1 structured evidence
        run: >-
          python -m rc7_release.rc72_platform_qualification
          --qualification-kind ${{ matrix.qualification_kind }}
          --source-commit ${{ github.sha }}
          --output rc72-q1-platform-evidence.json

      - name: Upload Q1 diagnostics and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc72-q1-${{ matrix.label }}-${{ github.sha }}
          path: |
            rc72-platform-junit/*.xml
            rc7-inherited-junit/*.xml
            rc72-q1-platform-evidence.json
          if-no-files-found: warn
          retention-days: 14

  # Required PR proof: both C09 tests execute against an ACTUAL Chromium
  # on Windows/Linux under the exact Python 3.8 environment Q1 uses.
  q1-browser-py38-pr-admission:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    name: q1-browser-py38-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Install pinned Python 3.8 smoke harness
        run: python -m pip install --disable-pip-version-check pytest==8.3.5 playwright==1.48.0
      - name: Install Linux actual Chromium and system libraries
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - name: Install Windows actual Chromium
        if: runner.os == 'Windows'
        run: python -m playwright install chromium
      - name: Assert exact PR HEAD and real Chromium before testing
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA" || exit 1
          python -c "import importlib.metadata as m; from pathlib import Path; from playwright.sync_api import sync_playwright; assert m.version('playwright')=='1.48.0'; p=sync_playwright().start(); assert Path(p.chromium.executable_path).is_file(); p.stop()"
      - name: Prove real CDP, HTTP POST, DOM, network Oracle, PNG and R1
        env:
          RC72_C09_EVIDENCE_EXPORT_ROOT: rc72-q1-real-cdp-evidence
        run: >-
          python -m pytest -v
          --junitxml=rc72-q1-real-chromium.xml
          tests/test_rc72_c09_real_chromium_cdp_smoke.py
      - name: Upload independent real browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc72-q1-real-chromium-${{ matrix.os }}-${{ github.event.pull_request.head.sha }}
          path: |
            rc72-q1-real-chromium.xml
            rc72-q1-real-cdp-evidence/
          retention-days: 14
          if-no-files-found: warn

  q1-summary:
    if: github.event_name != 'pull_request'
    name: q1-source-platform-baseline
    needs: source-platform-baseline
    runs-on: ubuntu-22.04
    steps:
      - name: Q1 baseline decision
        run: |
          echo 'Q1 source-platform engineering baseline: PASS'
          echo 'This is not target Linux Field qualification.'
          echo 'This is not BANK_FINAL.'
