name: Recovery G5 human gate focused qualification

on:
  push:
    branches: [work/v1.13.0-recovery-turnkey-validation]
    paths:
      - workspace-template/.pfc-internal-field-validation/tests/test_g3_testing_intelligence_product_path.py
      - workspace-template/.pfc-internal-field-validation/tests/test_g5_product_path.py
      - workspace-template/.pfc-internal-field-validation/tests/test_g5_worker_binding_and_recovery.py
      - workspace-template/.pfc-internal-field-validation/tests/test_g5_adversarial_defect_truth.py
      - workspace-template/.pfc-internal-field-validation/tests/test_g5_human_gate_and_duplicate_correlation.py
      - .github/workflows/recovery-g5-human-focused.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  g5-human:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Reuse qualified portable Python
        uses: actions/download-artifact@v4
        with:
          name: recovery-qualified-package
          github-token: ${{ github.token }}
          run-id: 34278790485
          path: ${{ runner.temp }}/g5-human-payload
      - name: Verify and expand qualified payload
        shell: pwsh
        run: |
          $incoming = Join-Path $env:RUNNER_TEMP 'g5-human-payload'
          $zip = Join-Path $incoming 'AITest-V1.13.0-Recovery-Turnkey-Windows-x64.zip'
          $expected = '49d8e4dc0a38a1ea89b5872bb7926151b938172650bec2534ce73c43f76e9be2'
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Offline payload input hash mismatch' }
          $expanded = Join-Path $env:RUNNER_TEMP 'g5-human-expanded'
          Expand-Archive $zip -DestinationPath $expanded
          $bundle = Get-ChildItem $expanded -Directory | Select-Object -First 1
          if (-not $bundle) { throw 'Qualified payload root missing' }
          $python = Join-Path $bundle.FullName 'workspace-template/runtime/python/python.exe'
          if (-not (Test-Path $python)) { throw 'Portable Python missing' }
          "FOCUSED_PYTHON=$python" | Out-File $env:GITHUB_ENV -Append
      - name: Run G5 product path regression
        shell: pwsh
        run: |
          $env:PYTHONNOUSERSITE='1'; $env:PYTHONDONTWRITEBYTECODE='1'; $env:PYTHONUTF8='1'
          $test='workspace-template/.pfc-internal-field-validation/tests/test_g5_product_path.py'
          & "$env:FOCUSED_PYTHON" -X utf8 -c "import sys,runpy; from pathlib import Path; p=sys.argv[1]; sys.path.insert(0,str(Path(p).parent)); sys.argv=[p]; runpy.run_path(p,run_name='__main__')" $test 2>&1 | Tee-Object -FilePath RECOVERY_G5_HUMAN_FOCUSED.log
          if ($LASTEXITCODE -ne 0) { throw 'G5 product regression failed' }
      - name: Run G5 worker binding regression
        shell: pwsh
        run: |
          $test='workspace-template/.pfc-internal-field-validation/tests/test_g5_worker_binding_and_recovery.py'
          & "$env:FOCUSED_PYTHON" -X utf8 -c "import sys,runpy; from pathlib import Path; p=sys.argv[1]; sys.path.insert(0,str(Path(p).parent)); sys.argv=[p]; runpy.run_path(p,run_name='__main__')" $test 2>&1 | Tee-Object -FilePath RECOVERY_G5_HUMAN_FOCUSED.log -Append
          if ($LASTEXITCODE -ne 0) { throw 'G5 worker regression failed' }
      - name: Run G5 adversarial regression
        shell: pwsh
        run: |
          $test='workspace-template/.pfc-internal-field-validation/tests/test_g5_adversarial_defect_truth.py'
          & "$env:FOCUSED_PYTHON" -X utf8 -c "import sys,runpy; from pathlib import Path; p=sys.argv[1]; sys.path.insert(0,str(Path(p).parent)); sys.argv=[p]; runpy.run_path(p,run_name='__main__')" $test 2>&1 | Tee-Object -FilePath RECOVERY_G5_HUMAN_FOCUSED.log -Append
          if ($LASTEXITCODE -ne 0) { throw 'G5 adversarial regression failed' }
      - name: Run G5 human gate and duplicate correlation
        shell: pwsh
        run: |
          $test='workspace-template/.pfc-internal-field-validation/tests/test_g5_human_gate_and_duplicate_correlation.py'
          & "$env:FOCUSED_PYTHON" -X utf8 -c "import sys,runpy; from pathlib import Path; p=sys.argv[1]; sys.path.insert(0,str(Path(p).parent)); sys.argv=[p]; runpy.run_path(p,run_name='__main__')" $test 2>&1 | Tee-Object -FilePath RECOVERY_G5_HUMAN_FOCUSED.log -Append
          if ($LASTEXITCODE -ne 0) { throw 'G5 human gate focused qualification failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-g5-human-focused
          path: RECOVERY_G5_HUMAN_FOCUSED.log
          if-no-files-found: warn
