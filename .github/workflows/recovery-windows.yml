name: Recovery turnkey Windows validation
on:
  push:
    branches: [work/v1.13.0-recovery-turnkey-validation]
    paths: [tools/recovery/ci-package.json]
  workflow_dispatch:
    inputs:
      draft_release_tag:
        description: Unpublished draft release holding the hash-locked offline payload carrier
        required: true
        type: string
      asset_name:
        description: Offline payload carrier ZIP (source is rebuilt from this workflow HEAD)
        required: true
        type: string
      expected_sha256:
        description: Exact carrier SHA256
        required: true
        type: string
      semantic_asset:
        description: Fresh real-host semantic proof JSON from the same draft release and exact source HEAD
        required: false
        type: string
      semantic_sha256:
        description: Exact SHA256 of the real-host semantic proof
        required: false
        type: string
permissions:
  # GitHub requires write access to retrieve assets from an unpublished draft.
  contents: write
jobs:
  windows-package:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PIP_NO_INDEX: '1'
      OPENCODE_DISABLE_AUTOUPDATE: 'true'
      AITEST_OFFLINE_MODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Retrieve hash-locked offline dependency carrier
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.draft_release_tag }}
          ASSET_NAME: ${{ inputs.asset_name }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
          SEMANTIC_ASSET: ${{ inputs.semantic_asset }}
          SEMANTIC_SHA256: ${{ inputs.semantic_sha256 }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            $config = Get-Content tools/recovery/ci-package.json -Raw | ConvertFrom-Json
            $env:RELEASE_TAG = $config.draft_release_tag
            $env:ASSET_NAME = $config.asset_name
            $env:EXPECTED_SHA256 = $config.expected_sha256
          }
          if ($env:EXPECTED_SHA256 -notmatch '^[a-fA-F0-9]{64}$') { throw 'Invalid carrier SHA256' }
          $incoming = Join-Path $env:RUNNER_TEMP 'rec3-incoming'
          New-Item -ItemType Directory -Path $incoming | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GH_REPO --pattern $env:ASSET_NAME --dir $incoming
          if ($LASTEXITCODE -ne 0) { throw 'Draft payload carrier retrieval failed' }
          $zip = Join-Path $incoming $env:ASSET_NAME
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:EXPECTED_SHA256.ToLowerInvariant()) { throw 'Carrier SHA256 mismatch' }
          "AITEST_CARRIER_SHA256=$actual" | Out-File -FilePath $env:GITHUB_ENV -Append
          $unpacked = Join-Path $env:RUNNER_TEMP 'rec3-carrier'
          Expand-Archive -Path $zip -DestinationPath $unpacked
          $carrier = Get-ChildItem $unpacked -Directory | Select-Object -First 1
          "AITEST_CARRIER=$($carrier.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          if ($env:SEMANTIC_ASSET) {
            if ($env:SEMANTIC_SHA256 -notmatch '^[a-fA-F0-9]{64}$') { throw 'Invalid semantic proof SHA256' }
            gh release download $env:RELEASE_TAG --repo $env:GH_REPO --pattern $env:SEMANTIC_ASSET --dir $incoming
            if ($LASTEXITCODE -ne 0) { throw 'Real semantic proof retrieval failed' }
            $proof = Join-Path $incoming $env:SEMANTIC_ASSET
            if ((Get-FileHash $proof -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:SEMANTIC_SHA256.ToLowerInvariant()) { throw 'Semantic proof SHA256 mismatch' }
            $identity = Get-Content $proof -Raw | ConvertFrom-Json
            if ($identity.source_head -ne $env:GITHUB_SHA) { throw 'Semantic proof source HEAD mismatch' }
            "AITEST_SEMANTIC_REPORT=$proof" | Out-File -FilePath $env:GITHUB_ENV -Append
          }
      - name: Materialize pinned Node and GitNexus into same offline carrier
        shell: pwsh
        run: |
          $nodeZip = Join-Path $env:RUNNER_TEMP 'node-v22.18.0-win-x64.zip'
          $nodeExtract = Join-Path $env:RUNNER_TEMP 'node-v22.18.0-win-x64-extract'
          curl.exe -fL --retry 3 --retry-delay 2 -o $nodeZip https://nodejs.org/download/release/v22.18.0/node-v22.18.0-win-x64.zip
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Node download failed' }
          $nodeArchiveSha = (Get-FileHash -Algorithm SHA256 $nodeZip).Hash.ToLowerInvariant()
          if ($nodeArchiveSha -ne 'c95d8a7e1c99e669cc08c9f1176e068c1f50847c37908fcb8c35b62482366511') {
            throw "Pinned Node archive SHA mismatch: $nodeArchiveSha"
          }
          Expand-Archive -LiteralPath $nodeZip -DestinationPath $nodeExtract -Force
          $nodeSource = Join-Path $nodeExtract 'node-v22.18.0-win-x64'
          $nodeTarget = Join-Path $env:AITEST_CARRIER 'workspace-template\runtime\tools\node'
          if (Test-Path $nodeTarget) { Remove-Item -Recurse -Force $nodeTarget }
          New-Item -ItemType Directory -Force -Path $nodeTarget | Out-Null
          Copy-Item -Path (Join-Path $nodeSource '*') -Destination $nodeTarget -Recurse -Force
          $nodeExe = Join-Path $nodeTarget 'node.exe'
          $npmCmd = Join-Path $nodeTarget 'npm.cmd'
          if ((& $nodeExe --version | Out-String).Trim() -ne 'v22.18.0') { throw 'Portable Node version mismatch' }
          $nodeExeSha = (Get-FileHash -Algorithm SHA256 $nodeExe).Hash.ToLowerInvariant()
          if ($nodeExeSha -ne 'c22d1c59a1f767a1ed0178445a027f2257d318c55430fc819d48f269586822b7') {
            throw "Portable Node executable SHA mismatch: $nodeExeSha"
          }

          $gitnexusTarget = Join-Path $env:AITEST_CARRIER 'workspace-template\runtime\tools\gitnexus'
          if (Test-Path $gitnexusTarget) { Remove-Item -Recurse -Force $gitnexusTarget }
          New-Item -ItemType Directory -Force -Path $gitnexusTarget | Out-Null
          & $npmCmd install --prefix $gitnexusTarget --no-audit --no-fund gitnexus@1.6.12
          if ($LASTEXITCODE -ne 0) { throw 'Pinned GitNexus materialization failed' }
          $gitnexusCli = Join-Path $gitnexusTarget 'node_modules\gitnexus\dist\cli\index.js'
          if (-not (Test-Path $gitnexusCli)) { throw 'GitNexus CLI missing after materialization' }
          $gitnexusVersion = (& $nodeExe $gitnexusCli --version 2>&1 | Out-String).Trim()
          if ($gitnexusVersion -notmatch '1\.6\.12') { throw "GitNexus version mismatch: $gitnexusVersion" }
          Write-Host "PORTABLE_NODE=22.18.0"
          Write-Host "GITNEXUS=1.6.12"
          Write-Host "GITNEXUS_TARGET=$gitnexusTarget"

      - name: Assemble this exact source HEAD with the carrier portable Python
        shell: pwsh
        run: |
          $assembly = Join-Path $env:RUNNER_TEMP 'rec3-assembly'
          & "$env:AITEST_CARRIER/workspace-template/runtime/python/python.exe" -X utf8 tools/recovery/reassemble_ci.py --repo . --carrier $env:AITEST_CARRIER --output $assembly
          if ($LASTEXITCODE -ne 0) { throw 'Exact HEAD offline assembly failed' }
          $result = Get-Content "$assembly/REASSEMBLY_RESULT.json" -Raw | ConvertFrom-Json
          if ($result.source_head -ne $env:GITHUB_SHA) { throw 'Package source HEAD differs from workflow HEAD' }
          "AITEST_BUNDLE=$($result.bundle)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "AITEST_INPUT_SHA256=$($result.sha256)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Install offline into two user-selected workspace roots
        shell: bash
        run: |
          set -euo pipefail
          cd "$AITEST_BUNDLE"
          unset GH_TOKEN GITHUB_TOKEN AITEST_MODEL_KEY OPENCODE_SERVER_PASSWORD
          parent="$(cygpath -u "$RUNNER_TEMP")/rec3 target A"
          ./INSTALL.sh "$parent" 'loan workspace' | tee windows-install.txt
          second="$(cygpath -u "$RUNNER_TEMP")/rec3-other-target/BLoan"
          ./INSTALL.sh --target "$(cygpath -w "$second")" | tee -a windows-install.txt
          first="$parent/loan workspace"
          test -f "$first/AGENTS.md"
          test -f "$second/AGENTS.md"
          test -f "$first/.git/HEAD"
          test -f "$second/.git/HEAD"
          test "$(cygpath -m "$(git -C "$first" rev-parse --show-toplevel)")" = "$(cygpath -m "$first")"
          test "$(cygpath -m "$(git -C "$second" rev-parse --show-toplevel)")" = "$(cygpath -m "$second")"
          test ! -d "$first/workspace-template"
          test ! -d "$second/workspace-template"
          cp "$first/INSTALL_MANIFEST.json" windows-install-manifest.json
          echo "AITEST_INSTALLED=$(cygpath -m "$first")" >> "$GITHUB_ENV"
          echo "AITEST_INSTALLED_B=$(cygpath -m "$second")" >> "$GITHUB_ENV"
          echo "AITEST_GIT_BASH=$(cygpath -m /bin/bash)" >> "$GITHUB_ENV"
      - name: Prepare external pre-existing host fixture from cached carrier bytes
        shell: pwsh
        run: |
          $hostRoot = Join-Path $env:RUNNER_TEMP 'rec3-preexisting-host'
          & "$env:AITEST_INSTALLED/runtime/python/python.exe" tools/recovery/prepare_host_fixture.py --carrier $env:AITEST_CARRIER --host $hostRoot
          if ($LASTEXITCODE -ne 0) { throw 'Host fixture preparation failed' }
          "AITEST_CI_HOST=$hostRoot" | Out-File $env:GITHUB_ENV -Append
          "AITEST_REAL_OPENCODE=$hostRoot/bin/opencode.exe" | Out-File $env:GITHUB_ENV -Append
          "AITEST_REAL_OPENCODE_PAYLOAD=$env:AITEST_INSTALLED/.opencode" | Out-File $env:GITHUB_ENV -Append
          "XDG_CONFIG_HOME=$hostRoot/config" | Out-File $env:GITHUB_ENV -Append
          "XDG_DATA_HOME=$hostRoot/data" | Out-File $env:GITHUB_ENV -Append
          "XDG_CACHE_HOME=$hostRoot/cache" | Out-File $env:GITHUB_ENV -Append
          "XDG_STATE_HOME=$hostRoot/state" | Out-File $env:GITHUB_ENV -Append
          "$hostRoot/bin" | Out-File $env:GITHUB_PATH -Append
      - name: Validate source contracts and installed runtime with portable Python
        shell: pwsh
        run: |
          $env:GH_TOKEN = ''
          $semanticArgs = @()
          if ($env:AITEST_SEMANTIC_REPORT) { $semanticArgs = @('--semantic-report', $env:AITEST_SEMANTIC_REPORT) }
          & "$env:AITEST_INSTALLED/runtime/python/python.exe" -X utf8 "$env:AITEST_BUNDLE/tools/recovery/validate_package.py" --bundle $env:AITEST_BUNDLE --installed $env:AITEST_INSTALLED --installed-b $env:AITEST_INSTALLED_B --fail-fast --output "$env:AITEST_BUNDLE/windows-validation.json" @semanticArgs
          if ($LASTEXITCODE -ne 0) { throw 'Windows qualification failed; final sealing remains blocked' }
      - name: Run installed daily entry on both independent targets
        shell: bash
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN
          cd "$AITEST_INSTALLED"
          ./AITEST.sh --doctor | tee "$AITEST_BUNDLE/windows-doctor.txt"
          ./AITEST.sh --self-check | tee "$AITEST_BUNDLE/windows-self-check.txt"
          cd "$AITEST_INSTALLED_B"
          ./AITEST.sh --doctor >> "$AITEST_BUNDLE/windows-doctor.txt"
          ./AITEST.sh --self-check >> "$AITEST_BUNDLE/windows-self-check.txt"
      - name: Retain this run's Windows evidence
        if: always()
        shell: pwsh
        run: |
          $reports = Join-Path $env:GITHUB_WORKSPACE 'rec3-evidence'
          New-Item -ItemType Directory -Path $reports -Force | Out-Null
          foreach ($base in @($env:AITEST_BUNDLE, $env:AITEST_INSTALLED)) {
            if ($base -and (Test-Path $base)) {
              Get-ChildItem $base -Filter 'windows-*' -File | Copy-Item -Destination $reports -Force
            }
          }
          if ($env:AITEST_INSTALLED -and (Test-Path "$env:AITEST_INSTALLED/INSTALL_MANIFEST.json")) {
            Copy-Item "$env:AITEST_INSTALLED/INSTALL_MANIFEST.json" "$reports/windows-install-manifest.json" -Force
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-windows-evidence
          path: rec3-evidence/*
          if-no-files-found: warn
      - name: Seal verified package with fresh installed-runtime evidence
        shell: pwsh
        run: |
          Copy-Item 'rec3-evidence/windows-*' $env:AITEST_BUNDLE -Force
          & "$env:AITEST_INSTALLED/runtime/python/python.exe" -X utf8 "$env:AITEST_BUNDLE/tools/recovery/qualify_package.py" --bundle $env:AITEST_BUNDLE --output qualified
          if ($LASTEXITCODE -ne 0) { throw 'Qualification sealing failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-qualified-package
          path: qualified/*
          compression-level: 0
          if-no-files-found: error
