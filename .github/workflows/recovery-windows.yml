name: Recovery turnkey Windows validation
on:
  push:
    branches: [work/v1.12.0-recovery-turnkey-validation]
    paths: [tools/recovery/ci-package.json]
  workflow_dispatch:
    inputs:
      draft_release_tag:
        description: Unpublished draft release holding the hash-locked offline payload carrier
        required: true
        type: string
      asset_name:
        description: Offline payload carrier ZIP (source is rebuilt from this workflow HEAD)
        required: true
        type: string
      expected_sha256:
        description: Exact carrier SHA256
        required: true
        type: string
permissions:
  contents: read
jobs:
  windows-package:
    runs-on: windows-latest
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PIP_NO_INDEX: '1'
      OPENCODE_DISABLE_AUTOUPDATE: 'true'
      AITEST_OFFLINE_MODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Retrieve hash-locked offline dependency carrier
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.draft_release_tag }}
          ASSET_NAME: ${{ inputs.asset_name }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            $config = Get-Content tools/recovery/ci-package.json -Raw | ConvertFrom-Json
            $env:RELEASE_TAG = $config.draft_release_tag
            $env:ASSET_NAME = $config.asset_name
            $env:EXPECTED_SHA256 = $config.expected_sha256
          }
          if ($env:EXPECTED_SHA256 -notmatch '^[a-fA-F0-9]{64}$') { throw 'Invalid carrier SHA256' }
          $incoming = Join-Path $env:RUNNER_TEMP 'rec3-incoming'
          New-Item -ItemType Directory -Path $incoming | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GH_REPO --pattern $env:ASSET_NAME --dir $incoming
          if ($LASTEXITCODE -ne 0) { throw 'Draft payload carrier retrieval failed' }
          $zip = Join-Path $incoming $env:ASSET_NAME
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:EXPECTED_SHA256.ToLowerInvariant()) { throw 'Carrier SHA256 mismatch' }
          "AITEST_CARRIER_SHA256=$actual" | Out-File -FilePath $env:GITHUB_ENV -Append
          $unpacked = Join-Path $env:RUNNER_TEMP 'rec3-carrier'
          Expand-Archive -Path $zip -DestinationPath $unpacked
          $carrier = Get-ChildItem $unpacked -Directory | Select-Object -First 1
          "AITEST_CARRIER=$($carrier.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Assemble this exact source HEAD with the carrier portable Python
        shell: pwsh
        run: |
          $assembly = Join-Path $env:RUNNER_TEMP 'rec3-assembly'
          & "$env:AITEST_CARRIER/workspace-template/runtime/python/python.exe" -X utf8 tools/recovery/reassemble_ci.py --repo . --carrier $env:AITEST_CARRIER --output $assembly
          if ($LASTEXITCODE -ne 0) { throw 'Exact HEAD offline assembly failed' }
          $result = Get-Content "$assembly/REASSEMBLY_RESULT.json" -Raw | ConvertFrom-Json
          if ($result.source_head -ne $env:GITHUB_SHA) { throw 'Package source HEAD differs from workflow HEAD' }
          "AITEST_BUNDLE=$($result.bundle)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "AITEST_INPUT_SHA256=$($result.sha256)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Install offline to the formal default location without authentication
        shell: bash
        run: |
          set -euo pipefail
          cd "$AITEST_BUNDLE"
          unset GH_TOKEN GITHUB_TOKEN AITEST_MODEL_KEY OPENCODE_SERVER_PASSWORD
          ./INSTALL.sh | tee windows-install.txt
          test -f /d/PFC/AITest/INSTALL_MANIFEST.json
          test -f /d/PFC/AITest/AITEST.sh
          cp /d/PFC/AITest/INSTALL_MANIFEST.json windows-install-manifest.json
          echo 'AITEST_INSTALLED=D:/PFC/AITest' >> "$GITHUB_ENV"
      - name: Validate installed runtime using installed packaged Python
        shell: pwsh
        run: |
          Set-Location $env:AITEST_INSTALLED
          $env:GH_TOKEN = ''
          & './workspace-template/runtime/python/python.exe' -X utf8 './tools/recovery/validate_package.py' --bundle . --output windows-validation.json
          if ($LASTEXITCODE -ne 0) { throw 'Installed packaged Windows validation failed' }
      - name: Run daily installed entry doctor and self check
        shell: bash
        run: |
          set -euo pipefail
          cd /d/PFC/AITest
          unset GH_TOKEN GITHUB_TOKEN
          ./AITEST.sh --doctor | tee windows-doctor.txt
          ./AITEST.sh --self-check | tee windows-self-check.txt
      - name: Retain this run's Windows evidence
        if: always()
        shell: pwsh
        run: |
          $reports = Join-Path $env:GITHUB_WORKSPACE 'rec3-evidence'
          New-Item -ItemType Directory -Path $reports -Force | Out-Null
          foreach ($base in @($env:AITEST_BUNDLE, $env:AITEST_INSTALLED)) {
            if ($base -and (Test-Path $base)) {
              Get-ChildItem $base -Filter 'windows-*' -File | Copy-Item -Destination $reports -Force
            }
          }
          if ($env:AITEST_INSTALLED -and (Test-Path "$env:AITEST_INSTALLED/INSTALL_MANIFEST.json")) {
            Copy-Item "$env:AITEST_INSTALLED/INSTALL_MANIFEST.json" "$reports/windows-install-manifest.json" -Force
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-windows-evidence
          path: rec3-evidence/*
          if-no-files-found: warn
      - name: Seal verified package with fresh installed-runtime evidence
        shell: pwsh
        run: |
          Copy-Item 'rec3-evidence/windows-*' $env:AITEST_BUNDLE -Force
          & "$env:AITEST_INSTALLED/workspace-template/runtime/python/python.exe" -X utf8 "$env:AITEST_BUNDLE/tools/recovery/qualify_package.py" --bundle $env:AITEST_BUNDLE --output qualified
          if ($LASTEXITCODE -ne 0) { throw 'Qualification sealing failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-qualified-package
          path: qualified/*
          compression-level: 0
          if-no-files-found: error
