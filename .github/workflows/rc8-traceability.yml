name: RC8 Traceability Graph

on:
  push:
    branches: ["work/rc8"]
    paths:
      - "rc8_center/traceability.py"
      - "rc8_center/code_source.py"
      - "rc8_center/repository_ports.py"
      - "rc8_center/infrastructure/postgres_traceability.py"
      - "rc8_center/infrastructure/__init__.py"
      - "center/migrations/versions/0012_traceability_graph.py"
      - "tests/test_rc8_traceability_graph.py"
      - "scripts/rc8_traceability_postgres_test.py"
      - ".github/workflows/rc8-traceability.yml"
  workflow_dispatch:

jobs:
  traceability-contract:
    runs-on: ubuntu-latest
    services:
      postgresql:
        image: postgres:16
        env:
          POSTGRES_DB: rc8
          POSTGRES_USER: rc8
          POSTGRES_PASSWORD: rc8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rc8 -d rc8"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      RC8_DATABASE_URL: postgresql+psycopg://rc8:rc8@127.0.0.1:5432/rc8
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Center dependencies
        run: pip install -r center/requirements.txt pytest
      - name: Compile traceability contracts
        run: |
          python -m py_compile \
            rc8_center/code_source.py \
            rc8_center/traceability.py \
            rc8_center/repository_ports.py \
            rc8_center/infrastructure/postgres_traceability.py \
            tests/test_rc8_traceability_graph.py \
            scripts/rc8_traceability_postgres_test.py
      - name: Run deterministic traceability unit contract
        run: python -m pytest -q tests/test_rc8_traceability_graph.py
      - name: Apply full RC8 PostgreSQL schema
        run: |
          alembic -c center/alembic.ini upgrade head
          alembic -c center/alembic.ini current
      - name: Run real PostgreSQL traceability smoke
        run: python scripts/rc8_traceability_postgres_test.py
      - name: Verify traceability downgrade SQL is renderable
        run: |
          alembic -c center/alembic.ini downgrade 0012_traceability_graph:0011_req_scope_revision --sql > /tmp/rc8-traceability-downgrade.sql
          test -s /tmp/rc8-traceability-downgrade.sql
