name: RC7.2 C07-C04 Captain Governed N9 Real DSH Worker

on:
  push:
    branches: [work/rc7.2-c07-c04-governed-n9-dsh]
    paths:
      - 'rc7_runtime/rc72_n9_captain_dsh_bridge.py'
      - 'rc7_runtime/rc72_n9_professional_dsh.py'
      - 'rc7_runtime/rc72_authority.py'
      - 'rc7_runtime/rc72_mission_factory.py'
      - 'tests/test_rc72_c07_c04_governed_n9_dsh.py'
      - 'tests/test_rc72_worker_process_environment.py'
      - '.github/workflows/rc72-c07-c04-governed-n9-dsh.yml'
  pull_request:
    branches: [work/rc7.2-abcd-v5-bsk-mobile-qualification]
    paths:
      - 'rc7_runtime/rc72_n9_captain_dsh_bridge.py'
      - 'rc7_runtime/rc72_n9_professional_dsh.py'
      - 'rc7_runtime/rc72_authority.py'
      - 'rc7_runtime/rc72_mission_factory.py'
      - 'tests/test_rc72_c07_c04_governed_n9_dsh.py'
      - 'tests/test_rc72_worker_process_environment.py'
      - '.github/workflows/rc72-c07-c04-governed-n9-dsh.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  captain-governed-n9-dsh:
    name: c07-c04-governed-n9-${{ matrix.os }}-py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
        python: ['3.8', '3.11']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install approved qualification harness
        run: python -m rc7_release.rc72_pytest_bootstrap --requirements rc7_release/requirements-qualification.txt --timeout-seconds 120
      - name: Compile governed Host, R1, factory and tests
        run: >-
          python -m py_compile
          rc7_runtime/rc72_n9_captain_dsh_bridge.py
          rc7_runtime/rc72_n9_professional_dsh.py
          rc7_runtime/rc72_authority.py
          rc7_runtime/rc72_mission_factory.py
          tests/test_rc72_c07_c04_governed_n9_dsh.py
          tests/test_rc72_worker_process_environment.py
      - name: Test real signed Worker and inherited security and product regressions
        run: >-
          python -m pytest -q
          tests/test_rc72_c07_c04_governed_n9_dsh.py
          tests/test_rc72_c07_n9_professional_dsh_fence.py
          tests/test_rc72_n9_captain_qualification.py
          tests/test_rc72_n9_professional_dsh_real_route.py
          tests/test_rc72_n9_professional_dsh_contract.py
          tests/test_rc72_worker_process_environment.py
          tests/test_rc72_mission_factory.py
          --junitxml=rc72-c07-c04-governed-n9.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: governed-n9-${{ matrix.os }}-${{ matrix.python }}-${{ github.sha }}
          path: rc72-c07-c04-governed-n9.xml
          retention-days: 14
          if-no-files-found: warn
