name: RC7.2 C05 Native N10 Repair-Rerun Fail-Closed Regression

on:
  push:
    branches:
      - work/rc7.2-c05-rerun-provider-gate
    paths:
      - 'rc7_runtime/rc72_n10_control.py'
      - 'tests/test_rc72_native_coverage_rerun.py'
      - '.github/workflows/rc7.2-c05-native-rerun-gate.yml'
  pull_request:
    branches:
      - work/rc7.2-abcd-v5-bsk-mobile-qualification
      - work/rc7.2
    paths:
      - 'rc7_runtime/rc72_n10_control.py'
      - 'tests/test_rc72_native_coverage_rerun.py'
      - '.github/workflows/rc7.2-c05-native-rerun-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc72-c05-n10-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  n10-repair-rerun:
    name: c05-native-${{ matrix.os }}-py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
        python: ['3.8', '3.11']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install approved Python qualification dependencies only
        run: python -m rc7_release.rc72_pytest_bootstrap --requirements rc7_release/requirements-qualification.txt --timeout-seconds 120
      - name: Compile native N10 and coverage repair/rerun
        run: >-
          python -m py_compile
          rc7_runtime/rc72_n10_control.py
          rc7_runtime/rc72_native_coverage_repair.py
          rc7_runtime/rc72_native_coverage_rerun.py
          tests/test_rc72_native_coverage_rerun.py
          tests/test_rc72_n10_control.py
      - name: Exercise real local N7 + Libra, provider denial and cold continuation
        run: >-
          python -m pytest -q
          tests/test_rc72_native_coverage_rerun.py
          tests/test_rc72_n10_control.py
          tests/test_rc72_native_coverage_repair_reentry_integrity.py
          --junitxml=rc72-c05-native-rerun.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc72-c05-${{ matrix.os }}-${{ matrix.python }}-${{ github.sha }}
          path: rc72-c05-native-rerun.xml
          retention-days: 14
          if-no-files-found: warn
