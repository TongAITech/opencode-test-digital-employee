name: RC8 Governance No-Discount Gate

on:
  push:
    branches:
      - work/rc8
    paths:
      - 'rc8_runtime/governance.py'
      - 'rc8_runtime/coverage.py'
      - 'rc8_runtime/sufficiency.py'
      - 'rc8_runtime/mission_graph.py'
      - 'rc8_runtime/__init__.py'
      - 'rc8_center/governance_repository.py'
      - 'rc8_center/coverage_repository.py'
      - 'rc8_center/governance_projection.py'
      - 'rc8_center/governance_event_projector.py'
      - 'rc8_center/mission_service.py'
      - 'rc8_center/product_api.py'
      - 'rc8_center/__main__.py'
      - 'rc8_center/__init__.py'
      - 'governance/**'
      - 'scripts/rc8_validate_governance.py'
      - 'tests/test_rc8_runtime_governance.py'
      - 'tests/test_rc8_sufficiency_anti_shrink.py'
      - 'tests/test_rc8_center_sufficiency_authority.py'
      - 'tests/test_rc8_mission_graph.py'
      - 'tests/test_rc8_mission_graph_scopes.py'
      - 'tests/test_rc8_mission_rework_routing.py'
      - 'tests/test_rc8_center_mission_service.py'
      - 'tests/test_rc8_governance_manifest.py'
      - 'tests/test_rc8_governance_persistence.py'
      - 'tests/test_rc8_governance_product_api.py'
      - 'tests/test_rc8_governance_r1_projection.py'
      - 'tests/test_rc8_center_cli.py'
      - 'docs/rc8/RC8-NO-DISCOUNT-DELIVERY-CONTRACT.md'
      - 'docs/rc8/RC8-SUFFICIENCY-ANTI-SHRINK-CONTRACT.md'
      - 'docs/rc8/RC8-CAPABILITY-CLOSURE-MATRIX.md'
      - 'docs/rc8/RC8-L1-L7-ACCEPTANCE-CONTRACT.md'
      - 'docs/rc8/RC8-MISSION-GRAPH-CONTRACT.md'
      - 'docs/rc8/RC8-PRODUCT-PROJECTION-MAP.md'
      - 'docs/rc8/RC8-RC7-REGRESSION-CATALOG.md'
      - 'docs/rc8/RC8-WAVE-DELIVERY-GATES.md'
      - '.github/workflows/rc8-governance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-discount-governance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Compile governance runtime, Mission service, R1 projector, Center launcher and validator
        shell: bash
        run: |
          python -m py_compile \
            rc8_runtime/contracts.py \
            rc8_runtime/governance.py \
            rc8_runtime/coverage.py \
            rc8_runtime/sufficiency.py \
            rc8_runtime/mission_graph.py \
            rc8_runtime/__init__.py \
            rc8_center/json_repository.py \
            rc8_center/governance_repository.py \
            rc8_center/coverage_repository.py \
            rc8_center/governance_projection.py \
            rc8_center/governance_event_projector.py \
            rc8_center/mission_service.py \
            rc8_center/product_api.py \
            rc8_center/__main__.py \
            rc8_center/__init__.py \
            scripts/rc8_validate_governance.py \
            tests/test_rc8_runtime_governance.py \
            tests/test_rc8_sufficiency_anti_shrink.py \
            tests/test_rc8_center_sufficiency_authority.py \
            tests/test_rc8_mission_graph.py \
            tests/test_rc8_mission_graph_scopes.py \
            tests/test_rc8_mission_rework_routing.py \
            tests/test_rc8_center_mission_service.py \
            tests/test_rc8_governance_manifest.py \
            tests/test_rc8_governance_persistence.py \
            tests/test_rc8_governance_product_api.py \
            tests/test_rc8_governance_r1_projection.py \
            tests/test_rc8_center_cli.py

      - name: Validate machine-readable closure claims
        shell: bash
        run: |
          python scripts/rc8_validate_governance.py

      - name: Run no-discount, anti-shrink, Center-authority, scope/rework, R1 replay, persistence and product projection regressions
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q \
            tests/test_rc8_runtime_governance.py \
            tests/test_rc8_sufficiency_anti_shrink.py \
            tests/test_rc8_center_sufficiency_authority.py \
            tests/test_rc8_mission_graph.py \
            tests/test_rc8_mission_graph_scopes.py \
            tests/test_rc8_mission_rework_routing.py \
            tests/test_rc8_center_mission_service.py \
            tests/test_rc8_governance_manifest.py \
            tests/test_rc8_governance_persistence.py \
            tests/test_rc8_governance_product_api.py \
            tests/test_rc8_governance_r1_projection.py \
            tests/test_rc8_center_cli.py
