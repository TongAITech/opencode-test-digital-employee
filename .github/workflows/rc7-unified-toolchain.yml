name: RC7 Final Unified Offline Turnkey

on:
  push:
    branches:
      - work/rc7-final-unified-offline-turnkey
  workflow_dispatch:

jobs:
  core-regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core test dependencies
        run: python -m pip install --disable-pip-version-check pytest python-docx openpyxl python-pptx pypdf
      - name: Compile RC7
        run: python -m compileall -q rc6_runtime rc6_release rc7_runtime rc7_release rc7_admin
      - name: Run unified core tests
        run: python -m pytest -q tests/test_rc7_unified_toolchain.py
      - name: Run professional toolchain qualification
        run: python -m rc7_release.toolchain_qualification

  windows-final-turnkey:
    needs: core-regression
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare build payload root
        shell: pwsh
        run: |
          $root = "$env:RUNNER_TEMP\rc7-final-payloads"
          New-Item -ItemType Directory -Force $root | Out-Null
          "PFC_RC7_PAYLOAD_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $nodeHome = Split-Path -Parent (Get-Command node).Source
          $mvnHome = Split-Path -Parent (Split-Path -Parent (Get-Command mvn).Source)
          "PFC_RC7_BUILD_NODE_DIR=$nodeHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PFC_RC7_BUILD_JDK_DIR=$env:JAVA_HOME" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PFC_RC7_BUILD_MAVEN_DIR=$mvnHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install package-local Python, document and local vision providers
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pytest requests python-docx openpyxl python-pptx pypdf "numpy<2" "onnxruntime<1.20" "opencv-python-headless<4.11" rapidocr-onnxruntime
          python -c "import pytest,docx,openpyxl,pptx,pypdf,cv2,onnxruntime,rapidocr_onnxruntime; print('PYTHON_DOCUMENT_VISION_OK')"

      - name: Vendor required DSH plugins without bank-side registry access
        shell: pwsh
        run: |
          $root = "$env:PFC_RC7_PAYLOAD_ROOT\dsh-plugins"
          New-Item -ItemType Directory -Force $root | Out-Null
          npm init -y --prefix $root | Out-Null
          $required = @(
            'dsh-routing-suite',
            '@wxg-prc-cpg/browser-skill-dsh-plugin',
            'dsh-context',
            'dsh-plugin-bridge',
            '@nanmicoder/dsh-agent-teams',
            '@perrylink/dsh-plugin-doctor'
          )
          foreach ($pkg in $required) {
            npm install --prefix $root --no-audit --no-fund "$pkg@latest"
            if ($LASTEXITCODE -ne 0) { throw "Required DSH plugin install failed: $pkg" }
          }
          $optional = @('dsh-vision-router','dsh-plugin-anydoc','dsh-memento','dsh-error-handling')
          $optionalState = @{}
          foreach ($pkg in $optional) {
            npm install --prefix $root --no-audit --no-fund "$pkg@latest"
            $optionalState[$pkg] = if ($LASTEXITCODE -eq 0) { 'BUNDLED_DISABLED_BY_DEFAULT' } else { 'OPTIONAL_NOT_RESOLVED' }
          }
          $optionalState | ConvertTo-Json | Set-Content -Encoding utf8 "$root\OPTIONAL_PLUGIN_STATE.json"
          "PFC_RC7_BUILD_DSH_PLUGINS_DIR=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Vendor Playwright and GitNexus execution packages
        shell: pwsh
        run: |
          $root = "$env:PFC_RC7_PAYLOAD_ROOT\node-execution"
          New-Item -ItemType Directory -Force $root | Out-Null
          npm init -y --prefix $root | Out-Null
          $env:PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD='1'
          $env:GITNEXUS_SKIP_OPTIONAL_GRAMMARS='1'
          npm install --prefix $root --no-audit --no-fund playwright@latest gitnexus@latest
          if ($LASTEXITCODE -ne 0) { throw 'Playwright/GitNexus vendor install failed' }
          node -e "require('$($root.Replace('\','/'))/node_modules/playwright'); console.log('PLAYWRIGHT_NODE_OK')"
          "PFC_RC7_BUILD_EXECUTION_NODE_DIR=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Resolve stable CodeGraph Windows payload
        shell: pwsh
        run: |
          $headers = @{ 'User-Agent' = 'rc7-final-turnkey-builder'; 'Accept' = 'application/vnd.github+json' }
          $release = Invoke-RestMethod -Headers $headers -Uri 'https://api.github.com/repos/codegraph-ai/CodeGraph/releases/latest'
          if ($release.draft -or $release.prerelease) { throw 'Latest CodeGraph release is not stable' }
          $asset = $release.assets | Where-Object { $_.name -eq 'codegraph-server-win32-x64.exe' } | Select-Object -First 1
          if (-not $asset) { throw 'CodeGraph Windows x64 release asset missing' }
          $expected = [string]$asset.digest
          if (-not $expected.StartsWith('sha256:')) { throw 'CodeGraph release asset digest missing' }
          $expected = $expected.Substring(7).ToLowerInvariant()
          $target = "$env:PFC_RC7_PAYLOAD_ROOT\codegraph-server-win32-x64.exe"
          Invoke-WebRequest -Headers $headers -Uri $asset.browser_download_url -OutFile $target
          $actual = (Get-FileHash -Algorithm SHA256 $target).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "CodeGraph digest mismatch expected=$expected actual=$actual" }
          "PFC_RC7_BUILD_CODEGRAPH_BIN=$target" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PFC_RC7_BUILD_CODEGRAPH_VERSION=$($release.tag_name)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PFC_RC7_BUILD_CODEGRAPH_SHA256=$expected" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Resolve stable Chrome for Testing Windows payload
        shell: pwsh
        run: |
          $index = Invoke-RestMethod -Uri 'https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json'
          $stable = $index.channels.Stable
          $download = $stable.downloads.chrome | Where-Object { $_.platform -eq 'win64' } | Select-Object -First 1
          if (-not $download.url) { throw 'Chrome for Testing win64 payload missing' }
          $root = "$env:PFC_RC7_PAYLOAD_ROOT\browser"
          $zip = "$env:PFC_RC7_PAYLOAD_ROOT\chrome-win64.zip"
          Invoke-WebRequest -Uri $download.url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $root -Force
          $browserDir = Join-Path $root 'chrome-win64'
          $chrome = Join-Path $browserDir 'chrome.exe'
          if (-not (Test-Path $chrome)) { throw 'Chrome executable missing' }
          $digest = (Get-FileHash -Algorithm SHA256 $chrome).Hash.ToLowerInvariant()
          "PFC_RC7_BUILD_BROWSER_DIR=$browserDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PFC_RC7_BUILD_BROWSER_VERSION=$($stable.version)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PFC_RC7_BUILD_BROWSER_SHA256=$digest" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Resolve BrowserSkill CLI and extension
        shell: pwsh
        run: |
          $headers = @{ 'User-Agent'='rc7-final-turnkey-builder'; 'Accept'='application/vnd.github+json' }
          $releases = Invoke-RestMethod -Headers $headers -Uri 'https://api.github.com/repos/Tencent/BrowserSkill/releases?per_page=30'
          $cliRel = $releases | Where-Object { -not $_.draft -and -not $_.prerelease -and $_.tag_name -like 'cli-v*' } | Select-Object -First 1
          $cliAsset = $cliRel.assets | Where-Object { $_.name -like '*x86_64-pc-windows-msvc.zip' } | Select-Object -First 1
          if (-not $cliAsset) { throw 'BrowserSkill Windows CLI release missing' }
          $cliZip = "$env:PFC_RC7_PAYLOAD_ROOT\bsk.zip"
          $cliRoot = "$env:PFC_RC7_PAYLOAD_ROOT\browserskill"
          Invoke-WebRequest -Uri $cliAsset.browser_download_url -OutFile $cliZip
          Expand-Archive -Path $cliZip -DestinationPath $cliRoot -Force
          if (-not (Get-ChildItem $cliRoot -Recurse -Filter bsk.exe | Select-Object -First 1)) { throw 'bsk.exe missing' }
          "PFC_RC7_BUILD_BROWSER_SKILL_DIR=$cliRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $extRel = $releases | Where-Object { -not $_.draft -and $_.tag_name -like 'ext-v*' } | Select-Object -First 1
          if ($extRel) {
            $extAsset = $extRel.assets | Where-Object { $_.name -like '*.zip' } | Select-Object -First 1
            if ($extAsset) {
              $extZip = "$env:PFC_RC7_PAYLOAD_ROOT\bsk-ext.zip"
              $extRoot = "$env:PFC_RC7_PAYLOAD_ROOT\browserskill-extension"
              Invoke-WebRequest -Uri $extAsset.browser_download_url -OutFile $extZip
              Expand-Archive -Path $extZip -DestinationPath $extRoot -Force
              "PFC_RC7_BUILD_BROWSER_SKILL_EXTENSION_DIR=$extRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }

      - name: Seed Maven JUnit offline bootstrap repository
        shell: pwsh
        run: |
          $repo = "$env:PFC_RC7_PAYLOAD_ROOT\maven-repository"
          $proj = "$env:PFC_RC7_PAYLOAD_ROOT\maven-seed"
          New-Item -ItemType Directory -Force "$proj\src\test\java\rc7" | Out-Null
          @'
          <project xmlns="http://maven.apache.org/POM/4.0.0"><modelVersion>4.0.0</modelVersion><groupId>rc7</groupId><artifactId>seed</artifactId><version>1</version><properties><maven.compiler.source>8</maven.compiler.source><maven.compiler.target>8</maven.compiler.target></properties><dependencies><dependency><groupId>org.junit.jupiter</groupId><artifactId>junit-jupiter</artifactId><version>5.11.4</version><scope>test</scope></dependency></dependencies><build><plugins><plugin><groupId>org.apache.maven.plugins</groupId><artifactId>maven-surefire-plugin</artifactId><version>3.5.2</version></plugin><plugin><groupId>org.apache.maven.plugins</groupId><artifactId>maven-failsafe-plugin</artifactId><version>3.5.2</version></plugin><plugin><groupId>org.jacoco</groupId><artifactId>jacoco-maven-plugin</artifactId><version>0.8.12</version></plugin></plugins></build></project>
          '@ | Set-Content -Encoding utf8 "$proj\pom.xml"
          'package rc7; import org.junit.jupiter.api.Test; import static org.junit.jupiter.api.Assertions.*; class SeedTest { @Test void ok(){ assertEquals(2,1+1); } }' | Set-Content -Encoding utf8 "$proj\src\test\java\rc7\SeedTest.java"
          mvn -q -Dmaven.repo.local="$repo" test
          if ($LASTEXITCODE -ne 0) { throw 'Maven JUnit seed failed' }
          mvn -q -Dmaven.repo.local="$repo" dependency:go-offline
          if ($LASTEXITCODE -ne 0) { throw 'Maven go-offline seed failed' }
          "PFC_RC7_BUILD_M2_DIR=$repo" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Resolve Allure k6 ZAP and ripgrep
        shell: pwsh
        run: |
          $headers = @{ 'User-Agent'='rc7-final-turnkey-builder'; 'Accept'='application/vnd.github+json' }
          function Get-ReleaseAsset([string]$repo,[string]$pattern,[string]$name) {
            $rel = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/latest"
            $asset = $rel.assets | Where-Object { $_.name -like $pattern } | Select-Object -First 1
            if (-not $asset) { throw "$name release asset missing ($pattern)" }
            return $asset
          }
          $allureAsset = Get-ReleaseAsset 'allure-framework/allure2' 'allure-*.zip' 'Allure'
          $allureZip="$env:PFC_RC7_PAYLOAD_ROOT\allure.zip"; $allureOut="$env:PFC_RC7_PAYLOAD_ROOT\allure-out"
          Invoke-WebRequest -Uri $allureAsset.browser_download_url -OutFile $allureZip; Expand-Archive $allureZip $allureOut -Force
          $allureBat = Get-ChildItem $allureOut -Recurse -Filter allure.bat | Select-Object -First 1
          if (-not $allureBat) { throw 'allure.bat missing' }
          "PFC_RC7_BUILD_ALLURE_DIR=$($allureBat.Directory.Parent.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          $k6Asset = Get-ReleaseAsset 'grafana/k6' '*windows-amd64.zip' 'k6'
          $k6Zip="$env:PFC_RC7_PAYLOAD_ROOT\k6.zip"; $k6Out="$env:PFC_RC7_PAYLOAD_ROOT\k6-out"
          Invoke-WebRequest -Uri $k6Asset.browser_download_url -OutFile $k6Zip; Expand-Archive $k6Zip $k6Out -Force
          $k6Exe = Get-ChildItem $k6Out -Recurse -Filter k6.exe | Select-Object -First 1
          if (-not $k6Exe) { throw 'k6.exe missing' }
          "PFC_RC7_BUILD_K6_DIR=$($k6Exe.Directory.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          $zapAsset = Get-ReleaseAsset 'zaproxy/zaproxy' '*Crossplatform.zip' 'ZAP'
          $zapZip="$env:PFC_RC7_PAYLOAD_ROOT\zap.zip"; $zapOut="$env:PFC_RC7_PAYLOAD_ROOT\zap-out"
          Invoke-WebRequest -Uri $zapAsset.browser_download_url -OutFile $zapZip; Expand-Archive $zapZip $zapOut -Force
          $zapBat = Get-ChildItem $zapOut -Recurse -Filter zap.bat | Select-Object -First 1
          if (-not $zapBat) { throw 'zap.bat missing' }
          "PFC_RC7_BUILD_ZAP_DIR=$($zapBat.Directory.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          $rgAsset = Get-ReleaseAsset 'BurntSushi/ripgrep' '*x86_64-pc-windows-msvc.zip' 'ripgrep'
          $rgZip="$env:PFC_RC7_PAYLOAD_ROOT\rg.zip"; $rgOut="$env:PFC_RC7_PAYLOAD_ROOT\rg-out"
          Invoke-WebRequest -Uri $rgAsset.browser_download_url -OutFile $rgZip; Expand-Archive $rgZip $rgOut -Force
          $rgExe = Get-ChildItem $rgOut -Recurse -Filter rg.exe | Select-Object -First 1
          if (-not $rgExe) { throw 'rg.exe missing' }
          "PFC_RC7_BUILD_RIPGREP_DIR=$($rgExe.Directory.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run full RC7 Windows regression before packaging
        shell: pwsh
        run: |
          python -m compileall -q rc6_runtime rc6_release rc7_runtime rc7_release rc7_admin
          $tests = Get-ChildItem 'tests' -Filter 'test_rc7_*.py' | ForEach-Object { $_.FullName }
          if (-not $tests) { throw 'No RC7 regression tests found' }
          python -m pytest -q $tests

      - name: Build base package then apply final unified overlay
        shell: pwsh
        run: |
          python -m rc7_release.package build --repo-root . --output dist --source-commit $env:GITHUB_SHA
          $pkg = Resolve-Path 'dist/PFC-AITest-DSH-Turnkey-RC7-BANK-WIN10'
          python -m rc7_release.final_unified_overlay --package-root $pkg --output dist --source-commit $env:GITHUB_SHA
          python -m rc7_release.package verify --package-root $pkg
          New-Item -ItemType Directory -Force 'dist/qualification' | Out-Null

      - name: Run final unified package-local qualification
        shell: pwsh
        run: |
          $pkg = Resolve-Path 'dist/PFC-AITest-DSH-Turnkey-RC7-BANK-WIN10'
          $py = Join-Path $pkg 'workspace-template/runtime/python/python.exe'
          & $py -m rc7_release.toolchain_qualification --codegraph-bin (Join-Path $pkg 'workspace-template/runtime/code-intelligence/codegraph/codegraph-server-win32-x64.exe') --output 'dist/qualification/professional-toolchains.json'
          if ($LASTEXITCODE -ne 0) { throw 'Professional toolchain qualification failed' }
          & $py -m rc7_release.dsh_plugins --home $pkg --profile web --dry-run --output 'dist/qualification/dsh-plugin-payload.json'
          if ($LASTEXITCODE -ne 0) { throw 'DSH plugin payload qualification failed' }
          & $py -m rc7_release.final_unified_qualification --home $pkg --output 'dist/qualification/final-unified.json' --require-pass
          if ($LASTEXITCODE -ne 0) { throw 'Final unified qualification failed' }
          & $py -m rc7_release.bank_binding probe --output 'dist/qualification/bank-bindings.json'

      - name: Qualify final clean Windows delivery ZIP
        shell: pwsh
        run: |
          $zip = Get-ChildItem 'dist/PFC-AITest-RC7-FINAL-UNIFIED-BANK-WIN10-*.zip' | Select-Object -First 1
          if (-not $zip) { throw 'Final unified ZIP missing' }
          python -m rc7_release.delivery_qualification --zip $zip.FullName --source-commit $env:GITHUB_SHA --output dist/qualification/delivery.json --require-pass
          if ($LASTEXITCODE -ne 0) { throw 'Clean Windows delivery qualification failed' }

      - name: Verify installer dry-run and inventory completeness
        shell: pwsh
        run: |
          $pkg = Resolve-Path 'dist/PFC-AITest-DSH-Turnkey-RC7-BANK-WIN10'
          $py = Join-Path $pkg 'workspace-template/runtime/python/python.exe'
          & $py -m rc7_release.workspace_install --source $pkg --target "$env:RUNNER_TEMP\PFC\AITest-RC7" --dry-run --output 'dist/qualification/install-dry-run.json'
          if ($LASTEXITCODE -ne 0) { throw 'Installer dry-run failed' }
          $inv = Get-Content (Join-Path $pkg 'FULL-CAPABILITY-INVENTORY.json') | ConvertFrom-Json
          foreach ($l in @('L1','L2','L3','L4','L5','L6','L7')) { if (-not $inv.execution_layers.$l) { throw "Missing execution layer $l" } }
          if ($inv.durable_truth -ne 'R1_EVENT_STREAM') { throw 'R1 truth drift' }
          if ($inv.real_bank_mission -ne 'HOLD_FIELD_EVIDENCE_REQUIRED') { throw 'False bank mission pass' }

      - name: Record final candidate truth
        shell: pwsh
        run: |
          @{
            status = 'PASS'
            gate = 'UNIFIED_ENGINEERING_PASS'
            delivery = 'PASS'
            source_commit = $env:GITHUB_SHA
            truth = 'R1_EVENT_STREAM'
            version_policy = 'CAPABILITY_BASED_NO_EXACT_VERSION_PIN'
            bank_field_bindings = 'HOLD_FIELD_CONFIGURATION_REQUIRED'
            real_bank_mission = 'HOLD_FIELD_EVIDENCE_REQUIRED'
            package_scope = @('DSH plugins','Requirement','CodeGraph+GitNexus','L1-L7 workers','JUnit/Maven/Pytest','Playwright+BrowserSkill','Local OCR/CV','k6','ZAP','Allure','4A/CAT/DB adapters','Diagnosis','Evidence/Defect/Report','Admin','Session handoff')
          } | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 'dist/qualification/final-candidate-truth.json'

      - name: Upload RC7 final unified artifact
        uses: actions/upload-artifact@v4
        with:
          name: PFC-AITest-RC7-FINAL-UNIFIED-${{ github.sha }}
          path: |
            dist/PFC-AITest-RC7-FINAL-UNIFIED-BANK-WIN10-*.zip
            dist/PFC-AITest-RC7-FINAL-UNIFIED-BANK-WIN10-*.zip.sha256
            dist/qualification/*.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
