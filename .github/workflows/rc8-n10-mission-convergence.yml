name: RC8 N10 Mission Convergence

on:
  push:
    branches: [work/rc8]
    paths:
      - 'rc8_center/mission_convergence.py'
      - 'rc8_center/mission_convergence_authority.py'
      - 'rc8_center/mission_node_gate.py'
      - 'rc8_center/mission_node_repository.py'
      - 'rc8_center/infrastructure/postgres_mission_node.py'
      - 'rc8_center/infrastructure/postgres_mission_convergence.py'
      - 'rc8_runtime/mission_nodes.py'
      - 'center/migrations/versions/0017_mission_node_state.py'
      - 'scripts/rc8_n10_mission_node_postgres_reality_test.py'
      - 'tests/test_rc8_mission_node_persistence.py'
      - 'tests/test_rc8_mission_node_postgres.py'
      - 'tests/test_rc8_mission_node_migration_contract.py'
      - 'tests/test_rc8_mission_convergence.py'
      - 'tests/test_rc8_mission_convergence_authority.py'
      - 'tests/test_rc8_mission_convergence_postgres.py'
      - '.github/workflows/rc8-n10-mission-convergence.yml'
  workflow_dispatch:

jobs:
  n10-mission-convergence:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Install formal Center infrastructure dependencies
        run: python -m pip install --disable-pip-version-check 'SQLAlchemy>=2,<3' 'redis>=5,<6'
      - name: Compile N10 Mission Convergence and durable MissionNode truth
        run: >-
          python -m py_compile
          rc8_center/mission_convergence.py
          rc8_center/mission_convergence_authority.py
          rc8_center/mission_node_gate.py
          rc8_center/mission_node_repository.py
          rc8_center/infrastructure/postgres_mission_node.py
          rc8_center/infrastructure/postgres_mission_convergence.py
          tests/test_rc8_mission_node_persistence.py
          tests/test_rc8_mission_node_postgres.py
          tests/test_rc8_mission_node_migration_contract.py
          tests/test_rc8_mission_convergence.py
          tests/test_rc8_mission_convergence_authority.py
          tests/test_rc8_mission_convergence_postgres.py
      - name: Run N10 Mission Convergence regression
        run: >-
          python -m unittest
          tests.test_rc8_coverage_denominator
          tests.test_rc8_defect_closure
          tests.test_rc8_mission_node_persistence
          tests.test_rc8_mission_node_postgres
          tests.test_rc8_mission_node_migration_contract
          tests.test_rc8_mission_convergence
          tests.test_rc8_mission_convergence_authority
          tests.test_rc8_mission_convergence_postgres
          -v

  n10-mission-node-postgres-reality:
    runs-on: ubuntu-latest
    services:
      postgresql:
        image: postgres:16
        env:
          POSTGRES_DB: rc8
          POSTGRES_USER: rc8
          POSTGRES_PASSWORD: rc8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rc8 -d rc8"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      RC8_DATABASE_URL: postgresql+psycopg://rc8:rc8@127.0.0.1:5432/rc8
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install formal Center dependencies
        run: pip install -r center/requirements.txt
      - name: Compile N10 MissionNode durable truth slice
        run: >-
          python -m py_compile
          center/migrations/versions/0017_mission_node_state.py
          rc8_center/mission_node_gate.py
          rc8_center/mission_node_repository.py
          rc8_center/infrastructure/postgres_mission_node.py
          scripts/rc8_n10_mission_node_postgres_reality_test.py
      - name: Apply formal PostgreSQL schema
        run: alembic -c center/alembic.ini upgrade head
      - name: Prove Center MissionNode PASS survives real PostgreSQL reconstruction
        run: python scripts/rc8_n10_mission_node_postgres_reality_test.py
      - name: Verify schema remains at head
        run: alembic -c center/alembic.ini current
