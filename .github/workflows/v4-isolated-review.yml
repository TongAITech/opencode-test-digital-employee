name: V4 isolated implementation review
on:
  push:
    branches: [work/v1.13.0-recovery-turnkey-validation]
    paths:
      - tools/v4_review/**
      - tools/recovery/launcher.py
      - tools/recovery/qualify_context_provider_boundary.py
      - tools/recovery/qualify_context_real_model.py
      - tests/v4/**
      - workspace-template/.pfc-internal-field-validation/tests/test_recovery_context_stress.py
      - workspace-template/.pfc-internal-field-validation/tests/test_g2_1_pressure_fallback.py
      - workspace-template/.opencode/plugins/**
      - workspace-template/ai-test/runtime/aitest_runtime/context_admission.py
      - workspace-template/ai-test/runtime/aitest_runtime/general_work/**
      - workspace-template/ai-test/runtime/aitest_runtime/interaction_receipts.py
      - workspace-template/ai-test/runtime/aitest_runtime/primary_sessions.py
      - workspace-template/ai-test/runtime/aitest_runtime/session_pressure.py
      - workspace-template/ai-test/runtime/aitest_runtime/g2_1/**
      - workspace-template/ai-test/runtime/aitest_runtime/control_loop.py
      - .github/workflows/v4-isolated-review.yml
  workflow_dispatch:
concurrency:
  group: v4-isolated-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  windows-test-tools:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reuse previously qualified offline payload bytes
        shell: pwsh
        run: |
          $incoming = Join-Path $env:RUNNER_TEMP 'v4-tool-input'
          gh run download 34278790485 --name recovery-qualified-package --dir $incoming
          if ($LASTEXITCODE -ne 0) { throw 'Prior offline artifact unavailable' }
          $zip = Join-Path $incoming 'AITest-V1.13.0-Recovery-Turnkey-Windows-x64.zip'
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '49d8e4dc0a38a1ea89b5872bb7926151b938172650bec2534ce73c43f76e9be2') { throw 'Offline payload input hash mismatch' }
          $expanded = Join-Path $env:RUNNER_TEMP 'v4-tools'
          Expand-Archive $zip -DestinationPath $expanded
          $bundle = Get-ChildItem $expanded -Directory | Select-Object -First 1
          "V4_RUNTIME=$($bundle.FullName)/workspace-template/runtime" | Out-File $env:GITHUB_ENV -Append
          "V4_PAYLOAD_WORKSPACE=$($bundle.FullName)/workspace-template" | Out-File $env:GITHUB_ENV -Append
      - name: Verify C2 Primary poison and context recovery regressions on current source
        shell: pwsh
        run: |
          $env:GH_TOKEN = ''
          $env:PIP_NO_INDEX = '1'
          $runtimeSource = Join-Path $PWD 'workspace-template/ai-test/runtime'
          $fieldTests = Join-Path $PWD 'workspace-template/.pfc-internal-field-validation/tests'
          $v4Tests = Join-Path $PWD 'tests/v4'
          $env:PYTHONPATH = $runtimeSource + [IO.Path]::PathSeparator + $fieldTests + [IO.Path]::PathSeparator + $v4Tests
          node tools/v4_review/context_governor_plugin_component.mjs
          if ($LASTEXITCODE -ne 0) { throw 'C2 Context Governor plugin component failed' }
          & "$env:V4_RUNTIME/python/python.exe" -X utf8 tests/v4/test_primary_sessions.py
          if ($LASTEXITCODE -ne 0) { throw 'C2 Primary session regression failed' }
          & "$env:V4_RUNTIME/python/python.exe" -X utf8 tests/v4/test_context_admission.py
          if ($LASTEXITCODE -ne 0) { throw 'C2 final-request admission regression failed' }
          & "$env:V4_RUNTIME/python/python.exe" -X utf8 tests/v4/test_context_admission_multirole.py
          if ($LASTEXITCODE -ne 0) { throw 'C2 all-role successor regression failed' }
          & "$env:V4_RUNTIME/python/python.exe" -X utf8 workspace-template/.pfc-internal-field-validation/tests/test_recovery_context_stress.py
          if ($LASTEXITCODE -ne 0) { throw 'C2 context recovery stress regression failed' }
      - name: Qualify capability contract on current bank OpenCode 1.18.26 host sample
        shell: pwsh
        run: |
          $env:GH_TOKEN = $env:GITHUB_TOKEN
          $output = Join-Path $env:RUNNER_TEMP 'v4-context-provider-boundary'
          if (Test-Path $output) { Remove-Item -Recurse -Force $output }
          "V4_CONTEXT_BOUNDARY_OUTPUT=$output" | Out-File $env:GITHUB_ENV -Append
          $hostDir = Join-Path $env:RUNNER_TEMP 'opencode-bank-current-host'
          New-Item -ItemType Directory -Path $hostDir -Force | Out-Null
          $zip = Join-Path $hostDir 'opencode-windows-x64.zip'
          $assetUrl = 'https://github.com/anomalyco/opencode/releases/download/v1.18.26/opencode-windows-x64.zip'
          Invoke-WebRequest -UseBasicParsing -Uri $assetUrl -OutFile $zip -MaximumRedirection 10
          if (-not (Test-Path $zip)) { throw 'Unable to acquire current bank OpenCode host sample' }
          $expected = 'c7af81e288dff3cf4378c9f3509208ef8bf060d7109589fee2cd943845d87786'
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Current bank OpenCode host sample hash mismatch' }
          $expanded = Join-Path $hostDir 'expanded'
          Expand-Archive $zip -DestinationPath $expanded
          $hostExe = Get-ChildItem $expanded -Recurse -File -Filter opencode.exe | Select-Object -First 1
          if (-not $hostExe) { throw 'Current bank OpenCode host executable missing' }
          $env:GH_TOKEN = ''
          $env:GITHUB_TOKEN = ''
          & "$env:V4_RUNTIME/python/python.exe" -X utf8 tools/recovery/qualify_context_provider_boundary.py --repo $PWD --payload-workspace $env:V4_PAYLOAD_WORKSPACE --output $output --host-opencode $hostExe.FullName --timeout 180
          if ($LASTEXITCODE -ne 0) { throw 'Capability-based current bank OpenCode provider-boundary qualification failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v4-context-provider-boundary
          path: |
            ${{ env.V4_CONTEXT_BOUNDARY_OUTPUT }}/*.json
            ${{ env.V4_CONTEXT_BOUNDARY_OUTPUT }}/*.log
          if-no-files-found: warn
      - name: Verify current General execution and file broker on actual Windows
        shell: pwsh
        run: |
          $env:GH_TOKEN = ''
          $env:PIP_NO_INDEX = '1'
          $output = Join-Path $env:RUNNER_TEMP 'v4-general-result'
          "V4_GENERAL_OUTPUT=$output" | Out-File $env:GITHUB_ENV -Append
          & "$env:V4_RUNTIME/python/python.exe" -X utf8 tools/v4_review/general_windows_component.py --output $output
          if ($LASTEXITCODE -ne 0) { throw 'Windows General execution component failed' }
      - uses: actions/upload-artifact@v4
        if: always() && env.V4_GENERAL_OUTPUT != ''
        with:
          name: v4-windows-general-component
          path: ${{ env.V4_GENERAL_OUTPUT }}/*
          if-no-files-found: warn
      - name: Verify actual offline Chromium HumanGate recovery with a fresh CDP adapter
        shell: pwsh
        run: |
          $env:GH_TOKEN = ''
          $env:PIP_NO_INDEX = '1'
          $output = Join-Path $env:RUNNER_TEMP 'v4-human-gate-cdp'
          "V4_GATE_CDP_OUTPUT=$output" | Out-File $env:GITHUB_ENV -Append
          & "$env:V4_RUNTIME/python/python.exe" -X utf8 tools/v4_review/human_gate_browser_component.py --chrome "$env:V4_RUNTIME/browser/chrome-win64/chrome.exe" --output $output
          if ($LASTEXITCODE -ne 0) { throw 'Actual offline Chromium HumanGate recovery failed' }
      - uses: actions/upload-artifact@v4
        if: always() && env.V4_GATE_CDP_OUTPUT != ''
        with:
          name: v4-windows-human-gate-cdp
          path: |
            ${{ env.V4_GATE_CDP_OUTPUT }}/*.json
            ${{ env.V4_GATE_CDP_OUTPUT }}/*.log
          if-no-files-found: warn
      - name: Execute actual Python HTTP DB k6 and ZAP against disposable local service
        shell: pwsh
        run: |
          $env:GH_TOKEN = ''
          $env:PIP_NO_INDEX = '1'
          $output = Join-Path $env:RUNNER_TEMP 'v4-test-tools-result'
          "V4_TOOLS_OUTPUT=$output" | Out-File $env:GITHUB_ENV -Append
          & "$env:V4_RUNTIME/python/python.exe" -X utf8 tools/v4_review/test_tools_spike.py --output $output --runtime $env:V4_RUNTIME
          if ($LASTEXITCODE -ne 0) { throw 'S7 real-tool spike failed' }
      - uses: actions/upload-artifact@v4
        if: always() && env.V4_TOOLS_OUTPUT != ''
        with:
          name: v4-windows-real-tool-review
          path: |
            ${{ env.V4_TOOLS_OUTPUT }}/*.json
            ${{ env.V4_TOOLS_OUTPUT }}/*.log
          if-no-files-found: warn
  windows-isolation:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Probe Windows confinement using synthetic disposable files
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP ('v4-isolation-' + [Guid]::NewGuid().ToString('N'))
          "V4_PROBE_OUTPUT=$output" | Out-File $env:GITHUB_ENV -Append
          & ./tools/v4_review/windows/run-spike.ps1 -OutputDirectory $output -UseDisposableCiUser
      - name: Record actual workflow identity and evidence
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path review-evidence -Force | Out-Null
          @{
            source_head = $env:GITHUB_SHA
            repository = $env:GITHUB_REPOSITORY
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            runner_os = $env:RUNNER_OS
            qualification_scope = 'ISOLATED_WINDOWS_OS_PRIMITIVE_ONLY'
            final_product_l3 = 'NOT_RUN'
            bank_l5 = 'NOT_RUN'
          } | ConvertTo-Json | Set-Content review-evidence/workflow-identity.json
          if ($env:V4_PROBE_OUTPUT -and (Test-Path $env:V4_PROBE_OUTPUT)) {
            Get-ChildItem $env:V4_PROBE_OUTPUT -File | Where-Object { $_.Extension -in '.json','.log' } | Copy-Item -Destination review-evidence
            $notes = Join-Path $env:V4_PROBE_OUTPUT 'notes'
            if (Test-Path $notes) {
              Get-ChildItem $notes -File -Filter '*-result.json' | Copy-Item -Destination review-evidence
            }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v4-windows-isolation-review
          path: review-evidence/*
          if-no-files-found: error
