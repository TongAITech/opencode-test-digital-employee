name: V4 isolated implementation review
on:
  push:
    branches: [work/v1.13.0-recovery-turnkey-validation]
    paths: [tools/v4_review/**, tests/v4/**, workspace-template/ai-test/runtime/aitest_runtime/general_work/**, workspace-template/ai-test/runtime/aitest_runtime/interaction_receipts.py, .github/workflows/v4-isolated-review.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  windows-test-tools:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reuse previously qualified offline payload bytes
        shell: pwsh
        run: |
          $incoming = Join-Path $env:RUNNER_TEMP 'v4-tool-input'
          gh run download 34278790485 --name recovery-qualified-package --dir $incoming
          if ($LASTEXITCODE -ne 0) { throw 'Prior offline artifact unavailable' }
          $zip = Join-Path $incoming 'AITest-V1.13.0-Recovery-Turnkey-Windows-x64.zip'
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '49d8e4dc0a38a1ea89b5872bb7926151b938172650bec2534ce73c43f76e9be2') { throw 'Offline payload input hash mismatch' }
          $expanded = Join-Path $env:RUNNER_TEMP 'v4-tools'
          Expand-Archive $zip -DestinationPath $expanded
          $bundle = Get-ChildItem $expanded -Directory | Select-Object -First 1
          "V4_RUNTIME=$($bundle.FullName)/workspace-template/runtime" | Out-File $env:GITHUB_ENV -Append
      - name: Verify current General execution and file broker on actual Windows
        shell: pwsh
        run: |
          $env:GH_TOKEN = ''
          $env:PIP_NO_INDEX = '1'
          $output = Join-Path $env:RUNNER_TEMP 'v4-general-result'
          "V4_GENERAL_OUTPUT=$output" | Out-File $env:GITHUB_ENV -Append
          & "$env:V4_RUNTIME/python/python.exe" -X utf8 tools/v4_review/general_windows_component.py --output $output
          if ($LASTEXITCODE -ne 0) { throw 'Windows General execution component failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v4-windows-general-component
          path: ${{ env.V4_GENERAL_OUTPUT }}/*
          if-no-files-found: warn
      - name: Verify actual offline Chromium HumanGate recovery with a fresh CDP adapter
        shell: pwsh
        run: |
          $env:GH_TOKEN = ''
          $env:PIP_NO_INDEX = '1'
          $output = Join-Path $env:RUNNER_TEMP 'v4-human-gate-cdp'
          "V4_GATE_CDP_OUTPUT=$output" | Out-File $env:GITHUB_ENV -Append
          & "$env:V4_RUNTIME/python/python.exe" -X utf8 tools/v4_review/human_gate_browser_component.py --chrome "$env:V4_RUNTIME/browser/chrome-win64/chrome.exe" --output $output
          if ($LASTEXITCODE -ne 0) { throw 'Actual offline Chromium HumanGate recovery failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v4-windows-human-gate-cdp
          path: |
            ${{ env.V4_GATE_CDP_OUTPUT }}/*.json
            ${{ env.V4_GATE_CDP_OUTPUT }}/*.log
          if-no-files-found: warn
      - name: Execute actual Python HTTP DB k6 and ZAP against disposable local service
        shell: pwsh
        run: |
          $env:GH_TOKEN = ''
          $env:PIP_NO_INDEX = '1'
          $output = Join-Path $env:RUNNER_TEMP 'v4-test-tools-result'
          "V4_TOOLS_OUTPUT=$output" | Out-File $env:GITHUB_ENV -Append
          & "$env:V4_RUNTIME/python/python.exe" -X utf8 tools/v4_review/test_tools_spike.py --output $output --runtime $env:V4_RUNTIME
          if ($LASTEXITCODE -ne 0) { throw 'S7 real-tool spike failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v4-windows-real-tool-review
          path: |
            ${{ env.V4_TOOLS_OUTPUT }}/*.json
            ${{ env.V4_TOOLS_OUTPUT }}/*.log
          if-no-files-found: warn
  windows-isolation:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Probe Windows confinement using synthetic disposable files
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP ('v4-isolation-' + [Guid]::NewGuid().ToString('N'))
          "V4_PROBE_OUTPUT=$output" | Out-File $env:GITHUB_ENV -Append
          & ./tools/v4_review/windows/run-spike.ps1 -OutputDirectory $output -UseDisposableCiUser
      - name: Record actual workflow identity and evidence
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path review-evidence -Force | Out-Null
          @{
            source_head = $env:GITHUB_SHA
            repository = $env:GITHUB_REPOSITORY
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            runner_os = $env:RUNNER_OS
            qualification_scope = 'ISOLATED_WINDOWS_OS_PRIMITIVE_ONLY'
            final_product_l3 = 'NOT_RUN'
            bank_l5 = 'NOT_RUN'
          } | ConvertTo-Json | Set-Content review-evidence/workflow-identity.json
          if ($env:V4_PROBE_OUTPUT -and (Test-Path $env:V4_PROBE_OUTPUT)) {
            Get-ChildItem $env:V4_PROBE_OUTPUT -File | Where-Object { $_.Extension -in '.json','.log' } | Copy-Item -Destination review-evidence
            $notes = Join-Path $env:V4_PROBE_OUTPUT 'notes'
            if (Test-Path $notes) {
              Get-ChildItem $notes -File -Filter '*-result.json' | Copy-Item -Destination review-evidence
            }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v4-windows-isolation-review
          path: review-evidence/*
          if-no-files-found: error
