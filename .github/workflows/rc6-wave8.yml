name: RC6 Wave 8 Precondition Test Data Runtime

on:
  push:
    branches:
      - work/rc6-runtime-reconstruction
  pull_request:
    paths:
      - 'rc6_runtime/preparation.py'
      - 'tests/test_preparation.py'
      - 'docs/RC6_WAVE8_QUALIFICATION.md'
      - '.github/workflows/rc6-wave8.yml'

jobs:
  wave8-precondition-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run all RC6 unit qualification
        run: python -m unittest discover -s tests -v
