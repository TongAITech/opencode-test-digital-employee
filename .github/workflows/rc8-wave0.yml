name: RC8 Wave0 Truth Identity Contracts

on:
  push:
    branches:
      - work/rc8
    paths:
      - 'rc8_runtime/**'
      - 'tests/test_rc8_truth_identity_contracts.py'
      - 'tests/test_rc8_r1_runtime.py'
      - 'docs/rc8/**'
      - '.github/workflows/rc8-wave0.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Compile RC8 W0 contracts
        shell: bash
        run: |
          python -m py_compile \
            rc8_runtime/__init__.py \
            rc8_runtime/contracts.py \
            rc8_runtime/r1_runtime.py \
            tests/test_rc8_truth_identity_contracts.py \
            tests/test_rc8_r1_runtime.py
      - name: Run RC8 W0 focused tests
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q \
            tests/test_rc8_truth_identity_contracts.py \
            tests/test_rc8_r1_runtime.py
