name: RC7.1 Script Bundle Preflight Focused Gate

on:
  push:
    branches:
      - work/rc7.1-minimal-hardening
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-script-bundle-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Script bundle preflight durable blocker focused test
        run: >-
          python -m pytest -q
          tests/test_rc7_1_bank_mission_autopilot.py::test_script_bundle_resolution_failure_becomes_durable_block_before_business_execution
