name: RC7.2 A N8 Multi-Round and Q7 CLI Side-Effect Admission

on:
  push:
    branches:
      - work/rc7.2-a-recovery-cli-hardening
    paths:
      - 'rc7_runtime/rc72_n8_retry_continuation.py'
      - 'rc7_release/rc72_mission_cli.py'
      - 'tests/test_rc72_n8_*'
      - 'tests/test_rc72_configured_mission.py'
      - 'tests/test_rc72_mission_bindings.py'
      - '.github/workflows/rc7.2-a-recovery-cli.yml'
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches:
      - work/rc7.2-abcd-v2-qualification
      - work/rc7.2-abd-integration
      - work/rc7.2
    paths:
      - 'rc7_runtime/rc72_n8_*.py'
      - 'rc7_runtime/rc72_mission_factory.py'
      - 'rc7_release/rc72_mission_cli.py'
      - 'rc7_release/rc72_configured_mission.py'
      - 'tests/test_rc72_n8_*.py'
      - 'tests/test_rc72_qa_c01_c02_independent.py'
      - 'tests/test_rc72_configured_mission.py'
      - 'tests/test_rc72_mission_bindings.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The latest relevant PR head supersedes old draft qualification runs.
  # Explicit manual runs are retained as independent audit evidence.
  group: rc72-n8-cli-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-n8-and-cli:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: n8-multi-round-cli-${{ matrix.os }}-py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
        python: ['3.8', '3.11']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install qualification dependencies
        run: python -m rc7_release.rc72_pytest_bootstrap --requirements rc7_release/requirements-qualification.txt --timeout-seconds 120
      - name: Compile production and test code
        run: python -m compileall -q rc6_runtime rc7_runtime rc7_release
      - name: Execute real N8 multi-generation, independent QA and Q7 admission negative regression
        run: >-
          python -m pytest -q
          tests/test_rc72_n8_retry_continuation.py
          tests/test_rc72_n8_multi_round.py
          tests/test_rc72_n8_multi_round_contract_history.py
          tests/test_rc72_n8_multi_round_executed_peer.py
          tests/test_rc72_n8_multi_round_pending.py
          tests/test_rc72_qa_c01_c02_independent.py
          tests/test_rc72_configured_mission.py
          tests/test_rc72_mission_bindings.py
          --junitxml=rc72-n8-cli-full-admission.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc72-n8-cli-${{ matrix.os }}-${{ matrix.python }}-${{ github.sha }}
          path: rc72-n8-cli-full-admission.xml
          retention-days: 14
          if-no-files-found: warn
