name: RC7.2 C07 Captain-Fenced Independent N9 DSH Bridge Admission

on:
  push:
    branches: [work/rc7.2-a-c07-n9-captain-fence]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [work/rc7.2-abcd-v4-qualification, work/rc7.2]
    paths:
      - 'rc7_runtime/rc72_captain_*.py'
      - 'rc7_runtime/rc72_n9_professional_dsh.py'
      - 'rc7_release/rc72_configured_mission.py'
      - 'tests/test_rc72_c07_n9_professional_dsh_fence.py'
      - 'tests/test_rc72_n9_captain_qualification.py'
      - 'tests/test_rc72_n9_professional_dsh_*.py'
      - 'tests/test_rc72_captain_*.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The latest relevant PR head supersedes old draft qualification runs.
  # Explicit manual runs are retained as independent audit evidence.
  group: rc72-c07-n9-fence-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  n9-captain-fenced-model:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: c07-n9-fence-${{ matrix.os }}-py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
        python: ['3.8', '3.11']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Pinned native qualification harness
        run: python -m rc7_release.rc72_pytest_bootstrap --requirements rc7_release/requirements-qualification.txt --timeout-seconds 120
      - name: Compile real C07 N8 N9 and independent model Host
        run: python -m compileall -q rc6_runtime rc7_runtime rc7_release
      - name: Verify accepted SUT discrepancy cannot bypass Captain model lease
        run: >-
          python -m pytest -q
          tests/test_rc72_c07_n9_professional_dsh_fence.py
          tests/test_rc72_n9_captain_qualification.py
          tests/test_rc72_n9_professional_dsh_contract.py
          tests/test_rc72_n9_professional_dsh_real_route.py
          tests/test_rc72_captain_dispatch_fencing.py
          tests/test_rc72_captain_n7_pipeline.py
          --junitxml=rc72-c07-n9-fence.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc72-c07-n9-fence-${{ matrix.os }}-${{ matrix.python }}-${{ github.sha }}
          path: rc72-c07-n9-fence.xml
          retention-days: 14
          if-no-files-found: warn
