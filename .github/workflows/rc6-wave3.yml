name: RC6 Wave 3 Bank Reality

on:
  push:
    branches:
      - work/rc6-runtime-reconstruction
  pull_request:
    paths:
      - 'rc6_runtime/reality.py'
      - 'rc6_runtime/target.py'
      - 'tests/test_bank_reality.py'
      - 'docs/RC6_WAVE3_QUALIFICATION.md'
      - '.github/workflows/rc6-wave3.yml'

jobs:
  wave3-bank-reality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run all RC6 unit qualification
        run: python -m unittest discover -s tests -v
