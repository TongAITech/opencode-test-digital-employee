name: RC7.2 Q1 Windows N10 File-Budget Qualification (No ZIP)
on:
  push:
    branches:
      - work/rc7.2-p2-q1-n10-20261109

permissions:
  contents: read

concurrency:
  group: rc72-q1-n10-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unchanged-q1-180s-budget:
    name: q1-n10-${{ matrix.os }}-python-3.8
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Use the same pinned Q1 pytest dependency
        run: >-
          python -m rc7_release.rc72_pytest_bootstrap
          --requirements rc7_release/requirements-qualification.txt
          --timeout-seconds 120
      - name: Verify original 13 test scenarios remain collectible
        run: >-
          python -m pytest -q --collect-only
          tests/test_rc72_n10_control.py
          tests/test_rc72_n10_feedback_tamper.py
      - name: Verify negative-case preservation contract
        run: python -m pytest -q tests/test_rc72_n10_qualification_partition.py
      - name: Run original N10 business/repair cases with unchanged 180s budget
        run: >-
          python -m rc7_release.rc72_bounded_pytest
          --pattern "tests/test_rc72_n10_control.py"
          --timeout-seconds 180
          --junit-dir q1-n10-original-junit
      - name: Run all seven original signed-snapshot tamper cases with unchanged 180s budget
        run: >-
          python -m rc7_release.rc72_bounded_pytest
          --pattern "tests/test_rc72_n10_feedback_tamper.py"
          --timeout-seconds 180
          --junit-dir q1-n10-tamper-junit
      - name: No P2 intermediate ZIP
        shell: bash
        run: |
          test ! -d dist/PFC-AITest-DSH-Turnkey-RC7.2-BANK-WIN10
          echo "N10_Q1_NO_ZIP"
      - name: Preserve exact test receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q1-n10-file-budget-${{ matrix.os }}-${{ github.sha }}
          path: |
            q1-n10-original-junit/*.xml
            q1-n10-tamper-junit/*.xml
          if-no-files-found: warn
          retention-days: 14
