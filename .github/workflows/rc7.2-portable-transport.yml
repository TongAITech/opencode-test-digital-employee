name: RC7.2 Portable Transport Preparation

on:
  workflow_call:
    inputs:
      final_qualification:
        description: 'Only a separately qualified RC7.2 source may request final package'
        required: true
        type: boolean
  workflow_dispatch:
    inputs:
      final_qualification:
        description: 'Deliberate final release gate: package only after full design and CI'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  portable-transport:
    # Manual Q2 and the one-shot qualified source caller use the same exact
    # physical materialization, clean-unpack, checksum and offline probes.
    if: inputs.final_qualification == true
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.9.0'
      - name: Prepare pinned test tooling and verified build tools
        shell: pwsh
        run: |
          python -m pip install -r rc7_release/requirements-qualification.txt
          if ($LASTEXITCODE -ne 0) { throw 'test tooling failed' }
          python -m rc7_release.runtime_build_bootstrap ripgrep --output .build-runtime/ripgrep --github-path $env:GITHUB_PATH
          if ($LASTEXITCODE -ne 0) { throw 'verified ripgrep bootstrap failed' }
      - name: Acquire complete offline plugin payloads at build time
        shell: pwsh
        run: |
          python -m rc7_release.plugin_payload acquire --repo-root .
          if ($LASTEXITCODE -ne 0) { throw 'plugin payload acquisition failed' }
      - name: Build exact RC7.2 source and materialize offline runtimes
        shell: pwsh
        env:
          RC72_DSH_MAIN_URL: ${{ secrets.RC72_DSH_MAIN_URL }}
          RC72_DSH_MAIN_SHA256: ${{ vars.RC72_DSH_MAIN_SHA256 }}
          RC72_DSH_MAIN_AUTHORIZATION: ${{ secrets.RC72_DSH_MAIN_AUTHORIZATION }}
        run: |
          python -m rc7_release.rc72_package build --repo-root . --output dist --source-commit $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'RC7.2 build failed' }
          $pkg = (Resolve-Path 'dist/PFC-AITest-DSH-Turnkey-RC7.2-BANK-WIN10').Path
          # Fail before acquiring GBs of offline runtimes if the approved
          # DSH engine is unavailable. The release must not waste a full ZIP
          # build and only discover this mandatory C12 gap after materializing.
          # The plugin tree alone is not the actual executable.
          if (-not $env:RC72_DSH_MAIN_URL -or -not $env:RC72_DSH_MAIN_SHA256) {
            throw 'RC72_DSH_MAIN_APPROVED_SOURCE_AND_SHA256_REQUIRED'
          }
          python -m rc7_release.rc72_dsh_main_payload --package-root $pkg --receipt dist/evidence/approved-dsh-main.json
          if ($LASTEXITCODE -ne 0) { throw 'RC72_DSH_MAIN_PHYSICAL_PAYLOAD_NOT_QUALIFIED' }
          python -m rc7_release.runtime_payload_materializer --package-root $pkg
          if ($LASTEXITCODE -ne 0) { throw 'offline runtime materialization failed' }
          Copy-Item packaging/rc7.2/start-rc7.2.cmd (Join-Path $pkg 'start-rc7.2.cmd')
          Copy-Item packaging/rc7.2/TRANSPORT-README.md (Join-Path $pkg 'READ-ME-FIRST.md')
          python -c "import pathlib,os; from rc7_release.rc72_package import _rewrite_manifest,verify_package; from rc7_release.runtime_payload_materializer import _repack; p=pathlib.Path(r'$pkg'); _rewrite_manifest(p,pathlib.Path('.').resolve(),os.environ['GITHUB_SHA']); verify_package(p,expected_source_commit=os.environ['GITHUB_SHA']); _repack(p,pathlib.Path('dist/RC72-PORTABLE-WIN10-'+os.environ['GITHUB_SHA'][:12]+'.zip'))"
          if ($LASTEXITCODE -ne 0) { throw 'RC7.2 manifest reseal failed' }
      - name: Clean extraction and package-local verification
        shell: pwsh
        run: |
          $checkout = (Get-Location).Path
          $zip = (Get-ChildItem dist/RC72-PORTABLE-WIN10-*.zip).FullName
          Remove-Item dist/PFC-AITest-DSH-Turnkey-RC7.2-BANK-WIN10 -Recurse -Force
          $clean = Join-Path $env:RUNNER_TEMP 'rc72-portable-clean'
          Expand-Archive $zip $clean -Force
          $pkg = (Get-ChildItem $clean -Directory).FullName
          $py = Join-Path $pkg 'workspace-template/runtime/python/python.exe'
          $evidence = (New-Item -ItemType Directory -Force dist/evidence).FullName
          Push-Location $pkg
          try {
            $env:PYTHONPATH = ''
            $env:PYTHONNOUSERSITE = '1'
            & $py -m rc7_release.rc72_package verify --package-root $pkg --expected-source-commit $env:GITHUB_SHA | Tee-Object (Join-Path $evidence 'package-identity.json')
            if ($LASTEXITCODE -ne 0) { throw 'package identity/checksums failed' }
            & $py -m rc7_release.runtime_delivery_contract --package-root $pkg | Tee-Object (Join-Path $evidence 'physical-payload-inventory.json')
            if ($LASTEXITCODE -ne 0) { throw 'offline payload inventory incomplete' }
            & $py -m rc7_release.rc72_complete_payload_inventory --package-root $pkg | Tee-Object (Join-Path $evidence 'complete-physical-payload-inventory.json')
            if ($LASTEXITCODE -ne 0) { throw 'full RC7.1-equivalent physical inventory failed' }
            & $py -I (Join-Path $pkg 'rc7_release/python_full_capability_probe.py') --runtime-root (Split-Path -Parent $py) --output (Join-Path $evidence 'full-python-offline.json')
            if ($LASTEXITCODE -ne 0) { throw 'package-local offline document/OCR qualification failed' }
            $node = Join-Path $pkg 'workspace-template/runtime/node/node.exe'
            Set-NetFirewallProfile -Profile Domain,Private,Public -Enabled True
            New-NetFirewallRule -Name 'RC72-Execution-Node-Offline' -DisplayName 'RC72 isolated component qualification' -Program $node -Direction Outbound -Action Block -Profile Any -Enabled True | Out-Null
            try {
              & $py -m rc7_release.rc72_execution_node_qualification --package-root $pkg --evidence-root (Join-Path $evidence 'execution-node') --require-windows-outbound-block --require-full-text-search
              if ($LASTEXITCODE -ne 0) { throw 'package-local offline native execution tooling failed' }
            } finally {
              Remove-NetFirewallRule -Name 'RC72-Execution-Node-Offline'
            }
            & $py -m rc7_release.rc72_windows_clean_qualification --package-root $pkg --output (Join-Path $evidence 'clean-runtime.json') --require-pass
            if ($LASTEXITCODE -ne 0) { throw 'package-local R1/session continuity failed' }
            & $py -c "import json; from rc7_release.rc72_tool_environment import package_tool_environment; print(json.dumps(package_tool_environment(r'$pkg'), sort_keys=True))" | Tee-Object (Join-Path $evidence 'package-tool-environment.json')
            if ($LASTEXITCODE -ne 0) { throw 'package-owned tool binding failed' }
          } finally { Pop-Location }
          $env:RC72_PIP_MIRROR_COMPONENT = '1'
          $env:RC72_PIP_MIRROR_PACKAGE_ROOT = $pkg
          $env:RC72_PIP_MIRROR_PACKAGE_ARCHIVE = $zip
          $env:RC72_PIP_MIRROR_ORIGINAL_STAGE = Join-Path $checkout 'dist/PFC-AITest-DSH-Turnkey-RC7.2-BANK-WIN10'
          $env:RC72_PIP_MIRROR_EVIDENCE = Join-Path $evidence 'pip-mirror-public'
          $junit = Join-Path $evidence 'pip-mirror-windows.xml'
          & $py -m pytest (Join-Path $checkout 'tests/test_rc72_bank_pc_pip_mirror_windows.py') -q "--junitxml=$junit"
          if ($LASTEXITCODE -ne 0) { throw 'final extracted package user-config mirror qualification failed' }
          'Preparation only: Q3/Q4/Field/BANK_FINAL qualification remains pending.' | Set-Content (Join-Path $evidence 'QUALIFICATION-BOUNDARY.txt')
      - name: Upload complete portable transport and engineering evidence
        uses: actions/upload-artifact@v4
        with:
          name: RC72-PORTABLE-WIN10-${{ github.sha }}
          path: |
            dist/RC72-PORTABLE-WIN10-*.zip
            dist/RC72-PORTABLE-WIN10-*.zip.sha256
            dist/evidence/*
          compression-level: 0
          retention-days: 30
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rc72-portable-build-failure-${{ github.sha }}
          path: |
            rc7_release/vendor/*.manifest.json
            dist/evidence/*
          if-no-files-found: ignore
