<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RC7 测试数字员工后管</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#172033;background:#f5f7fa}*{box-sizing:border-box}body{margin:0}.layout{display:grid;grid-template-columns:210px 1fr;min-height:100vh}.side{background:#fff;border-right:1px solid #e5e7eb;padding:18px 12px}.brand{font-weight:700;font-size:18px;padding:0 10px 4px}.truth{font-size:12px;color:#667085;padding:0 10px 14px}.nav button{display:block;width:100%;border:0;background:transparent;text-align:left;padding:9px 12px;border-radius:6px;cursor:pointer}.nav button.active,.nav button:hover{background:#eef2f7;font-weight:600}.main{padding:22px;min-width:0}.top{display:flex;justify-content:space-between;align-items:end;gap:12px}.top h1{margin:0;font-size:22px}.meta,.hint{font-size:12px;color:#667085}.filters{display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));gap:8px;background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:12px;margin:14px 0}.filters input,.filters select,.filters button{height:34px;border:1px solid #d0d5dd;border-radius:5px;background:#fff;padding:0 8px}.wrap{background:#fff;border:1px solid #e5e7eb;border-radius:8px;overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:10px 12px;border-bottom:1px solid #eef0f3;text-align:left;white-space:nowrap;max-width:360px;overflow:hidden;text-overflow:ellipsis}th{background:#f8fafc;color:#475467}.pager{display:flex;justify-content:flex-end;gap:8px;align-items:center;margin-top:10px}.pager button,.link{border:1px solid #d0d5dd;background:#fff;border-radius:5px;padding:7px 11px;cursor:pointer;text-decoration:none;color:#344054}.drawer{position:fixed;right:0;top:0;width:min(760px,92vw);height:100vh;background:#fff;border-left:1px solid #ddd;padding:18px;overflow:auto;display:none}.drawer.open{display:block}.drawer pre{white-space:pre-wrap;word-break:break-word;background:#f8fafc;padding:12px}.badge{border:1px solid #d0d5dd;border-radius:999px;padding:2px 7px}.error{background:#fff1f0;color:#b42318;padding:10px;border:1px solid #fecdca;border-radius:6px}@media(max-width:900px){.filters{grid-template-columns:1fr 1fr}.layout{display:block}.side{position:static}.nav{display:flex;overflow:auto}.nav button{min-width:max-content}}
</style></head><body><div class="layout"><aside class="side"><div class="brand">RC7 测试数字员工</div><div class="truth">唯一真相：R1 Event Stream</div><div id="nav" class="nav"></div></aside><main class="main"><div class="top"><div><h1 id="title">BR/SR/TR</h1><div class="meta">产品化查询 · 分页 · 详情 · 不建立第二套业务真相</div></div><div><a class="link" href="/index.html">完整用例维护页</a> <span id="health" class="meta">连接中…</span></div></div><p id="hint" class="hint">BR/SR/TR 从需求分析 R1 产物实时派生。</p><div id="err"></div><div class="filters"><input id="version" placeholder="版本"><input id="requirement" placeholder="需求编号"><input id="sst" placeholder="SST"><select id="level"><option value="">BR/SR/TR 全部</option><option>BR</option><option>SR</option><option>TR</option></select><input id="status" placeholder="状态"><input id="q" placeholder="全文查询"><button id="search">查询</button></div><div class="wrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table><div id="empty" class="hint" style="padding:30px;text-align:center;display:none">暂无数据</div></div><div class="pager"><span id="pageInfo"></span><button id="prev">上一页</button><button id="next">下一页</button></div></main></div><section id="drawer" class="drawer"><button id="close" class="link">关闭</button><h2 id="detailTitle"></h2><pre id="detail"></pre></section>
<script>
const resources=[['requirement-hierarchy','BR/SR/TR'],['requirements','需求分析'],['code-impacts','代码分析'],['test-cases','测试用例'],['executions','测试执行'],['defects','缺陷中心'],['evidence','证据中心'],['reports','测试报告']];
const columns={'requirement-hierarchy':['level','node_id','parent_id','release_id','requirement_id','title','status'],requirements:['id','release_id','requirement_id','status','artifact_version'],'code-impacts':['id','release_id','requirement_id','status','artifact_version'],'test-cases':['tc_id','release_id','requirement_id','sst_id','layer','status','case_version'],executions:['attempt_id','release_id','requirement_id','tc_id','status','test_result'],defects:['defect_id','mission_id','severity','state','fix_revision'],evidence:['evidence_id','mission_id','kind','source_ref'],reports:['id','release_id','requirement_id','status','artifact_version']};
const labels={level:'层级',node_id:'BR/SR/TR编号',parent_id:'上级编号',release_id:'版本',requirement_id:'需求编号',title:'标题/摘要',status:'状态',id:'标识',artifact_version:'产物版本',tc_id:'用例编号',sst_id:'SST',layer:'测试层',case_version:'用例版本',attempt_id:'执行尝试',test_result:'测试结果',defect_id:'缺陷编号',mission_id:'Mission',severity:'严重度',state:'状态',fix_revision:'修复版本',evidence_id:'证据编号',kind:'类型',source_ref:'证据来源'};
let resource='requirement-hierarchy',page=1,pages=0,items=[];const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}function val(v){return v&&typeof v==='object'?JSON.stringify(v):v??'';}function nav(){$('nav').innerHTML=resources.map(([k,t])=>`<button data-k="${k}" class="${k===resource?'active':''}">${t}</button>`).join('');$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{resource=b.dataset.k;page=1;$('title').textContent=resources.find(x=>x[0]===resource)[1];$('hint').textContent=resource==='requirement-hierarchy'?'BR/SR/TR 从需求分析 R1 产物实时派生。':'数据直接来自 R1 Event Stream 投影。';nav();load();});}function params(){const p=new URLSearchParams({page,page_size:20});for(const id of ['version','requirement','sst','level','status','q']){const v=$(id).value.trim();if(v)p.set(id,v);}return p;}async function api(u){const r=await fetch(u);const j=await r.json();if(!r.ok)throw new Error(j.error||`HTTP ${r.status}`);return j;}async function health(){try{const h=await api('/api/health');$('health').textContent=`R1 在线 · Mission ${h.inventory.missions||0}`;}catch(e){$('health').textContent='R1 连接失败';}}async function load(){$('err').innerHTML='';try{const d=await api(`/api/${resource}?${params()}`);items=d.items;pages=d.pages;const cols=columns[resource]||Object.keys(items[0]||{}).slice(0,8);$('thead').innerHTML='<tr>'+cols.map(c=>`<th>${esc(labels[c]||c)}</th>`).join('')+'</tr>';$('tbody').innerHTML=items.map((r,i)=>'<tr data-i="'+i+'">'+cols.map(c=>`<td title="${esc(val(r[c]))}">${c==='level'&&r[c]?'<span class="badge">'+esc(r[c])+'</span>':esc(val(r[c]))}</td>`).join('')+'</tr>').join('');$('tbody').querySelectorAll('tr').forEach(tr=>tr.onclick=()=>detail(items[Number(tr.dataset.i)]));$('empty').style.display=items.length?'none':'block';$('pageInfo').textContent=`第 ${d.page} 页 / 共 ${d.pages||0} 页 · ${d.total} 条`;$('prev').disabled=page<=1;$('next').disabled=!pages||page>=pages;}catch(e){$('err').innerHTML=`<div class="error">${esc(e.message)}</div>`;}}function detail(row){$('drawer').classList.add('open');$('detailTitle').textContent=row.node_id||row.tc_id||row.defect_id||row.id||'详情';$('detail').textContent=JSON.stringify(row,null,2);}$('search').onclick=()=>{page=1;load();};$('prev').onclick=()=>{if(page>1){page--;load();}};$('next').onclick=()=>{if(page<pages){page++;load();}};$('close').onclick=()=>$('drawer').classList.remove('open');$('level').onchange=()=>{if(resource==='requirement-hierarchy'){page=1;load();}};nav();health();load();setInterval(health,15000);
</script></body></html>
