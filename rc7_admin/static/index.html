<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RC7 测试数字员工后管</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#172033;background:#f5f7fa}*{box-sizing:border-box}body{margin:0}.layout{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.sidebar{background:#fff;border-right:1px solid #e6e9ef;padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-size:18px;font-weight:700;padding:0 10px 18px}.truth{font-size:12px;color:#667085;padding:0 10px 14px}.nav button{width:100%;border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:6px;cursor:pointer;color:#344054;font-size:14px}.nav button:hover,.nav button.active{background:#eef2f7;color:#111827;font-weight:600}.main{padding:22px;min-width:0}.heading{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:16px}.heading h1{font-size:22px;margin:0}.heading .meta{font-size:12px;color:#667085}.filters{display:grid;grid-template-columns:repeat(7,minmax(110px,1fr));gap:8px;background:#fff;border:1px solid #e6e9ef;border-radius:8px;padding:12px;margin-bottom:12px}.filters input,.filters select,.filters button{height:34px;border:1px solid #d0d5dd;border-radius:5px;padding:0 8px;background:#fff}.filters button{cursor:pointer}.table-wrap{background:#fff;border:1px solid #e6e9ef;border-radius:8px;overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:10px 12px;border-bottom:1px solid #eef0f3;text-align:left;white-space:nowrap;max-width:360px;overflow:hidden;text-overflow:ellipsis}.table th{background:#f8fafc;color:#475467;position:sticky;top:0}.table tr{cursor:pointer}.table tr:hover{background:#f8fafc}.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:12px;font-size:13px}.pager button{padding:6px 12px;border:1px solid #d0d5dd;background:#fff;border-radius:5px;cursor:pointer}.drawer{position:fixed;right:0;top:0;height:100vh;width:min(640px,86vw);background:#fff;border-left:1px solid #ddd;box-shadow:-8px 0 30px rgba(0,0,0,.08);padding:18px;overflow:auto;display:none;z-index:10}.drawer.open{display:block}.drawer-head{display:flex;justify-content:space-between;align-items:center}.drawer pre{white-space:pre-wrap;word-break:break-word;background:#f8fafc;padding:12px;border-radius:6px;font-size:12px}.close{border:0;background:#f2f4f7;padding:6px 10px;border-radius:5px;cursor:pointer}.empty{padding:40px;text-align:center;color:#98a2b3}.error{background:#fff1f0;color:#b42318;border:1px solid #fecdca;padding:10px;border-radius:6px;margin-bottom:12px}.case-edit{margin-top:16px;border-top:1px solid #eee;padding-top:14px}.case-edit textarea{width:100%;min-height:220px;font-family:monospace;font-size:12px}.case-edit button{margin-top:8px;padding:7px 12px}@media(max-width:1000px){.filters{grid-template-columns:repeat(3,1fr)}.layout{grid-template-columns:180px 1fr}}@media(max-width:700px){.layout{display:block}.sidebar{height:auto;position:static;border-right:0;border-bottom:1px solid #ddd}.nav{display:flex;overflow:auto}.nav button{min-width:max-content}.main{padding:12px}.filters{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="layout">
<aside class="sidebar">
  <div class="brand">RC7 测试数字员工</div>
  <div class="truth">数据真相：R1 Event Stream</div>
  <div id="nav" class="nav"></div>
</aside>
<main class="main">
  <div class="heading"><div><h1 id="title">Mission</h1><div class="meta" id="subtitle">查询、列表、分页与详情</div></div><div class="meta" id="health">正在连接…</div></div>
  <div id="error"></div>
  <div class="filters">
    <input id="version" placeholder="版本/Release">
    <input id="requirement" placeholder="需求编号">
    <input id="sst" placeholder="SST 编号">
    <input id="status" placeholder="状态">
    <input id="node" placeholder="节点">
    <input id="risk" placeholder="风险/严重度">
    <div style="display:flex;gap:6px"><input id="q" style="min-width:0;width:100%" placeholder="全文查询"><button id="search">查询</button></div>
  </div>
  <div class="table-wrap"><table class="table"><thead id="thead"></thead><tbody id="tbody"></tbody></table><div id="empty" class="empty" style="display:none">暂无数据</div></div>
  <div class="pager"><span id="pageInfo"></span><button id="prev">上一页</button><button id="next">下一页</button></div>
</main>
</div>
<section id="drawer" class="drawer"><div class="drawer-head"><h2 id="detailTitle">详情</h2><button class="close" id="close">关闭</button></div><div id="detail"></div></section>
<script>
const resources=[
 ['missions','Mission/版本任务'],['requirements','需求分析'],['code-impacts','代码分析'],['test-cases','测试用例'],['artifacts','脚本与产物'],['executions','测试执行'],['defects','缺陷中心'],['gaps','缺口中心'],['evidence','证据中心'],['tasks','运行任务'],['evaluations','独立评价'],['reports','测试报告']
];
const columns={
 missions:['mission_id','release_id','state','sufficiency_state','goal','updated_at'],
 requirements:['id','release_id','requirement_id','status','artifact_version'],
 'code-impacts':['id','release_id','requirement_id','status','artifact_version'],
 'test-cases':['tc_id','release_id','requirement_id','layer','risk','case_version'],
 artifacts:['artifact_id','mission_id','artifact_type_name','state','version','producer_task_id'],
 executions:['attempt_id','release_id','requirement_id','tc_id','status','test_result'],
 defects:['defect_id','mission_id','severity','state','fix_revision','source_gap_id'],
 gaps:['gap_id','mission_id','category','severity','state','target_node'],
 evidence:['evidence_id','mission_id','kind','source_ref','created_at'],
 tasks:['task_id','mission_id','node','task_type','state','priority'],
 evaluations:['evaluation_id','mission_id','node','result','evaluator_ref','created_at'],
 reports:['id','release_id','requirement_id','status','artifact_version']
};
let resource='missions', page=1, pages=0, current=[];
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function value(v){if(Array.isArray(v)) return v.join(', '); if(v&&typeof v==='object') return JSON.stringify(v); return v??'';}
function buildNav(){nav.innerHTML=resources.map(([k,t])=>`<button data-k="${k}" class="${k===resource?'active':''}">${t}</button>`).join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{resource=b.dataset.k;page=1;buildNav();title.textContent=resources.find(x=>x[0]===resource)[1];load();});}
function params(){const p=new URLSearchParams({page,page_size:20});for(const id of ['version','requirement','sst','status','node','risk','q']){const v=document.getElementById(id).value.trim();if(v)p.set(id,v);}return p;}
async function api(url,opt){const r=await fetch(url,opt);const j=await r.json();if(!r.ok)throw new Error(j.error||`HTTP ${r.status}`);return j;}
async function healthCheck(){try{const h=await api('/api/health');health.textContent=`R1 在线 · Mission ${h.inventory.missions||0} · 缺陷 ${h.inventory.defects||0}`;}catch(e){health.textContent='R1 连接失败';}}
async function load(){error.innerHTML='';try{const d=await api(`/api/${resource}?${params()}`);current=d.items;pages=d.pages;render(d);}catch(e){error.innerHTML=`<div class="error">${esc(e.message)}</div>`;}}
function render(d){const cols=columns[resource]||Object.keys(d.items[0]||{}).slice(0,8);thead.innerHTML='<tr>'+cols.map(c=>`<th>${esc(c)}</th>`).join('')+'</tr>';tbody.innerHTML=d.items.map((row,i)=>'<tr data-i="'+i+'">'+cols.map(c=>`<td title="${esc(value(row[c]))}">${esc(value(row[c]))}</td>`).join('')+'</tr>').join('');empty.style.display=d.items.length?'none':'block';tbody.querySelectorAll('tr').forEach(r=>r.onclick=()=>openDetail(current[Number(r.dataset.i)]));pageInfo.textContent=`第 ${d.page} 页 / 共 ${d.pages||0} 页 · ${d.total} 条`;prev.disabled=page<=1;next.disabled=!pages||page>=pages;}
function identity(row){for(const k of ['mission_id','task_id','gap_id','evidence_id','defect_id','evaluation_id','artifact_id','tc_id','attempt_id','id'])if(row[k])return row[k];return '详情';}
async function openDetail(row){drawer.classList.add('open');detailTitle.textContent=identity(row);let body=row;if(resource==='missions'){try{body=await api(`/api/missions/${encodeURIComponent(row.mission_id)}/overview`);}catch(e){}}detail.innerHTML=`<pre>${esc(JSON.stringify(body,null,2))}</pre>`;if(resource==='test-cases')addCaseEditor(row);}
function addCaseEditor(row){const wrap=document.createElement('div');wrap.className='case-edit';const next={...row,case_version:Number(row.case_version||0)+1};wrap.innerHTML=`<h3>新增测试用例版本</h3><p>保存不会覆盖旧版本，只会向 R1 追加新版本事件。</p><textarea id="caseJson">${esc(JSON.stringify(next,null,2))}</textarea><br><button id="saveCase">追加新版本</button>`;detail.appendChild(wrap);wrap.querySelector('#saveCase').onclick=async()=>{try{const candidate=JSON.parse(wrap.querySelector('#caseJson').value);const r=await api(`/api/test-cases/${encodeURIComponent(row.tc_id)}/revisions`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({case:candidate})});alert(`已追加版本，event=${r.event_id}`);drawer.classList.remove('open');load();}catch(e){alert('保存失败：'+e.message);}};}
search.onclick=()=>{page=1;load();};prev.onclick=()=>{if(page>1){page--;load();}};next.onclick=()=>{if(page<pages){page++;load();}};close.onclick=()=>drawer.classList.remove('open');
for(const id of ['version','requirement','sst','status','node','risk','q'])document.getElementById(id).addEventListener('keydown',e=>{if(e.key==='Enter'){page=1;load();}});
buildNav();healthCheck();load();setInterval(healthCheck,15000);
</script>
</body>
</html>
