<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RC7 测试数字员工后管</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#172033;background:#f5f7fa}*{box-sizing:border-box}body{margin:0}.layout{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.sidebar{background:#fff;border-right:1px solid #e6e9ef;padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-size:18px;font-weight:700;padding:0 10px 18px}.truth{font-size:12px;color:#667085;padding:0 10px 14px}.nav button{width:100%;border:0;background:transparent;text-align:left;padding:9px 12px;border-radius:6px;cursor:pointer;color:#344054;font-size:14px}.nav button:hover,.nav button.active{background:#eef2f7;color:#111827;font-weight:600}.main{padding:22px;min-width:0}.heading{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:16px}.heading h1{font-size:22px;margin:0}.meta{font-size:12px;color:#667085}.filters{display:grid;grid-template-columns:repeat(5,minmax(130px,1fr));gap:8px;background:#fff;border:1px solid #e6e9ef;border-radius:8px;padding:12px;margin-bottom:12px}.filters input,.filters button{height:34px;border:1px solid #d0d5dd;border-radius:5px;padding:0 8px;background:#fff}.filters button,.toolbar button{cursor:pointer}.toolbar{display:flex;gap:8px;margin-bottom:10px}.toolbar button{padding:7px 12px;border:1px solid #d0d5dd;background:#fff;border-radius:5px}.table-wrap{background:#fff;border:1px solid #e6e9ef;border-radius:8px;overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:10px 12px;border-bottom:1px solid #eef0f3;text-align:left;white-space:nowrap;max-width:360px;overflow:hidden;text-overflow:ellipsis}.table th{background:#f8fafc;color:#475467;position:sticky;top:0}.table tr{cursor:pointer}.table tr:hover{background:#f8fafc}.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:12px;font-size:13px}.pager button{padding:6px 12px;border:1px solid #d0d5dd;background:#fff;border-radius:5px;cursor:pointer}.drawer{position:fixed;right:0;top:0;height:100vh;width:min(720px,90vw);background:#fff;border-left:1px solid #ddd;box-shadow:-8px 0 30px rgba(0,0,0,.08);padding:18px;overflow:auto;display:none;z-index:10}.drawer.open{display:block}.drawer-head{display:flex;justify-content:space-between;align-items:center}.drawer pre{white-space:pre-wrap;word-break:break-word;background:#f8fafc;padding:12px;border-radius:6px;font-size:12px}.close{border:0;background:#f2f4f7;padding:6px 10px;border-radius:5px;cursor:pointer}.empty{padding:40px;text-align:center;color:#98a2b3}.error{background:#fff1f0;color:#b42318;border:1px solid #fecdca;padding:10px;border-radius:6px;margin-bottom:12px}.case-edit{margin-top:16px;border-top:1px solid #eee;padding-top:14px}.case-edit textarea{width:100%;min-height:220px;font-family:monospace;font-size:12px}.danger{color:#b42318}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.summary div{border:1px solid #e6e9ef;border-radius:6px;padding:10px}.summary b{display:block;font-size:18px}@media(max-width:1000px){.filters{grid-template-columns:repeat(3,1fr)}.layout{grid-template-columns:180px 1fr}}@media(max-width:700px){.layout{display:block}.sidebar{height:auto;position:static}.nav{display:flex;overflow:auto}.nav button{min-width:max-content}.main{padding:12px}.filters{grid-template-columns:1fr 1fr}.summary{grid-template-columns:1fr 1fr}}
</style></head><body>
<div class="layout"><aside class="sidebar"><div class="brand">RC7 测试数字员工</div><div class="truth">唯一真相：R1 Event Stream</div><div id="nav" class="nav"></div></aside>
<main class="main"><div class="heading"><div><h1 id="title">Mission</h1><div class="meta">查询 · 列表 · 分页 · 详情 · 受控维护</div></div><div class="meta" id="health">正在连接…</div></div><div id="error"></div>
<div class="filters"><input id="version" placeholder="版本/Release"><input id="requirement" placeholder="需求编号"><input id="sst" placeholder="SST 编号"><input id="source_revision" placeholder="源码 Revision"><input id="status" placeholder="状态"><input id="node" placeholder="节点"><input id="risk" placeholder="风险/严重度"><input id="date_from" type="date" title="开始日期"><input id="date_to" type="date" title="结束日期"><div style="display:flex;gap:6px"><input id="q" style="min-width:0;width:100%" placeholder="全文查询"><button id="search">查询</button></div></div>
<div id="toolbar" class="toolbar"></div><div class="table-wrap"><table class="table"><thead id="thead"></thead><tbody id="tbody"></tbody></table><div id="empty" class="empty" style="display:none">暂无数据</div></div><div class="pager"><span id="pageInfo"></span><button id="prev">上一页</button><button id="next">下一页</button></div></main></div>
<section id="drawer" class="drawer"><div class="drawer-head"><h2 id="detailTitle">详情</h2><button class="close" id="close">关闭</button></div><div id="detail"></div></section>
<script>
const resources=[['missions','Mission/版本任务'],['requirements','需求分析'],['code-impacts','代码分析'],['test-obligations','测试义务'],['test-cases','测试用例'],['scripts','脚本就绪'],['executions','测试执行'],['defects','缺陷中心'],['gaps','缺口中心'],['evidence','证据中心'],['tasks','运行任务'],['evaluations','独立评价'],['reports','测试报告'],['artifacts','全部产物']];
const columns={missions:['mission_id','release_id','state','sufficiency_state','goal','updated_at'],requirements:['id','release_id','requirement_id','status','artifact_version'],'code-impacts':['id','release_id','requirement_id','status','artifact_version'],'test-obligations':['obligation_id','mission_id','kind','layer','risk','required','coverage_count'],'test-cases':['tc_id','release_id','requirement_id','sst_id','layer','status','case_version'],scripts:['task_id','mission_id','state','artifact_type','result','content_hash'],executions:['attempt_id','release_id','requirement_id','tc_id','status','test_result'],defects:['defect_id','mission_id','severity','state','fix_revision','source_gap_id'],gaps:['gap_id','mission_id','category','severity','state','target_node'],evidence:['evidence_id','mission_id','kind','source_ref','created_at'],tasks:['task_id','mission_id','node','task_type','state','priority'],evaluations:['evaluation_id','mission_id','node','result','evaluator_ref','created_at'],reports:['id','release_id','requirement_id','status','artifact_version'],artifacts:['artifact_id','mission_id','artifact_type_name','state','version','producer_task_id']};
let resource='missions',page=1,pages=0,current=[],loadEpoch=0;const filterIds=['version','requirement','sst','source_revision','status','node','risk','date_from','date_to','q'];
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}function value(v){if(Array.isArray(v))return v.join(', ');if(v&&typeof v==='object')return JSON.stringify(v);return v??'';}
function buildNav(){nav.innerHTML=resources.map(([k,t])=>`<button data-k="${k}" class="${k===resource?'active':''}">${t}</button>`).join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{resource=b.dataset.k;page=1;buildNav();title.textContent=resources.find(x=>x[0]===resource)[1];buildToolbar();load();});}
function buildToolbar(){toolbar.innerHTML=resource==='test-cases'?'<button id="createCaseBtn">新增测试用例</button>':'';if(resource==='test-cases')document.getElementById('createCaseBtn').onclick=()=>createCase();}
function params(){const p=new URLSearchParams({page,page_size:20});for(const id of filterIds){const v=document.getElementById(id).value.trim();if(v)p.set(id,v);}return p;}
async function api(url,opt){const r=await fetch(url,opt);const j=await r.json();if(!r.ok)throw new Error(j.error||`HTTP ${r.status}`);return j;}async function healthCheck(){try{const h=await api('/api/health');health.textContent=`R1 在线 · Mission ${h.inventory.missions||0} · 缺陷 ${h.inventory.defects||0}`;}catch(e){health.textContent='R1 连接失败';}}
async function load(){const requestedResource=resource,requestedPage=page,epoch=++loadEpoch,query=params().toString();error.innerHTML='';try{const d=await api(`/api/${requestedResource}?${query}`);if(epoch!==loadEpoch||requestedResource!==resource)return;current=d.items;pages=d.pages;render(d,requestedResource,requestedPage);}catch(e){if(epoch!==loadEpoch||requestedResource!==resource)return;error.innerHTML=`<div class="error">${esc(e.message)}</div>`;}}
function render(d,renderResource=resource,renderPage=page){const cols=columns[renderResource]||Object.keys(d.items[0]||{}).slice(0,8);thead.innerHTML='<tr>'+cols.map(c=>`<th>${esc(c)}</th>`).join('')+'</tr>';tbody.innerHTML=d.items.map((row,i)=>'<tr data-i="'+i+'">'+cols.map(c=>`<td title="${esc(value(row[c]))}">${esc(value(row[c]))}</td>`).join('')+'</tr>').join('');empty.style.display=d.items.length?'none':'block';tbody.querySelectorAll('tr').forEach(r=>r.onclick=()=>openDetail(current[Number(r.dataset.i)],renderResource));pageInfo.textContent=`第 ${d.page} 页 / 共 ${d.pages||0} 页 · ${d.total} 条`;prev.disabled=renderPage<=1;next.disabled=!pages||renderPage>=pages;}
function identity(row){for(const k of ['mission_id','defect_id','obligation_id','task_id','gap_id','evidence_id','evaluation_id','artifact_id','tc_id','attempt_id','id'])if(row[k])return row[k];return '详情';}
async function openDetail(row,detailResource=resource){drawer.classList.add('open');detailTitle.textContent=identity(row);let body=row;try{if(detailResource==='missions')body=await api(`/api/missions/${encodeURIComponent(row.mission_id)}/detail`);if(detailResource==='defects')body=await api(`/api/defects/${encodeURIComponent(row.defect_id)}/detail`);}catch(e){}detail.innerHTML=detailResource==='missions'&&body.summary?missionHtml(body):`<pre>${esc(JSON.stringify(body,null,2))}</pre>`;if(detailResource==='test-cases')addCaseEditor(row);}
function missionHtml(body){const s=body.summary||{};return `<div class="summary"><div>任务通过<b>${s.task_pass||0}/${s.task_total||0}</b></div><div>开放缺口<b>${s.open_gaps||0}</b></div><div>关键缺口<b>${s.critical_open_gaps||0}</b></div><div>缺陷关闭<b>${s.defect_closed||0}/${s.defect_total||0}</b></div></div><h3>测试充分性快照</h3><pre>${esc(JSON.stringify(body.sufficiency_snapshot||{},null,2))}</pre><h3>Mission 真相</h3><pre>${esc(JSON.stringify(body.mission,null,2))}</pre>`;}
function addCaseEditor(row){const wrap=document.createElement('div');wrap.className='case-edit';const next={...row,case_version:Number(row.case_version||0)+1};delete next.artifact_type;wrap.innerHTML=`<h3>追加测试用例新版本</h3><p>不会覆盖历史版本。</p><textarea id="caseJson">${esc(JSON.stringify(next,null,2))}</textarea><br><button id="saveCase">保存新版本</button> <button class="danger" id="quarantineCase">隔离用例</button>`;detail.appendChild(wrap);wrap.querySelector('#saveCase').onclick=async()=>{try{const c=JSON.parse(wrap.querySelector('#caseJson').value);await api(`/api/test-cases/${encodeURIComponent(row.tc_id)}/revisions`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({case:c})});drawer.classList.remove('open');load();}catch(e){alert('保存失败：'+e.message);}};wrap.querySelector('#quarantineCase').onclick=async()=>{const reason=prompt('隔离原因');if(!reason)return;try{await api(`/api/test-cases/${encodeURIComponent(row.tc_id)}/quarantine`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reason})});drawer.classList.remove('open');load();}catch(e){alert('隔离失败：'+e.message);}};}
async function createCase(){const template={tc_id:'',case_version:1,release_id:document.getElementById('version').value||'',requirement_id:document.getElementById('requirement').value||'',sst_id:document.getElementById('sst').value||'',condition_id:'',objective:'',layer:'L3',preconditions:[],test_data:{},steps:[''],expected:'',oracle:{},evidence_requirements:['runtime evidence'],status:'CANDIDATE'};drawer.classList.add('open');detailTitle.textContent='新增测试用例';detail.innerHTML=`<div class="case-edit"><textarea id="newCaseJson">${esc(JSON.stringify(template,null,2))}</textarea><br><button id="createCaseSave">创建</button></div>`;document.getElementById('createCaseSave').onclick=async()=>{try{const c=JSON.parse(document.getElementById('newCaseJson').value);await api('/api/test-cases',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({case:c})});drawer.classList.remove('open');load();}catch(e){alert('创建失败：'+e.message);}};}
search.onclick=()=>{page=1;load();};prev.onclick=()=>{if(page>1){page--;load();}};next.onclick=()=>{if(page<pages){page++;load();}};close.onclick=()=>drawer.classList.remove('open');for(const id of filterIds)document.getElementById(id).addEventListener('keydown',e=>{if(e.key==='Enter'){page=1;load();}});buildNav();buildToolbar();healthCheck();load();setInterval(healthCheck,15000);
</script></body></html>
