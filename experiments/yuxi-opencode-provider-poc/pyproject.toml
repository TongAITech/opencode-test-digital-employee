[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yuxi-opencode-provider-poc"
version = "0.1.0"
description = "Feasibility adapter for using OpenCode as Yuxi's bank LLM access gateway"
requires-python = ">=3.12,<3.14"
dependencies = [
  "httpx>=0.27.0",
  "langchain-core>=1.6.0",
  "pydantic>=2.8.0",
]

[project.optional-dependencies]
test = [
  "langchain>=1.3.15,<1.4",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --tb=short"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
