# Public-validation-only DeepSeek V4 Flash provider.
#
# BazaarLink currently exposes the exact DeepSeek V4 Flash 0731 model with a
# rate-limited free allowance. This profile is only for public AgileTC and
# synthetic RC7 qualification data. Never send Bank requirements, source,
# credentials, logs, customer data, or other non-public material through it.
#
# Do not inherit the local-Qwen reasoning compatibility mapping. DeepSeek must
# prove its own DSH compatibility before any provider-specific mapping is added.
- id: llm-pi-ai
  config:
    providers:
      public-deepseek-v4-flash:
        apiKeyEnv: BAZAARLINK_API_KEY
        api: openai-completions
        baseURL: https://api.bazaarlink.ai/v1
        models:
          - id: deepseek/deepseek-v4-flash-0731free
            contextWindow: 1048576
            maxTokens: 512
            compat:
              maxTokensField: max_tokens

- id: agent-default-model
  config:
    provider: public-deepseek-v4-flash
    model: deepseek/deepseek-v4-flash-0731free

# A one-shot headless qualification Worker does not need an auxiliary title LLM
# call. This removes unrelated background model activity from lifecycle proof.
- id: session-title-llm
  disabled: true
