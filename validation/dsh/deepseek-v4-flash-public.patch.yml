# Public-validation-only DeepSeek V4 Flash provider.
#
# This endpoint serves the public DeepSeek-V4-Flash-0731 weights through an
# OpenAI-compatible API and is used only with public AgileTC / synthetic probe
# data. It is NOT a Bank endpoint and must never receive Bank requirements,
# source, credentials, logs, or customer data.
#
# Keep model reasoning compatibility capability-based: unlike the local Qwen
# profile, do not map DSH reasoningEffort values to provider-specific wire
# values until a DeepSeek capability probe proves such a mapping is required.
- id: llm-pi-ai
  config:
    providers:
      public-deepseek-v4-flash:
        apiKeyEnv: DEEPSEEK_PUBLIC_API_KEY
        api: openai-completions
        baseURL: https://q5dh1rfszfym23hj.us-east-2.aws.endpoints.huggingface.cloud/v1
        models:
          - id: deepseek-ai/DeepSeek-V4-Flash-0731
            contextWindow: 393216
            maxTokens: 512
            compat:
              maxTokensField: max_tokens

- id: agent-default-model
  config:
    provider: public-deepseek-v4-flash
    model: deepseek-ai/DeepSeek-V4-Flash-0731

# One-shot headless qualification sessions do not need a title-generation LLM
# request. This also removes a known source of extra background model activity.
- id: session-title-llm
  disabled: true
