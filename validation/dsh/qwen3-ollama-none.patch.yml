# Validation-only local Ollama/Qwen3 compatibility profile.
#
# DSH 0.2.0-rc.2 treats reasoningEffort=off as omission. Ollama Qwen3 thinks by
# default, so map the executable DSH "minimal" level to Ollama's OpenAI-compatible
# wire value "none". This is not Bank model policy; it keeps the CPU-only CI
# validation substrate bounded and capability-based.
#
# Keep a small explicit per-step output cap. The model catalog's maxTokens is a
# capacity declaration only unless the deployment explicitly configures it;
# 256 is sufficient for the local qualification worker to choose/call a tool
# without allowing one CPU-only response to consume the full diagnostic bound.
- id: llm-pi-ai
  config:
    providers:
      local-ollama:
        apiKeyEnv: LOCAL_MODEL_API_KEY
        api: openai-completions
        baseURL: http://127.0.0.1:11434/v1
        models:
          - id: qwen3:4b
            contextWindow: 32768
            maxTokens: 256
            reasoningEfforts:
              minimal: none
              medium: medium
            compat:
              thinkingFormat: openai
              supportsReasoningEffort: true
              maxTokensField: max_tokens

- id: agent-default-model
  config:
    provider: local-ollama
    model: qwen3:4b
    reasoningEffort: minimal

# A one-shot headless Worker does not need an auxiliary model call merely to
# title its transient DSH session. Keep fallback title bookkeeping, but remove
# the background first-prompt LLM request from the qualification path.
- id: session-title-llm
  disabled: true
